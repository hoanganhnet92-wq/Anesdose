<meta name="claude:viewport-fit-sides" content="cover">
<title>American Expressions</title>
<style>
/* Layout: một thẻ lật lớn giữa trang, thanh tiến độ + bộ lọc phía trên, nút điều hướng phía dưới. Palette ấm (kem + xanh mòng két + cam đất). */
:root{
  --bg:#f4efe6; --surface:#fffdf8; --ink:#2b2622; --muted:#8a7f72;
  --line:#e3dac9; --accent:#1f7a6d; --accent-soft:#d9ebe6;
  --warm:#c8632f; --warm-soft:#f6e3d6; --good:#1f7a6d; --shadow:rgba(61,47,30,.14);
  --disp:"Fraunces",Georgia,serif; --body:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1a17; --surface:#262320; --ink:#f0e9dc; --muted:#a79b89;
  --line:#3a352e; --accent:#59c3b2; --accent-soft:#1f3b36;
  --warm:#e08a52; --warm-soft:#3a2b20; --good:#59c3b2; --shadow:rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1c1a17; --surface:#262320; --ink:#f0e9dc; --muted:#a79b89;
  --line:#3a352e; --accent:#59c3b2; --accent-soft:#1f3b36;
  --warm:#e08a52; --warm-soft:#3a2b20; --good:#59c3b2; --shadow:rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);
  min-height:100%;display:flex;flex-direction:column;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{width:100%;max-width:560px;margin:0 auto;flex:1;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px 24px}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-family:var(--disp);font-weight:600;font-size:1.5rem;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.theme-btn{background:var(--surface);border:1px solid var(--line);color:var(--ink);
  width:40px;height:40px;border-radius:12px;font-size:1.1rem;cursor:pointer;flex:none}

.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:10px 8px;text-align:center}
.stat b{display:block;font-size:1.3rem;font-family:var(--disp);font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
.stat.learned b{color:var(--good)}

.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:14px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease;border-radius:99px}

.controls{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:none;background:none;color:var(--muted);font-family:var(--body);font-size:.82rem;
  padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button.on,
:root:not([data-theme="light"]) .seg button.on{color:#10201d}
@media (prefers-color-scheme:light){.seg button.on{color:#fff}}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:300px;gap:16px}
.counter{text-align:center;color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}

.card{position:relative;width:100%;aspect-ratio:3/2;max-width:100%;cursor:pointer;
  perspective:1400px;user-select:none}
.inner{position:absolute;inset:0;transition:transform .5s cubic-bezier(.2,.7,.2,1);
  transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 10px 30px -14px var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:26px 22px;gap:12px}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:transparent}
.tag{position:absolute;top:14px;left:16px;font-size:.68rem;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);font-weight:700}
.badge{position:absolute;top:12px;right:14px;font-size:.66rem;font-weight:700;padding:3px 9px;
  border-radius:99px;background:var(--good);color:#fff;letter-spacing:.03em}
:root[data-theme="dark"] .badge,:root:not([data-theme="light"]) .badge{color:#10201d}
@media (prefers-color-scheme:light){.badge{color:#fff}}
.badge[hidden]{display:none!important}

.term{font-family:var(--disp);font-weight:600;font-size:clamp(1.5rem,6.5vw,2.1rem);
  line-height:1.15;text-wrap:balance}
.ipa{color:var(--muted);font-size:1rem;letter-spacing:.01em}
.ipa[hidden]{display:none!important}
.mean{font-family:var(--disp);font-weight:500;font-size:clamp(1.25rem,5.5vw,1.7rem);
  line-height:1.25;text-wrap:balance;color:var(--ink)}
.ex{font-size:.95rem;color:var(--muted);font-style:italic;max-width:42ch;line-height:1.45}
.ex b{color:var(--warm);font-style:normal;font-weight:600}
.hint{color:var(--muted);font-size:.8rem;opacity:.8}
.speak{position:absolute;bottom:12px;right:14px;background:none;border:1px solid var(--line);
  color:var(--accent);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center}
.speak:active{transform:scale(.92)}

.actions{display:flex;gap:10px}
.actions button{flex:1;border:none;border-radius:14px;padding:14px;font-family:var(--body);
  font-weight:700;font-size:.95rem;cursor:pointer;display:flex;align-items:center;
  justify-content:center;gap:7px;transition:transform .08s}
.actions button:active{transform:scale(.97)}
.no{background:var(--warm-soft);color:var(--warm)}
.yes{background:var(--good);color:#fff}
:root[data-theme="dark"] .yes,:root:not([data-theme="light"]) .yes{color:#10201d}
@media (prefers-color-scheme:light){.yes{color:#fff}}

.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav button{background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-radius:12px;padding:10px 16px;font-family:var(--body);font-weight:600;cursor:pointer;font-size:.88rem}
.nav button:disabled{opacity:.4;cursor:default}

.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:1rem}
.empty b{display:block;font-family:var(--disp);font-size:1.3rem;color:var(--ink);margin-bottom:6px}

.foot{text-align:center;color:var(--muted);font-size:.74rem;margin-top:18px;line-height:1.6}
.foot button{background:none;border:none;color:var(--warm);font-size:.74rem;cursor:pointer;
  text-decoration:underline;font-family:var(--body)}
.kbd{display:none}
@media(min-width:620px){.kbd{display:block}}
button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.inner{transition:none}.bar>i{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="brand"><span>American</span> Expressions</div>
    <button class="theme-btn" id="theme" aria-label="Đổi giao diện sáng/tối">☾</button>
  </header>

  <div class="stats">
    <div class="stat"><b id="s-total">100</b><small>Tổng</small></div>
    <div class="stat"><b id="s-remain">100</b><small>Chưa học</small></div>
    <div class="stat learned"><b id="s-learned">0</b><small>Đã nhớ</small></div>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <div class="controls">
    <div class="seg" id="filter">
      <button data-f="all" class="on">Tất cả</button>
      <button data-f="new">Chưa học</button>
      <button data-f="learned">Đã nhớ</button>
    </div>
    <div class="seg" id="side">
      <button data-s="front" class="on">Cụm → Nghĩa</button>
      <button data-s="back">Nghĩa → Cụm</button>
    </div>
    <div class="seg" id="opts">
      <button data-o="ipa" class="on">IPA</button>
      <button data-o="shuffle">Trộn</button>
    </div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="nav" id="nav">
    <button id="prev">← Trước</button>
    <span class="counter" id="counter">–</span>
    <button id="next">Sau →</button>
  </div>

  <div class="foot">
    100 cụm từ tiếng Anh Mỹ thông dụng · Chạm thẻ để lật · 🔊 phát âm (máy không đọc được sẽ mở trang nghe online)
    <span class="kbd"><br>Space: lật · 1/←: chưa nhớ · 2/→: nhớ rồi</span>
    <br><button id="reset">Đặt lại tiến độ</button>
  </div>
</div>

{e:"the icing on the cake",ipa:"/ðə ˈaɪsɪŋ ɒn ðə keɪk/",m:"điều tuyệt vời bổ sung thêm",ex:"Winning the award was the icing on the cake."},

</script>
<script>
(function(){
  var KEY="amexpr_learned_v1";
  var learned={}; // index -> true
  try{learned=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){learned={};}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(learned));}catch(e){}}

  var state={filter:"all",side:"front",ipa:true,shuffle:false,order:[],pos:0,flipped:false};

  var stage=document.getElementById('stage');
  var counter=document.getElementById('counter');
  var bar=document.getElementById('bar');

  function baseOrder(){var a=[];for(var i=0;i<CARDS.length;i++)a.push(i);return a;}
  function shuffled(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

  function buildOrder(){
    var all=state.shuffle?shuffled(baseOrder()):baseOrder();
    state.order=all.filter(function(i){
      if(state.filter==="learned")return !!learned[i];
      if(state.filter==="new")return !learned[i];
      return true;
    });
    if(state.pos>=state.order.length)state.pos=Math.max(0,state.order.length-1);
  }

  function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function exHTML(card){
    // bôi đậm cụm từ trong ví dụ (không phân biệt hoa thường, dạng cơ bản)
    var ex=esc(card.ex);var e=card.e.split(" ")[0];
    try{var re=new RegExp("("+e.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"[\\w' ]*)","i");ex=ex.replace(re,"<b>$1</b>");}catch(_){}
    return ex;
  }

  function ttsAvailable(){return ('speechSynthesis'in window)&&('SpeechSynthesisUtterance'in window);}
  function fallbackListen(text){
    // Mở trang nghe người bản xứ phát âm khi giọng máy không phát được
    try{window.open("https://youglish.com/pronounce/"+encodeURIComponent(text)+"/english/us","_blank","noopener");}catch(e){}
  }
  function doSpeak(text,btn){
    if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
    try{speechSynthesis.resume();}catch(e){}
    var u=new SpeechSynthesisUtterance(text);
    u.lang="en-US";u.rate=.9;
    var vs=speechSynthesis.getVoices()||[];
    var v=vs.filter(function(x){return /en[-_]US/i.test(x.lang);})[0]||vs.filter(function(x){return /^en/i.test(x.lang);})[0];
    if(v)u.voice=v;
    var started=false;
    u.onstart=function(){started=true;if(btn)btn.textContent="🔈";};
    u.onend=function(){if(btn)btn.textContent="🔊";};
    u.onerror=function(){if(btn)btn.textContent="🔊";fallbackListen(text);};
    speechSynthesis.speak(u);
    // Nếu sau 1.5s vẫn im (môi trường chặn giọng máy) → mở trang nghe online
    setTimeout(function(){
      if(!started&&!speechSynthesis.speaking){if(btn)btn.textContent="🔊";fallbackListen(text);}
    },1500);
  }
  function speak(text,btn){
    if(!ttsAvailable()){fallbackListen(text);return;}
    try{
      var vs=speechSynthesis.getVoices()||[];
      if(!vs.length){
        // Giọng chưa tải xong — đợi rồi đọc, kèm hạn chót phòng khi không bao giờ tải
        var done=false;
        var once=function(){if(done)return;done=true;doSpeak(text,btn);};
        speechSynthesis.onvoiceschanged=once;
        setTimeout(once,600);
      }else{
        doSpeak(text,btn);
      }
    }catch(e){fallbackListen(text);}
  }

  function render(){
    buildOrder();
    document.getElementById('s-total').textContent=CARDS.length;
    var learnedCount=0;for(var k in learned)if(learned[k])learnedCount++;
    document.getElementById('s-learned').textContent=learnedCount;
    document.getElementById('s-remain').textContent=CARDS.length-learnedCount;
    bar.style.width=(CARDS.length?(learnedCount/CARDS.length*100):0)+"%";

    if(!state.order.length){
      stage.innerHTML='<div class="empty"><b>Trống</b>'+
        (state.filter==="learned"?"Bạn chưa đánh dấu nhớ cụm nào.":"Bạn đã học hết — tuyệt vời!")+'</div>';
      counter.textContent="0 / 0";
      document.getElementById('prev').disabled=true;
      document.getElementById('next').disabled=true;
      return;
    }
    var idx=state.order[state.pos];
    var card=CARDS[idx];
    var isLearned=!!learned[idx];
    var frontFirst=(state.side==="front");

    var topText=frontFirst?esc(card.e):esc(card.m);
    var topIpa=frontFirst&&state.ipa?'<div class="ipa">'+esc(card.ipa)+'</div>':'';
    var topClass=frontFirst?"term":"mean";

    var backText=frontFirst?esc(card.m):esc(card.e);
    var backIpa=(!frontFirst&&state.ipa)?'<div class="ipa">'+esc(card.ipa)+'</div>':'';
    var backClass=frontFirst?"mean":"term";

    stage.innerHTML=
      '<div class="counter" id="counter2"></div>'+
      '<div class="card'+(state.flipped?' flip':'')+'" id="card" tabindex="0" role="button" aria-label="Lật thẻ">'+
        '<div class="inner">'+
          '<div class="face front">'+
            '<span class="tag">'+(frontFirst?"Expression":"Nghĩa")+'</span>'+
            '<span class="badge"'+(isLearned?'':' hidden')+'>✓ đã nhớ</span>'+
            '<div class="'+topClass+'">'+topText+'</div>'+topIpa+
            '<div class="hint">chạm để xem '+(frontFirst?"nghĩa":"cụm từ")+'</div>'+
            '<button class="speak" data-say="'+esc(card.e)+'" aria-label="Phát âm">🔊</button>'+
          '</div>'+
          '<div class="face back">'+
            '<span class="tag">'+(frontFirst?"Nghĩa":"Expression")+'</span>'+
            '<div class="'+backClass+'">'+backText+'</div>'+backIpa+
            '<div class="ex">'+exHTML(card)+'</div>'+
            '<button class="speak" data-say="'+esc(card.e)+'" aria-label="Phát âm">🔊</button>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="actions">'+
        '<button class="no" id="btn-no">✕ Chưa nhớ</button>'+
        '<button class="yes" id="btn-yes">✓ Nhớ rồi</button>'+
      '</div>';

    counter.textContent=(state.pos+1)+" / "+state.order.length;
    document.getElementById('prev').disabled=false;
    document.getElementById('next').disabled=false;

    var cardEl=document.getElementById('card');
    cardEl.addEventListener('click',function(ev){
      if(ev.target.closest('.speak'))return;
      flip();
    });
    cardEl.addEventListener('keydown',function(ev){if(ev.key===" "||ev.key==="Enter"){ev.preventDefault();flip();}});
    Array.prototype.forEach.call(stage.querySelectorAll('.speak'),function(b){
      b.addEventListener('click',function(ev){ev.stopPropagation();speak(b.getAttribute('data-say'),b);});
    });
    document.getElementById('btn-yes').addEventListener('click',function(){mark(idx,true);});
    document.getElementById('btn-no').addEventListener('click',function(){mark(idx,false);});
  }

  function flip(){state.flipped=!state.flipped;var c=document.getElementById('card');if(c)c.classList.toggle('flip',state.flipped);}
  function go(d){
    if(!state.order.length)return;
    state.pos+=d;
    if(state.pos<0)state.pos=state.order.length-1;
    if(state.pos>=state.order.length)state.pos=0;
    state.flipped=false;render();
  }
  function mark(idx,val){
    if(val)learned[idx]=true;else delete learned[idx];
    save();
    // nếu đang lọc và thẻ không còn thuộc bộ lọc, giữ vị trí hợp lý
    var curFilter=state.filter;
    if((curFilter==="new"&&val)||(curFilter==="learned"&&!val)){
      state.flipped=false;render(); // thẻ rời khỏi danh sách, pos tự trỏ sang thẻ kế
    }else{
      go(1);
    }
  }

  // Controls
  function wireSeg(id,attr,apply){
    document.getElementById(id).addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b)return;
      Array.prototype.forEach.call(this.children,function(c){c.classList.remove('on');});
      b.classList.add('on');
      apply(b.getAttribute(attr));
    });
  }
  wireSeg('filter','data-f',function(v){state.filter=v;state.pos=0;state.flipped=false;render();});
  wireSeg('side','data-s',function(v){state.side=v;state.flipped=false;render();});
  document.getElementById('opts').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    var o=b.getAttribute('data-o');
    if(o==="ipa"){state.ipa=!state.ipa;b.classList.toggle('on',state.ipa);render();}
    if(o==="shuffle"){state.shuffle=!state.shuffle;b.classList.toggle('on',state.shuffle);state.pos=0;render();}
  });

  document.getElementById('prev').addEventListener('click',function(){go(-1);});
  document.getElementById('next').addEventListener('click',function(){go(1);});

  document.getElementById('reset').addEventListener('click',function(){
    learned={};save();state.pos=0;state.flipped=false;render();
  });

  // Theme toggle
  var tbtn=document.getElementById('theme');
  function curTheme(){
    var attr=document.documentElement.getAttribute('data-theme');
    if(attr)return attr;
    return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  }
  function syncIcon(){tbtn.textContent=curTheme()==='dark'?'☀':'☾';}
  try{var sv=localStorage.getItem('amexpr_theme');if(sv)document.documentElement.setAttribute('data-theme',sv);}catch(e){}
  syncIcon();
  tbtn.addEventListener('click',function(){
    var next=curTheme()==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('amexpr_theme',next);}catch(e){}
    syncIcon();
  });

  // Keyboard
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='BUTTON'&&e.key==='Enter')return;
    if(e.key===' '){e.preventDefault();flip();}
    else if(e.key==='ArrowLeft'||e.key==='1'){var idx=state.order[state.pos];if(idx!=null)mark(idx,false);}
    else if(e.key==='ArrowRight'||e.key==='2'){var i2=state.order[state.pos];if(i2!=null)mark(i2,true);}
  });

  if('speechSynthesis'in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){};}
  render();
})();
</script>
