<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#efe7d9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17150f" media="(prefers-color-scheme: dark)">
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>American Expressions</title>
<style>
/* Layout: giao diện app một màn hình — app bar trên, thẻ vuốt ở giữa, thanh nút tròn dưới; tùy chọn trong bottom sheet. Palette ấm (kem + teal + cam đất). */
:root{
  --bg:#efe7d9; --surface:#fffdf8; --ink:#2b2622; --muted:#8a7f72;
  --line:#e3dac9; --accent:#1f7a6d; --accent-soft:#d9ebe6;
  --warm:#c8632f; --warm-soft:#f7e6d9; --good:#1f7a6d; --good-ink:#fff;
  --shadow:rgba(61,47,30,.16);
  --disp:"Fraunces",Georgia,serif; --body:"Figtree",system-ui,sans-serif;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17150f; --surface:#262320; --ink:#f0e9dc; --muted:#a79b89;
  --line:#3a352e; --accent:#59c3b2; --accent-soft:#1f3b36;
  --warm:#e08a52; --warm-soft:#3a2b20; --good:#59c3b2; --good-ink:#10201d;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17150f; --surface:#262320; --ink:#f0e9dc; --muted:#a79b89;
  --line:#3a352e; --accent:#59c3b2; --accent-soft:#1f3b36;
  --warm:#e08a52; --warm-soft:#3a2b20; --good:#59c3b2; --good-ink:#10201d;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;
  line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

.app{height:100%;max-height:100dvh;max-width:460px;margin:0 auto;display:flex;flex-direction:column;
  padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px))}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px 8px}
.title{font-family:var(--disp);font-weight:600;font-size:1.3rem;letter-spacing:-.01em;display:flex;
  flex-direction:column;line-height:1.1}
.title .mode{font-family:var(--body);font-weight:600;font-size:.68rem;text-transform:uppercase;
  letter-spacing:.06em;color:var(--accent);margin-top:2px}
.top-actions{display:flex;gap:7px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.icon-btn:active{transform:scale(.93)}

.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:2px}
.progress>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease}
.ptext{text-align:center;color:var(--muted);font-size:.72rem;margin-top:6px;font-variant-numeric:tabular-nums}

.deck{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
  padding:14px 2px}
.ghost{position:absolute;width:100%;height:100%;max-height:600px;border-radius:24px;background:var(--surface);
  border:1px solid var(--line);opacity:.55;transform:translateY(12px) scale(.94);z-index:0}

.card{position:relative;width:100%;height:100%;max-height:600px;z-index:1;cursor:grab;
  touch-action:none;will-change:transform}
.card.spring{transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.card.fly{transition:transform .32s ease,opacity .32s ease}
.card:active{cursor:grabbing}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:24px;
  box-shadow:0 14px 34px -16px var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:28px 24px;gap:13px}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:transparent}
.tag{position:absolute;top:16px;left:18px;font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;
  color:var(--muted);font-weight:700}
.badge{position:absolute;top:14px;right:16px;font-size:.64rem;font-weight:700;padding:3px 9px;border-radius:99px;
  background:var(--good);color:var(--good-ink);letter-spacing:.03em}
.badge[hidden]{display:none!important}
.term{font-family:var(--disp);font-weight:600;font-size:clamp(1.6rem,7vw,2.3rem);line-height:1.12;text-wrap:balance}
.ipa{color:var(--muted);font-size:1.02rem}
.ipa[hidden]{display:none!important}
.mean{font-family:var(--disp);font-weight:500;font-size:clamp(1.3rem,6vw,1.8rem);line-height:1.22;text-wrap:balance}
.ex{font-size:.96rem;color:var(--muted);font-style:italic;max-width:40ch;line-height:1.45}
.ex b{color:var(--warm);font-style:normal;font-weight:600}
.hint{color:var(--muted);font-size:.78rem;opacity:.75}
.speak{position:absolute;bottom:16px;right:18px;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--bg);color:var(--accent);font-size:1.05rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.speak:active{transform:scale(.9)}

.swipe-label{position:absolute;top:22px;font-family:var(--disp);font-weight:700;font-size:1.3rem;
  padding:5px 14px;border-radius:12px;border:3px solid;opacity:0;pointer-events:none;z-index:2;transition:opacity .1s}
.swipe-label.like{right:20px;color:var(--good);border-color:var(--good);transform:rotate(12deg)}
.swipe-label.nope{left:20px;color:var(--warm);border-color:var(--warm);transform:rotate(-12deg)}

.counter{text-align:center;color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums;padding-top:2px}

.bottombar{display:flex;align-items:center;justify-content:center;gap:26px;padding-block:14px 16px}
.circle{border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px -10px var(--shadow);transition:transform .1s}
.circle:active{transform:scale(.9)}
.circle.no{width:60px;height:60px;background:var(--warm-soft);color:var(--warm);font-size:1.5rem}
.circle.yes{width:60px;height:60px;background:var(--good);color:var(--good-ink);font-size:1.5rem}
.circle.flip{width:52px;height:52px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:1.35rem}

.empty{text-align:center;color:var(--muted);padding:40px 20px;z-index:1}
.empty b{display:block;font-family:var(--disp);font-size:1.4rem;color:var(--ink);margin-bottom:6px}

/* Bottom sheet */
.backdrop{position:fixed;inset:0;background:rgba(20,16,10,.45);z-index:20;opacity:0;transition:opacity .25s}
.backdrop.show{opacity:1}
.backdrop[hidden]{display:none!important}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);
  border-radius:22px 22px 0 0;box-shadow:0 -12px 40px -16px var(--shadow);
  padding:8px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:520px;margin:0 auto}
.sheet.show{transform:translateY(0)}
.sheet[hidden]{display:none!important}
.grip{width:40px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 14px}
.sheet h3{font-family:var(--disp);font-weight:600;font-size:1.15rem;margin:0 0 14px}
.row{margin-bottom:16px}
.row>label{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  font-weight:700;margin-bottom:7px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;color:var(--muted);font-family:var(--body);font-size:.84rem;
  padding:9px 6px;border-radius:9px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--accent);color:var(--good-ink)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.toggle-row span{font-size:.95rem;font-weight:600}
.switch{width:50px;height:30px;border-radius:99px;background:var(--line);border:none;position:relative;cursor:pointer;flex:none}
.switch.on{background:var(--accent)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;transition:transform .2s}
.switch.on::after{transform:translateX(20px)}
.reset-btn{width:100%;margin-top:14px;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--warm);font-family:var(--body);font-weight:700;font-size:.9rem;cursor:pointer}

button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.inner,.card.spring,.card.fly,.progress>i{transition:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;600;700&display=swap">

<div class="app">
  <div class="topbar">
    <div class="title">Expressions<span class="mode" id="modeLabel">Cụm → Nghĩa</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="menuBtn" aria-label="Tùy chọn">☰</button>
      <button class="icon-btn" id="theme" aria-label="Sáng/tối">☾</button>
    </div>
  </div>

  <div class="progress"><i id="bar"></i></div>
  <div class="ptext" id="ptext">0 / 100 đã nhớ</div>

  <div class="deck" id="deck"></div>
  <div class="counter" id="counter">1 / 100</div>

  <div class="bottombar">
    <button class="circle no" id="btn-no" aria-label="Chưa nhớ">✕</button>
    <button class="circle flip" id="btn-flip" aria-label="Lật thẻ">⟳</button>
    <button class="circle yes" id="btn-yes" aria-label="Nhớ rồi">✓</button>
  </div>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="grip"></div>
  <h3>Tùy chọn học</h3>
  <div class="row">
    <label>Hiển thị thẻ</label>
    <div class="seg" id="filter">
      <button data-f="all" class="on">Tất cả</button>
      <button data-f="new">Chưa học</button>
      <button data-f="learned">Đã nhớ</button>
    </div>
  </div>
  <div class="row">
    <label>Chiều học</label>
    <div class="seg" id="side">
      <button data-s="front" class="on">Cụm → Nghĩa</button>
      <button data-s="back">Nghĩa → Cụm</button>
    </div>
  </div>
  <div class="toggle-row"><span>Hiện phiên âm (IPA)</span><button class="switch on" id="sw-ipa" aria-label="Bật/tắt IPA"></button></div>
  <div class="toggle-row"><span>Trộn ngẫu nhiên</span><button class="switch" id="sw-shuffle" aria-label="Bật/tắt trộn"></button></div>
  <button class="reset-btn" id="reset">Đặt lại tiến độ học</button>
</div>

<script>
// 100 common American English expressions — Vietnamese meaning, IPA, example
const CARDS = [
{e:"break the ice",ipa:"/breɪk ðə aɪs/",m:"phá vỡ sự ngại ngùng, bắt chuyện cho đỡ gượng",ex:"He told a joke to break the ice at the meeting."},
{e:"piece of cake",ipa:"/piːs əv keɪk/",m:"chuyện dễ như trở bàn tay",ex:"The exam was a piece of cake."},
{e:"hit the sack",ipa:"/hɪt ðə sæk/",m:"đi ngủ",ex:"I'm exhausted, I'm going to hit the sack."},
{e:"under the weather",ipa:"/ˈʌndər ðə ˈwɛðər/",m:"thấy hơi mệt, không khỏe trong người",ex:"She's feeling a bit under the weather today."},
{e:"call it a day",ipa:"/kɔːl ɪt ə deɪ/",m:"dừng công việc, nghỉ cho hôm nay",ex:"We've done enough, let's call it a day."},
{e:"on the same page",ipa:"/ɒn ðə seɪm peɪdʒ/",m:"cùng hiểu, cùng thống nhất quan điểm",ex:"Let's make sure we're on the same page before we start."},
{e:"cut corners",ipa:"/kʌt ˈkɔːrnərz/",m:"làm ẩu, làm tắt để tiết kiệm công sức/tiền",ex:"Don't cut corners on safety."},
{e:"hang in there",ipa:"/hæŋ ɪn ðɛr/",m:"cố lên, ráng chịu đựng",ex:"Hang in there, things will get better."},
{e:"hit the road",ipa:"/hɪt ðə roʊd/",m:"lên đường, bắt đầu đi",ex:"It's getting late, we should hit the road."},
{e:"a blessing in disguise",ipa:"/ə ˈblɛsɪŋ ɪn dɪsˈɡaɪz/",m:"trong cái rủi có cái may",ex:"Losing that job was a blessing in disguise."},
{e:"beat around the bush",ipa:"/biːt əˈraʊnd ðə bʊʃ/",m:"nói vòng vo, không vào thẳng vấn đề",ex:"Stop beating around the bush and tell me."},
{e:"bite the bullet",ipa:"/baɪt ðə ˈbʊlɪt/",m:"cắn răng chịu đựng, làm việc khó",ex:"I hate the dentist but I'll bite the bullet."},
{e:"the ball is in your court",ipa:"/ðə bɔːl ɪz ɪn jɔːr kɔːrt/",m:"giờ đến lượt bạn quyết định",ex:"I've done my part, the ball is in your court now."},
{e:"get the hang of it",ipa:"/ɡɛt ðə hæŋ əv ɪt/",m:"quen tay, nắm được cách làm",ex:"Driving is hard at first, but you'll get the hang of it."},
{e:"go the extra mile",ipa:"/ɡoʊ ðə ˈɛkstrə maɪl/",m:"nỗ lực hơn mức bình thường",ex:"She always goes the extra mile for her patients."},
{e:"in the same boat",ipa:"/ɪn ðə seɪm boʊt/",m:"cùng cảnh ngộ",ex:"We're all in the same boat here."},
{e:"let the cat out of the bag",ipa:"/lɛt ðə kæt aʊt əv ðə bæɡ/",m:"lỡ miệng làm lộ bí mật",ex:"He let the cat out of the bag about the surprise party."},
{e:"once in a blue moon",ipa:"/wʌns ɪn ə bluː muːn/",m:"rất hiếm khi, họa hoằn",ex:"We only see each other once in a blue moon."},
{e:"pull someone's leg",ipa:"/pʊl ˈsʌmwʌnz lɛɡ/",m:"trêu chọc, đùa ai đó",ex:"Relax, I'm just pulling your leg."},
{e:"speak of the devil",ipa:"/spiːk əv ðə ˈdɛvəl/",m:"vừa nhắc đã thấy xuất hiện",ex:"Speak of the devil — here she comes."},
{e:"spill the beans",ipa:"/spɪl ðə biːnz/",m:"khai ra, tiết lộ",ex:"Come on, spill the beans!"},
{e:"take it easy",ipa:"/teɪk ɪt ˈiːzi/",m:"thư giãn, bình tĩnh, nghỉ ngơi",ex:"You've worked hard, take it easy this weekend."},
{e:"the last straw",ipa:"/ðə læst strɔː/",m:"giọt nước tràn ly",ex:"His rudeness was the last straw."},
{e:"up in the air",ipa:"/ʌp ɪn ðə ɛr/",m:"còn chưa chắc chắn, chưa ngã ngũ",ex:"Our vacation plans are still up in the air."},
{e:"when pigs fly",ipa:"/wɛn pɪɡz flaɪ/",m:"chuyện không bao giờ xảy ra",ex:"He'll apologize when pigs fly."},
{e:"cost an arm and a leg",ipa:"/kɔːst ən ɑːrm ænd ə lɛɡ/",m:"đắt cắt cổ",ex:"That car cost an arm and a leg."},
{e:"back to the drawing board",ipa:"/bæk tə ðə ˈdrɔːɪŋ bɔːrd/",m:"làm lại từ đầu",ex:"The plan failed, so it's back to the drawing board."},
{e:"burn the midnight oil",ipa:"/bɜːrn ðə ˈmɪdnaɪt ɔɪl/",m:"thức khuya làm việc/học",ex:"She burned the midnight oil to finish the report."},
{e:"keep an eye on",ipa:"/kiːp ən aɪ ɒn/",m:"để mắt, trông chừng",ex:"Can you keep an eye on my bag?"},
{e:"out of the blue",ipa:"/aʊt əv ðə bluː/",m:"bất ngờ, không báo trước",ex:"She called me out of the blue."},
{e:"a dime a dozen",ipa:"/ə daɪm ə ˈdʌzən/",m:"nhiều vô kể, chẳng có gì đặc biệt",ex:"Cheap souvenirs are a dime a dozen here."},
{e:"add insult to injury",ipa:"/æd ˈɪnsʌlt tu ˈɪndʒəri/",m:"đã khổ còn khổ thêm",ex:"To add insult to injury, they charged me a fee."},
{e:"barking up the wrong tree",ipa:"/ˈbɑːrkɪŋ ʌp ðə rɒŋ triː/",m:"nhầm đối tượng, đổ lỗi sai chỗ",ex:"If you think I did it, you're barking up the wrong tree."},
{e:"the best of both worlds",ipa:"/ðə bɛst əv boʊθ wɜːrldz/",m:"được cả hai điều tốt",ex:"Working from home gives you the best of both worlds."},
{e:"cry over spilled milk",ipa:"/kraɪ ˈoʊvər spɪld mɪlk/",m:"tiếc nuối chuyện đã rồi",ex:"It's done — no use crying over spilled milk."},
{e:"get out of hand",ipa:"/ɡɛt aʊt əv hænd/",m:"vượt tầm kiểm soát",ex:"The party got out of hand."},
{e:"give the benefit of the doubt",ipa:"/ɡɪv ðə ˈbɛnɪfɪt əv ðə daʊt/",m:"tin tưởng cho qua khi chưa chắc",ex:"I'll give him the benefit of the doubt this time."},
{e:"hit the nail on the head",ipa:"/hɪt ðə neɪl ɒn ðə hɛd/",m:"nói trúng phóc, đúng vấn đề",ex:"You hit the nail on the head with that comment."},
{e:"jump on the bandwagon",ipa:"/dʒʌmp ɒn ðə ˈbændwæɡən/",m:"chạy theo trào lưu",ex:"Everyone's jumping on the bandwagon."},
{e:"keep your chin up",ipa:"/kiːp jɔːr tʃɪn ʌp/",m:"giữ vững tinh thần, đừng nản",ex:"Keep your chin up, you'll pass next time."},
{e:"miss the boat",ipa:"/mɪs ðə boʊt/",m:"lỡ cơ hội",ex:"If you don't apply now, you'll miss the boat."},
{e:"no pain, no gain",ipa:"/noʊ peɪn noʊ ɡeɪn/",m:"không khổ luyện thì không thành công",ex:"Training is tough, but no pain, no gain."},
{e:"on the ball",ipa:"/ɒn ðə bɔːl/",m:"nhanh nhạy, làm việc tốt",ex:"The new assistant is really on the ball."},
{e:"play it by ear",ipa:"/pleɪ ɪt baɪ ɪr/",m:"tùy cơ ứng biến, không lên kế hoạch cứng",ex:"We don't have a plan — let's play it by ear."},
{e:"pull yourself together",ipa:"/pʊl jɔːrˈsɛlf təˈɡɛðər/",m:"trấn tĩnh lại, lấy lại bình tĩnh",ex:"Pull yourself together, it's going to be fine."},
{e:"rings a bell",ipa:"/rɪŋz ə bɛl/",m:"nghe quen quen, thấy hơi nhớ",ex:"That name rings a bell."},
{e:"sit on the fence",ipa:"/sɪt ɒn ðə fɛns/",m:"lưỡng lự, chưa chọn bên nào",ex:"Stop sitting on the fence and decide."},
{e:"take with a grain of salt",ipa:"/teɪk wɪð ə ɡreɪn əv sɔːlt/",m:"nghe rồi dè chừng, đừng tin hết",ex:"Take his advice with a grain of salt."},
{e:"the tip of the iceberg",ipa:"/ðə tɪp əv ðə ˈaɪsbɜːrɡ/",m:"chỉ là bề nổi của vấn đề",ex:"These complaints are just the tip of the iceberg."},

{e:"the bottom line",ipa:"/ðə ˈbɒtəm laɪn/",m:"điểm mấu chốt, kết luận cuối",ex:"The bottom line is we need to save money."},
{e:"think outside the box",ipa:"/θɪŋk ˌaʊtˈsaɪd ðə bɒks/",m:"nghĩ sáng tạo, phá khuôn",ex:"We need to think outside the box."},
{e:"to make a long story short",ipa:"/tə meɪk ə lɒŋ ˈstɔːri ʃɔːrt/",m:"nói ngắn gọn thì",ex:"To make a long story short, we won."},

{e:"get the ball rolling",ipa:"/ɡɛt ðə bɔːl ˈroʊlɪŋ/",m:"khởi động, bắt đầu việc",ex:"Let's get the ball rolling on this project."},

{e:"out of the loop",ipa:"/aʊt əv ðə luːp/",m:"không được cập nhật thông tin",ex:"I've been out of the loop since vacation."},
{e:"put it off",ipa:"/pʊt ɪt ɔːf/",m:"hoãn lại, trì hoãn",ex:"Don't put off the deadline."},
{e:"take for granted",ipa:"/teɪk fɔːr ˈɡræntɪd/",m:"coi là đương nhiên, không trân trọng",ex:"We take clean water for granted."},
{e:"the icing on the cake",ipa:"/ðə ˈaɪsɪŋ ɒn ðə keɪk/",m:"điều tuyệt vời bổ sung thêm",ex:"Winning the award was the icing on the cake."},
];

</script>
<script>
(function(){
  var KEY="amexpr_learned_v1";
  var learned={};
  try{learned=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){learned={};}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(learned));}catch(e){}}

  var state={filter:"all",side:"front",ipa:true,shuffle:false,order:[],pos:0,flipped:false};
  var deck=document.getElementById('deck');

  function baseOrder(){var a=[];for(var i=0;i<CARDS.length;i++)a.push(i);return a;}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function buildOrder(){
    var all=state.shuffle?shuffle(baseOrder()):baseOrder();
    state.order=all.filter(function(i){
      if(state.filter==="learned")return !!learned[i];
      if(state.filter==="new")return !learned[i];
      return true;
    });
    if(state.pos>=state.order.length)state.pos=Math.max(0,state.order.length-1);
  }
  function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function exHTML(card){
    var ex=esc(card.ex),e=card.e.split(" ")[0];
    try{var re=new RegExp("("+e.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"[\\w' ]*)","i");ex=ex.replace(re,"<b>$1</b>");}catch(_){}
    return ex;
  }

  function ttsAvailable(){return ('speechSynthesis'in window)&&('SpeechSynthesisUtterance'in window);}
  function fallbackListen(t){try{window.open("https://youglish.com/pronounce/"+encodeURIComponent(t)+"/english/us","_blank","noopener");}catch(e){}}
  function doSpeak(text,btn){
    if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
    try{speechSynthesis.resume();}catch(e){}
    var u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.9;
    var vs=speechSynthesis.getVoices()||[];
    var v=vs.filter(function(x){return /en[-_]US/i.test(x.lang);})[0]||vs.filter(function(x){return /^en/i.test(x.lang);})[0];
    if(v)u.voice=v;
    var started=false;
    u.onstart=function(){started=true;if(btn)btn.textContent="🔈";};
    u.onend=function(){if(btn)btn.textContent="🔊";};
    u.onerror=function(){if(btn)btn.textContent="🔊";fallbackListen(text);};
    speechSynthesis.speak(u);
    setTimeout(function(){if(!started&&!speechSynthesis.speaking){if(btn)btn.textContent="🔊";fallbackListen(text);}},1500);
  }
  function speak(text,btn){
    if(!ttsAvailable()){fallbackListen(text);return;}
    try{
      var vs=speechSynthesis.getVoices()||[];
      if(!vs.length){var done=false,once=function(){if(done)return;done=true;doSpeak(text,btn);};
        speechSynthesis.onvoiceschanged=once;setTimeout(once,600);}
      else doSpeak(text,btn);
    }catch(e){fallbackListen(text);}
  }

  function updateStats(){
    var lc=0;for(var k in learned)if(learned[k])lc++;
    document.getElementById('bar').style.width=(CARDS.length?lc/CARDS.length*100:0)+"%";
    document.getElementById('ptext').textContent=lc+" / "+CARDS.length+" đã nhớ";
    document.getElementById('modeLabel').textContent=state.side==="front"?"Cụm → Nghĩa":"Nghĩa → Cụm";
  }

  function render(){
    buildOrder();updateStats();
    deck.innerHTML='<div class="ghost"></div>';
    if(!state.order.length){
      var em=document.createElement('div');em.className='empty';
      em.innerHTML='<b>Trống</b>'+(state.filter==="learned"?"Chưa có cụm nào được đánh dấu nhớ.":"Bạn đã học hết — tuyệt vời!");
      deck.appendChild(em);
      document.getElementById('counter').textContent="0 / 0";
      return;
    }
    var idx=state.order[state.pos],card=CARDS[idx],isL=!!learned[idx],ff=(state.side==="front");
    var topT=ff?esc(card.e):esc(card.m),topI=(ff&&state.ipa)?'<div class="ipa">'+esc(card.ipa)+'</div>':'';
    var backT=ff?esc(card.m):esc(card.e),backI=(!ff&&state.ipa)?'<div class="ipa">'+esc(card.ipa)+'</div>':'';
    var c=document.createElement('div');
    c.className='card'+(state.flipped?' flip':'');c.id='card';c.setAttribute('tabindex','0');
    c.innerHTML=
      '<div class="swipe-label like">NHỚ</div><div class="swipe-label nope">CHƯA</div>'+
      '<div class="inner">'+
        '<div class="face front">'+
          '<span class="tag">'+(ff?"Expression":"Nghĩa")+'</span>'+
          '<span class="badge"'+(isL?'':' hidden')+'>✓ đã nhớ</span>'+
          '<div class="'+(ff?"term":"mean")+'">'+topT+'</div>'+topI+
          '<div class="hint">chạm để xem '+(ff?"nghĩa":"cụm từ")+'</div>'+
          '<button class="speak" data-say="'+esc(card.e)+'" aria-label="Phát âm">🔊</button>'+
        '</div>'+
        '<div class="face back">'+
          '<span class="tag">'+(ff?"Nghĩa":"Expression")+'</span>'+
          '<div class="'+(ff?"mean":"term")+'">'+backT+'</div>'+backI+
          '<div class="ex">'+exHTML(card)+'</div>'+
          '<button class="speak" data-say="'+esc(card.ex)+'" aria-label="Đọc cả câu">🔊</button>'+
        '</div>'+
      '</div>';
    deck.appendChild(c);
    document.getElementById('counter').textContent=(state.pos+1)+" / "+state.order.length;
    wireCard(c,idx);
  }

  function flip(){state.flipped=!state.flipped;var c=document.getElementById('card');if(c)c.classList.toggle('flip',state.flipped);}

  function advance(){ // sang thẻ kế sau khi đánh dấu
    // với bộ lọc new/learned, thẻ vừa đổi trạng thái sẽ rời danh sách → pos giữ nguyên trỏ thẻ kế
    buildOrder();
    if(state.filter==="all"){state.pos++;if(state.pos>=state.order.length)state.pos=0;}
    else{if(state.pos>=state.order.length)state.pos=Math.max(0,state.order.length-1);}
    state.flipped=false;render();
  }
  function decide(idx,val,dir){
    if(val)learned[idx]=true;else delete learned[idx];save();
    var c=document.getElementById('card');
    if(c){c.classList.add('fly');
      c.style.transform='translate('+(dir>0?'130%':'-130%')+',-20px) rotate('+(dir>0?18:-18)+'deg)';
      c.style.opacity='0';}
    setTimeout(advance,300);
  }

  function wireCard(c,idx){
    var sx=0,sy=0,dx=0,drag=false,down=false;
    var like=c.querySelector('.like'),nope=c.querySelector('.nope');
    function setLabels(v){var t=Math.min(1,Math.abs(v)/90);like.style.opacity=v>0?t:0;nope.style.opacity=v<0?t:0;}
    c.addEventListener('pointerdown',function(e){
      if(e.target.closest('.speak'))return;
      down=true;drag=false;sx=e.clientX;sy=e.clientY;dx=0;c.classList.remove('spring');
      try{c.setPointerCapture(e.pointerId);}catch(_){}
    });
    c.addEventListener('pointermove',function(e){
      if(!down)return;dx=e.clientX-sx;var dy=e.clientY-sy;
      if(!drag&&(Math.abs(dx)>8||Math.abs(dy)>8))drag=Math.abs(dx)>Math.abs(dy);
      if(drag){e.preventDefault();c.style.transform='translate('+dx+'px,'+(dy*0.2)+'px) rotate('+(dx*0.05)+'deg)';setLabels(dx);}
    });
    function end(){
      if(!down)return;down=false;
      if(!drag){ // chạm nhẹ = lật
        if(Math.abs(dx)<10)flip();
        c.style.transform='';setLabels(0);return;
      }
      if(dx>90){decide(idx,true,1);return;}
      if(dx<-90){decide(idx,false,-1);return;}
      c.classList.add('spring');c.style.transform='';setLabels(0);
    }
    c.addEventListener('pointerup',end);
    c.addEventListener('pointercancel',end);
    c.addEventListener('keydown',function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();}});
    Array.prototype.forEach.call(c.querySelectorAll('.speak'),function(b){
      b.addEventListener('click',function(e){e.stopPropagation();speak(b.getAttribute('data-say'),b);});
    });
  }

  // Bottom bar
  document.getElementById('btn-flip').addEventListener('click',flip);
  document.getElementById('btn-yes').addEventListener('click',function(){var i=state.order[state.pos];if(i!=null)decide(i,true,1);});
  document.getElementById('btn-no').addEventListener('click',function(){var i=state.order[state.pos];if(i!=null)decide(i,false,-1);});

  // Sheet
  var sheet=document.getElementById('sheet'),backdrop=document.getElementById('backdrop');
  function openSheet(){backdrop.hidden=false;sheet.hidden=false;requestAnimationFrame(function(){backdrop.classList.add('show');sheet.classList.add('show');});}
  function closeSheet(){backdrop.classList.remove('show');sheet.classList.remove('show');setTimeout(function(){backdrop.hidden=true;sheet.hidden=true;},300);}
  document.getElementById('menuBtn').addEventListener('click',openSheet);
  backdrop.addEventListener('click',closeSheet);

  function wireSeg(id,attr,apply){
    document.getElementById(id).addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b)return;
      Array.prototype.forEach.call(this.children,function(x){x.classList.remove('on');});
      b.classList.add('on');apply(b.getAttribute(attr));
    });
  }
  wireSeg('filter','data-f',function(v){state.filter=v;state.pos=0;state.flipped=false;render();});
  wireSeg('side','data-s',function(v){state.side=v;state.flipped=false;render();});
  document.getElementById('sw-ipa').addEventListener('click',function(){state.ipa=!state.ipa;this.classList.toggle('on',state.ipa);render();});
  document.getElementById('sw-shuffle').addEventListener('click',function(){state.shuffle=!state.shuffle;this.classList.toggle('on',state.shuffle);state.pos=0;state.flipped=false;render();});
  document.getElementById('reset').addEventListener('click',function(){learned={};save();state.pos=0;state.flipped=false;render();closeSheet();});

  // Theme
  var tbtn=document.getElementById('theme');
  function curTheme(){var a=document.documentElement.getAttribute('data-theme');if(a)return a;
    return window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}
  function syncIcon(){tbtn.textContent=curTheme()==='dark'?'☀':'☾';}
  try{var sv=localStorage.getItem('amexpr_theme');if(sv)document.documentElement.setAttribute('data-theme',sv);}catch(e){}
  syncIcon();
  tbtn.addEventListener('click',function(){var n=curTheme()==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('amexpr_theme',n);}catch(e){}syncIcon();});

  // Keyboard (desktop)
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='BUTTON'&&(e.key==='Enter'||e.key===' '))return;
    if(e.key===' '){e.preventDefault();flip();}
    else if(e.key==='ArrowLeft'){var i=state.order[state.pos];if(i!=null)decide(i,false,-1);}
    else if(e.key==='ArrowRight'){var j=state.order[state.pos];if(j!=null)decide(j,true,1);}
  });

  if('speechSynthesis'in window){speechSynthesis.getVoices();}
  render();
})();
</script>

</body>
