<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnesDose — Tính nhanh liều thuốc gây mê</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#12161c; --muted:#5d6b7a; --line:#e3e8ee;
  --accent:#0f6fb8; --accent-soft:#e7f1f9; --warn:#b4530a; --warn-soft:#fdf1e3;
  --danger:#b3261e; --danger-soft:#fdecea; --ok:#1a7f57; --ok-soft:#e7f4ee;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
  --tap:44px; --on-accent:#ffffff;   /* chữ đặt trên nền màu nhận diện */   /* vùng chạm tối thiểu trên điện thoại */
  /* Màu nhận diện từng tab — cùng độ sáng và độ bão hoà, chỉ khác sắc.
     KHÔNG đụng vào bộ màu ý nghĩa lâm sàng: đỏ nguy hiểm, cam trẻ em, xanh lá an toàn. */
  --t-emergency:#d0006d; --t-emergency-soft:#fff2f5;
  --t-airway:#007965;    --t-airway-soft:#e7f9f3;
  --t-induction:#5d59d8; --t-induction-soft:#f6f3ff;
  --t-infusion:#067491;  --t-infusion-soft:#e8f8ff;
  --t-local:#b230aa;     --t-local-soft:#fef1fc;
  --t-fluid:#0770ac;     --t-fluid-soft:#eff6ff;
  --t-abg:#6729ae;       --t-abg-soft:#f7f3fc;
  /* 5 tab chính — sắc cách nhau đủ xa để phân biệt được ngay cạnh nhau */
  --t-anes:#5d59d8;      --t-anes-soft:#f6f3ff;
  --t-antico:#007965;    --t-antico-soft:#e7f9f3;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0e1116; --card:#161b22; --ink:#e8edf3; --muted:#9bacbe; --line:#252c36;
    --accent:#4ea8f0; --accent-soft:#12293c; --warn:#e5a05a; --warn-soft:#2e2313;
    --danger:#ff8a80; --danger-soft:#33191a; --ok:#5fd0a0; --ok-soft:#12291f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); --on-accent:#0e1116;
    --t-emergency:#ff97b7; --t-emergency-soft:#482d35;
    --t-airway:#06cdac;    --t-airway-soft:#1b3a32;
    --t-induction:#baabff; --t-induction-soft:#363247;
    --t-infusion:#02c5f5;  --t-infusion-soft:#163945;
    --t-local:#f991ee;     --t-local-soft:#422f3f;
    --t-fluid:#74bbff;     --t-fluid-soft:#243649;
    --t-abg:#c99cfc;       --t-abg-soft:#322145;
    --t-anes:#baabff;      --t-anes-soft:#363247;
    --t-antico:#06cdac;    --t-antico-soft:#1b3a32;}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(60px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right)}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);
  box-shadow:var(--shadow);padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:baseline;gap:10px;padding:12px 0 8px}
.brand h1{font-size:17px;margin:0;letter-spacing:-.2px}
.brand span{font-size:12px;color:var(--muted)}
.pt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-bottom:10px}
@media(max-width:560px){.pt-grid{grid-template-columns:repeat(2,1fr)}}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
input,select{width:100%;min-height:var(--tap);padding:10px 12px;border:1px solid var(--line);border-radius:11px;
  background:var(--bg);color:var(--ink);font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.derived{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px;font-size:12px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 11px;font-weight:650;font-size:12.5px;font-variant-numeric:tabular-nums}
.chip.g{background:var(--ok-soft);color:var(--ok)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;min-height:var(--tap);border:1.5px solid var(--tc,var(--line));
  background:var(--bg);color:var(--tc,var(--muted));padding:9px 16px;border-radius:999px;
  font-size:14.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;transition:background .12s}
nav.tabs button[aria-selected="true"]{background:var(--tc);border-color:var(--tc);color:var(--on-accent)}
section.panel{display:none;padding-top:14px}
section.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
/* Tiêu đề thẻ mang màu nhận diện của tab đang mở, kèm vạch màu bên trái */
.card>h2{margin:0;padding:12px 14px 12px 12px;font-size:13.5px;letter-spacing:.4px;text-transform:uppercase;
  color:var(--accent);font-weight:800;border-bottom:1px solid var(--line);
  border-left:4px solid var(--accent);background:var(--accent-soft)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:none}
.row .nm{grid-column:1;grid-row:1;font-weight:650}
.row .sub{grid-column:1;grid-row:2;font-size:12px;color:var(--muted);line-height:1.4}
.row .val{grid-column:2;grid-row:1/3;align-self:start;text-align:right;font-variant-numeric:tabular-nums;font-weight:750;font-size:19px;color:var(--accent);white-space:nowrap}
.row .val small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
.row.danger .val{color:var(--danger)}
.row.ok .val{color:var(--ok)}
.note{padding:10px 14px;font-size:12.5px;color:var(--muted);background:var(--bg);border-top:1px solid var(--line)}
.inline{display:flex;align-items:center;gap:6px}
.inline input{width:76px;min-height:40px;padding:6px 8px;font-size:15px;text-align:right}
.inline select{width:auto;padding:5px 24px 5px 7px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
td.n{text-align:right;font-weight:650}
td.hl{color:var(--accent);font-weight:800;font-size:15.5px}
tr:last-child td{border-bottom:none}
.banner{border-radius:var(--radius);padding:11px 14px;font-size:12.5px;margin-bottom:14px;line-height:1.5}
.banner.warn{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.banner.dg{background:var(--danger-soft);color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 25%,transparent)}
.seg{display:flex;gap:4px;padding:10px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--muted);padding:5px 11px;
  border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
footer{padding:18px 0 30px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.6}
.hidden{display:none!important}
/* Ô nhập liều: gõ tay, không dùng mũi tên tăng giảm */
.inddose::-webkit-outer-spin-button,.inddose::-webkit-inner-spin-button,
.infdose::-webkit-outer-spin-button,.infdose::-webkit-inner-spin-button,
.infconc::-webkit-outer-spin-button,.infconc::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.inddose,.infdose,.infconc{-moz-appearance:textfield;appearance:textfield}

.pickwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.pickwrap>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:700;font-size:14px;
  display:flex;align-items:center;gap:9px}
.pickwrap>summary::-webkit-details-marker{display:none}
.pickwrap>summary .pill{flex:0 0 auto;background:var(--accent);color:var(--on-accent);border-radius:7px;
  padding:2px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.pickwrap>summary .hint{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.pickwrap[open]>summary{border-bottom:1px solid var(--line)}
.pickwrap .picker{padding:10px 12px 12px;margin-bottom:0}
.grpbar{display:flex;gap:5px;padding:10px 12px 0;flex-wrap:wrap}
.grpbar button{flex:1 1 auto;min-height:var(--tap);border:1px solid var(--line);background:var(--bg);color:var(--muted);
  padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  -webkit-tap-highlight-color:transparent}
.grpbar button span{display:inline-block;margin-left:5px;background:var(--line);color:var(--muted);
  border-radius:999px;padding:0 6px;font-size:10.5px;font-variant-numeric:tabular-nums}
.grpbar button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grpbar button.on span{background:var(--accent);color:var(--on-accent)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scrollx table{min-width:100%;white-space:nowrap}
.scrollx td,.scrollx th{white-space:normal;min-width:88px}
ol.tight{margin:0;padding-left:20px}
ol.tight li{margin-bottom:5px}
.dhead .pick{flex:0 0 auto;display:flex;align-items:center;gap:4px;margin:0 8px}
.dhead .pick input{width:64px;min-height:40px;padding:6px 4px;font-size:15px;text-align:center}
.pickwrap>summary{min-height:var(--tap)}
.infdose,.infconc{min-height:40px!important;font-size:15px!important}
.dhead .pick .pu{font-size:10.5px;color:var(--muted);font-weight:600}
.picker{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.picker button{min-height:40px;border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:7px 11px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;line-height:1.3;
  -webkit-tap-highlight-color:transparent}
.picker button b{color:var(--accent);margin-right:3px;font-variant-numeric:tabular-nums}
.picker button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.picker button.on b{color:var(--on-accent)}
.drug{padding:11px 14px;border-bottom:1px solid var(--line)}
.drug:last-child{border-bottom:none}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dhead .nm{font-weight:650;flex:1 1 auto;min-width:0}
.dhead .dose{flex:0 0 auto;max-width:58%;font-weight:800;font-size:19px;color:var(--accent);
  font-variant-numeric:tabular-nums;text-align:right}
.dhead .dose .asis{font-size:12.5px;font-weight:600;color:var(--muted)}
.drug.ped .dose{color:var(--warn)}
.drug .vol{margin-top:3px;font-size:12.5px;color:var(--muted);text-align:right;font-weight:500}
.drug .vol b{color:var(--ink);font-weight:700}
.drug .sub{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.45}
.drug .sub i{color:var(--muted)}
.tag{display:inline-block;background:var(--warn-soft);color:var(--warn);border-radius:5px;
  padding:1px 6px;font-size:10.5px;font-weight:700;vertical-align:middle;letter-spacing:.3px}
.row.ped .val{color:var(--warn)}
.row.step{grid-template-columns:1fr}
.row.step .nm{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.stepno{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent);
  font-size:11.5px;font-weight:700}
.row .sub ul{margin:4px 0 0;padding-left:18px}
.row .sub li{margin-bottom:3px}
ul.tight{margin:0;padding-left:18px}
ul.tight li{margin-bottom:4px}
.inf{padding:12px 14px;border-bottom:1px solid var(--line)}
.inf:last-of-type{border-bottom:none}
.ihead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.ihead .nm{font-weight:700;flex:1 1 auto;min-width:0}
.ihead .dose{flex:0 0 auto;font-weight:800;font-size:19px;color:var(--accent);
  font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mixline{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px;font-size:13px;color:var(--muted)}
.mixline input{width:74px;min-height:40px;padding:6px 8px;font-size:15px;font-weight:700;text-align:center;
  border-radius:9px;-moz-appearance:textfield;appearance:textfield}
.mixline .lbl{font-weight:600}
.mixline .u{font-size:12px;font-weight:600}
.mixline .arrow{color:var(--accent);font-weight:800;margin:0 2px}
.mixline .conc{color:var(--ink);background:var(--accent-soft);border-radius:8px;padding:4px 9px;
  font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mixline .rangehint{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.inf .sub{font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px}
.inf .sub:empty{display:none}
.mono{font-variant-numeric:tabular-nums}

.abggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 12px;padding:12px 14px}
@media(max-width:480px){.abggrid{grid-template-columns:1fr}}
.abgblock{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55}
.abgblock:last-child{border-bottom:none}
.abgblock b.hd{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--accent);margin-bottom:4px;font-weight:800}
.ctxrow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.ctxrow button{min-height:40px;border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:7px 11px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;line-height:1.3;
  -webkit-tap-highlight-color:transparent}
.ctxrow button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.orbox{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);
  border-left:3px solid var(--accent);font-size:12.5px;line-height:1.55}
.orbox b.orhd{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;
  color:var(--accent);margin-bottom:5px;font-weight:800}
.orbox u{text-decoration:none;font-weight:700;color:var(--ink)}
details.pickwrap .abgblock:last-child{border-bottom:none}
.blkgrp{padding:9px 14px;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:800;color:var(--muted)}
.blk{padding:10px 14px;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:none}
.blk.over{background:var(--warn-soft)}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bhead .nm{font-weight:650;flex:1 1 auto;min-width:0}
.bhead .dose{flex:0 0 auto;font-weight:800;font-size:18px;color:var(--accent);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.blk .sub{margin-top:4px;font-size:12px;color:var(--muted);line-height:1.45}

/* Mục con trong tab Gây mê */
nav.subtabs{display:flex;gap:4px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
nav.subtabs::-webkit-scrollbar{display:none}
nav.subtabs button{flex:0 0 auto;min-height:38px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);padding:7px 14px;border-radius:9px;font-size:13.5px;font-weight:700;cursor:pointer;
  white-space:nowrap;-webkit-tap-highlight-color:transparent}
nav.subtabs button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.subpanel{display:none;padding-top:12px}
.subpanel.on{display:block}

/* Trị số sinh tồn bình thường theo tuổi, hiện ngay dưới dòng cân nặng */
.pedvit{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;
  margin-top:2px;padding:8px 11px;border-radius:10px;background:var(--warn-soft);
  border:1px solid color-mix(in srgb,var(--warn) 22%,transparent);font-size:12px;color:var(--warn)}
.pedvit .pv-t{font-weight:800;text-transform:uppercase;letter-spacing:.3px;font-size:10.5px}
.pedvit .pv{font-variant-numeric:tabular-nums}
.pedvit .pv b{font-weight:700}
.pedvit .pv.danger{color:var(--danger);font-weight:650}

/* Thang điểm đánh giá */
.assub{padding:10px 14px 4px;font-size:12px;color:var(--muted);line-height:1.45}
.asitem{padding:9px 14px;border-bottom:1px solid var(--line)}
.asq{font-size:13.5px;font-weight:650;margin-bottom:6px}
.ash{font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.autotag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:5px;
  padding:1px 6px;font-size:10px;font-weight:700;vertical-align:middle;letter-spacing:.2px}
.asbtns{display:flex;flex-wrap:wrap;gap:5px}
.asbtns .asbtn{min-height:38px;border:1px solid var(--line);background:var(--bg);color:var(--muted);
  padding:6px 12px;border-radius:9px;font-size:13px;font-weight:650;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.asbtns .asbtn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.asres{padding:11px 14px;font-size:12.5px;line-height:1.55;border-top:1px solid var(--line)}
.asres .rh{display:block;font-size:15px;font-weight:800;margin-bottom:4px}
.asres .rb{color:var(--muted)}
.asres.none{color:var(--muted);font-style:italic}
.asres.ok{background:var(--ok-soft)} .asres.ok .rh{color:var(--ok)}
.asres.warn{background:var(--warn-soft)} .asres.warn .rh{color:var(--warn)}
.asres.danger{background:var(--danger-soft)} .asres.danger .rh{color:var(--danger)}

/* Màn hình nằm ngang / màn hình thấp: chỉ giữ cố định hàng tab,
   phần nhập thông số bệnh nhân cuộn đi để lấy chỗ cho nội dung */
@media (orientation:landscape) and (max-height:560px){
  .brand{padding:8px 0 6px}
  .derived{padding-bottom:8px}
  nav.tabs{padding-bottom:6px}
  section.panel{padding-top:12px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>AnesDose</h1><span>Tính nhanh liều thuốc gây mê</span></div>
    <div class="pt-grid">
      <div class="field"><label>Cân nặng (kg)</label><input id="wt" type="number" inputmode="decimal" step="0.1" value="60"></div>
      <div class="field"><label>Chiều cao (cm)</label><input id="ht" type="number" inputmode="decimal" step="1" value="165"></div>
      <div class="field"><label>Tuổi</label>
        <div style="display:flex;gap:5px">
          <input id="age" type="number" inputmode="decimal" step="1" value="40">
          <select id="ageUnit" style="width:88px"><option value="y">năm</option><option value="m">tháng</option></select>
        </div>
      </div>
      <div class="field"><label>Giới</label><select id="sex"><option value="M">Nam</option><option value="F">Nữ</option></select></div>
    </div>
    <div class="derived" id="derived"></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <section class="panel on" id="p-emergency"></section>
  <section class="panel" id="p-anes">
    <nav class="subtabs" id="subtabs"></nav>
    <div class="subpanel on" id="p-assess"></div>
    <div class="subpanel" id="p-induction"></div>
    <div class="subpanel" id="p-airway"></div>
    <div class="subpanel" id="p-infusion"></div>
    <div class="subpanel" id="p-fluid"></div>
  </section>
  <section class="panel" id="p-local"></section>
  <section class="panel" id="p-antico"></section>

/* ==================== TIỆN ÍCH ==================== */
const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
function r(x, d){ if(!isFinite(x)) return "—"; const p = Math.pow(10,d); return (Math.round(x*p)/p).toString(); }
// làm tròn "thông minh" theo độ lớn
function sig(x){
  if(!isFinite(x)||x<=0) return "—";
  if(x >= 100) return r(x,0);
  if(x >= 10)  return r(x,1);
  if(x >= 1)   return r(x,1);
  if(x >= 0.1) return r(x,2);
  return r(x,3);
}
function rng(a,b,unit){ return (sig(a)===sig(b)) ? sig(a)+" "+unit : sig(a)+"–"+sig(b)+" "+unit; }

/* ==================== BỆNH NHÂN ==================== */
const P = { wt:60, ht:165, ageY:40, sex:"M" };

function readPatient(){
  P.wt = num($("wt").value);
  P.ht = num($("ht").value);
  const a = num($("age").value);
  P.ageY = $("ageUnit").value === "m" ? a/12 : a;
  P.sex = $("sex").value;
}
// BMI
const bmi = () => (P.ht>0 ? P.wt / Math.pow(P.ht/100,2) : 0);
// Cân nặng lý tưởng — Devine (người lớn); trẻ em dùng công thức BMI-50th đơn giản hoá
function IBW(){
  if(P.wt <= 0) return 0;
  if(P.ageY < 18){ // Traub-Johnson / xấp xỉ: IBW = BMI 50th * h^2 ; dùng TBW nếu không đủ dữ liệu
    if(P.ht <= 0) return P.wt;
    const b50 = P.ageY < 2 ? 16.5 : 14.5 + 0.28*Math.min(P.ageY,18); // xấp xỉ BMI bách phân vị 50
    return b50 * Math.pow(P.ht/100,2);
  }
  // Devine chỉ đúng từ khoảng 152 cm trở lên; dưới mức đó dùng BMI 22 để không ra số vô lý
  if(P.ht < 152) return 22 * Math.pow(P.ht/100, 2);
  const inch = P.ht/2.54;
  const base = P.sex === "M" ? 50 : 45.5;
  const v = base + 2.3*(inch-60);
  return v > 0 ? v : P.wt;
}
// Cân nặng nạc — Janmahasatian
function LBW(){
  if(P.wt <= 0) return 0;
  const b = bmi(); if(b<=0) return P.wt;
  if(P.ageY < 18){ // trẻ em: Peters — LBM = 3.8 × 0.0215 × W^0.6469 × H^0.7236
    if(P.ht <= 0) return P.wt;
    return 3.8*0.0215*Math.pow(P.wt,0.6469)*Math.pow(P.ht,0.7236);
  }
  return P.sex === "M" ? (9270*P.wt)/(6680+216*b) : (9270*P.wt)/(8780+244*b);
}
// Cân nặng hiệu chỉnh
function AdjBW(){ if(P.wt <= 0) return 0; const i = IBW(); return i + 0.4*(P.wt - i); }
function BSA(){ return Math.sqrt((P.ht*P.wt)/3600); }
// Cân nặng dùng để tính liều, theo "basis"
function W(basis){
  switch(basis){
    case "IBW": return Math.min(IBW(), P.wt);
    case "LBW": return Math.min(LBW(), P.wt);
    case "ADJ": return (IBW()>0 && P.wt > IBW()*1.2) ? AdjBW() : P.wt;
    default:    return P.wt;
  }
}

const isNeo   = () => P.ageY < 1/12;
const isInfant= () => P.ageY < 1;
const isElder = () => P.ageY >= 65;
const isObese = () => bmi() >= 30;

ơng ứng.","headers":["Cân nặng bệnh nhân","Cỡ LMA","Thể tích bóng chèn tối đa (mL)"],"rows":[["Đến 5 kg (sơ sinh / nhũ nhi)","1","Đến 4 mL"],["5-10 kg (nhũ nhi)","1½","Đến 7 mL"],["10-20 kg (nhũ nhi / trẻ em)","2","Đến 10 mL"],["20-30 kg (trẻ em)","2½","Đến 14 mL"],["30-50 kg (trẻ em / thiếu niên)","3","Đến 20 mL"],["50-70 kg (người lớn thể trạng trung bình)","4","Đến 30 mL"],["70-100 kg (người lớn thể trạng lớn)","5","Đến 40 mL"],["Trên 100 kg (người lớn thể trạng rất lớn)","6","Đến 50 mL"]],"steps":null,"weightCol":0,"notes":["Thể tích ghi trong bảng là thể tích bơm bóng chèn TỐI ĐA — chỉ bơm lượng vừa đủ để kín, không bơm đến mức tối đa một cách thường quy.","Sách in cỡ 1½ và 2½ (một số hãng ghi là 1.5 và 2.5)."]},{"id":"king-lt-procedure","title":"Đặt ống thanh quản King LT","intro":"Quy trình đặt ống thanh quản (laryngeal tube - King LT).","steps":["Chống chỉ định: bệnh nhân cao dưới 4 feet (~122 cm); không bảo vệ được đường thở khỏi hít sặc.","Bất động cột sống cổ nếu cần. Cung cấp oxy trước với O2 100%. Bôi trơn đầu xa và mặt sau của ống.","Xả xẹp bóng chèn. Mở miệng, dùng thủ thuật nâng cằm nếu cần, đưa đầu ống vào bên trong khoang miệng.","Đưa đầu ống vào phía sau trong khi xoay ống về đường giữa.","Đẩy ống vào cho đến khi vạch dấu (đế ống nối) ngang với cung răng hoặc nướu.","Bơm bóng chèn bằng khí với thể tích tối thiểu cần thiết (xem bảng cỡ LT).","Gắn thiết bị thông khí (bóng bóp/máy thở). Trong khi thông khí, nhẹ nhàng rút ống ra cho đến khi thông khí trở nên dễ dàng.","Điều chỉnh thể tích bóng chèn nếu cần để đạt độ kín tốt.","Kiểm tra vị trí đúng: quan sát di động lồng ngực và nghe phế âm hai phổi.","Gắn máy đo EtCO2 và máy đo SpO2.","Cố định bằng băng dính hoặc dụng cụ giữ ống.","Đánh giá lại đường thở định kỳ."],"headers":null,"rows":null,"weightCol":null,"notes":["Sau khi bơm bóng, rút ống ra từ từ trong lúc bóp bóng cho tới khi thông khí dễ nhất — đây là bước then chốt để ống nằm đúng vị trí."]},{"id":"king-lt-size","title":"Cỡ ống thanh quản King LT theo chiều cao bệnh nhân","intro":"Sách chọn cỡ King LT theo CHIỀU CAO bệnh nhân (không theo cân nặng); mỗi cỡ có mã màu riêng.","headers":["Chiều cao bệnh nhân","Cỡ LT","Thể tích bóng chèn (mL)"],"rows":[["35-45 inch (~89-114 cm)","2","25-35"],["41-51 inch (~104-130 cm)","2,5","30-40"],["4-5 feet (~122-152 cm)","3","45-60"],["5-6 feet (~152-183 cm)","4","60-80"],["Trên 6 feet (>183 cm)","5","70-90"]],"steps":null,"weightCol":null,"notes":["Bảng này KHÔNG có cột cân nặng — tiêu chí chọn cỡ King LT là chiều cao.","Mã màu trong sách: cỡ 2 = xanh lá, cỡ 2,5 = cam, cỡ 3 = vàng, cỡ 4 = đỏ, cỡ 5 = tím.","Bơm bóng chèn bằng thể tích tối thiểu đủ kín, trong khoảng ghi ở bảng."]},{"id":"transport-vent","title":"Chuyển bệnh nhân thở máy sang máy thở vận chuyển","intro":"Checklist chuyển bệnh nhân đang thở máy sang máy thở vận chuyển.","steps":["Xác định các cài đặt máy thở hiện tại.","Đánh giá khí máu động mạch gần nhất.","Đảm bảo đường thở nhân tạo được cố định chắc chắn (băng dính, dây buộc, dụng cụ cố định tại chỗ).","Bắt đầu theo dõi SpO2 và EtCO2 dạng sóng (capnography).","Bật máy thở vận chuyển.","Lắp dây máy (mạch thở) mới cho máy thở vận chuyển.","Điều chỉnh dòng khí nền liên tục.","Chọn tần số thở, thời gian hít vào, lưu lượng và FiO2.","Chọn chế độ thở (CPAP có PEEP, IMV/SIMV, thở máy kiểm soát...).","Nối bệnh nhân với máy thở.","Đánh giá lại bệnh nhân, đo SpO2 và EtCO2 dạng sóng.","Điều chỉnh cài đặt để duy trì oxy hóa máu (SpO2 92-94%) và thông khí phút đầy đủ.","Duy trì đường thở ổn định và thông thoáng (hút đờm khi cần).","Kiểm tra và ghi lại cài đặt máy thở trước, trong và khi kết thúc quá trình vận chuyển.","Đảm bảo đủ nguồn điện (pin) và nguồn oxy cho toàn bộ quá trình vận chuyển.","Đánh giá và ghi lại phế âm.","Chuyển sang bóp bóng bằng tay (bóng - van - mask/ống) nếu nghi ngờ máy thở trục trặc."],"headers":null,"rows":null,"weightCol":null,"notes":["Luôn mang theo bóng bóp có van (BVM) trong suốt quá trình vận chuyển."]},{"id":"low-pressure-alarm","title":"Xử trí báo động áp lực thấp của máy thở","intro":"Các bước xử trí khi máy thở báo động áp lực đường thở thấp.","steps":["Kiểm tra nhanh các mối nối máy thở - bệnh nhân để phát hiện chỗ tuột; siết chặt lại tất cả các mối nối.","Nếu báo động vẫn tiếp tục, ngắt kết nối máy thở và thông khí thủ công bằng bóng - van - mask.","Bịt kín đầu nối mạch thở của máy thở bằng ngón tay có mang găng và quan sát nhịp thở kế tiếp do máy tạo ra.","Nếu áp kế của máy thở cố gắng tăng áp lực và báo động chuyển thành áp lực cao, nghĩa là mạch thở của máy còn nguyên vẹn — chỗ rò rỉ nằm ở phía bệnh nhân hoặc ở đường thở nhân tạo."],"headers":null,"rows":null,"weightCol":null,"notes":["Nguyên tắc: nghi ngờ máy thở trục trặc thì tách bệnh nhân khỏi máy và bóp bóng bằng tay."]},{"id":"niv","title":"Hỗ trợ thông khí không xâm lấn (NIV)","intro":"Danh sách kiểm tra cài đặt máy thở - phần thông khí không xâm lấn.","headers":["Phương thức","Mô tả và cài đặt thông thường"],"rows":[["CPAP (áp lực đường thở dương liên tục)","Cải thiện oxy hóa máu ở bệnh nhân tự thở. Cài đặt thông thường 5-15 cm H2O."],["BiPAP (áp lực đường thở dương hai mức)","Cải thiện khả năng oxy hóa máu và thông khí ở bệnh nhân tự thở. Cài đặt thông thường: IPAP (áp lực hít vào) 6-14 cm H2O, EPAP (áp lực thở ra) 3-5 cm H2O. Điều chỉnh theo thể tích khí lưu thông, nhịp hô hấp và SpO2."]],"steps":null,"weightCol":null,"notes":["NIV chỉ dùng ở bệnh nhân còn tự thở, tỉnh táo, hợp tác và bảo vệ được đường thở."]},{"id":"invasive-modes","title":"Các chế độ thông khí xâm lấn","intro":"Định nghĩa và chỉ định của các chế độ thở máy xâm lấn.","headers":["Chế độ","Định nghĩa","Chỉ định"],"rows":[["CMV (thông khí kiểm soát hoàn toàn)","Máy thở cung cấp nhịp thở với tần số và thể tích khí lưu thông đã cài đặt trước. Bệnh nhân không thể tự thở vượt tần số đã cài.","Khi cần kiểm soát cả thể tích khí lưu thông lẫn tần số thở, ở bệnh nhân ngừng thở hoặc được gây mê/liệt cơ bằng thuốc."],["AC (chế độ hỗ trợ/kiểm soát)","Máy thở đảm bảo tần số thở tối thiểu. Bệnh nhân có thể thở vượt tần số cài đặt, nhưng mỗi nhịp thở tự phát đều được cung cấp thể tích khí lưu thông đã cài đặt.","Kiểm soát công thở, đồng thời cho phép bệnh nhân tự thiết lập nhịp thở của mình."],["SIMV (thông khí bắt buộc ngắt quãng đồng bộ)","Cung cấp tần số và thể tích khí lưu thông bắt buộc, đồng bộ với nhịp tự thở của bệnh nhân. Bệnh nhân có thể tự thở thêm ngoài tần số cài đặt, với tần số và thể tích khí lưu thông do chính bệnh nhân quyết định.","Cho phép bệnh nhân đảm nhận phần lớn hoặc toàn bộ công thở, tùy mức tần số cài đặt. Có thể dùng như chế độ cai máy."],["PCV (thông khí kiểm soát áp lực)","Nhịp thở được cung cấp đến một mức áp lực cài đặt trước, trong thời gian hít vào định sẵn. Thể tích khí lưu thông có thể thay đổi theo từng nhịp, tùy độ đàn hồi (compliance) của phổi.","Được dùng để tránh áp lực quá mức; thường kết hợp với các chiến lược bảo vệ phổi ở bệnh nhân khó đạt được thông khí đủ."],["PRVC (kiểm soát thể tích có điều chỉnh áp lực)","Nhịp thở được cung cấp với thể tích khí lưu thông cài đặt ở mức áp lực thấp nhất có thể.","Dùng khi cần kiểm soát cả áp lực lẫn thể tích."],["IRV (thông khí tỷ lệ nghịch đảo)","Thời gian hít vào được cài dài hơn thời gian thở ra.","Dùng để tăng oxy hóa máu. Cần thận trọng để tránh tình trạng căng phồng phổi quá mức và tình trạng chống máy (bệnh nhân không dung nạp)."],["PSV (thông khí hỗ trợ áp lực)","Bác sĩ lâm sàng chọn mức áp lực hỗ trợ để tăng cường mỗi nhịp tự thở của bệnh nhân.","Thường được dùng như chế độ cai máy hoặc chế độ thoải mái. Khắc phục sức cản của đường thở và của dây máy thở."]],"steps":null,"weightCol":null,"notes":["Bảng nằm ở hai trang liên tiếp trong sách (phần \"Chế độ thông khí xâm lấn\" và \"tiếp theo\")."]},{"id":"vent-initial-settings","title":"Hướng dẫn cài đặt thông số thở máy khởi đầu ở người lớn","intro":"Các thông số cần cài đặt khi bắt đầu thở máy ở người lớn và khoảng giá trị khuyến cáo.","headers":["Thông số","Định nghĩa","Khoảng cài đặt"],"rows":[["Vt (thể tích khí lưu thông)","Lượng khí được cung cấp trong mỗi nhịp thở của máy thở","5-7 mL/kg ban đầu, điều chỉnh theo khí máu động mạch (ABG), EtCO2 hoặc PIP"],["RR (tần số hô hấp)","Số nhịp thở của máy mỗi phút","10-14 lần/phút ban đầu, điều chỉnh theo ABG, EtCO2 hoặc nhu cầu bệnh nhân"],["FiO2 (phân suất oxy khí hít vào)","Tỷ lệ phần trăm oxy trong khí hít vào, biểu thị dưới dạng số thập phân","0,2-1,0; ban đầu 1,0 (100%) rồi giảm dần để duy trì SpO2 92-94%; dùng FiO2 thấp nhất có thể (<0,5) để tránh ngộ độc oxy"],["Lưu lượng đỉnh (peak flow)","Tốc độ cung cấp thể tích khí lưu thông","Thay đổi rất nhiều (35-100 L/phút)"],["Thời gian hít vào (inspiratory time)","Thời gian cài đặt để cung cấp thể tích khí lưu thông hoặc lưu lượng đã cài","Thay đổi trong khoảng 0,5-1,5 giây"],["PIP (áp lực đỉnh đường thở hít vào)","Áp lực đỉnh tạo ra trong quá trình thông khí","Nên duy trì ở mức thấp nhất có thể để tránh chấn thương áp lực (20-30 cm H2O); không được vượt quá 50 cm H2O"],["Tỷ lệ I:E (tỷ lệ thời gian hít vào / thở ra)","Tỷ lệ giữa thời gian hít vào và thời gian thở ra","1:2"]],"steps":null,"weightCol":null,"notes":["Bảng nằm ở hai trang liên tiếp trong sách (phần đầu và phần \"tiếp theo\").","PEEP không được liệt kê riêng trong bảng của sách; PEEP xuất hiện trong phần chế độ CPAP/thở máy vận chuyển."]},{"id":"svo2","title":"Giá trị SvO2 và các yếu tố ảnh hưởng","intro":"SvO2 (độ bão hòa oxy máu tĩnh mạch trộn) bình thường 60-80%; không tương quan trực tiếp với DO2 hoặc VO2. Giá trị <60% hoặc >80% cho thấy mất cân bằng giữa cung cấp và tiêu thụ oxy.","headers":["Yếu tố","SvO2 giảm (<60%)","SvO2 tăng (>80%)"],"rows":[["Cung cấp oxy (DO2)","Giảm cung cấp oxy: giảm SaO2 (độ bão hòa O2 máu động mạch), giảm hemoglobin, giảm PaO2 (áp lực riêng phần oxy máu động mạch)","Tăng cung cấp oxy: tăng SaO2, tăng hemoglobin, tăng PaO2"],["Tiêu thụ oxy (VO2)","Tăng tiêu thụ oxy: run lạnh, sốt, tăng công thở, tăng hoạt động cơ vân, co giật, đau, các can thiệp chăm sóc điều dưỡng (xoay trở, hút đờm, thay băng, tắm rửa)","Giảm tiêu thụ oxy: gây mê, hạ thân nhiệt, giảm công thở, giảm hoạt động cơ vân, thuốc an thần và thuốc giãn cơ, suy giáp, rối loạn chức năng sử dụng oxy của tế bào"]],"steps":null,"weightCol":null,"notes":["Bảng gốc dùng ký hiệu mũi tên tăng/giảm; bản dịch máy làm mất các mũi tên này (in sai thành \"ĐẠI HỌC\"). Cách trình bày ở đây theo đúng cấu trúc hai cột của sách: cột trái = SvO2 giảm, cột phải = SvO2 tăng.","Bảng nằm ở hai trang liên tiếp trong sách (phần đầu và phần \"tiếp theo\")."]},{"id":"capnography","title":"Theo dõi EtCO2 (capnography) - ứng dụng và diễn giải","intro":"Ứng dụng lâm sàng của theo dõi CO2 cuối thì thở ra và cách diễn giải dạng sóng tương ứng.","headers":["Ứng dụng","Dạng sóng / tình huống","Diễn giải"],"rows":[["Dạng sóng capnography bình thường","Đồ thị CO2 theo thời gian gồm 4 pha: A-B, B-C, C-D, D-E","AB = đường nền hô hấp (baseline); BC = pha thở ra đi lên; CD = cao nguyên thở ra (giá trị EtCO2 đọc ở điểm D); DE = pha hít vào, CO2 trở về 0"],["Phát hiện ống nội khí quản đặt nhầm vào thực quản","Xuất hiện một đường thẳng, phẳng - không phát hiện được CO2","Ống không nằm trong khí quản: phải rút ống và đặt lại"],["Xác nhận ống nội khí quản nằm đúng trong khí quản","Có sóng capnogram với các nhịp thở ra liên tiếp","Khi ống nằm trong khí quản, CO2 thở ra được hiển thị trên capnogram"],["Nhận biết bệnh nhân bắt đầu có nỗ lực tự thở trong khi đang bị giãn cơ / an thần","Xuất hiện khuyết lõm (\"curare cleft\") trên cao nguyên thở ra","Cơ hoành của bệnh nhân co lại tạo ra một nhịp hít vào, tạo vết khuyết trên sóng capnogram - dấu hiệu thuốc giãn cơ đang hết tác dụng"],["Nhận biết bệnh nhân bị ngắt kết nối khỏi máy thở","Sóng biến mất ngay lập tức và trở nên phẳng","Mất đột ngột EtCO2 - kiểm tra ngay mối nối, ống và máy thở"],["Tiên lượng kết quả bệnh nhân (trong hồi sinh tim phổi)","Biên độ sóng EtCO2 (thang 0-38 mmHg)","EtCO2 càng cao thì cung lượng tim càng cao và nỗ lực hồi sức càng hiệu quả"]],"steps":null,"weightCol":null,"notes":["Bảng nằm ở hai trang liên tiếp trong sách (phần đầu và phần \"tiếp theo\").","Bản dịch máy dịch sai nhiều thuật ngữ (ví dụ \"thể tích thủy triều\" = thể tích khí lưu thông, \"vòng bít\" = bóng chèn, \"nhúng\" = khuyết lõm trên sóng, \"thông gió\" = thông khí); nội dung ở đây đã được hiệu đính theo thuật ngữ gây mê hồi sức."]}];

nh, đẩy dịch; có thể lặp lại 12 mg","amount":6,"unit":"mg","route":"TM nhanh (bolus) kèm đẩy dịch nhanh","repeat":"lặp lại 12 mg nếu không hiệu quả","perKg":null,"pedPerKg":0.1,"pedUnit":"mg/kg","pedMax":6,"note":"Tránh dùng nếu có WPW hoặc hen phế quản. Nhi khoa: liều 2 là 0,2 mg/kg (tối đa 12 mg)"},{"name":"Esmolol","adult":"0,5 mg/kg TM trong 1 phút, có thể lặp lại sau 1 phút; sau đó truyền 50-300 mcg/kg/phút","amount":0.5,"unit":"mg/kg","route":"TM","repeat":"có thể lặp lại sau 1 phút","perKg":0.5,"infusionLo":50,"infusionHi":300,"infusionUnit":"mcg/kg/phút","pedPerKg":0.5,"pedUnit":"mg/kg","pedMax":null,"note":"Tránh dùng nếu có WPW, giảm EF hoặc hen phế quản"},{"name":"Metoprolol","adult":"1-2,5 mg TM, có thể lặp lại hoặc tăng gấp đôi sau 3-5 phút","amountLo":1,"amountHi":2.5,"unit":"mg","route":"TM","repeat":"lặp lại hoặc tăng gấp đôi sau 3-5 phút","perKg":null,"pedPerKg":0.1,"pedUnit":"mg/kg","pedMax":5,"note":"Tránh dùng nếu có WPW, giảm EF hoặc hen phế quản"},{"name":"Diltiazem","adult":"10-20 mg TM trong 2 phút, có thể lặp lại sau 5 phút; sau đó truyền 5-10 mg/giờ","amountLo":10,"amountHi":20,"unit":"mg","route":"TM","repeat":"lặp lại sau 5 phút","perKg":null,"infusionLo":5,"infusionHi":10,"infusionUnit":"mg/giờ","pedPerKg":0.25,"pedUnit":"mg/kg","pedMax":20,"note":"Tránh dùng nếu có WPW hoặc giảm EF. Không khuyến cáo thường quy ở trẻ < 1 tuổi"},{"name":"Amiodarone","adult":"150 mg TM truyền CHẬM trong 10 phút, có thể lặp lại một lần; sau đó truyền 1 mg/phút","amount":150,"unit":"mg","route":"TM truyền chậm trong 10 phút","repeat":"có thể lặp lại một lần","perKg":null,"infusionLo":1,"infusionHi":1,"infusionUnit":"mg/phút","pedPerKg":5,"pedUnit":"mg/kg","pedMax":300,"note":"Tránh dùng nếu có WPW. Truyền chậm để tránh tụt huyết áp; nhi khoa (nhịp nhanh có mạch) 5 mg/kg truyền trong 20-60 phút"},{"name":"Procainamide","adult":"20-50 mg/phút TM (tối đa 17 mg/kg) đến khi ức chế được loạn nhịp; sau đó truyền 1-4 mg/phút","amountLo":20,"amountHi":50,"unit":"mg/phút","route":"TM","repeat":"đến khi ức chế loạn nhịp hoặc đạt tối đa 17 mg/kg","perKg":17,"infusionLo":1,"infusionHi":4,"infusionUnit":"mg/phút","pedPerKg":15,"pedUnit":"mg/kg","pedMax":null,"note":"Tránh dùng nếu giảm EF hoặc QT kéo dài. Nhi khoa: 15 mg/kg truyền trong 30-60 phút"},{"name":"Magnesi sulfat","adult":"1-2 g TM (dùng cho xoắn đỉnh)","amountLo":1,"amountHi":2,"unit":"g","route":"TM","repeat":"có thể lặp lại","perKg":null,"pedPerKg":50,"pedUnit":"mg/kg","pedMax":2000,"note":"Chỉ định khi VT đa hình/xoắn đỉnh (sách ghi 'Cân nhắc Magnesi cho Torsades de Pointes')"}],"causes":["Cần loại trừ nhịp nhanh xoang (đáp ứng bù trừ do đau, giảm thể tích, thiếu oxy, sốt, thiếu máu, thuốc)","Rung nhĩ / cuồng nhĩ (phức bộ hẹp không đều)","Nhịp nhanh thất (phức bộ rộng đều, đặc biệt khi có CAD/MI)","VT đa hình / xoắn đỉnh (phức bộ rộng không đều)","Hội chứng WPW (tiền kích thích) - chống chỉ định adenosine, chẹn beta, chẹn kênh canxi, amiodarone"],"notes":["Tiêu chuẩn KHÔNG ỔN ĐỊNH: HA tâm thu < 75 mmHg, tụt HA tâm thu đột ngột dưới mức nền, thiếu máu cơ tim cấp/đau ngực, suy tim sung huyết cấp, thay đổi tri giác cấp","Bệnh nhân chưa gây mê cần được an thần trước khi chuyển nhịp","Loại trừ nhịp nhanh xoang trước khi điều trị SVT","Cân nhắc nghiệm pháp kích thích phế vị trước khi dùng thuốc (SVT ổn định)","Nếu ở bất kỳ thời điểm nào bệnh nhân mất ổn định: quay lại phác đồ SVT KHÔNG ỔN ĐỊNH trang 1","Nếu SVT không ổn định kháng trị: ngừng dùng hỗ trợ nhận thức và hội chẩn chuyên gia STAT"],"short":"SVT","grp":"anes"},{"id":"vfib-vtach","no":4,"title":"VFIB / VTACH (Rung thất / Nhịp nhanh thất vô mạch)","definition":"Ngừng tuần hoàn không có mạch kèm rung thất (VFIB) hoặc nhịp nhanh thất (VTACH) trên ECG - là nhịp sốc điện được.","signs":["Mất mạch","ECG có hình ảnh rung thất (sóng hỗn loạn) hoặc nhịp nhanh thất (phức bộ rộng đều, nhanh)"],"tasks":[{"task":"Khủng hoảng / Nguồn lực","actions":["Thông báo cho toàn nhóm; xác định người lãnh đạo","Gọi báo động cấp cứu (call code)","Gọi lấy xe cấp cứu ngừng tim (code cart)"]},{"task":"CPR (Hồi sinh tim phổi)","actions":["Ép tim tần số 100-120 lần/phút, hạn chế tối đa thời gian gián đoạn","Độ sâu ép tim ≥ 5 cm; cho phép lồng ngực nảy lại hoàn toàn; cân nhắc dùng ván ép tim","Duy trì EtCO2 > 10 mmHg và huyết áp tâm trương > 20 mmHg","Đổi người ép tim và kiểm tra nhịp tim mỗi 2 phút","Nếu chuyển thành nhịp không sốc điện được: Xem Vô tâm thu/PEA #1","Chỉ kiểm tra mạch khi có dấu hiệu ROSC (EtCO2 tăng liên tục, dạng sóng động mạch tự phát, thay đổi nhịp)","Có thể CPR ở tư thế nằm sấp (ép vùng lưng ngang bả vai) nếu đường thở đã được bảo đảm"]},{"task":"Đường thở / Thông khí","actions":["O2 100%, 10-15 L/phút","Ưu tiên khử rung tim trước đặt nội khí quản","Thông khí bằng mặt nạ với tỷ lệ 30 lần ép tim / 2 lần thổi ngạt","Nếu đường thở đã được bảo đảm: 10 nhịp thở/phút, thể tích khí lưu thông 6-7 mL/kg"]},{"task":"Khử rung tim","actions":["Dán miếng dán và khử rung NGAY: 120-200 J hai pha hoặc 360 J một pha","Tiếp tục CPR ngay sau sốc","Tăng dần mức năng lượng và lặp lại sốc điện mỗi 2 phút"]},{"task":"Đường truyền tĩnh mạch","actions":["Bảo đảm có đường truyền tĩnh mạch (IV) hoặc trong xương (IO) hoạt động tốt"]},{"task":"Thuốc","actions":["Tắt toàn bộ thuốc mê bốc hơi và các thuốc truyền gây giãn mạch","Sau lần sốc thứ 2: epinephrine 1 mg tiêm tĩnh mạch mỗi 3-5 phút","Sau lần sốc thứ 3: amiodarone 300 mg tiêm tĩnh mạch nhanh hoặc lidocaine 1-1,5 mg/kg tiêm tĩnh mạch","Liều nhắc lại (liều thứ hai) giảm liều: amiodarone 150 mg hoặc lidocaine 0,5-0,75 mg/kg","Nếu hạ magnesi máu hoặc xoắn đỉnh: magnesi 1-2 g tiêm tĩnh mạch","Nếu tăng kali máu: canxi clorua 1 g TM; natri bicarbonat 1 ống TM (50 mEq); insulin thường 5-10 đơn vị TM kèm dextrose/D50 1 ống (25 g)"]},{"task":"H và T","actions":["Tìm và điều trị các nguyên nhân có thể đảo ngược (trang tiếp theo)"]},{"task":"ECMO / CPB","actions":["Cân nhắc ECMO hoặc tuần hoàn ngoài cơ thể sau ngừng tim"]},{"task":"Sau ngừng tim (sau ROSC)","actions":["Nếu có ROSC: sắp xếp chăm sóc tại ICU và cân nhắc kiểm soát thân nhiệt đích (hạ thân nhiệt điều trị)"]},{"task":"Chẩn đoán nguyên nhân (trang 2)","actions":["TEE/TTE và các xét nghiệm giúp hỗ trợ chẩn đoán; mời cả nhóm cùng tham gia","Nhịp tim - kích thích phế vị: xả hơi ổ bụng, tháo dụng cụ kéo và gạc/bọt biển phẫu thuật, giải áp lực đè lên mắt, cổ, tai và não; dẫn lưu bàng quang"]}],"drugs":[{"name":"Khử rung tim (defibrillation)","adult":"120-200 J hai pha hoặc 360 J một pha","amountLo":120,"amountHi":200,"unit":"J","route":"Khử rung ngoài lồng ngực","repeat":"mỗi 2 phút, tăng dần mức năng lượng","perKg":null,"pedPerKg":2,"pedUnit":"J/kg","pedMax":200,"note":"Nhi khoa: 2 J/kg lần đầu, 4 J/kg lần sau, có thể tăng tới 10 J/kg hoặc liều người lớn"},{"name":"Epinephrine (Adrenalin)","adult":"1 mg tiêm tĩnh mạch mỗi 3-5 phút (sau lần sốc thứ 2)","amount":1,"unit":"mg","route":"TM/trong xương","repeat":"mỗi 3-5 phút","perKg":null,"pedPerKg":0.01,"pedUnit":"mg/kg","pedMax":1,"note":"Bắt đầu sau lần sốc điện thứ 2"},{"name":"Amiodarone","adult":"300 mg tiêm tĩnh mạch nhanh (sau lần sốc thứ 3); liều thứ hai 150 mg","amount":300,"unit":"mg","route":"TM/trong xương (bolus)","repeat":"liều thứ hai 150 mg","perKg":null,"pedPerKg":5,"pedUnit":"mg/kg","pedMax":300,"note":"Nhi khoa trong ngừng tim: 5 mg/kg bolus, có thể lặp lại tới 3 lần (tối đa 15 mg/kg/ngày)"},{"name":"Lidocaine","adult":"1-1,5 mg/kg tiêm tĩnh mạch (sau lần sốc thứ 3); liều thứ hai 0,5-0,75 mg/kg","amountLo":1,"amountHi":1.5,"unit":"mg/kg","route":"TM/trong xương","repeat":"liều thứ hai 0,5-0,75 mg/kg","perKg":1.5,"pedPerKg":1,"pedUnit":"mg/kg","pedMax":100,"note":"Thay thế cho amiodarone"},{"name":"Magnesi sulfat","adult":"1-2 g tiêm tĩnh mạch","amountLo":1,"amountHi":2,"unit":"g","route":"TM/trong xương","repeat":"có thể lặp lại","perKg":null,"pedPerKg":50,"pedUnit":"mg/kg","pedMax":2000,"note":"Chỉ định khi hạ magnesi máu hoặc xoắn đỉnh"},{"name":"Canxi clorua (CaCl2 10%)","adult":"1 g tiêm tĩnh mạch","amount":1,"unit":"g","route":"TM/trong xương","repeat":"theo đáp ứng","perKg":null,"pedPerKg":20,"pedUnit":"mg/kg","pedMax":1000,"note":"Dùng khi tăng kali máu hoặc hạ canxi máu"},{"name":"Natri bicarbonat (NaHCO3 8,4%)","adult":"1 ống (amp) = 50 mEq tiêm tĩnh mạch","amount":50,"unit":"mEq","route":"TM/trong xương","repeat":"theo khí máu","perKg":null,"pedPerKg":1,"pedUnit":"mEq/kg","pedMax":50,"note":"Dùng khi tăng kali máu hoặc toan chuyển hóa"},{"name":"Insulin thường + Dextrose 50%","adult":"Insulin 5-10 đơn vị TM kèm D50 1 ống (25 g)","amountLo":5,"amountHi":10,"unit":"đơn vị","route":"TM","repeat":"theo đường huyết","perKg":null,"pedPerKg":0.1,"pedUnit":"đơn vị/kg","pedMax":10,"note":"Điều trị tăng kali máu; theo dõi glucose máu sát"}],"causes":["Giảm thể tích máu (Hypovolemia): truyền dịch nhanh, kiểm tra Hgb; nếu thiếu máu/xuất huyết - Xem Xuất huyết #12; giảm thể tích tương đối (auto-PEEP: ngắt máy thở; chèn ép tĩnh mạch chủ dưới; sốc tắc nghẽn hoặc phân bố) - Xem Phản vệ #5, Xem Tê tủy sống cao #14","Thiếu oxy máu (Hypoxemia): O2 100% 10-15 L/phút, kiểm tra kết nối mạch thở, xác nhận vị trí ống nội khí quản bằng EtCO2, nghe phổi, hút nội khí quản, cân nhắc X-quang ngực và nội soi phế quản - Xem Thiếu oxy máu #17","Ion hydro - Toan máu (Hydrogen ion/Acidosis): cân nhắc bicarbonat; cân bằng giữa tăng thông khí với nguy cơ làm giảm chất lượng CPR","Tăng kali máu (Hyperkalemia): canxi clorua 1 g TM; bicarbonat 1 ống TM (50 mEq); insulin 5-10 đơn vị TM kèm D50 1 ống (25 g) và theo dõi glucose; cân nhắc lọc máu cấp cứu","Hạ kali máu (Hypokalemia): truyền kali có kiểm soát; magnesi sulfat 1-2 g TM","Hạ đường huyết (Hypoglycemia): D50 1 ống (25 g), theo dõi glucose","Hạ canxi máu (Hypocalcemia): canxi clorua 1 g TM","Tăng thân nhiệt (Hyperthermia): Xem Tăng thân nhiệt ác tính #19","Hạ thân nhiệt (Hypothermia): làm ấm tích cực (chăn khí ấm cưỡng bức, dịch truyền ấm, sưởi ấm phòng); cân nhắc ECMO hoặc phẫu thuật bắc cầu","Độc tố (Toxins): cân nhắc quá liều thuốc mê, rà soát lỗi dùng thuốc, tắt thuốc mê bốc hơi và các thuốc truyền gây giãn mạch; nếu đã gây tê tại chỗ - Xem Ngộ độc thuốc tê tại chỗ #18","Chèn ép tim (Tamponade - tim): xem xét TEE/TTE; thực hiện chọc dịch màng ngoài tim","Tràn khí màng phổi áp lực (Tension pneumothorax): rì rào phế nang không đối xứng, tĩnh mạch cổ nổi, khí quản lệch; siêu âm tìm mất trượt phổi và điểm phổi bất thường; X-quang ngực nhưng KHÔNG trì hoãn điều trị; giảm áp bằng kim ở khoang liên sườn 4 hoặc 5 đường nách giữa, sau đó đặt dẫn lưu màng phổi - Xem Tràn khí màng phổi #22","Huyết khối - động mạch vành (Thrombosis - coronary): TEE/TTE đánh giá rối loạn vận động thành tim; cân nhắc tái thông mạch vành cấp cứu - Xem Thiếu máu cơ tim #20","Huyết khối - phổi (Thrombosis - pulmonary): TEE/TTE đánh giá chức năng thất phải và RVSP; cân nhắc thuốc tiêu sợi huyết hoặc lấy bỏ huyết khối phổi - Xem Thuyên tắc phổi #9, Xem Suy tim phải #24"],"notes":["Khử rung tim được ưu tiên hơn đặt nội khí quản","Sốc điện ngay lập tức: 120-200 J hai pha hoặc 360 J một pha; tăng dần năng lượng và lặp lại mỗi 2 phút","Epinephrine bắt đầu sau lần sốc thứ 2; thuốc chống loạn nhịp (amiodarone/lidocaine) sau lần sốc thứ 3","Mục tiêu chất lượng CPR: EtCO2 > 10 mmHg và huyết áp tâm trương > 20 mmHg","Chỉ kiểm tra mạch khi có dấu hiệu ROSC","Nếu chuyển sang nhịp không sốc điện được: chuyển sang phác đồ Vô tâm thu/PEA #1","Sau ROSC: chuyển ICU và cân nhắc kiểm soát thân nhiệt đích"],"short":"Rung thất / NNT","grp":"anes"},{"id":"anaphylaxis","no":5,"title":"Phản vệ","definition":"Phản ứng quá mẫn cấp tính, đe dọa tính mạng do giải phóng hạt tế bào mast, biểu hiện bằng tụt huyết áp nặng, co thắt phế quản và/hoặc phù mạch xuất hiện đột ngột sau phơi nhiễm dị nguyên. Trong gây mê, dấu hiệu đầu tiên thường là tụt huyết áp không giải thích được kèm tăng áp lực đường thở.","signs":["Tụt huyết áp nặng","Ngừng tuần hoàn","Co thắt phế quản","Thở khò khè (wheezing)","Tăng áp lực đỉnh đường thở","Phù mạch (angioedema)","Phù nề đường thở","Nhịp tim nhanh","Loạn nhịp tim","Đỏ bừng (flushing)","Phát ban, mày đay","Ngứa","Nổi mề đay (hoặc có thể không có dấu hiệu nào trên da)"],"tasks":[{"task":"Khủng hoảng / Huy động nguồn lực","actions":["Thông báo cho toàn nhóm","Xác định người lãnh đạo xử trí","Gọi xe cấp cứu (code cart)","Xem xét tạm dừng thủ thuật"]},{"task":"Đường thở","actions":["FiO2 100%, lưu lượng 10–15 L/phút","Đảm bảo thông khí và kiểm soát đường thở","Nếu có phù mạch: xem xét đặt nội khí quản sớm (trước khi phù nề tiến triển)"]},{"task":"Đường truyền tĩnh mạch","actions":["Đảm bảo có đường truyền tĩnh mạch hoặc trong xương (IO) lỗ lớn, hoạt động tốt"]},{"task":"Thuốc (xử trí ban đầu)","actions":["Tiêm epinephrine để ngăn chặn quá trình mất hạt tế bào mast","Epinephrine 10–100 mcg TM (nếu chưa có đường truyền TM: 500 mcg tiêm bắp)","Tăng gấp đôi liều TM mỗi 2 phút cho đến khi cải thiện lâm sàng; có thể cần tổng liều > 1 mg","Bắt đầu truyền epinephrine liên tục sớm (xem Danh mục thuốc truyền)","Nếu tụt huyết áp: tắt thuốc mê bốc hơi và các thuốc gây giãn mạch","Cân nhắc dùng thuốc gây quên (ví dụ midazolam) để tránh thức tỉnh trong mổ"]},{"task":"Dịch truyền","actions":["Truyền dịch tinh thể nhanh, có thể cần nhiều lít","Cân nhắc tư thế đầu thấp, nâng cao chân","Loại bỏ ngay tác nhân gây dị ứng nghi ngờ"]},{"task":"Ngừng tác nhân gây dị ứng","actions":["Ngừng ngay các tác nhân nghi ngờ: kháng sinh, thuốc giãn cơ, chlorhexidine, thuốc nhuộm (xanh methylen, isosulfan blue), chế phẩm máu, mủ cao su (latex), thuốc cản quang, keo dán sinh học, protamine, sugammadex"]},{"task":"ACLS (nếu ngừng tuần hoàn)","actions":["Kiểm tra mạch. Nếu không bắt được mạch hoặc HA tâm thu < 50 mmHg: bắt đầu ép tim","Tần số ép tim 100–120 lần/phút, độ sâu ≥ 5 cm, cho phép lồng ngực nảy lại hoàn toàn","Cân nhắc dùng ván cứng lót lưng","Giữ EtCO2 > 10 mmHg và HA tâm trương > 20 mmHg","Đổi người ép tim mỗi 2 phút khi kiểm tra nhịp","CHỈ kiểm tra mạch khi có dấu hiệu ROSC (EtCO2 tăng kéo dài, xuất hiện dạng sóng động mạch tự phát, thay đổi nhịp tim)","Nếu thông khí bằng mặt nạ: tỷ lệ 30 lần ép tim : 2 lần thổi ngạt","Nếu đường thở đã được kiểm soát: 10 nhịp thở/phút, thể tích khí lưu thông 6–7 mL/kg","Đặt miếng dán khử rung tim trong trường hợp nhịp tim thay đổi","Cân nhắc ECMO hoặc tuần hoàn ngoài cơ thể"]},{"task":"Đường truyền bổ sung","actions":["Xem xét thiết lập thêm đường truyền tĩnh mạch","Cân nhắc đặt đường theo dõi huyết áp động mạch xâm lấn"]},{"task":"Thuốc (giai đoạn sau ổn định)","actions":["Nếu còn tụt huyết áp: tiếp tục truyền epinephrine; có thể thêm vasopressin và/hoặc norepinephrine (xem Danh mục thuốc truyền)","Nếu co thắt phế quản, dùng thuốc giãn phế quản","Nếu KHÔNG thông khí được, điều trị theo đường tĩnh mạch: epinephrine 5–10 mcg TM (hoặc 200 mcg tiêm dưới da), hoặc ketamine 10–50 mg TM (hoặc 40 mg TB), hoặc magnesi sulfat 1–2 g TM","Nếu thông khí được: albuterol (salbutamol) 4–8 nhát xịt MDI hoặc 2,5 mg khí dung, và tăng sevoflurane đến 1 MAC","Nếu co thắt phế quản dai dẳng, cân nhắc: kháng H1 diphenhydramine 25–50 mg TM; kháng H2 famotidine 20 mg TM; corticosteroid hydrocortisone 100 mg TM hoặc methylprednisolone 125 mg TM"]},{"task":"Siêu âm tim","actions":["Xem xét TEE/TTE để đánh giá tình trạng thể tích và chức năng tim"]},{"task":"Xét nghiệm","actions":["Gửi định lượng nồng độ tryptase huyết thanh đỉnh 1–2 giờ sau khi khởi phát phản ứng"]},{"task":"Chuyển tiếp / Theo dõi","actions":["Theo dõi ít nhất 6 giờ","Nếu phản ứng nặng, nguy cơ phản ứng hai pha cao hơn: nên theo dõi tại ICU trong 12–24 giờ","Nếu đã đặt nội khí quản: cân nhắc duy trì đặt nội khí quản","Ghi bổ sung tác nhân gây dị ứng vào danh sách dị ứng của bệnh nhân","Giới thiệu bệnh nhân đi làm xét nghiệm dị ứng để theo dõi"]}],"drugs":[{"name":"Epinephrine (Adrenalin) — bolus TM","adult":"10–100 mcg TM","amountLo":10,"amountHi":100,"unit":"mcg","route":"TM, chuẩn độ theo đáp ứng","repeat":"Tăng gấp đôi liều mỗi 2 phút cho đến khi cải thiện lâm sàng; có thể cần tổng liều > 1 mg","perKg":null,"pedPerKg":1,"pedUnit":"mcg/kg","pedMax":100,"note":"Thuốc đầu tay; dùng ngay để ngăn mất hạt tế bào mast"},{"name":"Epinephrine (Adrenalin) — tiêm bắp","adult":"500 mcg TB (khi chưa có đường truyền TM)","amountLo":500,"amountHi":500,"unit":"mcg","route":"Tiêm bắp (mặt trước ngoài đùi)","repeat":"Nhắc lại mỗi 5–15 phút nếu chưa cải thiện","perKg":null,"pedPerKg":10,"pedUnit":"mcg/kg","pedMax":500,"note":"PALS: 0,01 mg/kg TB, tối đa 0,5 mg"},{"name":"Epinephrine (Adrenalin) — truyền liên tục","adult":"Bắt đầu truyền sớm, chuẩn độ theo huyết áp","amountLo":null,"amountHi":null,"unit":"mcg/kg/phút","route":"Truyền TM liên tục","repeat":"Chuẩn độ liên tục","perKg":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":0.02,"infusionHi":0.3,"infusionUnit":"mcg/kg/phút","note":"Sách dẫn chiếu Danh mục thuốc truyền (trang #29); dải liều là quy ước thực hành thường dùng"},{"name":"Epinephrine — điều trị co thắt phế quản khi không thông khí được","adult":"5–10 mcg TM (hoặc 200 mcg tiêm dưới da)","amountLo":5,"amountHi":10,"unit":"mcg","route":"TM chuẩn độ, hoặc tiêm dưới da","repeat":"Nhắc lại theo đáp ứng","perKg":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"note":null},{"name":"Norepinephrine","adult":"Truyền TM khi còn tụt huyết áp dù đã dùng epinephrine","amountLo":null,"amountHi":null,"unit":"mcg/kg/phút","route":"Truyền TM liên tục","repeat":"Chuẩn độ theo huyết áp","perKg":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":0.02,"infusionHi":0.5,"infusionUnit":"mcg/kg/phút","note":"Xem Danh mục thuốc truyền #29"},{"name":"Vasopressin","adult":"Truyền TM bổ sung khi tụt huyết áp kháng trị","amountLo":null,"amountHi":null,"unit":"đơn vị/phút","route":"Truyền TM liên tục","repeat":"Chuẩn độ theo huyết áp","perKg":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":0.01,"infusionHi":0.04,"infusionUnit":"đơn vị/phút","note":"Xem Danh mục thuốc truyền #29"},{"name":"Ketamine","adult":"10–50 mg TM (hoặc 40 mg TB)","amountLo":10,"amountHi":50,"unit":"mg","route":"TM chậm hoặc tiêm bắp","repeat":"Nhắc lại theo đáp ứng","perKg":null,"pedPerKg":1,"pedUnit":"mg/kg","pedMax":50,"note":"Dùng cho co thắt phế quản khi không thông khí được"},{"name":"Magnesi sulfat","adult":"1–2 g TM","amountLo":1,"amountHi":2,"unit":"g","route":"TM truyền trong 20 phút","repeat":"Không nhắc lại thường quy","perKg":null,"pedPerKg":40,"pedUnit":"mg/kg","pedMax":2000,"note":"Giãn phế quản; theo dõi tụt huyết áp khi tiêm nhanh"},{"name":"Albuterol (Salbutamol)","adult":"4–8 nhát xịt MDI hoặc 2,5 mg khí dung","amountLo":4,"amountHi":8,"unit":"nhát xịt MDI","route":"Hít qua ống nội khí quản/mặt nạ","repeat":"Nhắc lại theo đáp ứng","perKg":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"note":"Khí dung nhi: 2,5 mg (<20 kg), 5 mg (≥20 kg)"},{"name":"Sevoflurane","adult":"Chuẩn độ đến 1 MAC","amountLo":1,"amountHi":1,"unit":"MAC","route":"Hít qua đường thở","repeat":"Duy trì theo huyết động","perKg":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"note":"Chỉ khi huyết động cho phép"},{"name":"Diphenhydramine (kháng H1)","adult":"25–50 mg TM","amountLo":25,"amountHi":50,"unit":"mg","route":"TM chậm","repeat":"Mỗi 6 giờ nếu cần","perKg":null,"pedPerKg":1,"pedUnit":"mg/kg","pedMax":50,"note":"Thuốc hàng hai, không thay thế epinephrine"},{"name":"Famotidine (kháng H2)","adult":"20 mg TM","amountLo":20,"amountHi":20,"unit":"mg","route":"TM chậm","repeat":"Mỗi 12 giờ nếu cần","perKg":null,"pedPerKg":0.25,"pedUnit":"mg/kg","pedMax":20,"note":null},{"name":"Hydrocortisone","adult":"100 mg TM","amountLo":100,"amountHi":100,"unit":"mg","route":"TM","repeat":"Mỗi 6 giờ nếu cần","perKg":null,"pedPerKg":4,"pedUnit":"mg/kg","pedMax":100,"note":null},{"name":"Methylprednisolone","adult":"125 mg TM","amountLo":125,"amountHi":125,"unit":"mg","route":"TM","repeat":"Mỗi 6 giờ nếu cần","perKg":null,"pedPerKg":2,"pedUnit":"mg/kg","pedMax":125,"note":null},{"name":"Midazolam","adult":"Liều gây quên, chuẩn độ theo huyết động","amountLo":1,"amountHi":2,"unit":"mg","route":"TM","repeat":"Nhắc lại theo đáp ứng","perKg":null,"pedPerKg":0.05,"pedUnit":"mg/kg","pedMax":2,"note":"Dùng khi phải tắt thuốc mê bốc hơi vì tụt huyết áp, để tránh thức tỉnh trong mổ"}],"causes":["Kháng sinh","Thuốc giãn cơ (neuromuscular blocking agents)","Chlorhexidine","Thuốc nhuộm (isosulfan blue, xanh methylen)","Chế phẩm máu","Mủ cao su (latex)","Thuốc cản quang","Keo dán sinh học","Protamine","Sugammadex"],"notes":["Chẩn đoán phân biệt: quá liều thuốc tê tại chỗ (xem Ngộ độc thuốc tê #18)","Chẩn đoán phân biệt: hít sặc","Chẩn đoán phân biệt: sốc phân bố hoặc sốc tắc nghẽn — thuyên tắc (khí, cục máu đông, mỡ) (xem Thuyên tắc)","Chẩn đoán phân biệt: xuất huyết (xem Xuất huyết #12)","Chẩn đoán phân biệt: tụt huyết áp (xem Tụt huyết áp #16)","Chẩn đoán phân biệt: nhồi máu cơ tim / thiếu máu cơ tim (xem Thiếu máu cơ tim #20)","Chẩn đoán phân biệt: tràn khí màng phổi (xem Tràn khí màng phổi #22)","Chẩn đoán phân biệt: nhiễm trùng huyết"],"short":"Phản vệ","grp":"anes"},{"id":"delayed_emergence","no":7,"title":"Chậm tỉnh sau gây mê","definition":"Bệnh nhân đáp ứng kém hơn dự kiến trong giai đoạn thoát mê, hoặc có khám thần kinh bất thường ở giai đoạn hậu phẫu. Cần loại trừ song song các nguyên nhân do thuốc, chuyển hóa và thần kinh trung ương.","signs":["Bệnh nhân đáp ứng kém hơn dự kiến trong quá trình thoát mê","Khám thần kinh bất thường giai đoạn hậu phẫu"],"tasks":[{"task":"Khủng hoảng / Huy động nguồn lực","actions":["Thông báo cho toàn nhóm"]},{"task":"Ngừng thuốc mê","actions":["Xác nhận đã ngừng tất cả thuốc mê bốc hơi và thuốc mê tĩnh mạch","Kiểm tra dấu hiệu sinh tồn và điều chỉnh: thiếu oxy máu, tăng CO2 máu, hạ thân nhiệt, tụt huyết áp","Kiểm tra các dấu hiệu tăng áp lực nội sọ (ICP): tăng huyết áp kèm mạch nảy mạnh, nhịp tim chậm, nhịp thở không đều (tam chứng Cushing)"]},{"task":"Giãn cơ tồn dư","actions":["Kiểm tra và hóa giải giãn cơ tồn dư bằng sugammadex hoặc neostigmine kèm glycopyrrolate","Thực hiện khám thần kinh sau khi đã hóa giải hoàn toàn"]},{"task":"Khám thần kinh","actions":["Kiểm tra thay đổi đồng tử, mất cân xứng vận động và nôn","Nếu đột quỵ bất thường hoặc nghi ngờ: gọi Code Stroke hoặc tương đương","Chụp CT sọ não cấp cứu (STAT) và/hoặc hội chẩn Thần kinh/Phẫu thuật thần kinh cấp cứu"]},{"task":"Hóa giải thuốc","actions":["Xem xét hóa giải opioid: naloxone 40 mcg TM, có thể tăng gấp đôi liều và lặp lại mỗi 2 phút cho đến tổng liều 400 mcg","Xem xét hóa giải benzodiazepine: flumazenil 0,2 mg TM mỗi 1 phút, liều tối đa 1 mg","Xem xét hội chứng kháng cholinergic (ví dụ do scopolamine): physostigmine 1 mg TM, có sẵn atropine phòng cơn cường cholinergic gây nhịp tim chậm nghiêm trọng","Cảnh giác tái an thần: thuốc hóa giải có thời gian bán thải ngắn hơn thuốc bị hóa giải","Kiểm tra và điều chỉnh tụt huyết áp"]},{"task":"Xét nghiệm","actions":["Gửi khí máu động mạch (ABG) kèm điện giải đồ","Đánh giá tăng CO2 máu, hạ natri máu, tăng natri máu và tăng canxi máu"]},{"task":"Thuốc","actions":["Kiểm tra khả năng nhầm lẫn/sai sót thuốc","Xem xét tình trạng chậm thanh thải thuốc (suy gan, suy thận)"]},{"task":"Nguyên nhân hiếm","actions":["Xem xét tổn thương tủy sống cao","Hội chứng serotonin","Tăng thân nhiệt ác tính","Hôn mê phù niêm (myxedema coma)","Co giật (kể cả co giật không co cứng)","Bão giáp","Bệnh não gan/urê huyết"]},{"task":"Theo dõi","actions":["Nếu tình trạng tâm thần kinh vẫn bất thường, theo dõi bệnh nhân tại ICU kèm theo dõi thần kinh"]}],"drugs":[{"name":"Naloxone","adult":"40 mcg TM","amountLo":40,"amountHi":40,"unit":"mcg","route":"TM chuẩn độ","repeat":"Có thể tăng gấp đôi liều và lặp lại mỗi 2 phút cho đến tổng 400 mcg","perKg":null,"pedPerKg":1,"pedUnit":"mcg/kg","pedMax":40,"note":"Thời gian tác dụng ngắn hơn opioid — theo dõi tái ức chế hô hấp"},{"name":"Flumazenil","adult":"0,2 mg TM","amountLo":0.2,"amountHi":0.2,"unit":"mg","route":"TM","repeat":"Mỗi 1 phút, tổng liều tối đa 1 mg","perKg":null,"pedPerKg":0.01,"pedUnit":"mg/kg","pedMax":0.2,"note":"Nguy cơ co giật ở bệnh nhân dùng benzodiazepine kéo dài"},{"name":"Physostigmine","adult":"1 mg TM","amountLo":1,"amountHi":1,"unit":"mg","route":"TM chậm","repeat":"Nhắc lại theo đáp ứng","perKg":null,"pedPerKg":0.02,"pedUnit":"mg/kg","pedMax":0.5,"note":"Dùng cho hội chứng kháng cholinergic (ví dụ scopolamine); phải có sẵn atropine"},{"name":"Atropine (dự phòng khi dùng physostigmine)","adult":"Có sẵn để xử trí cơn cường cholinergic với nhịp tim chậm nặng","amountLo":0.5,"amountHi":1,"unit":"mg","route":"TM","repeat":"Nhắc lại theo nhịp tim","perKg":null,"pedPerKg":0.02,"pedUnit":"mg/kg","pedMax":1,"note":"Sách chỉ ghi 'có sẵn atropine'; số liều người lớn là quy ước thực hành"},{"name":"Sugammadex","adult":"Hóa giải giãn cơ tồn dư (rocuronium/vecuronium)","amountLo":2,"amountHi":16,"unit":"mg/kg","route":"TM","repeat":"Theo mức độ giãn cơ tồn dư (TOF)","perKg":2,"pedPerKg":2,"pedUnit":"mg/kg","pedMax":null,"note":"Sách không ghi con số ở trang này; dải 2–16 mg/kg theo hướng dẫn dùng sugammadex"},{"name":"Neostigmine + Glycopyrrolate","adult":"Hóa giải giãn cơ tồn dư","amountLo":null,"amountHi":null,"unit":"mg","route":"TM","repeat":"Theo TOF","perKg":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"note":"Sách không ghi liều cụ thể ở trang này"}],"causes":["Tồn dư thuốc mê bốc hơi hoặc thuốc mê tĩnh mạch","Giãn cơ tồn dư","Tồn dư opioid","Tồn dư benzodiazepine","Hội chứng kháng cholinergic (scopolamine)","Thiếu oxy máu","Tăng CO2 máu","Hạ thân nhiệt","Tụt huyết áp","Tăng áp lực nội sọ","Đột quỵ","Hạ natri máu, tăng natri máu, tăng canxi máu","Sai sót/nhầm lẫn thuốc","Chậm thanh thải thuốc do suy gan hoặc suy thận","Tổn thương tủy sống cao","Hội chứng serotonin","Tăng thân nhiệt ác tính","Hôn mê phù niêm","Co giật","Bão giáp","Bệnh não gan/urê huyết"],"notes":["Dấu hiệu tăng áp lực nội sọ: tăng huyết áp kèm mạch nảy mạnh, nhịp tim chậm, nhịp thở không đều","Chỉ khám thần kinh sau khi đã hóa giải hoàn toàn giãn cơ","Thuốc hóa giải có thời gian bán thải ngắn hơn thuốc bị hóa giải — cần theo dõi tái an thần"],"short":"Chậm tỉnh","grp":"anes"},{"id":"difficult_airway_cric","no":8,"title":"Đường thở khó / Chọc màng nhẫn giáp (Cric)","definition":"Tình huống soi thanh quản/đặt nội khí quản thất bại hoặc khó thông khí, khó cung cấp oxy. Quyết định then chốt là phân nhánh giữa 'còn oxy hóa được' và 'không đặt được nội khí quản, không cung cấp được oxy' (CICO) — trường hợp CICO phải chuyển ngay sang mở đường thở qua cổ.","signs":["Soi thanh quản thất bại hoặc khó","Khó thông khí","Khó cung cấp oxy","SpO2 giảm nhanh","Không có dạng sóng CO2 khi thông khí"],"tasks":[{"task":"Khủng hoảng / Huy động nguồn lực","actions":["Thông báo cho toàn nhóm","Gọi hỗ trợ cấp cứu đường thở","Gọi kỹ thuật viên gây mê","Gọi xe đẩy đường thở khó (difficult airway cart)"]},{"task":"Tối ưu hóa điều kiện","actions":["Đảm bảo giãn cơ đầy đủ (ví dụ rocuronium 1,2 mg/kg)","Đảm bảo độ sâu gây mê (ví dụ truyền lại hoặc bolus propofol)","Tối ưu hóa tư thế: tư thế hít (sniffing), nâng đầu giường lên 30 độ, ngửa cổ, chỉnh chiều cao giường"]},{"task":"Cung cấp oxy","actions":["KHÔNG cố định (fixate) vào việc đặt nội khí quản","Theo dõi sự trở lại của dạng sóng CO2 (capnography) và SpO2","Nếu SpO2 tụt xuống mức nguy kịch tại bất kỳ thời điểm nào: chuyển ngay sang nhánh hộp đỏ (CICO)","Tối đa 2 lần thử cho mỗi phương thức cung cấp oxy","Mặt nạ: dùng kỹ thuật hai tay giữ mặt nạ; đặt canun mũi hầu/miệng hầu","Đường thở trên thanh quản (SGA/LMA): tối ưu hóa kích thước và độ vừa vặn (thay đổi vị trí đầu hoặc thiết bị, bơm vòng bít); xem xét dùng thiết bị thế hệ thứ 2","Soi thanh quản: ưu tiên video. Xem xét đổi lưỡi đèn, dùng nòng cứng (stylet), bougie, thao tác thanh quản từ bên ngoài, giải phóng áp lực sụn nhẫn","Chọn người thao tác có kinh nghiệm nhất và dùng thiết bị quen thuộc"]},{"task":"Nhánh XANH — Còn oxy hóa được","actions":["Theo dõi dạng sóng CO2 trở về bằng capnography và SpO2","Nếu không cung cấp được oxy tại bất kỳ thời điểm nào: chuyển ngay sang hộp đỏ (CICO)","Trong khi vẫn cung cấp được oxy, các lựa chọn gồm: đánh thức bệnh nhân","Kết thúc ca mổ bằng SGA/LMA hoặc mặt nạ","Đặt nội khí quản qua SGA/LMA","Kết hợp video + soi sợi quang (kỹ thuật phối hợp)","Các kỹ thuật đường thở tiên tiến khác"]},{"task":"Nhánh ĐỎ — CICO (không đặt được NKQ, không cung cấp được oxy)","actions":["Ưu tiên hàng đầu là mở đường thở qua cổ (cắt cổ / cricothyrotomy) — không trì hoãn","Gọi thêm người có khả năng thực hiện chọc màng nhẫn giáp","Nhận bộ dụng cụ Cric: dao mổ (ví dụ lưỡi dao số 10), bougie và ống nội khí quản cỡ 6.0","Người vận hành bổ sung tiếp tục cố gắng cung cấp oxy từ phía trên (mặt nạ, SGA/LMA, soi thanh quản video)","Khởi động quy trình Cric/eFONA (trang tiếp theo)"]},{"task":"Cric/eFONA — Thông báo và gọi hỗ trợ","actions":["Thông báo cho nhóm: tuyên bố khẩn cấp cric / tiếp cận đường thở phía trước cổ","Gọi hỗ trợ: Tai Mũi Họng, Phẫu thuật tổng quát, ICU, Gây mê, Nhóm Code"]},{"task":"Cric/eFONA — Chuẩn bị","actions":["Bộc lộ và ngửa cổ tối đa","Lấy dao mổ, bougie và ống nội khí quản 6.0 đã bôi trơn"]},{"task":"Cric/eFONA — Thuốc","actions":["Đảm bảo gây tê/gây mê đầy đủ","Người vận hành khác tiếp tục cố gắng cung cấp oxy từ phía trên (mặt nạ, SGA/LMA, soi thanh quản video)"]},{"task":"Cric/eFONA — Cung cấp oxy và theo dõi","actions":["Theo dõi dấu hiệu sinh tồn và mạch trong suốt thủ thuật"]},{"task":"Cric/eFONA — Kỹ thuật scalpel–bougie–tube (8 bước)","actions":["1. Bộc lộ và ngửa cổ. Dùng tay không thuận cố định thanh quản để xác định đường giữa","2. Rạch da theo đường dọc giữa, dài khoảng 8 cm. Rạch dứt khoát ra khỏi tay giữ","3. Sờ xác định màng nhẫn giáp","4. Đâm ngang qua màng nhẫn giáp; mở rộng vết rạch đến hết chiều ngang khí quản","5. Xoay dao mổ 90 độ (lưỡi dao hướng về phía chân bệnh nhân) và kéo về phía người thao tác","6. Luồn bougie dọc theo dao mổ vào khí quản. Rút dao mổ ra","7. Luồn ống nội khí quản 6.0 trượt trên bougie vào khí quản","8. Bơm bóng chèn (cuff), thông khí, xác nhận CO2 thở ra và kiểm tra âm phế bào hai bên"]},{"task":"Dự phòng khi tiên lượng đường thở khó","actions":["Lập kế hoạch dự phòng và cân nhắc chuẩn bị sẵn thiết bị đường thở tiên tiến trong phòng: xe đẩy đường thở khó, SGA/LMA thế hệ thứ hai, SGA/LMA cho phép đặt nội khí quản, ống thông trao đổi nội khí quản, ống soi phế quản sợi quang, ống soi phế quản cứng, bộ dụng cụ chọc/mở khí quản (dao mổ)","Cân nhắc đặt nội khí quản khi bệnh nhân tỉnh","Cung cấp oxy ngưng thở (apneic oxygenation) bằng oxy lưu lượng cao","Soi thanh quản video ngay từ lần thử đầu tiên","Có bác sĩ Tai Mũi Họng hoặc Phẫu thuật tổng quát trong phòng","Mở khí quản khi bệnh nhân tỉnh (sau khi hội chẩn với bác sĩ phẫu thuật)","Đặt sẵn ống thông (canula) ECMO trước, cùng bác sĩ tưới máu trong phòng"]}],"drugs":[{"name":"Rocuronium","adult":"1,2 mg/kg TM","amountLo":null,"amountHi":null,"unit":"mg/kg","route":"TM bolus","repeat":"Liều duy nhất để đảm bảo giãn cơ hoàn toàn","perKg":1.2,"pedPerKg":1.2,"pedUnit":"mg/kg","pedMax":null,"note":"Liều cao để tối ưu điều kiện đặt nội khí quản; có thể hóa giải bằng sugammadex 16 mg/kg"},{"name":"Propofol","adult":"Bolus hoặc truyền lại để đảm bảo độ sâu gây mê","amountLo":null,"amountHi":null,"unit":"mg","route":"TM","repeat":"Chuẩn độ theo độ sâu mê","perKg":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"note":"Sách không ghi con số cụ thể"}],"causes":["Soi thanh quản thất bại hoặc khó","Khó thông khí bằng mặt nạ","SGA/LMA đặt sai vị trí hoặc không kín","Áp lực sụn nhẫn cản trở tầm nhìn thanh quản","Độ giãn cơ hoặc độ sâu gây mê chưa đủ","Tư thế bệnh nhân chưa tối ưu"],"notes":["Tiêu chí chuyển sang chọc màng nhẫn giáp: khi rơi vào CICO — không đặt được nội khí quản VÀ không cung cấp được oxy bằng mặt nạ/SGA, hoặc SpO2 tụt xuống mức nguy kịch tại bất kỳ thời điểm nào. Khi đó ưu tiên tuyệt đối là mở đường thở qua cổ, không tiếp tục thử đặt nội khí quản","KHÔNG cố định tâm trí vào việc đặt nội khí quản — mục tiêu là cung cấp oxy","Tối đa 2 lần thử cho mỗi phương thức cung cấp oxy (mặt nạ, SGA/LMA, soi thanh quản)","Bộ Cric tối thiểu: dao mổ lưỡi số 10, bougie, ống nội khí quản 6.0 đã bôi trơn","Trong khi thực hiện Cric, người vận hành khác vẫn tiếp tục cố gắng cung cấp oxy từ phía trên","Xác nhận vị trí ống sau Cric bằng dạng sóng CO2 và nghe âm phế bào"],"short":"Đường thở khó / Cric","grp":"anes"},{"id":"embolism","no":9,"title":"Thuyên tắc (khí, mỡ, huyết khối, xi măng)","definition":"Tình trạng vật chất (khí, mỡ, huyết khối, xi măng xương, nước ối) lọt vào hệ tuần hoàn gây tắc nghẽn dòng máu phổi, biểu hiện bằng tụt đột ngột EtCO2, huyết áp hoặc SpO2 kèm tăng áp lực tĩnh mạch trung tâm. Cần nghĩ đến ngay khi có sụt giảm EtCO2 đột ngột không giải thích được.","signs":["Giảm đột ngột EtCO2, huyết áp hoặc SpO2","Tăng đột ngột áp lực tĩnh mạch trung tâm","Khó thở, suy hô hấp hoặc ho ở bệnh nhân tỉnh","Nguy cơ cao trong phẫu thuật chỉnh hình xương dài, thai sản, ung thư (đặc biệt u thận), BMI cao, phẫu thuật nội soi, hoặc vị trí phẫu thuật cao hơn mức tim","Thuyên tắc khí: có thể thấy khí trong buồng tim trên siêu âm tim qua thực quản (TEE)/qua thành ngực (TTE)","Thuyên tắc mỡ/xi măng: ban xuất huyết, lú lẫn hoặc kích thích nếu bệnh nhân tỉnh","Thuyên tắc ối: sản phụ quanh cuộc đẻ có thay đổi tri giác, tụt huyết áp, giảm oxy máu, co giật, rối loạn đông máu"],"tasks":[{"task":"Huy động nguồn lực","actions":["Thông báo cho toàn nhóm","Xác định người chỉ huy","Gọi hỗ trợ","Yêu cầu xe cấp cứu/xe thuốc cấp cứu","Cân nhắc dừng/kết thúc thủ thuật"]},{"task":"Kiểm tra mạch","actions":["Nếu không có mạch: bắt đầu ép tim (CPR), kiểm tra nhịp tim và xử trí theo phác đồ tương ứng","Xem phác đồ Vô tâm thu/PEA #1","Xem phác đồ Rung thất/Nhịp nhanh thất #4"]},{"task":"Đường thở","actions":["Cho thở O2 100%, lưu lượng 10-15 L/phút"]},{"task":"Tuần hoàn","actions":["Tắt thuốc mê bốc hơi và các thuốc gây giãn mạch","Tiêm tĩnh mạch thuốc co mạch để hỗ trợ tuần hoàn","Cân nhắc truyền dịch nhanh"]},{"task":"Đánh giá thất phải","actions":["Nếu chức năng thất phải giảm hoặc không ổn định trên TEE/TTE, dùng thuốc và biện pháp điều trị để:","Duy trì nhịp xoang","Duy trì thể tích tuần hoàn thất phải bình thường","Duy trì sức co bóp thất phải","Giảm hậu gánh thất phải","Xem phác đồ Suy tim phải #24"]},{"task":"ECMO/CPB","actions":["Nếu mất bù nghiêm trọng: cân nhắc ECMO hoặc tuần hoàn ngoài cơ thể"]},{"task":"Xử trí theo loại thuyên tắc — Thuyên tắc huyết khối phổi","actions":["Yếu tố nguy cơ: bệnh mạn tính, khối u, bất động, bỏ lỡ liều thuốc chống đông","Thảo luận với nhóm phẫu thuật về tính khả thi và độ an toàn của tiêu sợi huyết cấp cứu so với phẫu thuật lấy huyết khối","Tiêu sợi huyết: nếu an toàn, dùng alteplase (rtPA) 10 mg tiêm tĩnh mạch, sau đó truyền 90 mg trong 2 giờ","Lấy huyết khối: cân nhắc hội chẩn phẫu thuật tim mạch cấp (mổ mở) hoặc điện quang can thiệp cấp (qua da)","Điều trị hỗ trợ: đường thở, hô hấp, tuần hoàn"]},{"task":"Thuyên tắc khí hoặc CO2","actions":["Hạn chế khí tiếp tục lọt vào: kiểm tra đường truyền tĩnh mạch xem có khí không","Làm ngập trường mổ bằng nước muối sinh lý","Cân nhắc hạ vị trí phẫu thuật xuống thấp hơn mức tim","Cân nhắc tư thế nằm nghiêng trái","Cố gắng hút khí ra: hút khí qua catheter tĩnh mạch trung tâm nếu có","Điều trị hỗ trợ: đường thở, hô hấp, tuần hoàn","Cân nhắc điều trị oxy cao áp"]},{"task":"Thuyên tắc xi măng hoặc mỡ","actions":["Dấu hiệu: ban xuất huyết; lú lẫn hoặc kích thích nếu bệnh nhân tỉnh","Điều trị hỗ trợ: đường thở, hô hấp, tuần hoàn"]},{"task":"Thuyên tắc ối","actions":["Dấu hiệu: sản phụ quanh cuộc đẻ có thay đổi tri giác, tụt huyết áp, giảm oxy máu, co giật, rối loạn đông máu","Điều trị hỗ trợ: đường thở, hô hấp, tuần hoàn","Theo dõi thai nhi và cân nhắc mổ lấy thai cấp cứu","Theo dõi và điều trị co giật và đông máu nội mạch rải rác (DIC)"]}],"drugs":[{"name":"Alteplase (rtPA)","adult":"10 mg TM bolus, sau đó truyền 90 mg trong 2 giờ","amount":10,"unit":"mg","route":"TM bolus rồi truyền liên tục","repeat":"Truyền tiếp 90 mg trong 2 giờ","perKg":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"note":"Chỉ dùng khi đã hội chẩn với phẫu thuật viên và đánh giá nguy cơ chảy máu"}],"causes":["Phản vệ (xem Phản vệ #5)","Hội chứng cấy ghép xi măng xương","Co thắt phế quản (xem Co thắt phế quản #6)","Chèn ép tim","Sốc tim","Sốc phân bố","Giảm thể tích tuần hoàn","Thiếu máu cơ tim (xem Thiếu máu cơ tim #20)","Tràn khí màng phổi (xem Tràn khí màng phổi #22)","Phù phổi"],"notes":["Xử trí tiếp theo phụ thuộc vào loại thuyên tắc","Nguy cơ tăng trong phẫu thuật nội soi (bơm CO2) và khi vị trí phẫu thuật cao hơn mức tim"],"short":"Thuyên tắc","grp":"anes"},{"id":"fire-nonairway","no":11,"title":"Cháy ngoài đường thở","definition":"Cháy xảy ra trên hoặc quanh bệnh nhân nhưng không nằm trong đường thở (toan trải, gạc, da, dung dịch sát khuẩn cồn). Nhận biết bằng tiếng nổ, tia lửa, ngọn lửa, khói, nhiệt hoặc mùi khét xuất hiện đột ngột.","signs":["Tiếng nổ hoặc tia lửa đột ngột","Ngọn lửa nhìn thấy được","Khói","Nhiệt bất thường","Mùi khét đột ngột"],"tasks":[{"task":"Huy động nguồn lực","actions":["Thông báo cho toàn nhóm","Gọi hỗ trợ","Kích hoạt báo cháy","Gọi mã đỏ (Code Red)","Chuẩn bị bình chữa cháy CO2"]},{"task":"Ngăn cháy lan vào đường thở","actions":["Ngắt dòng khí mới","Ngắt hệ thống dây thở khỏi máy gây mê để chặn dòng khí đi vào đường thở","Bóp bóng tự phồng (Ambu) với khí phòng"]},{"task":"Ngăn tổn thương thêm cho bệnh nhân","actions":["Loại bỏ toàn bộ vật liệu dễ cháy và dễ bắt lửa (ví dụ toan trải, gạc, vải) khỏi bệnh nhân và ném xuống sàn","Dập tắt mọi ngọn lửa"]},{"task":"Dập lửa","actions":["Nếu cháy KHÔNG do điện: dùng bình chữa cháy CO2 (an toàn cho vết thương) và nước muối hoặc nước (ví dụ từ chậu, chai, túi dịch truyền)","Nếu cháy DO ĐIỆN: chỉ dùng bình chữa cháy CO2","Quy tắc PASS: PULL — kéo chốt","AIM — nhắm vào gốc ngọn lửa","SQUEEZE — bóp cò trong 5 giây","SWEEP — quét qua lại để dập lửa"]},{"task":"Chăm sóc bệnh nhân","actions":["Đánh giá các vết thương; theo dõi dấu hiệu sinh tồn","Đảm bảo đủ độ mê, ví dụ truyền propofol"]},{"task":"Cân nhắc sơ tán","actions":["Nếu khói hoặc lửa vẫn tiếp diễn: sơ tán bệnh nhân và nhân viên","Nếu không còn khói hoặc lửa: ở lại và trú tại chỗ"]},{"task":"Ngăn cháy lan rộng","actions":["Đóng cửa phòng mổ","Tắt van cung cấp khí bên ngoài phòng (O2 và N2O)"]},{"task":"Đánh giá mức độ cháy","actions":["Nếu lửa lan vào đường thở: xem phác đồ Cháy trong đường thở #10"]},{"task":"Tổng kết nhóm","actions":["Thảo luận với phẫu thuật viên và ban lãnh đạo phòng mổ về ảnh hưởng của vụ cháy đối với bệnh nhân này và lịch trình phòng mổ"]},{"task":"Dự phòng — với mọi thủ thuật nguy cơ cao","actions":["Thảo luận trước mổ về phòng cháy chữa cháy và quản lý thời gian chờ (time-out)","Tránh FiO2 > 0,3 và tránh N2O","Thông báo cho nhóm mỗi khi thay đổi FiO2 và mỗi khi dùng dao điện hoặc laser trong suốt ca mổ"]},{"task":"Dự phòng — thủ thuật vùng đầu mặt cổ nguy cơ cao nhất (gây mê theo dõi/MAC)","actions":["Dùng nồng độ O2 tối thiểu đủ để đạt SpO2 chấp nhận được","Ưu tiên ống thông mũi thay vì mặt nạ nếu có thể","Nếu cần nồng độ O2 cao: dùng mask thanh quản (LMA) hoặc ống nội khí quản","Bố trí toan trải để tránh tích tụ O2; cân nhắc hút chủ động nếu cần","Để dung dịch sát khuẩn da chứa cồn khô hoàn toàn trước khi trải toan"]}],"drugs":[{"name":"Propofol","adult":"Truyền liên tục để duy trì mê","amount":null,"unit":null,"route":"Truyền TM liên tục","repeat":"","perKg":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"note":"Duy trì độ mê sau khi ngắt máy gây mê"}],"causes":[],"notes":["Tam giác cháy: Nguy cơ cháy = Nhiên liệu + Chất oxy hóa + Nguồn đánh lửa","Nhiên liệu: toan trải, gạc, vải, dung dịch sát khuẩn cồn, tóc, ống dẫn","Chất oxy hóa: O2 và N2O","Nguồn đánh lửa: dao điện, laser, nguồn sáng, đầu đốt","Với cháy do điện: TUYỆT ĐỐI không dùng nước, chỉ dùng bình CO2","Bình CO2 an toàn khi xịt lên vết thương hở"],"short":"Cháy ngoài đường thở","grp":"anes"},{"id":"hemorrhage","no":12,"title":"Xuất huyết / Mất máu khối lượng lớn","definition":"Mất máu cấp tính khối lượng lớn gây bất ổn huyết động. Nhận biết bằng tăng lượng máu hút, tăng số lượng gạc/miếng bọt biển phẫu thuật thấm máu, kèm nhịp tim nhanh và tụt huyết áp.","signs":["Tăng thể tích máu trong bình hút","Tăng sử dụng gạc/miếng bọt biển phẫu thuật","Nhịp tim nhanh","Tụt huyết áp"],"tasks":[{"task":"Huy động nguồn lực","actions":["Thông báo cho toàn nhóm","Xác định người chỉ huy","Gọi hỗ trợ từ Gây mê, Phẫu thuật và Điều dưỡng","Kích hoạt Phác đồ Truyền máu Khối lượng lớn (MTP)"]},{"task":"Xử trí sớm","actions":["Truyền dịch tĩnh mạch bolus (dịch tinh thể, dịch keo). Nếu xuất huyết đáng kể: ưu tiên truyền chế phẩm máu","Thiết lập đường truyền tĩnh mạch lỗ lớn; cân nhắc đường trong xương (IO) hoặc catheter tĩnh mạch trung tâm","Tạm thời nâng huyết áp khi tụt huyết áp nghiêm trọng bằng thuốc co mạch tiêm tĩnh mạch","Cân nhắc tư thế đầu thấp hoặc nâng cao chân"]},{"task":"Đường thở","actions":["Cho thở O2 100%, lưu lượng 10-15 L/phút","Cân nhắc đặt nội khí quản sớm, trước khi đường thở bị phù nề"]},{"task":"Xử trí then chốt","actions":["Nếu mất ổn định huyết động nghiêm trọng ở bất kỳ thời điểm nào: thông báo cho phẫu thuật viên và đề xuất các biện pháp cầm máu tạm thời (ví dụ chèn gạc, ép trực tiếp mạch máu chính hoặc kẹp mạch chéo, thuốc cầm máu tại chỗ: keo thrombin hoặc fibrin)","Gọi thêm hỗ trợ phẫu thuật (ví dụ Chấn thương, Mạch máu, Tim mạch, Phụ khoa-Ung thư hoặc Ngoại tổng quát)"]},{"task":"Thiết bị truyền nhanh","actions":["Phân công người phụ trách riêng","Chuẩn bị hệ thống truyền dịch nhanh (rapid infuser)","Chuẩn bị máy thu hồi hồng cầu (cell saver) nếu vị trí phẫu thuật không nhiễm trùng và không phải ung thư"]},{"task":"Truyền máu","actions":["Nếu chảy máu đáng kể: truyền máu ngay, không chờ kết quả xét nghiệm","Làm ấm tất cả chế phẩm máu","Dựa vào bệnh cảnh lâm sàng: truyền theo tỷ lệ 1-2 khối hồng cầu (PRBC) : 1 huyết tương tươi đông lạnh (FFP) : 1 khối tiểu cầu","Điều chỉnh tỷ lệ truyền theo bất kỳ dấu hiệu lâm sàng hoặc xét nghiệm nào của rối loạn đông máu"]},{"task":"Duy trì thân nhiệt bình thường","actions":["Làm ấm phòng, dùng dịch truyền ấm, chăn thổi khí ấm (forced-air warming)"]},{"task":"Đường động mạch","actions":["Cân nhắc đặt catheter động mạch để theo dõi huyết áp liên tục và lấy mẫu xét nghiệm lặp lại"]},{"task":"Theo dõi nước tiểu và xét nghiệm","actions":["Đặt sonde Foley; mục tiêu lượng nước tiểu ≥ 0,5 mL/kg/giờ","Theo dõi mức độ hồi sức đầy đủ bằng sự ổn định lâm sàng và các xét nghiệm lặp lại: Hgb, tiểu cầu, đông máu, tình trạng toan kiềm, kiềm dư, điện giải, lactat, TEG/ROTEM","Chủ động duy trì nồng độ canxi bình thường"]}],"drugs":[{"name":"Khối hồng cầu (PRBC)","adult":"Truyền nếu Hgb < 7-10 g/dL tùy theo ổn định huyết động, bệnh mạch vành và tốc độ mất máu","amountLo":7,"amountHi":10,"unit":"g/dL (ngưỡng Hgb)","route":"TM","repeat":"Theo diễn tiến lâm sàng","perKg":null,"pedPerKg":10,"pedUnit":"mL/kg","pedMax":null,"note":"Mỗi đơn vị làm tăng Hgb khoảng 1 g/dL hoặc Hct khoảng 3%"},{"name":"Huyết tương tươi đông lạnh (FFP)","adult":"10-15 mL/kg nếu INR hoặc PTT > 1,5 lần bình thường","amountLo":10,"amountHi":15,"unit":"mL/kg","route":"TM","repeat":"Kiểm tra lại xét nghiệm rồi tiếp tục theo tỷ lệ PRBC : FFP là 1:1","perKg":10,"pedPerKg":10,"pedUnit":"mL/kg","pedMax":null,"note":"Sách in liều theo mL/kg"},{"name":"Khối tiểu cầu","adult":"Truyền nếu tiểu cầu < 50-100 K/µL và đang chảy máu","amountLo":50,"amountHi":100,"unit":"K/µL (ngưỡng tiểu cầu)","route":"TM","repeat":"Theo diễn tiến lâm sàng","perKg":null,"pedPerKg":10,"pedUnit":"mL/kg","pedMax":null,"note":"Mỗi đơn vị tách tiểu cầu (apheresis) làm tăng tiểu cầu khoảng 50 K/µL"},{"name":"Tủa lạnh (Cryoprecipitate)","adult":"Truyền nếu fibrinogen < 80-100 mg/dL (< 300 mg/dL trong thai kỳ/chuyển dạ); mỗi 10 đơn vị tăng fibrinogen ~50 mg/dL","amountLo":80,"amountHi":100,"unit":"mg/dL (ngưỡng fibrinogen)","route":"TM","repeat":"Lặp lại tới khi đạt mục tiêu fibrinogen","perKg":null,"pedPerKg":1,"pedUnit":"đơn vị/10 kg","pedMax":null,"note":"Ngưỡng cao
