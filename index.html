":"Tiêm trực tiếp vào động mạch vành qua ống thông","repeat":null,"perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Sách không nêu liều cụ thể."}],"causes":["Tắc/bóc tách động mạch vành trong lúc can thiệp","Loạn nhịp do tái tưới máu","Chèn ép tim do thủng buồng tim/mạch vành","Huyết khối cấp trong stent","Phản ứng với thuốc cản quang"],"notes":["Phòng thông tim có sẵn phương tiện cho CPR cơ học và hỗ trợ tuần hoàn ngoài cơ thể — cần huy động sớm","Chèn ép tim cấp trong lúc can thiệp: xem xét chọc dẫn lưu màng ngoài tim cấp cứu, hoặc mở ngực cấp cứu"],"grp":"cv"},{"id":"cv-electrolyte-arrest","no":8,"short":"Rối loạn điện giải","title":"Ngừng tim do mất cân bằng điện giải (kali, magnesi, canxi)","definition":"Rối loạn điện giải nặng có thể gây loạn nhịp ác tính và ngừng tim. Cần nhận biết trên ECG và điều trị đặc hiệu song song với ACLS chuẩn.","signs":["Tăng kali máu: QRS rộng, sóng T cao nhọn, nhịp tự thất (IVR)","Hạ kali máu: khoảng QT dài, sóng T dẹt, xuất hiện sóng U","Hạ magnesi máu: nhịp nhanh thất đa hình (xoắn đỉnh)","Tăng magnesi máu: yếu cơ, mất phản xạ gân xương, nhịp chậm, tụt huyết áp"],"tasks":[{"task":"TĂNG KALI MÁU","actions":["Nhận biết trên ECG: QRS rộng, sóng T cao nhọn, nhịp tự thất","Bảo vệ màng tế bào cơ tim: Canxi clorua 10% 500-1000 mg TM/trong xương (5-10 mL) trong 2-5 phút, HOẶC Canxi gluconat 10% 15-30 mL trong 2-5 phút","Natri bicarbonat 50 mEq TM/trong xương trong 5 phút (có thể lặp lại sau 15 phút)","Đưa kali vào nội bào: Glucose 25 g (50 mL dung dịch Dextrose 50%) TM/trong xương kèm insulin thường 10 đơn vị TM/trong xương trong 15-30 phút","Salbutamol (Albuterol) 10-20 mg khí dung trong 15 phút","Thải kali: Furosemid 40-80 mg tiêm tĩnh mạch mỗi ngày"]},{"task":"HẠ KALI MÁU","actions":["Nhận biết trên ECG: khoảng QT dài, sóng T dẹt, sóng U","Sử dụng BLS và ACLS tiêu chuẩn","Bù kali và magnesi theo xét nghiệm"]},{"task":"TĂNG MAGNESI MÁU","actions":["Ngừng ngay việc truyền magnesi","Cân nhắc dùng Canxi clorua 10% 500-1000 mg TM/trong xương (5-10 mL) trong 2-5 phút, HOẶC Canxi gluconat 10% 15-30 mL trong 2-5 phút"]},{"task":"HẠ MAGNESI MÁU","actions":["Nhận biết: nhịp nhanh thất đa hình (xoắn đỉnh)","Magnesi sulfat 1-2 g TM/trong xương"]}],"drugs":[{"name":"Canxi clorua 10%","adult":"500-1000 mg TM/trong xương (5-10 mL) trong 2-5 phút","amount":null,"amountLo":500,"amountHi":1000,"unit":"mg","route":"TM/trong xương (ưu tiên tĩnh mạch trung tâm)","repeat":"lặp lại theo ECG và ion đồ","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":20,"pedUnit":"mg/kg","pedMax":1000,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Dùng cho tăng kali máu và tăng magnesi máu. Gây hoại tử mô nếu thoát mạch — ưu tiên đường tĩnh mạch trung tâm. Liều nhi (PALS): 20 mg/kg (0,2 mL/kg CaCl2 10%)."},{"name":"Canxi gluconat 10%","adult":"15-30 mL trong 2-5 phút","amount":null,"amountLo":15,"amountHi":30,"unit":"mL","route":"TM/trong xương","repeat":"lặp lại theo ECG và ion đồ","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":60,"pedUnit":"mg/kg","pedMax":3000,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Thay thế canxi clorua, ít gây kích ứng tĩnh mạch ngoại vi hơn. Liều nhi (PALS): 60 mg/kg (0,6 mL/kg canxi gluconat 10%)."},{"name":"Natri bicarbonat","adult":"50 mEq TM/trong xương trong 5 phút (có thể lặp lại sau 15 phút)","amount":50,"amountLo":null,"amountHi":null,"unit":"mEq","route":"TM/trong xương","repeat":"có thể lặp lại sau 15 phút","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":1,"pedUnit":"mEq/kg","pedMax":50,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Điều trị tăng kali máu (đưa kali vào nội bào). Liều nhi (PALS): 1 mEq/kg."},{"name":"Glucose ưu trương (Dextrose 50%) + Insulin thường","adult":"Glucose 25 g (50 mL D50) TM/trong xương, kèm insulin thường 10 đơn vị TM/trong xương trong 15-30 phút","amount":25,"amountLo":null,"amountHi":null,"unit":"g glucose","route":"TM/trong xương","repeat":"theo đường huyết và kali máu","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":0.1,"pedUnit":"đơn vị insulin/kg","pedMax":10,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Insulin thường 10 đơn vị đi kèm 25 g glucose. Phải theo dõi đường huyết chặt để tránh hạ đường huyết. Liều nhi: insulin 0,1 đơn vị/kg kèm glucose 0,5 g/kg."},{"name":"Salbutamol (Albuterol) khí dung","adult":"10-20 mg khí dung trong 15 phút","amount":null,"amountLo":10,"amountHi":20,"unit":"mg","route":"Khí dung","repeat":"theo kali máu","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Đưa kali vào nội bào trong điều trị tăng kali máu."},{"name":"Furosemid","adult":"40-80 mg tiêm tĩnh mạch mỗi ngày","amount":null,"amountLo":40,"amountHi":80,"unit":"mg","route":"Tiêm tĩnh mạch","repeat":"mỗi ngày","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":1,"pedUnit":"mg/kg","pedMax":40,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Tăng thải kali qua thận; chỉ hiệu quả khi chức năng thận còn."},{"name":"Magnesi sulfat","adult":"1-2 g TM/trong xương","amount":null,"amountLo":1,"amountHi":2,"unit":"g","route":"TM/trong xương","repeat":"theo đáp ứng và magnesi máu","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":25,"pedUnit":"mg/kg","pedMax":2000,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Điều trị hạ magnesi máu và nhịp nhanh thất đa hình (xoắn đỉnh). Liều nhi (PALS): 25-50 mg/kg, tối đa 2 g."}],"causes":["Suy thận, toan chuyển hóa, tiêu cơ vân (tăng kali máu)","Thuốc: chẹn beta, ức chế men chuyển, lợi tiểu giữ kali, digoxin","Mất qua đường tiêu hóa, lợi tiểu quai/thiazid (hạ kali, hạ magnesi máu)","Nghiện rượu, suy dinh dưỡng (hạ magnesi máu)","Truyền magnesi quá liều (tăng magnesi máu, ví dụ trong sản khoa)","Truyền máu khối lượng lớn, hội chứng ly giải u (rối loạn canxi)"],"notes":["Tăng kali máu là một trong các nguyên nhân ngừng tim có thể đảo ngược (5H) — cần điều trị ngay khi nghi ngờ","Canxi chỉ bảo vệ màng tế bào cơ tim, KHÔNG làm giảm nồng độ kali máu","Glucose-insulin và salbutamol đưa kali vào nội bào; lợi tiểu và lọc máu mới thực sự thải kali","Xoắn đỉnh luôn nghĩ đến hạ magnesi máu và các thuốc kéo dài QT","Nhớ kiểm tra kali/magnesi/canxi sớm ở bệnh nhân ngừng tim không rõ nguyên nhân"],"grp":"cv"},{"id":"cv-pe-arrest","no":9,"short":"Thuyên tắc phổi","title":"Ngừng tim do thuyên tắc phổi","definition":"Ngừng tim do huyết khối gây tắc động mạch phổi, thường biểu hiện dưới dạng hoạt động điện vô mạch (PEA). Đây là một nguyên nhân có thể đảo ngược.","signs":["PEA là dạng nhịp thường gặp nhất","Suy thất phải cấp, giãn thất phải trên siêu âm tim","Khó thở, đau ngực, tụt huyết áp đột ngột trước khi ngừng tim","Bệnh cảnh nguy cơ: bất động lâu, hậu phẫu, ung thư, huyết khối tĩnh mạch sâu"],"tasks":[{"task":"Xử trí ban đầu","actions":["Sử dụng BLS và ACLS tiêu chuẩn","Thực hiện siêu âm tim cấp cứu để hỗ trợ chẩn đoán (giãn thất phải, huyết khối)"]},{"task":"Điều trị đặc hiệu","actions":["Xem xét dùng thuốc tiêu sợi huyết cho trường hợp nghi ngờ thuyên tắc phổi","Tham khảo ý kiến chuyên gia","Xem xét phẫu thuật lấy huyết khối (embolectomy)","Xem xét lấy huyết khối cơ học qua da hoặc phẫu thuật lấy huyết khối"]}],"drugs":[{"name":"Thuốc tiêu sợi huyết","adult":"Xem xét dùng thuốc tiêu sợi huyết cho trường hợp nghi ngờ thuyên tắc phổi gây ngừng tim","amount":null,"amountLo":null,"amountHi":null,"unit":null,"route":"Truyền tĩnh mạch","repeat":null,"perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Sách không nêu liều cụ thể. Nếu đã dùng tiêu sợi huyết, nên tiếp tục CPR ít nhất 60-90 phút trước khi cân nhắc ngừng hồi sức."}],"causes":["Huyết khối tĩnh mạch sâu chi dưới di chuyển lên phổi","Bất động kéo dài, sau phẫu thuật lớn, chấn thương","Bệnh lý ác tính, tình trạng tăng đông","Thai kỳ và hậu sản","Dùng thuốc tránh thai đường uống"],"notes":["PEA không giải thích được ở bệnh nhân có yếu tố nguy cơ — luôn nghĩ tới thuyên tắc phổi","Siêu âm tim tại giường trong lúc hồi sức giúp định hướng chẩn đoán nhanh","Huy động sớm hội chẩn để cân nhắc lấy huyết khối qua ống thông hoặc phẫu thuật"],"grp":"cv"},{"id":"cv-hypothermia","no":10,"short":"Hạ thân nhiệt","title":"Hạ thân nhiệt","definition":"Tình trạng nhiệt độ trung tâm cơ thể giảm dưới mức bình thường, phân độ nhẹ (34-36°C), vừa (30-34°C) và nặng (<30°C). Xử trí gồm ngăn mất nhiệt tiếp tục, làm ấm theo mức độ và hồi sức kéo dài khi ngừng tim.","signs":["Hạ thân nhiệt nhẹ: 34-36°C (93-97°F)","Hạ thân nhiệt vừa phải: 30-34°C (86-93°F)","Hạ thân nhiệt nghiêm trọng: <30°C (<86°F)","Run, lơ mơ, mạch chậm, có thể mất mạch","Mạch rất khó bắt — cần kiểm tra kỹ phản ứng, nhịp thở và mạch"],"tasks":[{"task":"Xử trí chung ban đầu","actions":["Cởi bỏ quần áo ướt và ngăn mất nhiệt tiếp tục (đắp chăn và thiết bị cách nhiệt)","Giữ bệnh nhân nằm ngang; di chuyển bệnh nhân nhẹ nhàng, không xô đẩy (tránh kích thích gây rung thất)","Theo dõi nhiệt độ trung tâm cơ thể và nhịp tim liên tục","Điều trị đồng thời các nguyên nhân nền (quá liều thuốc, rượu, chấn thương...) song song với hồi sức","Kiểm tra phản ứng, nhịp thở và mạch"]},{"task":"NẾU CÒN MẠCH VÀ CÒN THỞ — làm ấm theo mức độ","actions":["34-36°C (93-97°F) — hạ thân nhiệt NHẸ: làm ấm thụ động","30-34°C (86-93°F) — hạ thân nhiệt VỪA PHẢI: làm ấm bên ngoài chủ động (làm ấm bằng không khí cưỡng bức)","<30°C (<86°F) — hạ thân nhiệt NGHIÊM TRỌNG: làm ấm bên trong lõi cơ thể (bắc cầu tim phổi, rửa khoang ngực bằng nước ấm, làm ấm máu ngoài cơ thể)"]},{"task":"Các biện pháp làm ấm bổ sung","actions":["Truyền dịch tĩnh mạch ấm (43°C)","Cung cấp oxy được làm ấm và làm ẩm (42-46°C)","Rửa phúc mạc bằng dịch ấm","Làm ấm bên ngoài cơ thể","Rửa/làm ấm qua ống thực quản","Làm ấm nội mạch (catheter làm ấm trong lòng mạch)"]},{"task":"NẾU KHÔNG CÓ MẠCH / NGỪNG THỞ","actions":["Bắt đầu CPR, thông khí hỗ trợ","Khử rung nếu có VF/VT: hai pha 120-200 J, HOẶC một pha 360 J","Tiếp tục CPR ngay lập tức (cân nhắc thực hiện thêm các lần khử rung sau khi làm ấm cho VF/VT)","Xem thuật toán ngừng tim ACLS","Đặt nội khí quản, thông khí bằng oxy ấm, ẩm (42-46°C)","Thiết lập đường truyền TM/trong xương, truyền dung dịch muối sinh lý ấm (43°C)","Cân nhắc dùng thuốc co mạch: Adrenalin (Epinephrine) 1 mg tiêm tĩnh mạch mỗi 3-5 phút, HOẶC Vasopressin 40 đơn vị TM"]},{"task":"Vận chuyển và hồi sức kéo dài","actions":["Tiếp tục CPR trong quá trình vận chuyển đến khoa cấp cứu","Bắt đầu làm ấm lõi cơ thể ngay khi có thể","Tiếp tục hồi sức cho đến khi bệnh nhân được làm ấm lại"]},{"task":"Sau ROSC","actions":["Sau khi tái lập tuần hoàn tự nhiên, làm ấm bệnh nhân đến 32-34°C (90-93°F), hoặc đến nhiệt độ cơ thể bình thường"]}],"drugs":[{"name":"Khử rung — hai pha","adult":"120-200 J hai pha","amount":null,"amountLo":120,"amountHi":200,"unit":"J","route":"Điện cực dán/bản cực ngực","repeat":"cân nhắc thực hiện thêm các lần khử rung sau khi đã làm ấm","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":2,"pedUnit":"J/kg","pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Cho VF/VT vô mạch. Tim hạ thân nhiệt nặng thường kháng sốc — sau lần sốc đầu không hiệu quả, ưu tiên làm ấm trước khi sốc thêm."},{"name":"Khử rung — một pha","adult":"360 J một pha","amount":360,"amountLo":null,"amountHi":null,"unit":"J","route":"Điện cực dán/bản cực ngực","repeat":"cân nhắc thực hiện thêm các lần khử rung sau khi đã làm ấm","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Máy một pha dùng 360 J cho tất cả các lần sốc."},{"name":"Adrenalin (Epinephrine)","adult":"1 mg tiêm tĩnh mạch mỗi 3-5 phút","amount":1,"amountLo":null,"amountHi":null,"unit":"mg","route":"TM/trong xương","repeat":"mỗi 3-5 phút","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":0.01,"pedUnit":"mg/kg","pedMax":1,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Thuốc chuyển hóa chậm ở bệnh nhân hạ thân nhiệt nặng — cân nhắc kéo dài khoảng cách giữa các liều để tránh tích lũy độc tính."},{"name":"Vasopressin","adult":"40 đơn vị tiêm tĩnh mạch","amount":40,"amountLo":null,"amountHi":null,"unit":"đơn vị","route":"TM/trong xương","repeat":"một liều duy nhất","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Thay thế cho adrenalin."},{"name":"Dịch truyền tĩnh mạch ấm (NaCl 0,9%)","adult":"Truyền dung dịch muối sinh lý ấm 43°C","amount":null,"amountLo":null,"amountHi":null,"unit":"°C","route":"TM/trong xương","repeat":"liên tục cho đến khi làm ấm đạt mục tiêu","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Không dùng Ringer lactat ở bệnh nhân hạ thân nhiệt nặng (gan chuyển hóa lactat kém)."},{"name":"Oxy được làm ấm và làm ẩm","adult":"Thông khí bằng oxy ấm, ẩm ở nhiệt độ 42-46°C","amount":null,"amountLo":42,"amountHi":46,"unit":"°C","route":"Qua ống nội khí quản/mặt nạ","repeat":"liên tục","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Biện pháp làm ấm lõi cơ thể ít xâm lấn."}],"causes":["Tiếp xúc môi trường lạnh, ngâm nước lạnh","Quá liều thuốc (an thần, thuốc phiện)","Ngộ độc rượu","Chấn thương, đa chấn thương","Suy giáp, suy thượng thận, hạ đường huyết","Người cao tuổi, trẻ sơ sinh, vô gia cư"],"notes":["Nguyên tắc: \"Không ai được xem là đã tử vong cho đến khi được làm ấm và vẫn tử vong\"","Di chuyển bệnh nhân hết sức nhẹ nhàng — kích thích cơ học có thể khởi phát rung thất","Tim hạ thân nhiệt nặng thường kháng với sốc điện và thuốc — ưu tiên làm ấm lõi cơ thể","Sau ROSC, làm ấm đến 32-34°C hoặc đến nhiệt độ cơ thể bình thường","Tiếp tục hồi sức kéo dài cho đến khi bệnh nhân được làm ấm lại"],"grp":"cv"},{"id":"cv-stemi","no":11,"short":"Tiêu sợi huyết STEMI","title":"Phác đồ tiêu sợi huyết trong STEMI","definition":"Quy trình sàng lọc và triển khai thuốc tiêu sợi huyết cho nhồi máu cơ tim cấp ST chênh lên (STEMI). Nguyên tắc: \"Thời gian là cơ tim\" — thời gian cửa - kim (door-to-needle) phải dưới 30 phút.","signs":["Triệu chứng đau ngực kiểu thiếu máu cơ tim kéo dài > 15 phút nhưng < 12 giờ","ECG 12 chuyển đạo có ST chênh lên hoặc block nhánh trái (LBBB) mới xuất hiện","Ghi ECG 12 chuyển đạo ngay và khởi động quy trình STEMI"],"tasks":[{"task":"Bước 1 - Đánh giá ban đầu (< 10 phút)","actions":["Ghi ECG 12 chuyển đạo ngay lập tức và các quy trình khác phù hợp với nhồi máu cơ tim cấp","Thở oxy, nitroglycerin (NTG), morphin, aspirin (ASA) nếu không có chống chỉ định","Thiết lập 2 đường truyền tĩnh mạch (nhưng không được làm chậm việc chuyển bệnh nhân)","Đo huyết áp tâm thu/tâm trương cả hai tay (tay phải ___/___ , tay trái ___/___)"]},{"task":"Bước 2 - Sàng lọc chống chỉ định","actions":["Chạy hết bảng kiểm chống chỉ định tiêu sợi huyết — tất cả các mục phải trả lời \"KHÔNG\"","Đánh giá thêm hồ sơ nguy cơ cao / chỉ định chuyển tuyến can thiệp","Nếu có bất kỳ dấu hiệu nguy cơ cao nào: cân nhắc chuyển đến bệnh viện có khả năng chụp và can thiệp mạch vành (PCI)"]},{"task":"Bước 3 - Nếu không có chống chỉ định và đã xác định STEMI","actions":["Dùng thuốc tiêu sợi huyết ngay (thời gian cửa - kim < 30 phút)","Phối hợp thuốc chống đông và điều trị hội chứng vành cấp chuẩn","Theo dõi các dấu hiệu tái tưới máu thành công"]},{"task":"Bước 4 - Theo dõi dấu hiệu tái tưới máu","actions":["Giảm hoặc hết đau ngực","Đoạn ST trở về bình thường","Loạn nhịp tái tưới máu (nhịp tự thất gia tốc, ngoại tâm thu thất)","Giải quyết được tình trạng tắc nghẽn dẫn truyền","Đạt đỉnh sớm của các dấu ấn sinh học tim (men tim)"]}],"drugs":[{"name":"Aspirin (ASA)","adult":"160-325 mg nhai","amount":null,"amountLo":160,"amountHi":325,"unit":"mg","route":"Uống (nhai)","repeat":null,"perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Dùng dạng nhai để hấp thu nhanh; cho ngay nếu không có chống chỉ định"},{"name":"Oxy","adult":"4 L/phút, duy trì SpO2 ≥ 94%","amount":4,"amountLo":null,"amountHi":null,"unit":"L/phút","route":"Gọng mũi","repeat":null,"perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Chuẩn độ theo SpO2 mục tiêu ≥ 94%"},{"name":"Nitroglycerin (NTG)","adult":"0,4 mg ngậm dưới lưỡi hoặc xịt, lặp lại tối đa 3 lần","amount":0.4,"amountLo":null,"amountHi":null,"unit":"mg","route":"Ngậm dưới lưỡi / xịt dưới lưỡi","repeat":"Mỗi 5 phút, tối đa 3 liều; sau đó cân nhắc truyền tĩnh mạch","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Chống chỉ định khi tụt huyết áp, nhồi máu thất phải, dùng thuốc ức chế PDE-5 gần đây"},{"name":"Morphin sulfat","adult":"2-5 mg tiêm tĩnh mạch","amount":null,"amountLo":2,"amountHi":5,"unit":"mg","route":"Tiêm tĩnh mạch","repeat":"Lặp lại nếu còn đau ngực sau khi đã dùng NTG","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Chỉ dùng khi đau ngực không giảm với nitroglycerin; theo dõi tụt huyết áp và ức chế hô hấp"}],"causes":["Tắc nghẽn hoàn toàn động mạch vành do huyết khối trên nền mảng xơ vữa vỡ"],"notes":["\"Thời gian là cơ tim\" — mỗi phút chậm trễ bệnh nhân có thể mất khoảng 1% cơ tim còn cứu được","Thời gian cửa - kim (door-to-needle) mục tiêu < 30 phút","Cửa sổ điều trị: triệu chứng > 15 phút nhưng < 12 giờ","Nếu có bất kỳ tiêu chí nguy cơ cao nào, ưu tiên chuyển bệnh viện có khả năng can thiệp mạch vành thay vì tiêu sợi huyết","Sau tiêu sợi huyết vẫn tiếp tục điều trị hội chứng vành cấp chuẩn: chống đông, chống ngưng tập tiểu cầu, chẹn beta, statin"],"tables":[{"title":"Bảng kiểm chống chỉ định tiêu sợi huyết (tất cả phải trả lời \"KHÔNG\")","headers":["Tiêu chí"],"rows":[["Huyết áp tâm thu > 180-200 mmHg"],["Huyết áp tâm trương > 100-110 mmHg"],["Chênh lệch huyết áp tâm thu giữa tay phải và tay trái > 15 mmHg"],["Đột quỵ > 3 giờ hoặc < 3 tháng"],["Tiền sử bệnh lý cấu trúc thần kinh trung ương"],["Chấn thương đầu / mặt trong vòng 3 tháng"],["Chấn thương nặng, chảy máu tiêu hóa hoặc đường tiết niệu, hoặc phẫu thuật lớn trong vòng 4 tuần"],["Đang dùng thuốc chống đông; bệnh lý chảy máu / rối loạn đông máu"],["Có thai"],["Tiền sử xuất huyết nội sọ"],["Ung thư tiến triển; bệnh gan hoặc bệnh thận nặng"]]},{"title":"Hồ sơ nguy cơ cao — chỉ định chuyển can thiệp mạch vành (PCI)","headers":["Dấu hiệu nguy cơ cao"],"rows":[["Nhịp tim ≥ 100 lần/phút VÀ huyết áp tâm thu ≤ 100 mmHg"],["Phù phổi (ran ẩm ở phổi)"],["Dấu hiệu sốc"],["Đã được cấp cứu ngừng tuần hoàn (CPR)"],["Có chống chỉ định với thuốc tiêu sợi huyết"]]}],"grp":"cv"},{"id":"cv-acs","no":12,"short":"Hội chứng vành cấp","title":"Hội chứng vành cấp — xử trí theo các bước","definition":"Lưu đồ xử trí hội chứng vành cấp (ACS) từ đánh giá trước viện đến phân tầng theo ECG 12 chuyển đạo: STEMI, ST chênh xuống / T đảo ngược (NSTEMI - đau thắt ngực không ổn định), và ECG không chẩn đoán.","signs":["Đau ngực hoặc khó chịu ngực kiểu thiếu máu cơ tim","Các dấu hiệu và triệu chứng gợi ý thiếu máu cục bộ hoặc nhồi máu cơ tim","Có thể kèm khó thở, vã mồ hôi, buồn nôn, đau lan tay/hàm"],"tasks":[{"task":"1. Nhận diện dấu hiệu và triệu chứng","actions":["Các dấu hiệu và triệu chứng gợi ý thiếu máu cục bộ hoặc nhồi máu cơ tim"]},{"task":"2. Đánh giá và xử trí của cấp cứu ngoại viện (EMS)","actions":["ABC; chuẩn bị sẵn sàng CPR; chuẩn bị máy khử rung tim","Thở oxy, aspirin, nitroglycerin, morphin khi cần thiết (phác đồ MONA)","Oxy 4 L/phút, duy trì SpO2 ≥ 94%","Aspirin 160-325 mg dạng nhai","Nitroglycerin 0,4 mg ngậm dưới lưỡi hoặc xịt, có thể lặp lại 3 lần","Morphin 2-5 mg tiêm tĩnh mạch nếu đau ngực không giảm với nitroglycerin","Ghi ECG 12 chuyển đạo; nếu có ST chênh lên: báo trước cho bệnh viện để huy động ê-kíp STEMI"]},{"task":"3. Đánh giá và điều trị tại khoa cấp cứu ngay lập tức (< 10 phút)","actions":["Đánh giá dấu hiệu sinh tồn, SpO2","Thiết lập đường truyền tĩnh mạch","Tiếp tục phác đồ MONA (morphin, oxy, nitroglycerin, aspirin)","Xem lại ECG 12 chuyển đạo (tóm tắt, có mục tiêu)","Khai thác bệnh sử ngắn gọn và khám thực thể có trọng tâm","Chạy bảng kiểm chống chỉ định tiêu sợi huyết","Lấy nồng độ dấu ấn sinh học tim (troponin) ban đầu","Xét nghiệm điện giải và đông máu ban đầu","Chụp X-quang ngực tại giường (< 30 phút)"]},{"task":"4. Phân nhóm theo kết quả ECG 12 chuyển đạo","actions":["Nhóm A (bước 5): ST chênh lên hoặc LBBB mới / nghi mới — STEMI","Nhóm B (bước 9): ST chênh xuống hoặc T đảo ngược — NSTEMI / đau thắt ngực không ổn định nguy cơ cao","Nhóm C (bước 13): ECG bình thường hoặc không thay đổi ST/T — ACS nguy cơ trung bình / thấp"]},{"task":"5-8. Nhánh STEMI (ST chênh lên hoặc LBBB mới)","actions":["6. Bắt đầu điều trị bổ sung khi có chỉ định (không được làm chậm tái tưới máu): nitroglycerin truyền tĩnh mạch, chẹn beta uống, clopidogrel, heparin (truyền tĩnh mạch hoặc tiêm dưới da), thuốc ức chế glycoprotein IIb/IIIa","7. Xác định thời gian từ khi khởi phát triệu chứng: > 12 giờ hay ≤ 12 giờ?","Nếu > 12 giờ → chuyển sang bước 8 (nhánh triệu chứng kéo dài); nếu ≤ 12 giờ → tái tưới máu","8. Triệu chứng ≤ 12 giờ — tái tưới máu: Can thiệp mạch vành qua da (PCI) — mục tiêu thời gian cửa - bóng < 90 phút; HOẶC tiêu sợi huyết — mục tiêu thời gian cửa - kim < 30 phút","Tiếp tục các liệu pháp bổ sung: aspirin, heparin, chẹn beta, ức chế men chuyển / ức chế thụ thể angiotensin (ƯCMC/ARB), statin"]},{"task":"9-12. Nhánh ST chênh xuống / T đảo ngược (NSTEMI - nguy cơ cao)","actions":["9. ST chênh xuống hoặc T đảo ngược gợi ý mạnh tình trạng thiếu máu cục bộ — đau thắt ngực không ổn định nguy cơ cao / NSTEMI","10. Troponin tăng cao hoặc bệnh nhân có nguy cơ cao — cân nhắc chiến lược can thiệp sớm khi có: đau ngực dai dẳng, thay đổi ST tái phát, huyết động không ổn định, suy tim","11. Bắt đầu điều trị bổ sung khi có chỉ định: nitroglycerin truyền tĩnh mạch, chẹn beta uống, clopidogrel, heparin (truyền tĩnh mạch hoặc tiêm dưới da), thuốc ức chế glycoprotein IIb/IIIa","12. Nhập viện theo dõi tại giường có monitor; đánh giá lại nguy cơ; tiếp tục aspirin, heparin và các liệu pháp khác (ƯCMC/ARB, statin)","Nếu không còn nguy cơ cao: phân tầng nguy cơ không xâm lấn (nghiệm pháp gắng sức)"]},{"task":"13-17. Nhánh ECG bình thường / không chẩn đoán (nguy cơ trung bình - thấp)","actions":["13. ECG bình thường hoặc không thay đổi đoạn ST / sóng T — ACS nguy cơ trung bình hoặc thấp","14. Xem xét cho nhập viện theo dõi: theo dõi liên tục ECG và men tim, theo dõi đoạn ST; cân nhắc xét nghiệm chẩn đoán không xâm lấn","15. Nếu xuất hiện bất kỳ diễn tiến nào: đặc điểm lâm sàng của ACS, thay đổi ST/T động học, troponin tăng cao?","Nếu CÓ → đi đến bước 10 (nhánh nguy cơ cao); nếu KHÔNG → đi đến bước 16","16. Chụp mạch vành hoặc nghiệm pháp gắng sức có bất thường? Nếu CÓ → đi đến bước 12; nếu KHÔNG → đi đến bước 17","17. Cho xuất viện, sắp xếp theo dõi ngoại trú"]}],"drugs":[{"name":"Aspirin (ASA)","adult":"160-325 mg nhai","amount":null,"amountLo":160,"amountHi":325,"unit":"mg","route":"Uống (nhai)","repeat":null,"perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Cho càng sớm càng tốt nếu không có chống chỉ định"},{"name":"Oxy","adult":"4 L/phút, duy trì SpO2 ≥ 94%","amount":4,"amountLo":null,"amountHi":null,"unit":"L/phút","route":"Gọng mũi","repeat":null,"perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":""},{"name":"Nitroglycerin (NTG)","adult":"0,4 mg ngậm dưới lưỡi hoặc xịt, lặp lại tối đa 3 lần","amount":0.4,"amountLo":null,"amountHi":null,"unit":"mg","route":"Ngậm dưới lưỡi / xịt dưới lưỡi; sau đó truyền tĩnh mạch nếu cần","repeat":"Mỗi 5 phút, tối đa 3 liều","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Thận trọng / tránh khi nhồi máu thất phải, huyết áp tâm thu thấp, dùng thuốc ức chế PDE-5"},{"name":"Morphin sulfat","adult":"2-5 mg tiêm tĩnh mạch","amount":null,"amountLo":2,"amountHi":5,"unit":"mg","route":"Tiêm tĩnh mạch","repeat":"Lặp lại nếu đau ngực không giảm với NTG","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":""},{"name":"Clopidogrel","adult":"Theo chỉ định (thuốc ức chế thụ thể P2Y12 bổ sung)","amount":null,"amountLo":null,"amountHi":null,"unit":null,"route":"Uống","repeat":null,"perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Sách không nêu liều cụ thể — thuộc nhóm điều trị bổ sung khi có chỉ định"},{"name":"Heparin","adult":"Truyền tĩnh mạch hoặc tiêm dưới da (heparin trọng lượng phân tử thấp)","amount":null,"amountLo":null,"amountHi":null,"unit":null,"route":"Tĩnh mạch / dưới da","repeat":null,"perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Sách không nêu liều cụ thể"},{"name":"Thuốc ức chế glycoprotein IIb/IIIa","adult":"Theo chỉ định","amount":null,"amountLo":null,"amountHi":null,"unit":null,"route":"Tĩnh mạch","repeat":null,"perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Sách không nêu liều cụ thể"},{"name":"Thuốc chẹn beta","adult":"Đường uống, khi có chỉ định","amount":null,"amountLo":null,"amountHi":null,"unit":null,"route":"Uống","repeat":null,"perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Tránh khi sốc tim, suy tim mất bù, nhịp chậm, block nhĩ thất cao độ"}],"causes":["Vỡ hoặc bào mòn mảng xơ vữa động mạch vành gây hình thành huyết khối","Tắc hoàn toàn động mạch vành → STEMI","Tắc bán phần / thuyên tắc vi mạch → NSTEMI hoặc đau thắt ngực không ổn định"],"notes":["LƯU Ý: Lưu đồ này chỉ là hướng dẫn chung, không áp dụng cứng nhắc cho mọi bệnh nhân. Với tất cả các phương pháp điều trị, cần cẩn trọng thực hiện đúng chỉ định và loại trừ chống chỉ định.","Mục tiêu thời gian: đánh giá tại khoa cấp cứu < 10 phút; X-quang ngực tại giường < 30 phút","Mục tiêu tái tưới máu: cửa - bóng (PCI) < 90 phút; cửa - kim (tiêu sợi huyết) < 30 phút","Ghi ECG 12 chuyển đạo trước viện và báo trước cho bệnh viện giúp rút ngắn đáng kể thời gian tái tưới máu"],"tables":[{"title":"Phân nhóm theo ECG 12 chuyển đạo","headers":["Nhóm","Hình ảnh ECG","Ý nghĩa","Đi tiếp"],"rows":[["A (bước 5)","ST chênh lên hoặc LBBB mới / nghi mới","STEMI — tổn thương xuyên thành đang diễn tiến","Bước 6-8: điều trị bổ sung + tái tưới máu"],["B (bước 9)","ST chênh xuống hoặc T đảo ngược động học","Thiếu máu cục bộ nặng — đau thắt ngực không ổn định / NSTEMI nguy cơ cao","Bước 10-12: điều trị bổ sung, cân nhắc can thiệp sớm"],["C (bước 13)","ECG bình thường hoặc không thay đổi ST/T","ACS nguy cơ trung bình hoặc thấp","Bước 14-17: theo dõi, men tim chuỗi, phân tầng nguy cơ"]]}],"grp":"cv"},{"id":"cv-ecg-quick-read","no":13,"short":"Đọc nhanh ECG 12 CĐ","title":"Đọc nhanh điện tâm đồ 12 chuyển đạo","definition":"Quy trình 5 bước đọc nhanh ECG 12 chuyển đạo để phát hiện thiếu máu cục bộ, tổn thương và nhồi máu cơ tim, cùng các dạng sóng tiến triển theo thời gian của nhồi máu.","signs":["Đoạn ST chênh lên — biểu hiện tổn thương cơ tim cấp","Đoạn ST chênh xuống kèm sóng T đảo ngược — thiếu máu cơ tim","Sóng Q bệnh lý (≥ 0,03-0,04 giây hoặc ≥ 1/3 chiều cao phức bộ QRS) — hoại tử cơ tim"],"tasks":[{"task":"Bước 1 - Xác định nhịp","actions":["Xác định nhịp cơ bản","Nếu là nhịp trên thất: nhịp xoang, rung nhĩ, nhịp nhanh nhĩ, cuồng nhĩ"]},{"task":"Bước 2 - Loại trừ block nhánh trái (LBBB)","actions":["LBBB: QRS > 0,12 giây VÀ sóng R có khía/rộng ở chuyển đạo I hoặc V5, V6","LBBB làm nhiễu loạn việc chẩn đoán nhồi máu cơ tim cấp / hội chứng vành cấp","Ngoại lệ: LBBB mới xuất hiện được xem là tương đương STEMI"]},{"task":"Bước 3 - Nếu không có LBBB, tìm 3 dấu hiệu","actions":["Đoạn ST chênh lên → có ý nghĩa nhồi máu cơ tim cấp","Đoạn ST chênh xuống kèm sóng T đảo ngược → có thể là thiếu máu cơ tim hoặc sắp xảy ra nhồi máu","Sóng Q bệnh lý (rộng hoặc sâu) → nhồi máu cơ tim"]},{"task":"Bước 4 - Loại trừ các yếu tố gây nhiễu","actions":["Hội chứng WPW (giả nhồi máu)","Block nhánh (BBB)","Viêm màng ngoài tim (giả nhồi máu cơ tim)","Digoxin (làm ST chênh xuống hình lòng máng)","Phì đại thất trái (LVH) — làm ST chênh xuống, sóng T đảo ngược"]},{"task":"Bước 5 - Định khu nhồi máu và chọn điều trị","actions":["Xác định vùng nhồi máu (trước, dưới, thất phải, bên, sau)","Cân nhắc điều trị thích hợp: MONA, PCI hoặc tiêu sợi huyết, nitrat truyền tĩnh mạch, heparin, thuốc ức chế glycoprotein IIb/IIIa, chẹn beta, thuốc chống loạn nhịp..."]}],"drugs":[],"causes":[],"notes":["Nếu ECG ban đầu chưa có dấu hiệu nhồi máu cơ tim cấp nhưng lâm sàng nghi ngờ, phải ghi ECG chuỗi (nối tiếp)","Chuẩn hóa máy: 1 mV = 1 cm (10 mm)","Sóng Q nhỏ là bình thường ở các chuyển đạo I, II, aVL, V5 và V6","Tái tưới máu sớm là phương pháp điều trị dứt điểm cho hầu hết bệnh nhân nhồi máu cơ tim cấp — mỗi phút chậm trễ mất khoảng 1% cơ tim còn cứu được. \"Thời gian là cơ tim\"","Cấp máu của động mạch vành phải (RCA): tâm nhĩ phải, tâm thất phải, nút xoang, nút nhĩ thất, bó His và phân nhánh sau","Cấp máu của động mạch vành trái (LCA): tâm nhĩ trái, tâm thất trái, vách liên thất, nhánh bó phải và trái, phân nhánh trước và sau"],"tables":[{"title":"Các dạng ECG theo tiến triển của nhồi máu cơ tim","headers":["Giai đoạn","Hình ảnh ECG","Thời điểm xuất hiện"],"rows":[["Tổn thương","Đoạn ST chênh lên","Thường xuất hiện trong vòng vài phút sau khi khởi phát đau ngực do tim"],["Thiếu máu cục bộ","Sóng T đảo ngược","Có thể hồi phục hoàn toàn sau 24 giờ"],["Nhồi máu cấp","Sóng Q bệnh lý (≥ 0,03 giây hoặc ≥ 1/3 chiều cao QRS)","Bắt đầu hình thành sau khoảng 1 giờ"],["Nhồi máu cũ","Sóng Q tồn tại vĩnh viễn, đoạn ST đã trở về bình thường","Di chứng lâu dài"],["ST chênh xuống soi gương","ST chênh xuống ở các chuyển đạo đối diện","Thấy ở các chuyển đạo xa vùng nhồi máu"],["Nhồi máu không sóng Q (NSTEMI)","Đoạn ST phẳng hoặc lõm ở hai hay nhiều chuyển đạo liền kề, có thể kèm sóng T đảo ngược","Không hình thành sóng Q"]]}],"grp":"cv"},{"id":"cv-mi-localization","no":14,"short":"Định khu nhồi máu","title":"Định khu nhồi máu cơ tim trên ECG (trước, dưới, thất phải, bên, sau)","definition":"Bảng tra cứu vùng nhồi máu cơ tim theo chuyển đạo có ST chênh lên, động mạch thủ phạm và các biến chứng dẫn truyền / huyết động đi kèm.","signs":["ST chênh lên ở hai hoặc nhiều chuyển đạo liền kề","ST chênh xuống soi gương ở các chuyển đạo đối diện","Sóng Q bệnh lý và sóng T đảo ngược có thể xuất hiện"],"tasks":[{"task":"Xác định vùng nhồi máu","actions":["Đối chiếu nhóm chuyển đạo có ST chênh lên với bảng định khu","Tìm ST chênh xuống soi gương để củng cố chẩn đoán","Nhồi máu cơ tim thành dưới: LUÔN ghi thêm chuyển đạo V4R để loại trừ nhồi máu thất phải","Nghi nhồi máu thành sau: ghi thêm các chuyển đạo ngực sau V7-V9"]}],"drugs":[],"causes":[],"notes":["Nhồi máu cơ tim thất phải đi kèm nhồi máu cơ tim thành dưới trong khoảng 30% trường hợp — luôn kiểm tra V4R","Trong nhồi máu thất phải, huyết áp có thể tụt nếu giảm tiền gánh — CẨN TRỌNG với morphin, nitroglycerin và furosemid; điều trị tụt huyết áp bằng truyền dịch tĩnh mạch và tạo nhịp","Vị trí đặt điện cực MC4R: khe liên sườn 5, đường trung đòn phải; theo dõi kèm chuyển đạo III","Nhồi máu thành bên hiếm khi đơn độc, thường là một phần của nhồi máu nhiều vùng (trước bên, dưới bên hoặc sau bên)","Nhồi máu thành sau hiếm khi đơn độc; thường phối hợp với nhồi máu thành dưới","Cảnh giác chẩn đoán nhầm: phì đại thất trái (LVH) cũng có thể gây sóng R tiến triển kém và sóng Q ở V1-V2; phì đại thất phải (RVH) cũng gây sóng R lớn ở V1 — phải loại trừ trước"],"tables":[{"title":"Định khu nhồi máu cơ tim: chuyển đạo / động mạch thủ phạm / biến chứng","headers":["Vùng nhồi máu","Chuyển đạo có ST chênh lên","Tiêu chí","Soi gương (ST chênh xuống)","Động mạch thủ phạm","Biến chứng thường gặp"],"rows":[["Thành trước","V1-V4","ST chênh lên ≥ 0,5-1 mm ở hai hoặc nhiều chuyển đạo liền kề; có thể kèm sóng Q, sóng R tiến triển kém, sóng T đảo ngược","II, III, aVF","Nhánh liên thất trước (LAD) của động mạch vành trái","Block phân nhánh trái trước; RBBB; block nhĩ thất độ II Mobitz II; block nhĩ thất độ III với nhịp tự thất; suy bơm (sốc tim)"],["Thành dưới","II, III, aVF","ST chênh lên ≥ 0,5-1 mm ở hai hoặc nhiều chuyển đạo liền kề; có thể kèm sóng Q và T đảo ngược","I, aVL và V2-V4","Động mạch vành phải (RCA), đôi khi động mạch vành trái","Nhịp chậm xoang; block nhĩ thất độ I; block nhĩ thất độ II Mobitz I (Wenckebach); block nhĩ thất độ III với nhịp bộ nối; block phân nhánh trái sau; trục trái; tụt huyết áp"],["Thất phải","V4R (MC4R)","ST chênh lên ở V4R; có thể kèm sóng Q và T đảo ngược","—","Động mạch vành phải (RCA)","Block nhĩ thất; rung nhĩ / cuồng nhĩ; suy tim phải; tĩnh mạch cổ nổi kèm phổi trong; tụt huyết áp nhạy cảm với giảm tiền gánh"],["Thành bên","I, aVL, V5, V6","ST chênh lên ≥ 0,5-1 mm; có thể kèm sóng Q và T đảo ngược","III, aVF (kèm ST chênh lên ở aVR)","Nhánh mũ (LCx) của động mạch vành trái","Rối loạn chức năng thất trái; block nút nhĩ thất"],["Thành sau","V7-V9 (chuyển đạo ngực sau)","ST chênh XUỐNG kèm hoặc không kèm sóng R lớn ở V1, V2, V3; có thể kèm sóng T đảo ngược","V1-V3 (hình ảnh soi gương)","Động mạch vành phải (RCA) hoặc nhánh mũ (LCx)","Ngừng xoang; thường phối hợp nhồi máu thành dưới"]]}],"grp":"cv"},{"id":"cv-ecg-patterns","no":15,"short":"Block nhánh, trục, WPW","title":"Block nhánh, trục điện tim, WPW và các dạng ECG khác","definition":"Bảng tra cứu tiêu chuẩn chẩn đoán block nhánh (LBBB, RBBB), block phân nhánh, block hai bó, trục điện tim, hội chứng tiền kích thích (WPW, LGL) và các dạng ECG hay gặp khác.","signs":["QRS ≥ 0,12 giây gợi ý block nhánh","PR ngắn kèm sóng delta gợi ý WPW","Trục điện tim lệch gợi ý block phân nhánh, phì đại thất hoặc nhồi máu"],"tasks":[{"task":"Nhận diện block nhánh","actions":["Đo độ rộng QRS: ≥ 0,12 giây → block nhánh hoàn toàn","Nhìn V1 và V6 để phân biệt LBBB với RBBB","Nếu có LBBB, KHÔNG nên cố chẩn đoán nhồi máu cơ tim cấp chỉ bằng tiêu chuẩn ECG thông thường"]},{"task":"Nhận diện hội chứng tiền kích thích","actions":["WPW: PR ngắn, QRS rộng, có sóng delta — dễ khởi phát cơn nhịp nhanh kịch phát trên thất (PSVT)","LGL: PR ngắn, độ rộng QRS bình thường — cũng dễ có PSVT","WPW kèm rung nhĩ: tần số rất nhanh, QRS rộng giống nhịp nhanh thất — SỐC ĐIỆN CHUYỂN NHỊP","Sóng delta có thể bắt chước sóng Q bệnh lý (giả nhồi máu) hoặc bắt chước block nhánh"]}],"drugs":[],"causes":[],"notes":["WPW kèm rung nhĩ đáp ứng thất rất nhanh: sốc điện chuyển nhịp; tránh các thuốc ức chế nút nhĩ thất (adenosin, verapamil, digoxin, chẹn beta) vì có thể làm tăng dẫn truyền qua đường phụ","Bệnh nhân có block hai bó có thể tiến triển thành block nhĩ thất hoàn toàn","Sóng U: liên quan đến một số rối loạn điện giải (đặc biệt là hạ kali máu), thuốc hoặc bệnh tim","Sóng J (sóng Osborn): gặp trong hạ thân nhiệt","Viêm màng ngoài tim có thể tiến triển đến chèn ép tim, rung nhĩ, cuồng nhĩ hoặc nhịp nhanh nhĩ kịch phát"],"tables":[{"title":"Block nhánh (QRS ≥ 0,12 giây)","headers":["Loại","Tiêu chuẩn ECG","Chuyển đạo quan sát"],"rows":[["LBBB (block nhánh trái)","Sóng R có khía / rộng ở I hoặc V5, V6; phức bộ chủ yếu âm ở V1","I, V5, V6 và V1"],["RBBB (block nhánh phải)","Sóng R có khía hoặc hai đỉnh (rsR', \"tai thỏ\") ở V1 hoặc V2; sóng S rộng ở I, V5 và V6","V1, V2 và I, V5, V6"]]},{"title":"Block phân nhánh và block hai bó","headers":["Loại","Tiêu chuẩn ECG"],"rows":[["Block phân nhánh trái trước","Trục lệch trái bệnh lý ≥ -30°; sóng Q ở I, sóng S ở III (Q1S3); không có nhồi máu thành dưới"],["Block phân nhánh trái sau","Trục lệch phải ≥ +90°; sóng S ở I, sóng Q ở III (S1Q3); không có phì đại thất phải"],["Block hai bó - dạng 1","RBBB + block phân nhánh trái trước"],["Block hai bó - dạng 2","RBBB + block phân nhánh trái sau"],["Block hai bó - dạng 3","RBBB + block nhĩ thất độ I"],["Block hai bó - dạng 4","LBBB + block nhĩ thất độ I"],["Lưu ý","Bệnh nhân có block hai bó có thể tiến triển thành block nhĩ thất độ III"]]},{"title":"Trục điện tim","headers":["Trục","Khoảng độ","Nguyên nhân thường gặp"],"rows":[["Trục bình thường","0° đến +90°","Sinh lý bình thường"],["Trục lệch trái (LAD)","0° đến -30° (sinh lý); -30° đến -90° (bệnh lý)","Cổ trướng; nhồi máu cơ tim thành dưới; block phân nhánh trái trước; phì đại thất trái (LVH); LBBB; thai kỳ; tim nằm ngang"],["Trục lệch phải (RAD)","+90° đến +180°","Block phân nhánh trái sau; phì đại thất phải (RVH); RBBB; bệnh phổi (COPD); tim nằm dọc"],["Trục lệch phải cực độ (\"vùng vô định\")","-90° đến -180° (tức +180° đến +270°)","Nhịp lạc chỗ thất, ví dụ nhịp nhanh thất (VT); tăng kali máu nặng"]]},{"title":"Hội chứng tiền kích thích","headers":["Hội chứng","Tiêu chuẩn ECG","Nguy cơ loạn nhịp"],"rows":[["WPW (Wolff-Parkinson-White)","PR ngắn, QRS rộng, có sóng delta (bắt chước sóng Q bệnh lý hoặc block nhánh)","Dễ có PSVT; WPW kèm rung nhĩ cho tần số rất nhanh, giống nhịp nhanh thất — cần sốc điện chuyển nhịp"],["LGL (Lown-Ganong-Levine)","PR ngắn, độ rộng QRS bình thường, không có sóng delta","Dễ có PSVT"]]},{"title":"Các dạng ECG khác","headers":["Dạng ECG","Tiêu chuẩn / đặc điểm","Ghi chú lâm sàng"],"rows":[["Phì đại thất trái (LVH)","Sóng R ≥ 25 mm ở V5 hoặc V6; hoặc sóng S ≥ 25 mm ở V1 hoặc V2; kèm ST chênh xuống và T đảo ngược kiểu \"quá tải\"","Có thể giả nhồi máu thành trước (sóng R tiến triển kém)"],["Viêm màng ngoài tim","ST chênh lên lõm ở hầu hết các chuyển đạo, không có ST chênh xuống soi gương; đoạn PR chênh xuống","Kèm sốt; tiếng cọ màng ngoài tim; tiếng tim mờ; đau ngực kiểu màng phổi, đau nhói; có thể tiến triển chèn ép tim, rung nhĩ, cuồng nhĩ, nhịp nhanh nhĩ kịch phát"],["Tái cực sớm lành tính (biến thể bình thường)","ST chênh lên dốc lên, hơi cao ở vài chuyển đạo; sóng T cao so với đường đẳng điện; không có ST chênh xuống soi gương","Biến thể bình thường, không phải thiếu máu cơ tim"],["Bệnh phổi tắc nghẽn mạn tính (COPD)","Điện thế QRS thấp ở các chuyển đạo chi (I, II, III, aVR, aVL, aVF)","Có thể kèm phì đại thất phải (RVH)"],["Sóng U","Sóng nhỏ sau sóng T","Liên quan rối loạn điện giải (nhất là hạ kali máu), thuốc hoặc bệnh tim"],["Sóng J (sóng Osborn)","Sóng nhô lên tại điểm J","Gặp trong hạ thân nhiệt"]]}],"grp":"cv"},{"id":"cv-cardiac-markers","no":16,"short":"Dấu ấn sinh học tim","title":"Bảng dấu ấn sinh học tim (men tim)","definition":"Giá trị bình thường và động học (thời điểm bắt đầu tăng, đạt đỉnh, thời gian tồn tại) của các dấu ấn sinh học tim trong nhồi máu cơ tim cấp: troponin I, myoglobin và CK-MB.","signs":["Troponin I tăng: dấu ấn đặc hiệu nhất cho hoại tử cơ tim","Myoglobin tăng sớm nhất nhưng kém đặc hiệu","CK-MB > 10% tổng CK gợi ý tổn thương cơ tim"],"tasks":[{"task":"Sử dụng men tim trong chẩn đoán","actions":["Lấy men tim ngay khi tiếp nhận (giá trị nền) và làm chuỗi theo thời gian","Không được trì hoãn tái tưới máu để chờ kết quả men tim","Đối chiếu kết quả với thời điểm khởi phát triệu chứng để diễn giải đúng","Đạt đỉnh sớm của men tim là một dấu hiệu tái tưới máu thành công"]}],"drugs":[],"causes":[],"notes":["Các giá trị này chỉ là hướng dẫn. Từng dấu ấn có thể khác nhau tùy kích thước ổ nhồi máu, thời điểm khởi phát triệu chứng và phương pháp / máy xét nghiệm của từng phòng xét nghiệm","Troponin tồn tại lâu (4-7 ngày) nên hữu ích để chẩn đoán muộn, nhưng kém hữu ích để phát hiện tái nhồi máu sớm","Myoglobin tăng sớm (1-3 giờ) nhưng không đặc hiệu cho cơ tim (cũng tăng khi tổn thương cơ vân)"],"tables":[{"title":"Động học dấu ấn sinh học ở bệnh nhân nhồi máu cơ tim cấp","headers":["Dấu ấn sinh học tim","Bắt đầu tăng (giờ)","Đạt đỉnh (giờ)","Thời gian tồn tại"],"rows":[["Troponin I","4-6 giờ","12-24 giờ","4-7 ngày"],["Myoglobin","1-3 giờ","6-10 giờ","24 giờ"],["CK-MB","3-4 giờ","12-24 giờ","2-3 ngày"]]},{"title":"Giá trị bình thường của dấu ấn sinh học tim","headers":["Giới tính","Troponin I (ng/mL)","Myoglobin (ng/mL)","CK-MB (ng/mL)"],"rows":[["Nam","0-0,1","10-95","0-4 (hoặc > 10% tổng CK là bệnh lý)"],["Nữ","0-0,1","10-65","0-4 (hoặc > 10% tổng CK là bệnh lý)"]]}],"grp":"cv"},{"id":"cv-swan-ganz","no":17,"short":"Swan-Ganz","title":"Theo dõi bằng ống thông động mạch phổi (Swan-Ganz)","definition":"Ống thông động mạch phổi (PA) cho phép theo dõi áp lực buồng tim phải, áp lực động mạch phổi và áp lực mao mạch phổi bít, giúp đánh giá tiền gánh thất phải và thất trái.","signs":["Dạng sóng CVP/RA: sóng a, c, v — áp lực nhĩ phải","Dạng sóng thất phải (RV): áp lực tâm thu cao, tâm trương thấp","Dạng sóng PA: có khuyết trùng động mạch (dicrotic notch)","Dạng sóng PCWP: giảm biên độ, xuất hiện khi bơm bóng"],"tasks":[{"task":"Nguyên tắc theo dõi","actions":["Xu hướng biến đổi của các giá trị, kết hợp với đánh giá lâm sàng bệnh nhân, cho bức tranh chính xác hơn so với một giá trị đơn lẻ ban đầu","Khi ống thông PA đã đặt tại chỗ, phải theo dõi áp lực PA liên tục để phát hiện tình trạng bít (wedge) ngoài ý muốn kéo dài","Bít ống thông kéo dài ngoài ý muốn có thể gây nhồi máu phổi"]}],"drugs":[],"causes":[],"notes":["CVP/RA phản ánh tiền gánh thất phải","PCWP/PAOP phản ánh tiền gánh thất trái","PAP đo lượng máu trở về phổi","Luôn kiểm tra dạng sóng để xác nhận vị trí đầu ống thông"],"tables":[{"title":"Giá trị áp lực bình thường qua ống thông Swan-Ganz","headers":["Vị trí đo","Ý nghĩa","Giá trị bình thường"],"rows":[["CVP / RA (áp lực tĩnh mạch trung tâm / áp lực nhĩ phải)","Tiền gánh thất phải","2-6 mmHg"],["RV (áp lực thất phải)","Áp lực buồng thất phải","Tâm thu 15-30 mmHg; tâm trương 2-8 mmHg"],["PAP (áp lực động mạch phổi)","Lượng máu trở về phổi","PASP (tâm thu) 15-30 mmHg; PADP (tâm trương) 8-15 mmHg; áp lực trung bình 9-18 mmHg"],["PCWP / PAOP (áp lực mao mạch phổi bít / áp lực bít động mạch phổi)","Tiền gánh thất trái","6-12 mmHg"]]}],"grp":"cv"},{"id":"cv-iabp","no":18,"short":"Bóng đối xung IABP","title":"Bơm bóng đối xung động mạch chủ (IABP) — vận hành và xử trí sự cố","definition":"IABP là thiết bị hỗ trợ tuần hoàn cơ học đặt trong động mạch chủ xuống, bơm bóng thì tâm trương để tăng tưới máu vành và xả bóng trước thì tâm thu để giảm hậu gánh. Mục này gồm quy trình vận chuyển bệnh nhân có IABP và xử trí sự cố khẩn cấp.","signs":["Dạng sóng áp lực động mạch có đối xung (augmentation) trong thì tâm trương","Mất đối xung hoặc báo động máy — gợi ý sự cố kỹ thuật","Thay đổi mạch chi dưới cùng bên hoặc vị trí chèn ống thông — gợi ý thiếu máu chi hoặc di lệch ống thông"],"tasks":[{"task":"Chuẩn bị trước vận chuyển (bước 1-8)","actions":["1. Đánh giá trực quan môi trường xung quanh để đảm bảo hành lang, thang máy và tuyến đường di chuyển đủ chỗ cho thiết bị và nhân sự cần thiết","2. Nhận bàn giao báo cáo bệnh nhân","3. Xác định các thiết lập IABP hiện tại và ghi lại các thiết lập áp lực điển hình","4. Xác định model máy, kích thước bóng và độ sâu vị trí chèn ống thông IAB","5. Xác nhận vị trí đầu bóng đã được kiểm chứng bằng X-quang ngực","6. Tiến hành đánh giá bệnh nhân","7. Gắn các dây điện cực ECG mới và cố định từng dây trên điện cực bằng băng dính vải 2 inch","8. Đảm bảo ống thông IAB được dán cố định chắc chắn"]},{"task":"Vận chuyển bệnh nhân (bước 9-13)","actions":["9. Đặt nẹp cố định đầu gối vào chân đã đặt IAB để tránh gập chân trong quá trình vận chuyển; chuẩn bị sẵn các đầu nối thích hợp để kết nối IABP vào bảng điều khiển vận chuyển; mang theo mọi bộ chuyển đổi cần thiết tại cơ sở tiếp nhận","10. Di chuyển bệnh nhân sang cáng vận chuyển; kết nối và cố định tất cả bơm tiêm, monitor, máy thở và các thiết bị khác","11. Chuyển IABP sang bảng điều khiển vận chuyển ở đầu giường hoặc trong xe cứu thương (nếu bảng điều khiển IABP được gắn trong xe)","12. Cấp nguồn cho bảng điều khiển IABP vận chuyển","13. Mở bình khí heli và kiểm tra áp suất bình"]},{"task":"Khởi động và tối ưu hóa (bước 14-16)","actions":["14. Thực hiện theo hướng dẫn của bảng điều khiển IABP để khởi động (theo trợ giúp trên màn hình hoặc hướng dẫn sử dụng của nhà sản xuất): thiết lập ECG và dạng sóng áp lực từ bệnh nhân; xác nhận các cài đặt ban đầu của máy bơm; thiết lập thời gian (timing); khởi động bơm IAB; xác nhận lại tất cả các cài đặt của máy bơm","15. Tối ưu hóa thời gian bơm ở chế độ 1:2 — đặt thời điểm bơm (inflation) bằng cách điều chỉnh trễ dần cho đến khi khuyết trùng động mạch (dicrotic notch) xuất hiện rõ, sau đó chuyển thời điểm bơm sớm hơn cho đến khi hình chữ V rõ nét xuất hiện tại khuyết trùng động mạch; cài đặt thời điểm xả bóng (deflation) để đạt được áp lực tâm trương thấp nhất có thể trong khi vẫn duy trì mức đối xung tối đa","16. Đánh giá áp lực mỗi 5 phút hoặc bất cứ khi nào tình trạng bệnh nhân thay đổi trong quá trình vận chuyển; kiểm tra vị trí chèn ống thông và mạch chi mỗi 15 phút"]},{"task":"Xử trí sự cố và tình huống khẩn cấp","actions":["Ngừng tim: chuyển bảng điều khiển sang chế độ kích hoạt theo \"áp lực\" (pressure trigger) và bắt đầu hồi sinh tim phổi. Duy trì huyết áp trung bình (MAP) ≥ 60 mmHg. Sốc điện khi cần (không cần ngắt kết nối hoặc cô lập IABP hay thiết bị theo dõi). Sau khi có tuần hoàn tự nhiên trở lại (ROSC), đưa tín hiệu kích hoạt IABP trở lại ECG khi bệnh nhân đã ổn định","Vỡ bóng hoặc rò rỉ: NGỪNG ngay liệu pháp IABP, ngắt kết nối ống thông. Nếu nghi thuyên tắc khí (có dấu hiệu / triệu chứng), đặt bệnh nhân ở tư thế nằm nghiêng trái (đầu thấp)","Lỗi bảng điều khiển: bơm và xả bóng bằng tay với 40 mL khí mỗi 5 phút","Hết heli: xác nhận van bình đã mở. Lưu ý một bình heli đầy cung cấp đủ cho nhiều tuần điều trị; nếu cần, thay bình mới","Chảy máu quá nhiều: ép trực tiếp vào vị trí chèn; cân nhắc chuyển đến cơ sở y tế gần nhất","Di lệch ống thông hoặc tuột ống: phòng ngừa bằng cách nẹp chân đặt IABP bằng dụng cụ cố định đầu gối, dán băng cố định các đầu nối ống và dán ống IABP vào chân. Nếu ống tuột — NGỪNG liệu pháp IABP. KHÔNG được đẩy lại ống vào nếu bao vô trùng đã bị mất độ sâu ban đầu. Tham khảo ý kiến bác sĩ kiểm soát y tế"]}],"drugs":[],"causes":[],"notes":["Khi ngừng tim: KHÔNG cần ngắt kết nối hoặc cô lập IABP trước khi sốc điện","Duy trì MAP ≥ 60 mmHg trong hồi sức","Không bao giờ để bóng đứng yên (không bơm) quá lâu — nguy cơ hình thành huyết khối trên bóng; nếu ngừng máy phải bơm tay 40 mL mỗi 5 phút","Kiểm tra mạch chi và vị trí chèn ống thông mỗi 15 phút trong quá trình vận chuyển","Chân có đặt IABP phải được nẹp thẳng (nẹp cố định đầu gối) để tránh gập và di lệch ống thông"],"tables":[{"title":"Xử trí nhanh sự cố IABP","headers":["Sự cố","Xử trí"],"rows":[["Ngừng tim","Chuyển sang kích hoạt theo áp lực, bắt đầu CPR, duy trì MAP ≥ 60 mmHg, sốc điện khi cần (không cần ngắt IABP); sau ROSC chuyển lại kích hoạt theo ECG"],["Vỡ bóng / rò rỉ (thấy máu trong ống khí)","Ngừng ngay IABP, ngắt kết nối ống thông; nghi thuyên tắc khí → tư thế nằm nghiêng trái, đầu thấp"],["Lỗi bảng điều khiển","Bơm và xả bóng bằng tay 40 mL khí mỗi 5 phút"],["Hết khí heli","Kiểm tra van bình đã mở; thay bình mới nếu cần (một bình đầy dùng được nhiều tuần)"],["Chảy máu vị trí chèn","Ép trực tiếp; cân nhắc chuyển đến cơ sở y tế gần nhất"],["Di lệch / tuột ống thông","Ngừng IABP; KHÔNG đẩy lại ống nếu bao vô trùng đã mất độ sâu ban đầu; hội chẩn bác sĩ kiểm soát y tế"]]}],"grp":"cv"},{"id":"ped-initial-assessment","no":1,"short":"Đánh giá ban đầu","title":"Đánh giá nhi khoa ban đầu","definition":"Tam giác đánh giá nhi khoa (Pediatric Assessment Triangle) là công cụ quan sát nhanh trong vài giây đầu tiếp cận trẻ, giúp nhận định mức độ nặng trước khi thăm khám. Gồm 3 cạnh: Vẻ bề ngoài, Công thở và Tuần hoàn da.","signs":["Vẻ bề ngoài: trạng thái tinh thần (tri giác)","Vẻ bề ngoài: trương lực cơ","Vẻ bề ngoài: tư thế cơ thể","Thở: cử động lồng ngực quan sát được","Thở: công thở (bình thường/tăng công thở)","Tuần hoàn: màu sắc da"],"tasks":[{"task":"Quan sát vẻ bề ngoài","actions":["Đánh giá trạng thái tinh thần/tri giác của trẻ","Đánh giá trương lực cơ (mềm nhũn hay bình thường)","Đánh giá tư thế cơ thể (tư thế tự chọn, tư thế bất thường)"]},{"task":"Quan sát nhịp thở","actions":["Nhìn cử động lồng ngực/bụng có thấy được không","Đánh giá công thở: bình thường hay tăng (rút lõm, phập phồng cánh mũi, thở rên)"]},{"task":"Quan sát tuần hoàn da","actions":["Đánh giá màu sắc da: hồng, tái, nổi vân tím, tím trung ương"]}],"drugs":[],"causes":[],"notes":["Tam giác đánh giá nhi khoa được sử dụng với sự cho phép của Viện Hàn lâm Nhi khoa Hoa Kỳ, chương trình Giáo dục nhi khoa dành cho các chuyên gia tiền nhập viện (PEPP), bản quyền 2000.","Một phần nội dung trang này đã bị lược bỏ do hạn chế bản quyền."],"tables":[],"grp":"ped"},{"id":"ped-cardiac-arrest","no":2,"short":"Ngừng tim trẻ em","title":"Ngừng tim ở trẻ em","definition":"Trẻ mất ý thức, không đáp ứng, không thở bình thường và không có mạch trung tâm. Xử trí theo phác đồ PALS: ép tim chất lượng cao, thông khí, adrenalin và khử rung khi có chỉ định.","signs":["Mất ý thức, không đáp ứng","Ngừng thở hoặc thở ngáp","Không bắt được mạch trung tâm trong vòng 10 giây","Nhịp trên monitor: rung thất (VF), nhanh thất (VT) vô mạch, vô tâm thu hoặc hoạt động điện vô mạch (PEA)"],"tasks":[{"task":"Xử trí ban đầu chung","actions":["Kêu cứu, kích hoạt phản ứng khẩn cấp","Bắt đầu hồi sinh tim phổi, cung cấp oxy","Gắn máy khử rung/monitor ngay khi có"]},{"task":"VF hoặc VT vô mạch","actions":["Khử rung 2 J/kg, tiếp tục CPR ngay lập tức (2 phút, tỷ lệ 15:2)","Đặt đường truyền tĩnh mạch hoặc trong xương","Vẫn còn VF/VT: sốc 4 J/kg, tiếp tục CPR × 2 phút","Adrenalin 0,01 mg/kg TM/trong xương (1:10.000; 0,1 mL/kg) mỗi 3-5 phút HOẶC qua NKQ 0,1 mg/kg (1:1000; 0,1 mL/kg)","Xem xét đường thở nâng cao (ống NKQ, đường thở trên thanh môn): thở 8-10 lần/phút, không ngắt quãng ép tim","Vẫn còn VF/VT: sốc ≥4 J/kg (tối đa 10 J/kg hoặc liều người lớn), tiếp tục CPR × 2 phút","Amiodaron 5 mg/kg TM/trong xương, có thể lặp lại 2 lần nữa","Xác minh vị trí/tiếp xúc của bản cực (má điện cực)","Xác định và điều trị nguyên nhân","Nếu có tuần hoàn tự nhiên trở lại (mạch, huyết áp, PETCO2 ≥40 mmHg): tiến hành chăm sóc sau ngừng tim"]},{"task":"Vô tâm thu / PEA","actions":["Tiếp tục CPR ngay lập tức (2 phút, tỷ lệ 15:2)","Đưa đường truyền tĩnh mạch hoặc trong xương","Adrenalin 0,01 mg/kg TM/trong xương (1:10.000; 0,1 mL/kg) mỗi 3-5 phút HOẶC qua NKQ 0,1 mg/kg (1:1000; 0,1 mL/kg)","Xem xét đường thở nâng cao (ống NKQ, đường thở trên thanh môn): thở 8-10 lần/phút, phối hợp với ép tim liên tục","Theo dõi capnography: nếu PETCO2 <15 mmHg thì cải thiện chất lượng CPR","Nếu chuyển sang VF/VT: chuyển sang nhánh phác đồ VF/VT","Nếu không: CPR × 2 phút, lặp lại adrenalin như trên","Xác định và điều trị nguyên nhân"]}],"drugs":[{"name":"Adrenalin (Epinephrine) TM/trong xương","adult":"0,01 mg/kg IV/IO (1:10.000, 0,1 mL/kg) cứ 3-5 phút","amount":null,"amountLo":null,"amountHi":null,"unit":"mg","route":"TM/trong xương","repeat":"mỗi 3-5 phút","perKg":0.01,"perKgHi":null,"perKgUnit":"mg/kg","pedPerKg":null,"pedUnit":null,"pedMax":1,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Dung dịch 1:10.000 (0,1 mg/mL), tương ứng 0,1 mL/kg"},{"name":"Adrenalin (Epinephrine) qua ống nội khí quản","adult":"ET: 0,1 mg/kg (1:1000, 0,1 mL/kg)","amount":null,"amountLo":null,"amountHi":null,"unit":"mg","route":"qua ống nội khí quản","repeat":"mỗi 3-5 phút","perKg":0.1,"perKgHi":null,"perKgUnit":"mg/kg","pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Dung dịch 1:1000 (1 mg/mL), tương ứng 0,1 mL/kg"},{"name":"Amiodaron","adult":"Amiodarone: 5 mg/kg IV/IO; có thể lặp lại hai lần","amount":null,"amountLo":null,"amountHi":null,"unit":"mg","route":"TM/trong xương","repeat":"có thể lặp lại 2 lần","perKg":5,"perKgHi":null,"perKgUnit":"mg/kg","pedPerKg":null,"pedUnit":null,"pedMax":300,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Dùng trong VF/VT vô mạch kháng trị sau sốc điện"},{"name":"Khử rung - sốc lần 1","adult":"Khử rung tim 2 J/kg","amount":null,"amountLo":null,"amountHi":null,"unit":"J","route":"sốc điện không đồng bộ","repeat":"một lần, sau đó CPR 2 phút","perKg":2,"perKgHi":null,"perKgUnit":"J/kg","pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Ngay sau sốc tiếp tục CPR 2 phút, tỷ lệ 15:2"},{"name":"Khử rung - sốc lần 2","adult":"Sốc 4 J/kg","amount":null,"amountLo":null,"amountHi":null,"unit":"J","route":"sốc điện không đồng bộ","repeat":"sau CPR 2 phút","perKg":4,"perKgHi":null,"perKgUnit":"J/kg","pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":""},{"name":"Khử rung - các sốc tiếp theo","adult":"Sốc ≥4 J/kg (tối đa 10 J/kg hoặc liều người lớn)","amount":null,"amountLo":null,"amountHi":null,"unit":"J","route":"sốc điện không đồng bộ","repeat":"mỗi 2 phút CPR","perKg":4,"perKgHi":10,"perKgUnit":"J/kg","pedPerKg":null,"pedUnit":null,"pedMax":360,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Không vượt quá liều người lớn"}],"causes":["Thiếu oxy (Hypoxia)","Nhiễm toan (H+ - toan máu)","Giảm thể tích máu (Hypovolemia)","Ngộ độc (độc chất)","Tăng/hạ kali máu","Hạ thân nhiệt","Chèn ép tim cấp","Tràn khí màng phổi áp lực","Huyết khối phổi (thuyên tắc phổi)","Huyết khối động mạch vành"],"notes":["*Sau khi đặt đường thở nâng cao, hãy thổi ngạt 8-10 lần/phút trong khi thực hiện CPR liên tục.","Tỷ lệ ép tim/thổi ngạt 15:2 khi có 2 người cấp cứu.","Theo dõi PETCO2: nếu <15 mmHg cần cải thiện chất lượng ép tim.","ROSC gợi ý khi có mạch, huyết áp, PETCO2 ≥40 mmHg."],"tables":[],"grp":"ped"},{"id":"ped-bradycardia","no":3,"short":"Nhịp chậm trẻ em","title":"Nhịp tim chậm ở trẻ em (có mạch nhưng có triệu chứng)","definition":"Nhịp tim chậm kèm dấu hiệu giảm tưới máu ở trẻ, thường là hậu quả của tình trạng thiếu oxy. Ưu tiên hàng đầu là hỗ trợ hô hấp và oxy hóa trước khi dùng thuốc.","signs":["Thay đổi trạng thái tinh thần","Hạ huyết áp","Dấu hiệu sốc / tưới máu kém","Nhịp tim chậm dưới mức bình thường theo tuổi"],"tasks":[{"task":"Xử trí ban đầu","actions":["Duy trì đường thở, cung cấp oxy, thông khí hỗ trợ nếu cần","Gắn monitor ECG, đo huyết áp và SpO2","Lập đường truyền tĩnh mạch hoặc trong xương","Ghi ECG 12 chuyển đạo (nhưng không được trì hoãn điều trị)","Điều trị các nguyên nhân có thể hồi phục"]},{"task":"Đánh giá: có tổn thương tim mạch nghiêm trọng không?","actions":["Tìm dấu hiệu: thay đổi trạng thái tinh thần, hạ huyết áp, sốc","NẾU KHÔNG: hỗ trợ ABC, cho thở oxy, quan sát, tham khảo ý kiến chuyên gia"]},{"task":"Nếu CÓ tổn thương tim mạch nghiêm trọng","actions":["Bắt đầu CPR nếu nhịp tim <60 lần/phút mặc dù đã oxy hóa và thông khí tốt","Đánh giá lại sau 2 phút hồi sức: còn nhịp chậm không?","Kiểm tra lại đường thở, nguồn oxy, sự thông khí đầy đủ","Adrenalin 0,01 mg/kg TM/trong xương (1:10.000; 0,1 mL/kg) mỗi 3-5 phút HOẶC qua NKQ 0,1 mg/kg (1:1000; 0,1 mL/kg)","Atropin 0,02 mg/kg TM/trong xương HOẶC qua NKQ 0,04-0,06 mg/kg — dùng khi nhịp chậm do cường phó giao cảm hoặc block nhĩ thất nguyên phát","Cân nhắc đặt máy tạo nhịp","Nếu xảy ra ngừng tim, chuyển sang phác đồ Ngừng tim ở trẻ em"]}],"drugs":[{"name":"Adrenalin (Epinephrine)","adult":"Epinephrine: 0,01 mg/kg IV/IO (1:10.000, 0,1 mL/kg) cứ sau 3-5 phút HOẶC ET: 0, p đường truyền tĩnh mạch/trong xương","Ghi ECG 12 chuyển đạo (nhưng không trì hoãn điều trị)","Điều trị các nguyên nhân có thể hồi phục","Đo thời gian QRS để phân nhánh xử trí"]},{"task":"QRS hẹp ≤0,09 giây — Nhịp nhanh xoang","actions":["Bệnh sử phù hợp với nguyên nhân gây nhịp nhanh","Sóng P bình thường, hiện diện","Khoảng RR thay đổi, PR hằng định","Nhũ nhi: tần số thường <220 lần/phút","Trẻ lớn: tần số thường <180 lần/phút","Điều trị nguyên nhân có thể hồi phục"]},{"task":"QRS hẹp ≤0,09 giây — Nhịp nhanh trên thất (SVT)","actions":["Bệnh sử không phù hợp, khởi phát/kết thúc đột ngột","Sóng P không có hoặc bất thường","Tần số tim không thay đổi theo hoạt động","Nhũ nhi: tần số thường ≥220 lần/phút","Trẻ lớn: tần số thường ≥180 lần/phút","Thực hiện nghiệm pháp kích thích phó giao cảm (không trì hoãn điều trị)","Adenosin 0,1 mg/kg TM nhanh/trong xương (liều tối đa 6 mg)","Có thể lặp lại với liều 0,2 mg/kg (liều tối đa 12 mg)","HOẶC chuyển nhịp đồng bộ 0,5-1,0 J/kg; có thể tăng lên 2 J/kg nếu liều ban đầu không hiệu quả; dùng an thần nếu có thể nhưng không được trì hoãn chuyển nhịp","Tham khảo ý kiến chuyên gia"]},{"task":"QRS rộng >0,09 giây — Bệnh nhân KHÔNG ổn định","actions":["Dấu hiệu: hạ huyết áp, sốc, thay đổi tri giác (AMS)","Nghĩ đến nhịp nhanh thất (VT)","Chuyển nhịp đồng bộ 0,5-1,0 J/kg; có thể tăng lên 2 J/kg nếu liều ban đầu không hiệu quả","Dùng thuốc an thần nếu có thể, nhưng không được trì hoãn việc chuyển nhịp","Tham khảo ý kiến chuyên gia"]},{"task":"QRS rộng >0,09 giây — Bệnh nhân ổn định","actions":["Xem xét adenosin 0,1 mg/kg TM nhanh/trong xương (tối đa 6 mg) nếu QRS đơn hình dạng đều","HOẶC amiodaron 5 mg/kg truyền tĩnh mạch trong 20-60 phút","HOẶC procainamid 15 mg/kg truyền tĩnh mạch trong 30-60 phút","Tham khảo ý kiến chuyên gia"]}],"drugs":[{"name":"Adenosin - liều 1","adult":"Adenosine: 0,1 mg/kg IVP/IO (liều tối đa 6 mg)","amount":null,"amountLo":null,"amountHi":null,"unit":"mg","route":"TM nhanh/trong xương","repeat":"có thể lặp lại với liều 0,2 mg/kg","perKg":0.1,"perKgHi":null,"perKgUnit":"mg/kg","pedPerKg":null,"pedUnit":null,"pedMax":6,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Tiêm nhanh, đẩy nhanh bằng nước muối sinh lý"},{"name":"Adenosin - liều 2","adult":"Có thể lặp lại với liều 0,2 mg/kg (liều tối đa 12 mg)","amount":null,"amountLo":null,"amountHi":null,"unit":"mg","route":"TM nhanh/trong xương","repeat":"một lần","perKg":0.2,"perKgHi":null,"perKgUnit":"mg/kg","pedPerKg":null,"pedUnit":null,"pedMax":12,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":""},{"name":"Chuyển nhịp đồng bộ","adult":"0,5-1,0 J/kg; có thể tăng lên 2 J/kg nếu liều ban đầu không hiệu quả","amount":null,"amountLo":null,"amountHi":null,"unit":"J","route":"sốc điện đồng bộ","repeat":"tăng lên 2 J/kg nếu liều đầu không hiệu quả","perKg":0.5,"perKgHi":1,"perKgUnit":"J/kg","pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Dùng an thần nếu có thể, nhưng không được trì hoãn chuyển nhịp"},{"name":"Amiodaron","adult":"Amiodarone: 5 mg/kg truyền tĩnh mạch trong 20-60 phút","amount":null,"amountLo":null,"amountHi":null,"unit":"mg","route":"truyền tĩnh mạch trong 20-60 phút","repeat":null,"perKg":5,"perKgHi":null,"perKgUnit":"mg/kg","pedPerKg":null,"pedUnit":null,"pedMax":300,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Dùng cho nhịp nhanh QRS rộng ở bệnh nhân ổn định"},{"name":"Procainamid","adult":"Procainamide: 15 mg/kg IV trong 30-60 phút","amount":null,"amountLo":null,"amountHi":null,"unit":"mg","route":"truyền tĩnh mạch trong 30-60 phút","repeat":null,"perKg":15,"perKgHi":null,"perKgUnit":"mg/kg","pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Không dùng phối hợp thường quy với amiodaron"}],"causes":["Thiếu oxy","Nhiễm toan","Giảm thể tích máu","Ngộ độc (độc chất)","Hạ đường huyết","Tăng/hạ kali máu","Hạ thân nhiệt","Huyết khối phổi","Tràn khí màng phổi áp lực","Chèn ép tim cấp","Huyết khối động mạch vành"],"notes":["Ngưỡng phân biệt: QRS hẹp ≤0,09 giây; QRS rộng >0,09 giây.","Nhũ nhi: nhịp nhanh xoang thường <220 lần/phút, SVT thường ≥220 lần/phút.","Trẻ lớn: nhịp nhanh xoang thường <180 lần/phút, SVT thường ≥180 lần/phút."],"tables":[],"grp":"ped"},{"id":"ped-septic-shock","no":5,"short":"Sốc nhiễm trùng","title":"Sốc nhiễm trùng ở trẻ em","definition":"Nhiễm trùng huyết kèm rối loạn tuần hoàn ở trẻ, biểu hiện bằng thay đổi tri giác và tưới máu kém. Cần hồi sức dịch tích cực, kháng sinh sớm và thuốc vận mạch theo mục tiêu trong giờ đầu tiên.","signs":["Thay đổi trạng thái tinh thần","Tưới máu kém (refill kéo dài, da nổi vân, chi lạnh hoặc ấm)","Hạ huyết áp","ScvO2 <70%","Sốc ấm (hạ huyết áp kèm giãn mạch) hoặc sốc lạnh (co mạch, tưới máu ngoại vi kém)"],"tasks":[{"task":"Nhận biết và xử trí ban đầu","actions":["Nhận biết tình trạng thay đổi tri giác và tưới máu kém","Cung cấp oxy, hỗ trợ hô hấp","Bắt đầu lập đường truyền tĩnh mạch/trong xương","Hồi sức theo phác đồ PALS","Xét nghiệm: khí máu (VBG hoặc ABG), lactat, glucose, canxi ion hóa, cấy máu, công thức máu (CBC)"]},{"task":"Giờ đầu tiên - hồi sức dịch","actions":["Tiêm tĩnh mạch/trong xương nhiều lần với liều 20 mL/kg dịch tinh thể","Tối đa 3-4 lần bolus, có thể nhiều hơn nếu có ran ẩm, suy hô hấp hoặc gan to","Điều chỉnh hạ đường huyết và hạ canxi máu","Dùng kháng sinh ngay lập tức","Xem xét truyền thuốc co mạch ngay (bắt đầu qua đường TM/trong xương thứ hai)","Cân nhắc dùng hydrocortison liều cao (lấy cortisol nền trước; cân nhắc test kích thích ACTH). Nếu nghi ngờ suy tuyến thượng thận: hydrocortison bolus TM/trong xương 2 mg/kg (tối đa 100 mg)"]},{"task":"Nếu tưới máu KHÔNG cải thiện sau truyền dịch","actions":["Bắt đầu thuốc vận mạch (chuẩn độ theo tình trạng hạ huyết áp và tưới máu kém); xem xét đặt catheter tĩnh mạch trung tâm","Mục tiêu: ScvO2 >70%","Huyết áp bình thường: bắt đầu dopamin 2-20 mcg/kg/phút","Sốc ấm (hạ huyết áp và giãn mạch): bắt đầ mcg/kg/phút"},{"name":"Lidocain (truyền)","adult":"LIDOCAINE DRIP (dùng dung dịch 2%, 20 mg/mL) liều lượng: 20-50 mcg/kg/phút. Để pha trộn: thêm 300 mg (15 mL) vào 250 mL D5W. 1 microdrop/kg/phút dung dịch này là 20 mcg/kg/phút.","amount":null,"amountLo":null,"amountHi":null,"unit":"mcg","route":"truyền tĩnh mạch liên tục","repeat":null,"perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":20,"infusionHi":50,"infusionUnit":"mcg/kg/phút","note":"Pha 300 mg (15 mL) dung dịch 2% vào 250 mL D5W: 1 microdrop/kg/phút = 20 mcg/kg/phút"},{"name":"Nitroprussid","adult":"NITROPRUSSIDE (pha 50 mg với 5 mL D5W) liều dùng: 1-8 mcg/kg/phút. Để pha trộn: thêm 15 mg (1,5 mL) vào 250 mL D5W. 1 microdrop/kg/phút dung dịch này là 0,5 mcg/kg/phút.","amount":null,"amountLo":null,"amountHi":null,"unit":"mcg","route":"truyền tĩnh mạch liên tục","repeat":null,"perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":1,"infusionHi":8,"infusionUnit":"mcg/kg/phút","note":"Pha 50 mg với 5 mL D5W, lấy 15 mg (1,5 mL) vào 250 mL D5W: 1 microdrop/kg/phút = 0,5 mcg/kg/phút"}],"causes":[],"notes":["Vì mục đích đo lường cho trẻ em, cuốn sách này có chiều dài khoảng 11 inch khi mở ra.","1 microdrop = 1/60 mL (bộ dây truyền 60 giọt/mL)."],"tables":[],"grp":"ped"},{"id":"ped-trauma-score","no":8,"short":"Điểm chấn thương","title":"Điểm chấn thương nhi khoa (Pediatric Trauma Score)","definition":"Thang điểm phân loại mức độ nặng của chấn thương ở trẻ em gồm 6 tiêu chí, mỗi tiêu chí cho +2, +1 hoặc -1 điểm. Tổng điểm giúp tiên lượng tử vong và quyết định chuyển tuyến.","signs":["Kích thước (cân nặng) bệnh nhân","Tình trạng đường thở","Tình trạng thần kinh trung ương","Huyết áp tâm thu hoặc chất lượng mạch","Vết thương hở","Tổn thương xương"],"tasks":[{"task":"Cách tính điểm","actions":["Cho điểm từng tiêu chí trong 6 tiêu chí: +2, +1 hoặc -1","Cộng tổng điểm (dao động từ -6 đến +12)","Diễn giải kết quả để quyết định chuyển tuyến"]}],"drugs":[],"causes":[],"notes":[">12 = tỷ lệ tử vong <3%, thường tổn thương tối thiểu hoặc không có thương tích","≤8 = Chấn thương nghiêm trọng, cần chuyển đến Trung tâm chấn thương nhi khoa","4 = Dự đoán tỷ lệ tử vong khoảng 50%","<1 = Dự đoán tỷ lệ tử vong >98%"],"tables":[{"title":"Điểm chấn thương nhi khoa","headers":["Tiêu chí","+2","+1","-1","Điểm"],"rows":[["Kích thước bệnh nhân",">20 kg","10-20 kg","<10 kg",""],["Đường thở","Bình thường","Có thể duy trì mà không cần các thủ thuật xâm lấn","Không thể duy trì, cần các thủ thuật xâm lấn",""],["Hệ thần kinh trung ương","Tỉnh táo","Lơ mơ / mất tri giác thoáng qua","Hôn mê",""],["Huyết áp tâm thu (mmHg) (hoặc mạch)",">90 (bắt được mạch quay)","50-90 (chỉ bắt được mạch bẹn)","<50 (không bắt được mạch)",""],["Vết thương hở","Không có","Nhỏ","Lớn hoặc xuyên thấu",""],["Tổn thương xương","Không có","Gãy xương kín","Gãy xương hở/nhiều chỗ",""],["Tổng cộng","","","",""]]}],"grp":"ped"},{"id":"ped-intraosseous","no":9,"short":"Truyền trong xương","title":"Truyền dịch trong xương (Intraosseous)","definition":"Kỹ thuật thiết lập đường truyền cấp cứu qua tủy xương khi không lấy được đường tĩnh mạch. Vị trí ưu tiên ở trẻ em là mặt trước trong đầu trên xương chày.","signs":[],"tasks":[{"task":"Kỹ thuật đặt kim trong xương","actions":["Xác định vị trí: mặt trước trong (phẳng) của xương chày, cách củ xương chày 2 cm, bên dưới đĩa tăng trưởng. Các vị trí khác: mặt trước xương đùi đoạn xa, mắt cá trong, mào chậu","Sát trùng vùng chọc bằng dung dịch sát khuẩn","Tiến kim trong xương ở góc 90° qua da, cân và xương, với áp lực liên tục và chuyển động xoáy","Hướng kim hơi xa khỏi đĩa sụn tăng trưởng","Cảm giác mất sức cản (\"tiếng lạo xạo\") khi kim vào tới tủy xương","Thử hút tủy xương (có thể hút được hoặc không)","Truyền dịch và kiểm tra xem có thấm dịch không; ngừng truyền nếu vị trí truyền bị thấm dịch hoặc thuốc; ấn băng tay vào vị trí truyền rồi băng ép","Cố định kim trong xương, dán băng dính và gắn vào bơm truyền tĩnh mạch"]}],"drugs":[],"causes":[],"notes":["LƯU Ý: Hầu hết các loại thuốc, chế phẩm máu hoặc dung dịch có thể dùng qua đường tĩnh mạch đều có thể dùng qua đường trong xương."],"tables":[],"grp":"ped"},{"id":"ped-general-assessment","no":10,"short":"Đánh giá chung","title":"Đánh giá chung các cấp cứu nhi khoa","definition":"Quy trình đánh giá nhanh đường thở - hô hấp - tuần hoàn - tri giác ở trẻ cấp cứu, kèm các lưu ý đặc thù của nhi khoa.","signs":["Đường thở: tắc nghẽn, chảy nước dãi, chấn thương, phù nề","Thở: tần số thở, thông khí có hiệu quả không, cử động lồng ngực","Tuần hoàn: nhịp tim, thời gian đổ đầy mao mạch","Trạng thái tinh thần: trẻ có hoạt động bình thường không","Sốt, màu da"],"tasks":[{"task":"Đánh giá ABC","actions":["Đường thở: kiểm tra tắc nghẽn, chảy nước dãi, chấn thương, phù nề","Thở: có thở gắng sức không? Tốc độ hô hấp? Thông khí có hiệu quả? Cử động lồng ngực?","Tuần hoàn: nhịp tim? Thời gian đổ đầy mao mạch?","Nhịp tim chậm ở trẻ đồng nghĩa với thiếu oxy — phải thông khí ngay!"]},{"task":"Đánh giá trạng thái tinh thần và bệnh sử","actions":["Hỏi bệnh sử: khởi phát, lượng thức ăn đưa vào, thói quen tiêu hóa","Khám: sốt? màu da? các phát hiện khác?","Trẻ bị sốc cần được điều trị tích cực"]},{"task":"Xử trí và theo dõi","actions":["Thông khí; đánh giá lại đường thở, đặc biệt trong quá trình vận chuyển","Kiểm tra đường huyết mao mạch (CBG), cân nhắc dùng naloxon","Thử thách truyền dịch tĩnh mạch 20 mL/kg, lặp lại nếu cần. Không đợi đến khi huyết áp giảm — hạ huyết áp là dấu hiệu muộn","Vận chuyển nhanh đến cơ sở chăm sóc đặc biệt nhi khoa"]}],"drugs":[{"name":"Dịch tinh thể (thử thách dịch)","adult":"Thử thách truyền dịch tĩnh mạch (20 mL/kg-lặp lại nếu cần thiết)","amount":null,"amountLo":null,"amountHi":null,"unit":"mL","route":"TM/trong xương","repeat":"lặp lại nếu cần thiết","perKg":20,"perKgHi":null,"perKgUnit":"mL/kg","pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"K /* ==================== HIỂN THỊ ==================== */
function doseFor(it){
  let d = it.a;
  if(isPed() && it.p) d = it.p;
  else if(isElder() && it.eld) d = it.eld;
  return d;
}

function renderDerived(){
  const el = $("derived"); const b = bmi();
  if(P.wt <= 0){ el.innerHTML = '<span class="chip w">Nhập cân nặng để bắt đầu tính liều</span>'; return; }
  const parts = [
    `<span class="chip">TBW ${sig(P.wt)} kg</span>`,
    `<span class="chip">IBW ${sig(IBW())} kg</span>`,
    `<span class="chip">LBW ${sig(LBW())} kg</span>`,
    `<span class="chip">AdjBW ${sig(AdjBW())} kg</span>`,
    `<span class="chip g">BMI ${sig(b)}</span>`,
    `<span class="chip g">BSA ${sig(BSA())} m²</span>`
  ];
  if(isPed())   parts.push('<span class="chip w">Nhi khoa</span>');
  if(isNeo())   parts.push('<span class="chip w">Sơ sinh</span>');
  if(isElder()) parts.push('<span class="chip w">Cao tuổi — giảm liều</span>');
  if(isObese()) parts.push('<span class="chip w">Béo phì — chú ý cân nặng tính liều</span>');
  el.innerHTML = parts.join("") + pedVitalsBar();
}

/* Trị số sinh tồn bình thường theo tuổi (PALS/APLS) — chỉ hiện khi là trẻ em.
   Mỗi mốc: tuổi tối đa (năm), nhãn, nhịp tim, nhịp thở, HA tâm thu bình thường. */
const PED_VITALS = [
  {max:1/12,  g:"Sơ sinh",        hr:"100–205", rr:"30–60", sbp:"67–84"},
  {max:1,     g:"Nhũ nhi",        hr:"100–180", rr:"30–53", sbp:"72–104"},
  {max:3,     g:"Trẻ 1–3 tuổi",   hr:"98–140",  rr:"22–37", sbp:"86–106"},
  {max:6,     g:"Trẻ 3–6 tuổi",   hr:"80–120",  rr:"20–28", sbp:"89–112"},
  {max:12,    g:"Trẻ 6–12 tuổi",  hr:"75–118",  rr:"18–25", sbp:"97–120"},
  {max:18,    g:"Trẻ 12–18 tuổi", hr:"60–100",  rr:"12–20", sbp:"110–131"}
];
function pedVitals(){
  for(const v of PED_VITALS) if(P.ageY < v.max) return v;
  return null;
}
/* Huyết áp tâm thu tối thiểu chấp nhận được (ngưỡng tụt huyết áp theo PALS) */
function pedMinSBP(){
  const a = P.ageY;
  if(a < 1/12) return 60;
  if(a < 1)    return 70;
  if(a < 10)   return 70 + 2*Math.floor(a);
  return 90;
}
function pedVitalsBar(){
  if(!isPed()) return "";
  const v = pedVitals(); if(!v) return "";
  return `<div class="pedvit">
    <span class="pv-t">${v.g} — trị số bình thường</span>
    <span class="pv"><b>Nhịp tim</b> ${v.hr} l/ph</span>
    <span class="pv"><b>Nhịp thở</b> ${v.rr} l/ph</span>
    <span class="pv"><b>HA tâm thu</b> ${v.sbp} mmHg</span>
    <span class="pv danger"><b>Ngưỡng tụt HA</b> tâm thu &lt; ${pedMinSBP()} mmHg</span>
    <span class="pv"><b>Nước tiểu</b> ${isInfant()?"2":"1–2"} mL/kg/h = ${sig((isInfant()?2:1)*P.wt)}${isInfant()?"":"–"+sig(2*P.wt)} mL/h</span>
  </div>`;
}

const IND_DOSE = {};   // liều mg/kg người dùng tự gõ, theo khoá "nhóm-mục"
const IND_FLAT = {};   // tra nhanh thuốc theo khoá "nhóm-mục"

/* Tính lại các con số của MỘT dòng thuốc, KHÔNG vẽ lại cả tab.
   Vẽ lại cả tab sẽ thay mới ô đang gõ, khiến không nhập được số thập phân
   dạng "0.3" (vì lúc gõ tới "0." thì giá trị tạm bằng 0 và bị xoá trắng). */
function indNumbers(it, key){
  const [lo,hi] = doseFor(it);
  const w = W(it.basis);
  const sel = IND_DOSE[key];
  const picked = (sel != null && isFinite(sel) && sel > 0);
  const perKg = picked ? sel : null;
  const offRange = picked && (sel < lo || sel > hi);

  let dLo, dHi, capped = false;
  if(picked){ dLo = dHi = perKg*w; } else { dLo = lo*w; dHi = hi*w; }
  if(it.max && dHi > it.max){ dHi = it.max; capped = true; if(dLo>it.max) dLo = it.max; }

  const basisTxt = {TBW:"cân nặng thực",LBW:"cân nặng nạc",IBW:"cân nặng lý tưởng",ADJ:"cân nặng hiệu chỉnh"}[it.basis];
  return {
    dose: rng(dLo, dHi, it.u),
    vol : it.conc ? `<b>${rng(dLo/it.conc, dHi/it.conc, "mL")}</b> @ ${it.conc} ${it.concLabel}` : "",
    sub : `${picked ? sig(perKg) : (lo===hi?sig(lo):sig(lo)+"–"+sig(hi))} ${it.unitPerKg} × ${sig(w)} kg (${basisTxt})`
        + (capped   ? ` · <b>giới hạn tối đa ${it.max} ${it.u}</b>` : "")
        + (offRange ? ` · <b style="color:var(--warn)">ngoài khoảng khuyến cáo ${sig(lo)}–${sig(hi)} ${it.unitPerKg}</b>` : "")
        + (it.note  ? `<br>${it.note}` : ""),
    lo, hi
  };
}

function updateIndRow(key){
  const it = IND_FLAT[key]; if(!it) return;
  const n = indNumbers(it, key);
  const d = document.querySelector(`[data-dose="${key}"]`);
  const v = document.querySelector(`[data-vol="${key}"]`);
  const s = document.querySelector(`[data-sub="${key}"]`);
  if(d) d.textContent = n.dose;
  if(v) v.innerHTML  = n.vol;
  if(s) s.innerHTML  = n.sub;
}

function drugRow(it, key){
  const n = indNumbers(it, key);
  const sel = IND_DOSE[key];
  return `<div class="drug">
    <div class="dhead"><span class="nm">${it.n}</span>
      <span class="pick"><input type="text" inputmode="decimal" placeholder="—"
        value="${sel != null ? sel : ""}" data-ind="${key}" class="inddose"><span class="pu">${it.unitPerKg}</span></span>
      <span class="dose" data-dose="${key}">${n.dose}</span></div>
    <div class="vol" data-vol="${key}">${n.vol}</div>
    <div class="sub" data-sub="${key}">${n.sub}</div></div>`;
}

function renderInduction(){
  let h = `<div class="banner warn">Liều gợi ý cho người bệnh ổn định. Giảm liều khi giảm thể tích tuần hoàn, suy tim, cao tuổi, ASA III–IV. Luôn chuẩn độ theo đáp ứng.
    Gõ một liều cụ thể vào ô ở giữa để ra đúng một con số; để trống sẽ hiện cả khoảng.</div>`;
  INDUCTION.forEach((grp,gi) => {
    h += `<div class="card"><h2>${grp.g}</h2>`
       + grp.items.map((it,ii) => { const k = gi+"-"+ii; IND_FLAT[k] = it; return drugRow(it, k); }).join("")
       + `</div>`;
  });
  $("p-induction").innerHTML = h;
  $("p-induction").querySelectorAll(".inddose").forEach(inp => inp.addEventListener("input", e => {
    const k = e.target.dataset.ind;
    const raw = e.target.value.replace(",", ".").trim();   // chấp nhận cả dấu phẩy thập phân
    const val = parseFloat(raw);
    IND_DOSE[k] = (raw === "" || !isFinite(val)) ? null : val;
    updateIndRow(k);                                        // chỉ cập nhật đúng dòng đó
  }));
}

/* Mỗi thuốc truyền: người dùng tự nhập LƯỢNG THUỐC (mg) và THỂ TÍCH DUNG DỊCH (mL)
   → app tính nồng độ pha → nhập liều muốn chạy → ra tốc độ mL/giờ. */
const INF_MIX  = {};   // {i: {mg, ml}} — cách pha do người dùng sửa
const INF_DOSE = {};   // {i: liều muốn chạy}

const unitMass = du => du.trim().split("/")[0];          // "mcg" hoặc "mg"
const perMinute = du => /phút/.test(du);
const perKgDose = du => /\/kg/.test(du);          // vasopressin tính theo đơn vị/phút, không theo cân nặng

function infConc(f, i){                                   // trả về nồng độ theo đơn vị của liều
  const mix = INF_MIX[i] || {};
  const mg = mix.mg != null ? mix.mg : f.mg;
  const ml = mix.ml != null ? mix.ml : f.ml;
  if(!(mg > 0) || !(ml > 0)) return {mg, ml, cMgMl:0, c:0, unit:unitMass(f.du)+"/mL"};
  const cMgMl = mg/ml;
  const u = unitMass(f.du);
  return {mg, ml, cMgMl, c: u === "mcg" ? cMgMl*1000 : cMgMl, unit: u+"/mL"};
}

function infRate(f, i){
  const {c} = infConc(f, i);
  const w = perKgDose(f.du) ? W(f.basis) : 1;
  const k = perMinute(f.du) ? 60 : 1;
  const sel = INF_DOSE[i];
  if(!(c > 0) || !(w > 0)) return {txt:"—", sub:""};
  if(sel != null && isFinite(sel) && sel > 0){
    const off = (sel < f.lo || sel > f.hi);
    return {txt: sig(sel*w*k/c) + " mL/h",
            sub: off ? `<b style="color:var(--warn)">ngoài khoảng ${sig(f.lo)}–${sig(f.hi)} ${f.du}</b>` : ""};
  }
  return {txt: rng(f.lo*w*k/c, f.hi*w*k/c, "mL/h"), sub:""};
}

function updateInfCard(i){
  const f = INFUSIONS[i];
  const cc = infConc(f, i), rr = infRate(f, i);
  const cEl = document.querySelector(`[data-infconc="${i}"]`);
  const rEl = document.querySelector(`[data-infrate="${i}"]`);
  const sEl = document.querySelector(`[data-infsub="${i}"]`);
  if(cEl) cEl.textContent = cc.c > 0 ? sig(cc.c) + " " + cc.unit : "—";
  if(rEl) rEl.textContent = rr.txt;
  if(sEl) sEl.innerHTML = rr.sub;
}
function updateInfusionRates(){ INFUSIONS.forEach((f,i) => updateInfCard(i)); }

function renderInfusion(){
  let h = `<div class="banner warn">Nhập <b>lượng thuốc</b> và <b>thể tích dung dịch</b> đúng như bạn pha — app tự tính nồng độ rồi ra tốc độ bơm tiêm điện.
    Bỏ trống ô liều thì hiện cả khoảng; gõ một liều cụ thể thì ra đúng một tốc độ.</div>`;
  h += `<div class="card"><h2>Truyền liên tục — tốc độ mL/giờ</h2>`;
  INFUSIONS.forEach((f,i) => {
    const cc = infConc(f, i), rr = infRate(f, i);
    const sel = INF_DOSE[i];
    h += `<div class="inf">
      <div class="ihead"><span class="nm">${f.n}</span>
        <span class="dose"><span data-infrate="${i}">${rr.txt}</span></span></div>
      <div class="mixline">
        <span class="lbl">Pha</span>
        <input type="text" inputmode="decimal" class="infmg" data-infmg="${i}" value="${cc.mg}"><span class="u">${unitMass(f.du) === "đơn vị" ? "đơn vị" : "mg"}</span>
        <span class="lbl">trong</span>
        <input type="text" inputmode="decimal" class="infml" data-infml="${i}" value="${cc.ml}"><span class="u">mL</span>
        <span class="arrow">→</span>
        <b class="conc" data-infconc="${i}">${cc.c > 0 ? sig(cc.c)+" "+cc.unit : "—"}</b>
      </div>
      <div class="mixline">
        <span class="lbl">Liều chạy</span>
        <input type="text" inputmode="decimal" class="infdose" data-infdose="${i}" placeholder="—"
               value="${sel != null ? sel : ""}"><span class="u">${f.du}</span>
        <span class="rangehint">khuyến cáo ${sig(f.lo)}–${sig(f.hi)}</span>
      </div>
      <div class="sub" data-infsub="${i}">${rr.sub}</div>
      ${f.note ? `<div class="sub">${f.note}</div>` : ""}
    </div>`;
  });
  h += `<div class="note">Công thức: <b>mL/h = liều × cân nặng × hệ số thời gian ÷ nồng độ</b>
    (hệ số 60 nếu liều tính theo phút, 1 nếu theo giờ). Cân nặng dùng để tính ghi ở đầu trang.</div></div>`;
  $("p-infusion").innerHTML = h;

  const bind = (sel, fn) => $("p-infusion").querySelectorAll(sel).forEach(inp =>
    inp.addEventListener("input", e => {
      const v = e.target.value.replace(",", ".").trim();
      const n = parseFloat(v);
      fn(e.target.dataset, (v === "" || !isFinite(n)) ? null : n);
    }));

  bind(".infmg",   (d,v) => { INF_MIX[d.infmg] = Object.assign({}, INF_MIX[d.infmg], {mg:v}); updateInfCard(d.infmg); });
  bind(".infml",   (d,v) => { INF_MIX[d.infml] = Object.assign({}, INF_MIX[d.infml], {ml:v}); updateInfCard(d.infml); });
  bind(".infdose", (d,v) => { INF_DOSE[d.infdose] = v; updateInfCard(d.infdose); });
}
