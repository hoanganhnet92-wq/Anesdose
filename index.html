m thể tích tuần hoàn/xuất huyết (#12), suy tim phải (#24), chèn ép tĩnh mạch chủ dưới, thuốc giãn mạch","Sức co bóp cơ tim giảm: nhiễm toan, ngộ độc thuốc tê tại chỗ (#18), rối loạn nhịp tim, bệnh cơ tim, thuốc ức chế cơ tim, thiếu oxy máu (#17), thiếu máu cơ tim (#20)","Hậu gánh cao: hẹp van tim, tắc nghẽn đường ra thất trái (LVOT)","Dòng chảy xuôi thấp: hở van tim"],"notes":["Khung tư duy sinh lý: HA = SVR x CO; CO = HR x SV; SV phụ thuộc tiền gánh, sức co bóp và hậu gánh","Luôn phân tích theo thành phần nào của phương trình bị rối loạn để chọn điều trị đúng"],"short":"Tụt huyết áp","grp":"anes"},{"id":"last","no":18,"title":"Ngộ độc thuốc tê toàn thân (LAST)","definition":"Ngộ độc toàn thân do thuốc tê tại chỗ hấp thu quá mức hoặc tiêm nhầm vào mạch máu, biểu hiện bằng bất kỳ tổ hợp nào của triệu chứng thần kinh trung ương và/hoặc tim mạch. Nghi ngờ ở mọi bệnh nhân có rối loạn ý thức, co giật hoặc rối loạn huyết động sau khi dùng thuốc tê.","signs":["Triệu chứng thần kinh: co giật","Thay đổi tri giác / rối loạn ý thức","Ù tai","Vị kim loại trong miệng","Tê quanh miệng","Triệu chứng tim mạch: suy tim (giảm co bóp)","Tụt huyết áp","Loạn nhịp tim: ngoại tâm thu, nhịp chậm, ngừng tim, rung thất (VF), nhịp nhanh thất (VT)"],"tasks":[{"task":"Huy động nguồn lực (Crisis Resources)","actions":["Thông báo cho toàn bộ ê-kíp","Gọi hỗ trợ","Gọi lấy nhũ tương lipid 20% (Intralipid™) NGAY LẬP TỨC","Nếu huyết động không ổn định: cân nhắc gọi sớm ECMO hoặc tuần hoàn ngoài cơ thể (CPB)"]},{"task":"Ngừng tác nhân gây bệnh","actions":["Ngừng ngay mọi mũi tiêm hoặc truyền thuốc tê tại chỗ"]},{"task":"Hồi sinh tim phổi (CPR)","actions":["Nếu mất mạch: bắt đầu ép tim ngay. Có thể cần CPR kéo dài +/- ECMO","Thở oxy 100% với lưu lượng 10-15 L/phút","Bắt đầu nhũ tương lipid trước, sau đó đặt nội khí quản nếu cần"]},{"task":"Nhũ tương lipid 20% (điều trị đặc hiệu)","actions":["Bolus nhũ tương lipid 20%: 100 mL tiêm tĩnh mạch trong 2-3 phút (nếu cân nặng < 70 kg: bolus 1,5 mL/kg)","Sau đó truyền nhũ tương lipid 20%: 250 mL tĩnh mạch trong 15-20 phút (nếu < 70 kg: truyền 0,25 mL/kg/phút trong 20 phút)","Nếu vẫn không ổn định: lặp lại liều bolus và tăng gấp đôi tốc độ truyền cho đến khi ổn định","Tổng liều nhũ tương lipid 20% tối đa: 12 mL/kg","Khi đã ổn định, tiếp tục truyền duy trì thêm ít nhất 15 phút"]},{"task":"Nếu co giật — Tư thế và bảo vệ bệnh nhân","actions":["Đặt bệnh nhân nằm nghiêng, đầu thấp để tránh hít sặc","Phòng ngừa té ngã và chấn thương đầu","Cho benzodiazepin"]},{"task":"Nếu co giật — Thuốc cắt cơn","actions":["Cắt cơn co giật: midazolam 2-4 mg tiêm tĩnh mạch","Nếu co giật kháng trị: cho thuốc giãn cơ, ví dụ rocuronium","Nếu không có benzodiazepin và huyết áp ổn định: propofol 20 mg tiêm tĩnh mạch, có thể lặp lại cho đến khi cắt được cơn co giật"]},{"task":"Nếu co giật — Đường thở","actions":["Hỗ trợ hô hấp; đặt nội khí quản nếu cần"]},{"task":"Nếu loạn nhịp tim hoặc tụt huyết áp — Xử trí loạn nhịp","actions":["Nếu loạn nhịp dai dẳng: amiodarone 150 mg tiêm tĩnh mạch chậm trong 10-15 phút","TRÁNH thuốc chẹn kênh canxi, thuốc chẹn beta, thuốc tê tại chỗ (kể cả lidocaine) và bất kỳ thuốc tăng co bóp cơ tim liều cao nào"]},{"task":"Nếu loạn nhịp tim hoặc tụt huyết áp — Xử trí tụt huyết áp","actions":["Dùng adrenalin (epinephrine) LIỀU THẤP: bắt đầu 0,2-1 mcg/kg tiêm tĩnh mạch","TRÁNH vasopressin"]},{"task":"Nếu ngừng tim — CPR","actions":["Tần số ép tim 100-120 lần/phút, độ sâu ≥ 5 cm, cho phép lồng ngực nảy lại hoàn toàn","Cân nhắc dùng ván ép tim (backboard)","Duy trì EtCO2 > 10 mmHg và huyết áp tâm trương > 20 mmHg","Thay người ép tim và kiểm tra nhịp mỗi 2 phút","CHỈ bắt mạch khi có dấu hiệu tái lập tuần hoàn tự nhiên (ROSC): EtCO2 tăng đột ngột và duy trì, xuất hiện dạng sóng động mạch tự phát, thay đổi nhịp tim","Dán sẵn miếng đệm (pads) khử rung"]},{"task":"Nếu ngừng tim — Đường thở","actions":["Nếu thông khí bằng mặt nạ: tỷ lệ 30 lần ép tim / 2 lần thổi ngạt","Nếu đường thở đã được bảo đảm (nội khí quản): 10 lần thông khí/phút, thể tích khí lưu thông 6-7 mL/kg"]},{"task":"Nếu ngừng tim — Khử rung","actions":["Nếu rung thất (VF) hoặc nhịp nhanh thất (VT) mất mạch/không ổn định: khử rung ngay lập tức 120-200 J (máy hai pha) hoặc 360 J (máy một pha)","Tiếp tục ép tim ngay sau sốc điện","Có thể tăng mức năng lượng của các lần sốc điện lặp lại, mỗi 2 phút"]},{"task":"Nếu ngừng tim — Thuốc","actions":["Adrenalin (epinephrine) LIỀU THẤP: bắt đầu 0,2-1 mcg/kg tiêm tĩnh mạch","Nếu VF/VT không đáp ứng với khử rung: amiodarone 300 mg tiêm tĩnh mạch, có thể lặp lại 150 mg tiêm tĩnh mạch","TRÁNH lidocaine"]},{"task":"ECMO / CPB","actions":["Nếu cần CPR kéo dài: cân nhắc ECMO hoặc tuần hoàn ngoài cơ thể (bắc cầu tim phổi)"]},{"task":"Chăm sóc sau sự kiện","actions":["Tiếp tục theo dõi tại PACU/ICU tối thiểu: 2 giờ sau cơn co giật","6 giờ sau khi có mất ổn định huyết động","24-48 giờ sau ngừng tim"]},{"task":"Tham khảo","actions":["Khuyến cáo mới nhất của ASRA: http://www.asra.com"]}],"drugs":[{"name":"Nhũ tương lipid 20% (Intralipid™) - liều bolus","adult":"100 mL TM trong 2-3 phút (nếu < 70 kg: 1,5 mL/kg)","amount":100,"unit":"mL","route":"TM","repeat":"Lặp lại bolus nếu chưa ổn định","perKg":1.5,"perKgUnit":"mL/kg","pedPerKg":1.5,"pedUnit":"mL/kg","pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Tổng liều tối đa 12 mL/kg. Dùng bolus theo cân nặng lý tưởng khi < 70 kg."},{"name":"Nhũ tương lipid 20% (Intralipid™) - truyền duy trì","adult":"250 mL TM trong 15-20 phút (nếu < 70 kg: 0,25 mL/kg/phút trong 20 phút)","amount":250,"unit":"mL","route":"TM","repeat":"Tăng gấp đôi tốc độ truyền nếu chưa ổn định; duy trì thêm ít nhất 15 phút sau khi ổn định","perKg":0.25,"perKgUnit":"mL/kg/phút","pedPerKg":0.25,"pedUnit":"mL/kg/phút","pedMax":null,"infusionLo":0.25,"infusionHi":0.5,"infusionUnit":"mL/kg/phút","note":"Tổng liều tối đa 12 mL/kg."},{"name":"Midazolam","adult":"2-4 mg TM","amount":2,"unit":"mg","route":"TM","repeat":"Có thể lặp lại đến khi cắt cơn co giật","perKg":null,"perKgUnit":null,"pedPerKg":0.1,"pedUnit":"mg/kg","pedMax":4,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Thuốc đầu tay cắt co giật do LAST."},{"name":"Propofol","adult":"20 mg TM","amount":20,"unit":"mg","route":"TM","repeat":"Có thể lặp lại cho đến khi cắt cơn co giật","perKg":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"CHỈ dùng khi không có benzodiazepin VÀ huyết áp ổn định. Không dùng propofol thay cho nhũ tương lipid."},{"name":"Rocuronium","adult":"Liều giãn cơ khi co giật kháng trị","amount":null,"unit":"mg","route":"TM","repeat":null,"perKg":null,"perKgUnit":null,"pedPerKg":1,"pedUnit":"mg/kg","pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Giãn cơ chỉ chấm dứt co giật trên lâm sàng, không cắt hoạt động động kinh ở não; phải bảo đảm thông khí."},{"name":"Adrenalin (epinephrine) LIỀU THẤP","adult":"0,2-1 mcg/kg TM","amount":null,"unit":"mcg","route":"TM","repeat":"Chuẩn độ theo đáp ứng","perKg":0.2,"perKgUnit":"mcg/kg","pedPerKg":1,"pedUnit":"mcg/kg","pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Dùng liều THẤP (< 1 mcg/kg). Liều adrenalin cao làm giảm hiệu quả hồi sức bằng nhũ tương lipid. TRÁNH vasopressin."},{"name":"Amiodarone","adult":"150 mg TM chậm trong 10-15 phút (loạn nhịp dai dẳng); 300 mg TM nếu ngừng tim do VF/VT, lặp lại 150 mg","amount":150,"unit":"mg","route":"TM","repeat":"Có thể lặp lại 150 mg","perKg":null,"perKgUnit":null,"pedPerKg":5,"pedUnit":"mg/kg","pedMax":300,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Thuốc chống loạn nhịp lựa chọn trong LAST."}],"causes":["Tiêm nhầm thuốc tê vào lòng mạch (động mạch hoặc tĩnh mạch)","Hấp thu toàn thân quá mức do liều thuốc tê vượt ngưỡng an toàn","Gây tê vùng có tưới máu phong phú (liên sườn, cạnh cột sống, đám rối thần kinh)","Chẩn đoán phân biệt: phản vệ, phản xạ phế vị, tắc mạch khí, cơn động kinh nguyên phát, ngộ độc thuốc khác"],"notes":["Nhũ tương lipid 20% là điều trị đặc hiệu — dùng SỚM, không chờ ngừng tim.","Tổng liều nhũ tương lipid 20% tối đa: 12 mL/kg.","TRÁNH: vasopressin, thuốc chẹn kênh canxi, thuốc chẹn beta, thuốc tê tại chỗ (bao gồm lidocaine).","Adrenalin phải dùng LIỀU THẤP (bắt đầu 0,2-1 mcg/kg), không dùng liều 1 mg như ACLS thường quy.","Có thể cần CPR kéo dài; cân nhắc gọi ECMO/CPB sớm khi huyết động không ổn định.","Theo dõi sau sự cố: ≥ 2 giờ sau co giật, ≥ 6 giờ sau mất ổn định huyết động, 24-48 giờ sau ngừng tim."],"short":"Ngộ độc thuốc tê","grp":"anes"},{"id":"malignant-hyperthermia","no":19,"title":"Sốt cao ác tính (Tăng thân nhiệt ác tính - MH)","definition":"Tình trạng tăng chuyển hóa cấp tính đe dọa tính mạng ở người có cơ địa nhạy cảm, khởi phát do thuốc mê bay hơi và/hoặc succinylcholine. Nhận biết sớm dựa vào EtCO2 tăng nhanh không giải thích được kèm nhiễm toan, tăng thân nhiệt và cứng cơ.","signs":["Dấu hiệu sớm: nhiễm toan hỗn hợp (chuyển hóa và hô hấp)","Tăng EtCO2, nhịp tim nhanh, thở nhanh","Tăng thân nhiệt","Co cứng cơ nhai (trismus)","Cứng cơ toàn thân, có thể không kèm run, hoặc kèm run/co giật","Dấu hiệu muộn: myoglobin niệu (nước tiểu sẫm màu)","Dấu hiệu muộn: loạn nhịp tim, kể cả ngừng tim do tăng kali máu"],"tasks":[{"task":"Huy động nguồn lực","actions":["Thông báo cho toàn bộ ê-kíp","Gọi xe đẩy cấp cứu MH có sẵn dantrolene","Gọi hỗ trợ nhân lực","Cân nhắc tạm dừng cuộc mổ"]},{"task":"Ngừng tác nhân khởi phát","actions":["Ngừng ngay thuốc mê bay hơi và succinylcholine","KHÔNG mất thời gian thay máy gây mê hoặc thay hệ thống dây thở","Thở oxy 100% với lưu lượng 10-15 L/phút","Nếu có sẵn, lắp bộ lọc than hoạt tính vào nhánh hít vào và thở ra của hệ thống dây thở"]},{"task":"Đường thở / Thông khí","actions":["Tối ưu hóa và tăng tối đa thông khí phút","Ưu tiên thông khí cơ học (máy thở)","Tránh bẫy khí (air trapping)"]},{"task":"Dùng thuốc giải độc (dantrolene)","actions":["Liều dantrolene ban đầu: 2,5 mg/kg tiêm tĩnh mạch","Dạng cô đặc, dễ hòa tan (Ryanodex): pha loãng 1 lọ 250 mg trong 5 mL nước vô trùng không chứa chất bảo quản. Bệnh nhân 70 kg: 175 mg = 3,5 mL","Dạng không cô đặc (Dantrium hoặc Revonto): cần nhiều người pha. Pha mỗi lọ 20 mg trong 60 mL nước vô trùng không chứa chất bảo quản. Bệnh nhân 70 kg: 175 mg = 9 lọ","Lặp lại dantrolene 2,5 mg/kg mỗi 5 phút cho đến khi hết tăng CO2 và hết cứng cơ, nhiệt độ không còn tăng","Có thể cần tổng liều > 10 mg/kg"]},{"task":"Trao đổi thông tin ê-kíp","actions":["Nếu cần, dừng cuộc mổ","Duy trì mê bằng các thuốc KHÔNG khởi phát MH: propofol, benzodiazepin, opioid"]},{"task":"Điều trị tăng kali máu","actions":["Canxi clorua 10 mg/kg tiêm tĩnh mạch, tối đa 2 g","Insulin thường (regular) 5-10 đơn vị tiêm tĩnh mạch kèm dextrose: 1 ống D50 (25 g); theo dõi đường huyết","Albuterol (salbutamol) 8-12 nhát xịt MDI hoặc khí dung 2,5 mg","Natri bicarbonate 0,5 ống (25 mL) mỗi lần; duy trì thông khí phút để thải lượng CO2 sinh thêm","Nếu tăng kali máu nặng: cân nhắc lọc máu / chạy thận nhân tạo cấp cứu"]},{"task":"Điều trị loạn nhịp","actions":["Amiodarone 150 mg tiêm tĩnh mạch trong 10-15 phút","Esmolol 10-20 mg tiêm tĩnh mạch, sau đó truyền duy trì","Hoặc magnesi sulfat 1 g tiêm tĩnh mạch","TRÁNH thuốc chẹn kênh canxi (verapamil, diltiazem) và thuốc chẹn kênh natri (lidocaine, procainamide)","Nếu huyết động không ổn định: gọi xe đẩy cấp cứu; xem thêm các sự kiện ACLS: Vô tâm thu/PEA #1, Nhịp chậm #2, VF/VT #3"]},{"task":"Làm mát tích cực","actions":["Nếu nhiệt độ trung tâm > 38°C: làm mát tích cực bằng dịch truyền tĩnh mạch lạnh 20-30 mL/kg (nước muối sinh lý hoặc dung dịch tinh thể)","Ngừng mọi thiết bị làm ấm","Mở luồng khí cưỡng bức, mở phòng mát","Chườm túi đá lên đầu, nách và bẹn","Làm ướt da","Nếu ổ bụng hoặc khoang màng phổi đang mở: rửa bằng dịch lạnh (tránh rửa bàng quang để bảo toàn độ chính xác của lượng nước tiểu theo dõi)","Ngừng làm mát khi nhiệt độ trung tâm về khoảng 38°C để tránh hạ thân nhiệt"]},{"task":"Đường truyền / Theo dõi","actions":["Đặt thêm đường truyền tĩnh mạch","Đặt đường động mạch xâm lấn"]},{"task":"Xét nghiệm","actions":["Gửi khí máu động mạch (ABG), kali máu, CK, myoglobin niệu, xét nghiệm đông máu, lactat"]},{"task":"Theo dõi nước tiểu","actions":["Đặt sonde Foley và theo dõi lượng nước tiểu","Mục tiêu 1-2 mL/kg/giờ","Cân nhắc truyền dịch tĩnh mạch và thuốc lợi tiểu"]},{"task":"Đường dây nóng MH","actions":["Gọi 24/7 để được tư vấn chuyên gia: 1-800-MH-HYPER (1-800-644-9737)","http://www.mhaus.org"]},{"task":"Chăm sóc sau sự kiện","actions":["Chuyển bệnh nhân cùng nhân viên có kinh nghiệm sau khi đã ổn định","Thường cần thở máy vì khoảng 20% các trường hợp MH tái phát trong vòng 16 giờ","Rút nội khí quản khi chuyển hóa và huyết động đã ổn định","Tiếp tục dantrolene: 1 mg/kg tiêm tĩnh mạch mỗi 4-6 giờ, hoặc truyền 0,25 mg/kg/giờ, trong tối đa 24 giờ","Theo dõi tiêu cơ vân, DIC, tăng kali máu, hội chứng khoang","Hoàn thành báo cáo AMRA (Adverse Metabolic Reaction to Anesthesia): https://anest.ufl.edu/namhr/","Xét nghiệm gen: https://www.mhaus.org/testing/genetic-testing/"]}],"drugs":[{"name":"Dantrolene - liều ban đầu","adult":"2,5 mg/kg TM (bệnh nhân 70 kg: 175 mg)","amount":175,"unit":"mg","route":"TM","repeat":"Lặp lại 2,5 mg/kg mỗi 5 phút cho đến khi hết tăng CO2 và cứng cơ; có thể cần > 10 mg/kg","perKg":2.5,"perKgUnit":"mg/kg","pedPerKg":2.5,"pedUnit":"mg/kg","pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Ryanodex: 1 lọ 250 mg pha trong 5 mL nước vô trùng không chất bảo quản → 175 mg = 3,5 mL. Dantrium/Revonto: mỗi lọ 20 mg pha trong 60 mL nước vô trùng không chất bảo quản → 175 mg = 9 lọ."},{"name":"Dantrolene - duy trì sau sự kiện","adult":"1 mg/kg TM mỗi 4-6 giờ hoặc truyền 0,25 mg/kg/giờ, tối đa 24 giờ","amount":null,"unit":"mg","route":"TM","repeat":"Mỗi 4-6 giờ trong 24 giờ","perKg":1,"perKgUnit":"mg/kg","pedPerKg":1,"pedUnit":"mg/kg","pedMax":null,"infusionLo":0.25,"infusionHi":0.25,"infusionUnit":"mg/kg/giờ","note":"Duy trì vì khoảng 20% ca MH tái phát trong 16 giờ đầu."},{"name":"Canxi clorua","adult":"10 mg/kg TM, tối đa 2 g","amount":null,"unit":"mg","route":"TM","repeat":"Lặp lại theo kali máu và ECG","perKg":10,"perKgUnit":"mg/kg","pedPerKg":20,"pedUnit":"mg/kg","pedMax":1000,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Ổn định màng tế bào cơ tim trong tăng kali máu. Ưu tiên qua đường truyền trung tâm."},{"name":"Insulin thường (regular) + Dextrose","adult":"Insulin 5-10 đơn vị TM kèm 1 ống D50 (25 g dextrose)","amount":null,"unit":"đơn vị","route":"TM","repeat":"Theo dõi đường huyết, lặp lại theo kali máu","perKg":null,"perKgUnit":null,"pedPerKg":0.1,"pedUnit":"đơn vị/kg","pedMax":10,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Nhi: insulin 0,1 đơn vị/kg kèm dextrose 0,5 g/kg. Theo dõi sát đường huyết vì nguy cơ hạ đường huyết muộn."},{"name":"Natri bicarbonate","adult":"0,5 ống (25 mL dung dịch 8,4%) mỗi lần","amount":25,"unit":"mL","route":"TM","repeat":"Lặp lại theo khí máu","perKg":null,"perKgUnit":null,"pedPerKg":1,"pedUnit":"mEq/kg","pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Phải duy trì thông khí phút cao để thải lượng CO2 sinh thêm sau khi dùng bicarbonate."},{"name":"Albuterol (salbutamol)","adult":"8-12 nhát xịt MDI hoặc khí dung 2,5 mg","amount":2.5,"unit":"mg","route":"Khí dung / MDI qua dây thở","repeat":"Có thể lặp lại","perKg":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":2.5,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Nhi: khí dung 2,5 mg (< 20 kg) đến 5 mg (≥ 20 kg). Đẩy kali vào nội bào."},{"name":"Amiodarone","adult":"150 mg TM trong 10-15 phút","amount":150,"unit":"mg","route":"TM","repeat":"Theo đáp ứng","perKg":null,"perKgUnit":null,"pedPerKg":5,"pedUnit":"mg/kg","pedMax":300,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":""},{"name":"Esmolol","adult":"10-20 mg TM, sau đó truyền duy trì","amount":10,"unit":"mg","route":"TM","repeat":"Chuẩn độ theo nhịp tim và huyết áp","perKg":null,"perKgUnit":null,"pedPerKg":0.5,"pedUnit":"mg/kg","pedMax":null,"infusionLo":50,"infusionHi":200,"infusionUnit":"mcg/kg/phút","note":""},{"name":"Magnesi sulfat","adult":"1 g TM","amount":1,"unit":"g","route":"TM","repeat":"Theo đáp ứng","perKg":null,"perKgUnit":null,"pedPerKg":25,"pedUnit":"mg/kg","pedMax":2000,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":""},{"name":"Dịch tinh thể lạnh (làm mát tích cực)","adult":"20-30 mL/kg TM dung dịch muối sinh lý/tinh thể lạnh","amount":null,"unit":"mL","route":"TM","repeat":"Đến khi nhiệt độ trung tâm ≈ 38°C","perKg":20,"perKgUnit":"mL/kg","pedPerKg":20,"pedUnit":"mL/kg","pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Chỉ định khi nhiệt độ trung tâm > 38°C."}],"causes":["Thuốc mê bay hơi (sevoflurane, isoflurane, desflurane) và succinylcholine ở người có cơ địa nhạy cảm","Chẩn đoán phân biệt: thổi CO2 vào ổ bụng (phẫu thuật nội soi)","Giảm thông khí","Thiếu oxy máu","Sốt do nhiễm trùng / do thầy thuốc gây ra (ủ ấm quá mức)","Lạm dụng chất kích thích","Mê nông / gây mê không đủ sâu","Hội chứng ác tính do thuốc an thần kinh (NMS)","U tủy thượng thận (pheochromocytoma)","Hội chứng serotonin","Bão giáp"],"notes":["Công thức pha Ryanodex (dạng cô đặc, dễ hòa tan): 1 lọ 250 mg + 5 mL nước vô trùng KHÔNG chất bảo quản; bệnh nhân 70 kg cần 175 mg = 3,5 mL.","Công thức pha Dantrium/Revonto (dạng không cô đặc): mỗi lọ 20 mg + 60 mL nước vô trùng KHÔNG chất bảo quản; bệnh nhân 70 kg cần 175 mg = 9 lọ — cần huy động nhiều người cùng pha.","Liều dantrolene ban đầu 2,5 mg/kg TM, lặp lại 2,5 mg/kg mỗi 5 phút cho đến khi kiểm soát được; tổng liều có thể vượt 10 mg/kg.","KHÔNG mất thời gian thay máy gây mê hay hệ thống dây thở — ưu tiên cho dantrolene và tăng thông khí.","TRÁNH thuốc chẹn kênh canxi (verapamil, diltiazem) khi dùng chung dantrolene (nguy cơ tăng kali máu, trụy tim mạch) và tránh thuốc chẹn kênh natri (lidocaine, procainamide).","Đường dây nóng MHAUS 24/7: 1-800-MH-HYPER (1-800-644-9737).","Khoảng 20% ca MH tái phát trong vòng 16 giờ — theo dõi ICU, thường cần thở máy tiếp."],"short":"Sốt cao ác tính","grp":"anes"},{"id":"myocardial-ischemia","no":20,"title":"Thiếu máu cục bộ cơ tim","definition":"Mất cân bằng giữa cung và cầu oxy cơ tim trong giai đoạn chu phẫu, biểu hiện bằng biến đổi đoạn ST, rối loạn nhịp, rối loạn vận động vùng mới hoặc triệu chứng đau ngực. Cần nhận diện và xử trí ngay để hạn chế vùng cơ tim tổn thương.","signs":["ST chênh xuống hoặc chênh lên","Sóng T đảo ngược","Loạn nhịp: rối loạn dẫn truyền mới (ví dụ blốc nhánh trái mới xuất hiện), nhịp không đều, nhịp nhanh hoặc nhịp chậm","Tụt huyết áp","Rối loạn vận động vùng mới xuất hiện trên siêu âm tim","Hở van hai lá mới xuất hiện hoặc nặng lên","Đau ngực, khó thở, buồn nôn hoặc vã mồ hôi"],"tasks":[{"task":"Huy động nguồn lực","actions":["Thông báo cho ê-kíp","Nhận xe cấp cứu / xe thuốc","Gọi bác sĩ gây mê tim mạch hoặc bác sĩ tim mạch","Cho thở oxy bổ sung để duy trì SpO2 ≥ 95%"]},{"task":"Đường thở / Oxy","actions":["Duy trì SpO2 ≥ 95%"]},{"task":"Theo dõi","actions":["Thực hiện điện tâm đồ 12 chuyển đạo","Xác minh vị trí các điện cực ECG đúng vị trí","Mở rộng chế độ theo dõi ECG sang các chuyển đạo II, V5 và các chuyển đạo khác","Chuẩn bị sẵn sàng cho loạn nhịp: dán miếng đệm khử rung/tạo nhịp và theo dõi đa chuyển đạo"]},{"task":"Trao đổi thông tin ê-kíp","actions":["Tạm dừng hoặc dừng cuộc mổ nếu có thể","Thảo luận với phẫu thuật viên về nguy cơ chảy máu và khả năng dùng thuốc chống đông"]},{"task":"Thuốc","actions":["Điều trị mọi rối loạn nhịp nhanh, nhịp chậm, tụt huyết áp hoặc tăng huyết áp (xem Danh mục truyền dịch/thuốc vận mạch #29)","Thảo luận với phẫu thuật viên về chống chỉ định và lợi ích của kháng kết tập tiểu cầu kép và chống đông","Aspirin 160-325 mg uống, qua sonde dạ dày hoặc đặt hậu môn","Thuốc ức chế thụ thể P2Y12 ADP: clopidogrel 300 mg uống, prasugrel 60 mg uống hoặc ticagrelor 180 mg uống","Truyền heparin","Giảm đau bằng opioid: fentanyl hoặc morphin","Cân nhắc nitroglycerin dạng dán hoặc truyền tĩnh mạch — tránh dùng nếu tụt huyết áp","Cân nhắc thuốc chẹn beta để làm chậm nhịp tim và cho phép tưới máu động mạch vành tốt hơn; ưu tiên esmolol vì có thể ngừng nhanh nếu gây suy tim","TRÁNH chẹn beta nếu nhịp chậm, blốc nhĩ thất độ 1 hoặc độ 2, hoặc tụt huyết áp","Nếu phù phổi cấp: cân nhắc lợi tiểu furosemide 10-40 mg tiêm tĩnh mạch; theo dõi lượng nước tiểu"]},{"task":"Hội chẩn tim mạch","actions":["Nếu STEMI: hội chẩn bác sĩ tim mạch để tái thông mạch vành cấp cứu hoặc tiêu sợi huyết khẩn cấp","Cân nhắc chuyển khẩn cấp đến phòng thông tim hoặc trung tâm can thiệp mạch vành (PCI)"]},{"task":"Đường truyền","actions":["Cân nhắc đặt thêm đường truyền tĩnh mạch","Đặt đường động mạch để theo dõi huyết áp liên tục và lấy máu xét nghiệm","Cân nhắc đặt đường truyền tĩnh mạch trung tâm"]},{"task":"Xét nghiệm","actions":["Gửi khí máu động mạch, điện giải đồ, hemoglobin, troponin, xét nghiệm đông máu"]},{"task":"Siêu âm tim","actions":["Cân nhắc siêu âm tim qua thực quản (TEE) hoặc qua thành ngực (TTE) để đánh giá thể tích tuần hoàn, rối loạn vận động vùng, chức năng tâm thất và bệnh van tim","Dùng đánh giá khả năng co bóp để hướng dẫn lựa chọn dịch truyền và thuốc vận mạch"]},{"task":"ECMO / CPB","actions":["Cân nhắc ECMO, tuần hoàn ngoài cơ thể hoặc bóng đối xung động mạch chủ (IABP)"]},{"task":"Bố trí sau xử trí","actions":["Có thể cần chuyển ICU theo dõi"]}],"drugs":[{"name":"Aspirin","adult":"160-325 mg uống, qua sonde dạ dày hoặc đặt hậu môn","amount":325,"unit":"mg","route":"Uống / sonde dạ dày / hậu môn","repeat":null,"perKg":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Cân nhắc nguy cơ chảy máu, thống nhất với phẫu thuật viên."},{"name":"Clopidogrel","adult":"300 mg uống (liều nạp)","amount":300,"unit":"mg","route":"Uống","repeat":null,"perKg":null,"perKgUnit":null,"pedPerKg":null,"pedUni ,{"name":"Fentanyl / Morphin","adult":"Chuẩn độ tĩnh mạch để giảm đau","amount":null,"unit":"mcg","route":"TM","repeat":"Chuẩn độ theo đau","perKg":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Giảm đau làm giảm tiêu thụ oxy cơ tim."}],"causes":["Mất cân bằng cung - cầu oxy cơ tim: nhịp tim nhanh, thiếu máu, tụt huyết áp, tăng huyết áp","Huyết khối cấp mảng xơ vữa động mạch vành (nhồi máu type 1)","Thiếu máu do mất máu phẫu thuật","Thiếu oxy máu, giảm cung lượng tim","Chẩn đoán phân biệt: viêm màng ngoài tim, thuyên tắc phổi, bóc tách động mạch chủ, co thắt mạch vành, hội chứng Takotsubo, sai vị trí điện cực ECG"],"notes":["Xác minh vị trí điện cực ECG trước khi kết luận biến đổi ST là thật.","Cân bằng giữa lợi ích chống huyết khối và nguy cơ chảy máu ngoại khoa — phải thảo luận trực tiếp với phẫu thuật viên.","STEMI trong mổ là chỉ định hội chẩn tim mạch cấp cứu để can thiệp tái thông mạch vành.","Ưu tiên esmolol trong nhóm chẹn beta do thời gian tác dụng ngắn.","Xem Danh mục thuốc truyền/vận mạch (sự kiện #29) khi cần xử trí huyết động."],"short":"Thiếu máu cơ tim","grp":"anes"},{"id":"oxygen-failure","no":21,"title":"Mất nguồn oxy (Oxygen failure)","definition":"Mất hoặc gián đoạn nguồn cung cấp oxy cho máy gây mê/máy thở. Nhận biết qua báo động lỗi oxy, FiO2 đo được thấp bất thường không phù hợp với cài đặt, hoặc lưu lượng kế chỉ số thấp bất thường.","signs":["Báo động lỗi oxy bằng âm thanh hoặc hình ảnh","Giá trị FiO2 thấp không phù hợp trên máy phân tích khí","Lưu lượng kế chỉ số thấp bất thường","SpO2 giảm"],"tasks":[{"task":"Huy động nguồn lực","actions":["Thông báo cho ê-kíp","Cân nhắc tạm dừng cuộc mổ","Gọi hỗ trợ","Lấy xe cấp cứu kèm bình oxy dự phòng"]},{"task":"Thông khí không qua máy gây mê","actions":["Ngắt kết nối bệnh nhân khỏi máy gây mê và bóp bóng tự phồng (Ambu) với khí trời","KHÔNG nối bóng Ambu vào nguồn oxy phụ trợ của máy gây mê vì nguồn này cùng chung nguồn oxy đang bị lỗi","Chỉ định một người có năng lực chuyên trách bóp bóng bằng tay"]},{"task":"Kiểm tra mạch","actions":["Kiểm tra mạch; nếu mất mạch: bắt đầu CPR và xem sự kiện Vô tâm thu/PEA #1"]},{"task":"Tìm nguồn oxy không phụ thuộc máy gây mê","actions":["Nối bóng Ambu vào van/đầu nối trên bình oxy vận chuyển","HOẶC không nối gì cả — tiếp tục thông khí bằng khí trời"]},{"task":"Theo dõi khí thở (capnography)","actions":["Nối đường lấy mẫu khí bằng đầu nối khuỷu tay đặt giữa bệnh nhân và bóng Ambu","Xác minh vị trí ống nội khí quản đúng bằng dạng sóng CO2","Xác minh nồng độ oxy bệnh nhân đang nhận trên máy phân tích khí: 100% nếu dùng bình oxy, 21% nếu thông khí bằng khí trời"]},{"task":"Nếu áp lực đường thở thấp","actions":["Xác nhận ống thông dạ dày/ống mũi-dạ dày không nằm trong khí quản"]},{"task":"Duy trì mê không phụ thuộc máy gây mê","actions":["Duy trì mê bằng thuốc đường tĩnh mạch","Tắt thuốc mê bay hơi"]},{"task":"Tiết kiệm oxy","actions":["Sử dụng lưu lượng khí tươi thấp nhất có thể và FiO2 thấp nhất chấp nhận được"]},{"task":"Báo cáo sự cố","actions":["Thông báo cho điều dưỡng phụ trách, trưởng khoa gây mê và tất cả các phòng mổ khác","Liên hệ kỹ thuật viên trang thiết bị y sinh để: báo cáo sự cố; yêu cầu hỗ trợ chẩn đoán và sửa chữa trong khi bạn tập trung chăm sóc bệnh nhân","Xác định sự cố là cục bộ hay toàn hệ thống"]},{"task":"Tóm tắt nhóm","actions":["Thảo luận kế hoạch cho bệnh nhân này và lịch trình các ca mổ tiếp theo trong phòng mổ"]}],"drugs":[{"name":"Thuốc mê tĩnh mạch (ví dụ propofol)","adult":"Duy trì mê bằng đường tĩnh mạch (TIVA)","amount":null,"unit":"mg","route":"TM","repeat":"Chuẩn độ theo độ mê","perKg":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":50,"infusionHi":150,"infusionUnit":"mcg/kg/phút","note":"Bắt buộc chuyển sang TIVA vì thuốc mê bay hơi không dùng được khi mất nguồn khí."}],"causes":["Hỏng hệ thống oxy trung tâm của bệnh viện","Hỏng bộ điều áp hoặc đường ống dẫn oxy tới phòng mổ","Bình oxy dự phòng cạn hoặc van đóng","Lỗi máy gây mê / lỗi bộ trộn khí","Chẩn đoán phân biệt: sai máy phân tích khí, tuột dây, tắc nghẽn đường thở"],"notes":["Sai lầm nguy hiểm nhất: nối bóng Ambu vào cổng oxy phụ trợ của máy gây mê — cổng này lấy từ cùng nguồn oxy đã hỏng.","Thông khí bằng khí trời (21% O2) vẫn tốt hơn không thông khí.","Bình oxy vận chuyển là nguồn oxy độc lập đáng tin cậy nhất tại chỗ.","Phải chuyển sang duy trì mê tĩnh mạch ngay khi ngắt khỏi máy gây mê để tránh tỉnh trong mổ.","Xác định sớm sự cố là cục bộ hay toàn hệ thống để cảnh báo các phòng mổ khác."],"short":"Mất nguồn oxy","grp":"anes"},{"id":"power-failure","no":23,"title":"Mất điện","definition":"Mất nguồn điện đột ngột trong phòng mổ dẫn đến tối đen và ngừng hoạt động của các thiết bị chạy điện (máy gây mê, monitor, bơm tiêm điện, đèn mổ).","signs":["Bóng tối đột ngột trong phòng mổ","Mất hoạt động các thiết bị chạy bằng điện","Máy thở của máy gây mê ngừng hoạt động hoặc chuyển sang chạy pin","Monitor tắt hoặc hiển thị lỗi","Báo động mất nguồn cấp khí/oxy"],"tasks":[{"task":"Huy động nguồn lực khủng hoảng","actions":["Thông báo cho toàn ê-kíp","Gọi trợ giúp"]},{"task":"Bảo đảm nguồn sáng","actions":["Sử dụng mọi nguồn sáng sẵn có: đèn soi thanh quản, đèn điện thoại di động, đèn pin, ánh sáng tự nhiên từ cửa hoặc rèm cửa"]},{"task":"Kiểm tra máy thở / thông khí","actions":["Máy gây mê có thể có pin dự phòng (~30 phút); cân nhắc dùng máy thở vận chuyển","Nếu máy thở không hoạt động: cân nhắc chuyển sang thở tự nhiên","Thông khí bằng bóng tự phồng (Ambu) hoặc bóng gây mê","Chuyển sang TIVA bằng bơm tiêm điện chạy pin, hoặc điều chỉnh tốc độ truyền bằng khoá/bộ đếm giọt thủ công"]},{"task":"Kiểm tra monitor","actions":["Nếu monitor mất chức năng: phân công một người bắt mạch liên tục","Đo huyết áp thủ công","Dùng monitor vận chuyển hoặc monitor của máy phá rung"]},{"task":"Kiểm tra nguồn oxy dự phòng","actions":["Nếu mất điện ảnh hưởng đến nguồn cấp oxy hoặc có báo động: xem Sự cố nguồn oxy (#21)","Bảo đảm có bình oxy dự phòng tại chỗ"]},{"task":"Kiểm tra nguồn điện ưu tiên (ổ cắm khẩn cấp)","actions":["Xác nhận ổ cắm điện khẩn cấp (do máy phát điện cấp) đang hoạt động","Cắm tất cả thiết bị duy trì sự sống vào ổ cắm khẩn cấp","Rút các thiết bị không duy trì sự sống khỏi ổ cắm khẩn cấp"]},{"task":"Báo cáo sự cố","actions":["Thông báo cho điều dưỡng trưởng ca, trưởng khoa Gây mê hồi sức và tất cả các phòng mổ","Gọi bộ phận kỹ thuật/cơ điện: báo cáo sự cố, yêu cầu hỗ trợ chẩn đoán và khắc phục trong khi ê-kíp tập trung chăm sóc người bệnh","Nếu chỉ mất điện tại một phòng: đề nghị kiểm tra cầu dao/aptomat có bị ngắt không","Xác định phạm vi sự cố là cục bộ hay toàn hệ thống"]},{"task":"Hội ý ê-kíp","actions":["Trao đổi với phẫu thuật viên và ê-kíp về ảnh hưởng của mất điện lên người bệnh và tiến trình cuộc mổ"]}],"drugs":[],"causes":["Mất điện lưới toàn bệnh viện","Ngắt cầu dao/aptomat tại phòng mổ","Hỏng máy phát điện dự phòng","Sự cố nguồn điện ưu tiên/UPS"],"notes":["Máy gây mê thường có pin dự phòng khoảng 30 phút — dùng khoảng thời gian này để chuẩn bị phương án thay thế","Khi mất điện, các bơm tiêm điện có thể ngừng: ưu tiên duy trì thuốc mê và thuốc vận mạch","Ổ cắm màu đỏ (khẩn cấp) được cấp bởi máy phát điện dự phòng"],"short":"Mất điện","grp":"anes"},{"id":"right-heart-failure","no":24,"title":"Suy tim phải","definition":"Tình trạng thất phải mất khả năng duy trì cung lượng tim đầy đủ do quá tải áp lực và/hoặc thể tích, dẫn đến giãn thất phải, giảm co bóp thất phải và tụt huyết áp hệ thống.","signs":["Khó thở, chóng mặt, phù ngoại vi","Khó chịu vùng hạ sườn phải (gan sung huyết)","Tụt huyết áp","ECG có dấu hiệu tăng gánh thất phải","TEE/TTE: thất phải giãn, chức năng thất phải giảm","Vách liên thất phẳng (thất trái hình chữ D)","TAPSE giảm < 6 mm (bình thường 16–20 mm)","Mất bù sau thiếu oxy máu, tăng CO2 hoặc toan máu","Mất bù khi bắt đầu thông khí áp lực dương","CVP > 20 mmHg và/hoặc SvO2 < 65%"],"tasks":[{"task":"Huy động nguồn lực khủng hoảng","actions":["Thông báo cho ê-kíp","Yêu cầu thuốc giãn mạch phổi: nitric oxide dạng hít (INOmax) hoặc epoprostenol (Flolan, Veletri)","Gọi xe cấp cứu ngừng tuần hoàn và máy TEE/TTE","Mời bác sĩ gây mê tim mạch, bác sĩ tim mạch hoặc hồi sức tích cực"]},{"task":"Đường thở và thông khí","actions":["FiO2 100%, oxy 10–15 L/phút","Giảm thể tích khí lưu thông và tăng tần số thở để giảm áp lực trong lồng ngực, tránh tăng CO2 máu","Tránh ứ khí (auto-PEEP), tránh chồng nhịp thở","Giảm PEEP tới mức thấp nhất nếu dung nạp được","Tránh thiếu oxy máu (thiếu oxy làm co mạch phổi)"]},{"task":"Đánh giá bằng siêu âm tim (TEE/TTE)","actions":["Đánh giá chức năng thất phải: TAPSE < 6 mm gợi ý giảm nặng (bình thường 16–20 mm)","Tìm dấu quá tải thể tích/áp lực thất phải: vách liên thất phẳng, thất trái hình chữ D","Đánh giá giãn và/hoặc phì đại thất phải","Thất trái đổ đầy kém dù đủ tiền tải"]},{"task":"Tìm và xử trí nguyên nhân đe dọa tính mạng","actions":["Chèn ép tim: chọc dẫn lưu màng ngoài tim cấp cứu","Phản ứng với protamine: ngừng protamine ngay","Thuyên tắc (khí, huyết khối, mỡ)","Nhồi máu thất phải — xem Thiếu máu cơ tim (#20)","Tràn khí màng phổi áp lực — xem Tràn khí màng phổi (#22)"]},{"task":"Cân nhắc ECMO/CPB","actions":["Nếu huyết động mất ổn định nặng: cân nhắc ECMO hoặc tuần hoàn ngoài cơ thể"]},{"task":"Giảm hậu tải thất phải","actions":["Giảm sức cản mạch phổi (PVR)","Dùng prostacyclin dạng khí dung, nitric oxide dạng hít hoặc thuốc giãn mạch phổi đường tĩnh mạch","Tránh thiếu oxy máu, tăng CO2 máu, toan máu và áp lực trong lồng ngực quá cao"]},{"task":"Duy trì co bóp thất phải","actions":["Tránh tụt huyết áp để bảo đảm tưới máu mạch vành","Nếu co bóp thất phải giảm: cân nhắc epinephrine (hoặc milrinone, dobutamine)","Nếu co bóp thất phải còn bình thường: cân nhắc vasopressin hoặc norepinephrine","Xem Danh sách pha truyền (#29)","Nếu tụt huyết áp kháng trị: cân nhắc bóng đối xung nội động mạch chủ (IABP) để duy trì tưới máu vành"]},{"task":"Duy trì thể tích tuần hoàn tối ưu","actions":["Quá tải thể tích thất phải nguy hiểm hơn giảm thể tích nhẹ","Quá tải thất phải được gợi ý khi CVP > 20 mmHg và/hoặc SvO2 < 65%","Nếu quá tải thất phải: cân nhắc lợi tiểu và hội chẩn chuyên khoa","Nếu thất phải đổ đầy kém: bù thể tích thận trọng bằng máu hoặc dịch tinh thể tuỳ theo Hct"]},{"task":"Duy trì nhịp xoang bình thường","actions":["Tránh nhịp chậm hoặc nhịp nhanh quá mức để duy trì cung lượng tim","Phát hiện và điều chỉnh rối loạn điện giải","Duy trì co bóp nhĩ (đồng bộ nhĩ - thất) để tăng cung lượng tim","Nếu nhịp không đều/nhanh trên thất: xem SVT (#3)"]}],"drugs":[{"name":"Nitric oxide dạng hít (INOmax)","adult":"20–40 ppm dạng hít","amount":null,"unit":"ppm","route":"Hít","repeat":"","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Thuốc giãn mạch phổi chọn lọc; liều cụ thể không in trong sách"},{"name":"Epoprostenol (Flolan, Veletri)","adult":"Khí dung/hít liên tục hoặc truyền tĩnh mạch theo phác đồ","amount":null,"unit":null,"route":"Khí dung / TM","repeat":"","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Prostacyclin giãn mạch phổi; liều cụ thể không in trong sách"},{"name":"Milrinone (Primacor)","adult":"Liều tải 50–75 mcg/kg trong 10 phút; truyền 0,375–0,75 mcg/kg/phút","amount":null,"unit":"mcg","route":"TM","repeat":"","perKg":50,"perKgHi":75,"perKgUnit":"mcg/kg","pedPerKg":50,"pedUnit":"mcg/kg (liều tải trong 10–60 phút)","pedMax":null,"infusionLo":0.375,"infusionHi":0.75,"infusionUnit":"mcg/kg/phút","note":"Truyền nhi khoa 0,25–0,75 mcg/kg/phút (PALS); liều tải có thể gây tụt huyết áp"},{"name":"Epinephrine","adult":"Truyền 0,02–0,3 mcg/kg/phút (20–300 nanogam/kg/phút)","amount":null,"unit":"mcg","route":"TM","repeat":"","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusio màu (huyết sắc tố niệu), chảy máu lan toả hoặc DIC","Phản ứng sốt không tan máu: sốt, ớn lạnh, rét run, đau đầu, buồn nôn/nôn","Phản ứng phản vệ: tụt huyết áp, mề đay, ban da, khò khè/co thắt phế quản, nhịp tim nhanh"],"tasks":[{"task":"Ngừng truyền máu","actions":["Ngừng truyền chế phẩm máu ngay lập tức","Giữ lại túi máu và dây truyền","Thông báo cho ê-kíp"]},{"task":"Huy động nguồn lực khủng hoảng","actions":["Thông báo cho ê-kíp, xác định người chỉ huy","Gọi trợ giúp","Gọi xe cấp cứu ngừng tuần hoàn","Cân nhắc tạm dừng cuộc mổ"]},{"task":"Đường thở","actions":["Oxy 100%, 10–15 L/phút","Nếu chưa đặt nội khí quản: cân nhắc đặt nội khí quản sớm (nguy cơ phù đường thở trong phản vệ)"]},{"task":"Tuần hoàn","actions":["Truyền dịch tĩnh mạch tích cực","Nếu tụt huyết áp: giảm hoặc ngừng thuốc mê","Dùng thuốc co mạch (phenylephrine, ephedrine)","Nếu nặng: epinephrine 10–100 mcg TM và/hoặc vasopressin 0,5–1 đơn vị TM"]},{"task":"Liên hệ ngân hàng máu","actions":["Gửi mẫu xét nghiệm phù hợp và trả lại đơn vị máu theo quy trình của cơ sở","Kiểm tra lại định danh người bệnh và nhãn đơn vị máu"]},{"task":"Xử trí đặc hiệu: phản ứng tan máu","actions":["Theo dõi dấu hiệu DIC (xét nghiệm đông máu, fibrinogen, tiểu cầu)","Duy trì lượng nước tiểu bằng truyền dịch tĩnh mạch và thuốc lợi tiểu","Theo dõi huyết sắc tố niệu, kali máu và chức năng thận"]},{"task":"Xử trí đặc hiệu: phản ứng sốt","actions":["Hạ sốt bằng acetaminophen 1000 mg đường tĩnh mạch","Loại trừ phản ứng tan máu","Loại trừ nhiễm khuẩn do chế phẩm máu nhiễm bẩn"]},{"task":"Xử trí đặc hiệu: phản ứng phản vệ","actions":["Tiêm bolus epinephrine, sau đó truyền liên tục epinephrine","Cân nhắc corticosteroid: dexamethasone 4–8 mg TM hoặc hydrocortisone 100 mg TM","Kháng histamine: diphenhydramine 25–50 mg TM và famotidine 20 mg TM"]},{"task":"Sau xử trí","actions":["Có thể cần chuyển hồi sức tích cực (ICU) để theo dõi tiếp"]}],"drugs":[{"name":"Epinephrine","adult":"10–100 mcg TM (phản ứng nặng); bolus rồi truyền liên tục t ":2,"pedUnit":"mg/kg TM","pedMax":100,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Dùng cho phản ứng phản vệ"},{"name":"Diphenhydramine","adult":"25–50 mg TM","amount":null,"unit":"mg","route":"TM","repeat":"","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":1,"pedUnit":"mg/kg TM","pedMax":50,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Kháng histamine H1"},{"name":"Famotidine","adult":"20 mg TM","amount":20,"unit":"mg","route":"TM","repeat":"","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":0.25,"pedUnit":"mg/kg TM","pedMax":20,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Kháng histamine H2"}],"causes":["Truyền nhầm nhóm máu ABO (tan máu cấp)","Kháng thể kháng bạch cầu/cytokine trong chế phẩm (phản ứng sốt)","Thiếu hụt IgA hoặc dị ứng protein huyết tương (phản vệ)","Chế phẩm máu nhiễm khuẩn"],"notes":["Luôn giữ lại túi máu và dây truyền để gửi ngân hàng máu điều tra","Sốt trong khi truyền máu phải luôn được coi là tan máu cấp hoặc nhiễm khuẩn cho tới khi loại trừ được","Trong gây mê toàn thân, tụt huyết áp và rỉ máu lan toả tại vết mổ có thể là dấu hiệu duy nhất của phản ứng tan máu"],"short":"Phản ứng truyền máu","grp":"anes"},{"id":"trauma","no":26,"title":"Chấn thương","definition":"Người bệnh bị chấn thương do lực tác động mạnh (chấn thương kín) hoặc vết thương xuyên thấu vào các cơ quan trọng yếu, cần hồi sức và can thiệp phẫu thuật khẩn cấp.","signs":["Cơ chế chấn thương năng lượng cao hoặc vết thương xuyên thấu","Sốc mất máu: tụt huyết áp, nhịp nhanh, da lạnh ẩm","Rối loạn ý thức (điểm Glasgow giảm)","Suy hô hấp, tràn khí hoặc tràn máu màng phổi","Chảy máu ngoài không kiểm soát"],"tasks":[{"task":"Huy động nguồn lực khủng hoảng","actions":["Gọi báo động chấn thương (mã chấn thương)","Kích hoạt phòng mổ chấn thương","Kích hoạt phác đồ truyền máu khối lượng lớn (MTP)"]},{"task":"Khi người bệnh vào phòng mổ","actions":["Tất cả thành viên ê-kíp nêu tên và vai trò; giao tiếp vòng kín rõ ràng; ghi chép diễn biến","Kiểm tra mạch. Nếu không có mạch: bắt đầu ACLS đồng thời truyền máu và tìm nguyên nhân có thể đảo ngược","Lắp monitor tiêu chuẩn và bảo đảm có đường truyền tĩnh mạch lớn","Duy trì bất động cột sống cổ khi di chuyển người bệnh"]},{"task":"Khảo sát ban đầu — A: Đường thở và hô hấp","actions":["Đánh giá đường thở, bảo đảm oxy hoá và thông khí","Đặt nội khí quản khi có chỉ định; khuyến cáo khởi mê nhanh (RSI) với đèn soi thanh quản video, xác nhận vị trí ống bằng nội soi và capnography","Nếu tụt huyết áp: đổi hoặc bỏ thuốc mê","Nếu có chỉ định: phẫu thuật mở đường thở","Điều trị tràn khí hoặc tràn máu màng phổi bằng dẫn lưu màng phổi cấp cứu"]},{"task":"Khảo sát ban đầu — C: Tuần hoàn","actions":["Kiểm soát chảy máu ngoài","Ưu tiên truyền máu hơn bolus dịch tinh thể","Thực hiện FAST: siêu âm đánh giá nhanh tại giường tìm chấn thương/dịch tự do"]},{"task":"Khảo sát ban đầu — D: Thần kinh","actions":["Đánh giá mức độ ý thức, đồng tử, đường huyết và thang điểm hôn mê Glasgow (GCS)"]},{"task":"Khảo sát ban đầu — E: Bộc lộ","actions":["Bộc lộ toàn thân để đánh giá đầy đủ tổn thương","Sau đó che ấm để phòng hạ thân nhiệt"]},{"task":"Khảo sát thì hai","actions":["Khai thác bệnh sử đầy đủ: dị ứng, thuốc đang dùng, tiền sử bệnh, bữa ăn cuối, các sự kiện dẫn đến chấn thương","AT MIST: tuổi, thời gian bị thương, cơ chế chấn thương, tổn thương ghi nhận, dấu hiệu sinh tồn, xử trí đã thực hiện","Khám toàn thân từ đầu đến chân và đánh giá hình ảnh X-quang"]},{"task":"Chuẩn bị phòng mổ (trước và khi người bệnh vào)","actions":["Sưởi ấm phòng mổ > 25 °C (77 °F) để duy trì thân nhiệt","Chuẩn bị máy gây mê, hệ thống hút, monitor, dụng cụ đường thở (đèn soi thanh quản, bộ mở đường thở phẫu thuật)","Chuẩn bị bộ dụng cụ đường truyền tĩnh mạch và trong xương (IO), thiết bị truyền dịch nhanh, máy siêu âm, xe cấp cứu, monitor xâm lấn (đường động mạch, CVP), máy thu hồi máu tự thân (cell saver)","Chuẩn bị thuốc: midazolam, ketamine, propofol, etomidate, scopolamine, succinylcholine, rocuronium, epinephrine, vasopressin, ephedrine, phenylephrine, canxi, kháng sinh","Kiểm tra sẵn có: dịch tinh thể, dịch keo và chế phẩm máu (MTP)"]},{"task":"Khởi mê và kiểm soát đường thở","actions":["Lắp monitor tiêu chuẩn ASA và cho thở oxy trước khởi mê","Nếu người bệnh còn tỉnh: trấn an ngắn gọn","Thống nhất với ê-kíp (gây mê, phẫu thuật, điều dưỡng) về thời điểm và thứ tự ưu tiên: đặt đường truyền tĩnh mạch/động mạch, khởi mê, kiểm soát đường thở, hồi sức chảy máu và thời điểm rạch da","Khởi mê nhanh (RSI) kèm bất động cột sống cổ","Đặt thêm đường truyền tĩnh mạch và đường động mạch","Nếu huyết động ổn định: duy trì mê bằng thuốc mê bốc hơi","Nếu huyết động không ổn định: duy trì mê bằng benzodiazepine hoặc ketamine","Nếu mất ổn định nghiêm trọng: thông báo cho phẫu thuật viên; thảo luận biện pháp tạm thời (nhét gạc chèn, chèn ép động mạch chủ, kẹp động mạch chủ, thrombin, keo fibrin, REBOA)"]},{"task":"Truyền máu","actions":["Dựa trên hình ảnh lâm sàng: truyền theo tỷ lệ 1–2 khối hồng cầu : 1 huyết tương tươi đông lạnh : 1 khối tiểu cầu","Rối loạn đông máu có thể cần tủa lạnh, fibrinogen, canxi, TXA"]},{"task":"Chấn thương sọ não","actions":["Duy trì áp lực tưới máu não (CPP) đồng thời giảm áp lực nội sọ (ICP)","Mục tiêu: MAP ≥ 80 mmHg, HA tâm thu ≥ 100 mmHg, SpO2 ≥ 90%, EtCO2 35–40 mmHg","Dùng mannitol hoặc dung dịch muối ưu trương, tư thế đầu cao","Kiểm soát chảy máu và ngăn ngừa vỡ khối máu tụ","Xét nghiệm nối tiếp: phản ứng chéo, khí máu động mạch, điện giải, lactate, đông máu"]},{"task":"Thuốc","actions":["Nếu < 3 giờ sau chấn thương: acid tranexamic (TXA) 1 g TM trong 10 phút, sau đó 1 g mỗi 8 giờ","Bổ sung canxi để hỗ trợ đông máu và huyết áp","Điều trị tăng kali máu: canxi clorua 1 g TM; natri bicarbonate 1 ống TM (50 mEq); insulin thường 5–10 đơn vị TM kèm dextrose/D50 1 ống TM (25 g)"]},{"task":"Sau sự kiện","actions":["Chuyển hồi sức tích cực (ICU) để tiếp tục hồi sức"]}],"drugs":[{"name":"Acid tranexamic (TXA)","adult":"1 g TM trong 10 ns":["Duy trì nhận thức tình huống","Biết mọi thứ vận hành thế nào và mọi thứ ở đâu","Nhận thức điểm mạnh và điểm yếu của môi trường làm việc"]},{"task":"Sử dụng mọi thông tin sẵn có","actions":["Giám sát nhiều luồng dữ liệu và thông tin","Kiểm tra chéo và đối chiếu thông tin"]},{"task":"Phân phối khối lượng công việc","actions":["Giao nhiệm vụ cụ thể cho từng thành viên theo năng lực của họ","Phân phối lại công việc nếu có người quá tải hoặc mắc lỗi"]},{"task":"Phân bổ sự chú ý một cách hợp lý","actions":["Loại bỏ hoặc giảm bớt yếu tố gây xao nhãng","Theo dõi tình trạng quá tải dữ liệu và bão hoà công việc","Tránh bị dán chặt vào một chi tiết (fixation error)","Huy động người khác hỗ trợ giám sát"]},{"task":"Huy động nguồn lực","actions":["Kích hoạt tất cả các nguồn lực hữu ích, bao gồm thiết bị và nhân sự bổ sung"]},{"task":"Giao tiếp hiệu quả","actions":["Ra y lệnh và yêu cầu rõ ràng","Yêu cầu xác nhận đã nhận y lệnh (giao tiếp vòng kín)","Tránh phát ngôn chung chung, không rõ người nhận","Khuyến khích đóng góp ý kiến và bầu không khí trao đổi cởi mở giữa tất cả nhân viên"]},{"task":"Sử dụng công cụ hỗ trợ nhận thức (cognitive aids)","actions":["Làm quen trước với nội dung, bố cục và vị trí của tài liệu","Hỗ trợ việc sử dụng hiệu quả các công cụ hỗ trợ nhận thức trong khủng hoảng"]}],"drugs":[],"causes":[],"notes":["10 điểm then chốt của CRM: gọi trợ giúp sớm, chỉ định người lãnh đạo, dự đoán và lập kế hoạch, thiết lập vai trò rõ ràng, biết rõ môi trường, sử dụng mọi thông tin sẵn có, phân phối khối lượng công việc, phân bổ sự chú ý hợp lý, huy động nguồn lực, giao tiếp hiệu quả, sử dụng công cụ hỗ trợ nhận thức","Sơ đồ CRM © 2008: S. Goldhaber-Fiebert, K. McCowan, K. Harrison, R. Fanning, S. Howard, D. Gaba","Người đọc công cụ hỗ trợ nhận thức (reader) nên là một người riêng biệt, không phải người trực tiếp làm thủ thuật"],"short":"Quản lý khủng hoảng","grp":"anes"},{"id":"infusion-table","no":29,"title":"Danh sách pha truyền","infusions":[{"name":"Amiodarone"," /D5W","conc":4,"concUnit":"mcg/mL","dose":"Truyền 1–5 mcg/phút (không tính theo cân nặng)","doseLo":1,"doseHi":5,"doseUnit":"mcg/phút","weightBased":false},{"name":"Lidocaine (Xylocaine)","mix":"2 g trong 250 mL NS","conc":8,"concUnit":"mg/mL","dose":"Liều tải 1–1,5 mg/kg; truyền 1–2 mg/kg/giờ","doseLo":1,"doseHi":2,"doseUnit":"mg/kg/giờ","weightBased":true},{"name":"Milrinone (Primacor)","mix":"20 mg trong 100 mL D5W","conc":200,"concUnit":"mcg/mL","dose":"Liều tải 50–75 mcg/kg trong 10 phút; truyền 0,375–0,75 mcg/kg/phút","doseLo":0.375,"doseHi":0.75,"doseUnit":"mcg/kg/phút","weightBased":true},{"name":"Nesiritide (BNP)","mix":"1,5 mg trong 250 mL D5W","conc":6,"concUnit":"mcg/mL","dose":"Liều tải 2 mcg/kg trong 1 phút; truyền 0,01 mcg/kg/phút","doseLo":0.01,"doseHi":0.01,"doseUnit":"mcg/kg/phút","weightBased":true},{"name":"Nicardipine (Cardene)","mix":"40 mg trong 200 mL","conc":0.2,"concUnit":"mg/mL","dose":"Truyền 5–15 mg/giờ (không tính theo cân nặng)","doseLo":5,"doseHi":15,"doseUnit":"mg/giờ","weightBased":false},{"name":"Nitroglycerin (Tridil)","mix":"50 mg trong 250 mL D5W","conc":200,"concUnit":"mcg/mL","dose":"Truyền 0,1–1 mcg/kg/phút","doseLo":0.1,"doseHi":1,"doseUnit":"mcg/kg/phút","weightBased":true},{"name":"Nitroprusside (Nipride)","mix":"50 mg trong 250 mL NS","conc":200,"concUnit":"mcg/mL","dose":"Truyền 0,1–1 mcg/kg/phút","doseLo":0.1,"doseHi":1,"doseUnit":"mcg/kg/phút","weightBased":true},{"name":"Norepinephrine (Levophed)","mix":"4 mg trong 250 mL NS","conc":16,"concUnit":"mcg/mL","dose":"Truyền 0,02–0,3 mcg/kg/phút (20–300 nanogam/kg/phút)","doseLo":0.02,"doseHi":0.3,"doseUnit":"mcg/kg/phút","weightBased":true},{"name":"Phenylephrine (Neosynephrine)","mix":"40 mg trong 250 mL NS","conc":160,"concUnit":"mcg/mL","dose":"Truyền 0,1–1 mcg/kg/phút (hoặc 5–100 mcg/phút)","doseLo":0.1,"doseHi":1,"doseUnit":"mcg/kg/phút","weightBased":true},{"name":"Remifentanil (Ultiva)","mix":"2000 mcg (2 mg) trong 40 mL NS","conc":50,"concUnit":"mcg/mL","dose":"Tr  quản","Đưa ống hút mềm qua ống nội khí quản để kiểm tra gấp khúc hoặc nút nhầy","Kiểm tra xem đường thở trên thanh môn có bị lệch vị trí không"]},{"task":"Thuốc","actions":["Nếu nặng: epinephrine 5–10 mcg TM mỗi 3–5 phút, hoặc 200 mcg tiêm dưới da; tăng liều nếu cần","Cân nhắc thêm glycopyrrolate 0,2–0,4 mg TM","Theo dõi nhịp tim nhanh và tăng huyết áp","Nếu có thở rít hoặc nhịp tim nhanh: khí dung L-epinephrine racemic 0,5 mL dung dịch 2,25% pha trong 3 mL nước muối sinh lý (có thể thay bằng adrenalin 0,25–1 mg khí dung)","Nếu thông khí được, dùng thuốc giãn phế quản: albuterol 4–8 nhát xịt MDI hoặc 2,5 mg khí dung, có hoặc không kèm ipratropium","Cân nhắc ketamine 10–50 mg TM, magnesi sulfat 1–2 g TM, hoặc hydrocortisone 100 mg TM"]},{"task":"Xét nghiệm","actions":["Xem xét làm khí máu động mạch (ABG) và tryptase huyết thanh"]},{"task":"ECMO/CPB","actions":["Nếu nặng: cân nhắc ECMO hoặc tuần hoàn ngoài cơ thể"]}],"drugs":[{"name":"Epinephrine (Adrenalin)","adult":"5–10 mcg TM mỗi 3–5 phút, hoặc 200 mcg tiêm dưới da","amountLo":5,"amountHi":10,"unit":"mcg","route":"TM chuẩn độ, hoặc tiêm dưới da","repeat":"Mỗi 3–5 phút, tăng liều nếu cần","perKg":null,"pedPerKg":1,"pedUnit":"mcg/kg","pedMax":10,"note":"Theo dõi nhịp tim nhanh và tăng huyết áp"},{"name":"L-epinephrine racemic khí dung","adult":"0,5 mL dung dịch 2,25% pha trong 3 mL NaCl 0,9%","amountLo":0.5,"amountHi":0.5,"unit":"mL dung dịch 2,25%","route":"Khí dung","repeat":"Nhắc lại theo đáp ứng","perKg":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"note":"Ghi chú trên bản in: có thể thay bằng adrenalin 0,25–1 mg khí dung. Dùng khi có thở rít hoặc nhịp tim nhanh"},{"name":"Albuterol (Salbutamol)","adult":"4–8 nhát xịt MDI hoặc 2,5 mg khí dung","amountLo":4,"amountHi":8,"unit":"nhát xịt MDI","route":"Hít, có hoặc không kèm ipratropium","repeat":"Nhắc lại theo đáp ứng","perKg":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"note":"Khí dung nhi: 2,5 mg (<20 kg), 5 mg (≥20 kg)"},{"name":"Glycopyrrolate","ad  bệnh nhân (ống nội khí quản, khí quản, phế quản) trong lúc phẫu thuật. Nhận biết bằng tiếng nổ, tia lửa, ngọn lửa, khói, nhiệt hoặc mùi khét xuất hiện đột ngột.","signs":["Tiếng nổ hoặc tia lửa đột ngột","Ngọn lửa nhìn thấy được","Khói","Nhiệt bất thường","Mùi khét đột ngột"],"tasks":[{"task":"Huy động nguồn lực","actions":["Thông báo cho toàn nhóm","Xác định người chỉ huy","Gọi hỗ trợ"]},{"task":"Xử trí tức thì của bác sĩ gây mê","actions":["Ngắt hệ thống dây thở khỏi máy gây mê để ngăn ống nội khí quản trở thành 'ngọn đuốc'","Ngắt toàn bộ dòng khí mới"]},{"task":"Xử trí tức thì của phẫu thuật viên","actions":["Nếu có sẵn kẹp: kẹp ngay ống nội khí quản","Nếu không có kẹp: gập (bẻ gập) ống nội khí quản để chặn dòng khí nếu hệ thống dây thở chưa được ngắt","Rút ngay ống nội khí quản và mọi dị vật trong đường thở","Đổ nước muối sinh lý vào đường thở và hút sạch các mảnh vụn"]},{"task":"Đánh giá mức độ lan của ngọn lửa","actions":["Nếu lửa lan ra ngoài đường thở (ví dụ cháy toan trải, cháy trên người bệnh nhân): xem phác đồ Cháy ngoài đường thở #11"]},{"task":"Sau khi đã dập tắt lửa","actions":["Thiết lập lại cung cấp oxy sau khi lửa đã tắt hoàn toàn; giảm FiO2 xuống thấp nhất có thể","Cân nhắc thông khí","Cân nhắc đặt lại nội khí quản sớm bằng ống có đường kính trong ≥ 7,0 mm trước khi phù nề tiến triển","Đảm bảo độ mê đầy đủ, ví dụ truyền propofol","Nội soi phế quản toàn bộ đường thở để đánh giá tổn thương và lấy hết mảnh vụn còn sót","Kiểm tra ống nội khí quản đã rút để xác nhận không còn mảnh nào sót lại trong đường thở","Lưu giữ toàn bộ vật liệu liên quan để điều tra sau","Cân nhắc corticosteroid, ví dụ dexamethasone 8 mg tiêm tĩnh mạch"]},{"task":"Bố trí sau xử trí","actions":["Chuyển hồi sức tích cực (ICU) để thở máy kéo dài và theo dõi đường thở"]},{"task":"Dự phòng — với mọi thủ thuật nguy cơ cao","actions":["Thảo luận trước mổ về phòng ngừa và ứng phó cháy trong thời gian chờ (time-out)","Tránh FiO2 > 0,3 và tránh N2O","Bác sĩ gây mê: thông báo cho nhóm mỗi khi thay đổi FiO2","Phẫu thuật viên: thông báo khi sử dụng laser hoặc dao điện"]},{"task":"Dự phòng — phẫu thuật laser thanh quản hoặc dây thanh","actions":["Dùng ống nội khí quản chống laser (loại một hoặc hai bóng chèn)","Đảm bảo bóng chèn ống nội khí quản nằm đủ thấp dưới dây thanh","Cân nhắc bơm bóng chèn bằng nước muối sinh lý pha xanh methylen","Phẫu thuật viên: giữ laser ở chế độ chờ (standby) khi không sử dụng","Phẫu thuật viên: bảo vệ bóng chèn ống nội soi bằng gạc ướt","Phẫu thuật viên: xác nhận FiO2 < 0,3 và không dùng N2O trước khi chiếu laser hoặc dùng dao điện","Bác sĩ gây mê: thông báo mỗi khi thay đổi FiO2"]},{"task":"Dự phòng — phẫu thuật vùng hầu họng không dùng laser","actions":["Có thể dùng ống nội khí quản PVC thông thường","Phẫu thuật viên: bảo vệ bóng chèn ống nội soi bằng gạc ướt","Cân nhắc hút liên tục bên trong hầu họng","Phẫu thuật viên: xác nhận FiO2 < 0,3 và không có N2O trước khi dùng dao điện","Bác sĩ gây mê: thông báo mỗi khi thay đổi FiO2"]}],"drugs":[{"name":"Dexamethasone","adult":"8 mg","amount":8,"unit":"mg","route":"TM","repeat":"","perKg":null,"pedPerKg":0.5,"pedUnit":"mg/kg","pedMax":8,"note":"Giảm phù nề đường thở sau bỏng đường thở"},{"name":"Propofol","adult":"Truyền liên tục để duy trì mê","amount":null,"unit":null,"route":"Truyền TM liên tục","repeat":"","perKg":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"note":"Duy trì đủ độ mê sau khi mất đường dẫn thuốc mê bốc hơi"}],"causes":[],"notes":["Tam giác cháy: Nguy cơ cháy = Nhiên liệu + Chất oxy hóa + Nguồn đánh lửa","Nhiên liệu: ống nội khí quản, gạc, toan trải, cồn sát khuẩn, tóc, mô","Chất oxy hóa: O2 và N2O","Nguồn đánh lửa: laser, dao điện, đầu đốt, nguồn sáng nội soi","Nguyên tắc cốt lõi: ngắt khí mới + rút ống nội khí quản + đổ nước muối là ba động tác đầu tiên","Không thiết lập lại oxy cho tới khi chắc chắn lửa đã tắt hoàn toàn"],"short":"Cháy đường thở","grp":"resp"},{"id":"high-airway-pressure","no":3,"title":"Áp lực đường thở cao","definition":"Áp lực đường thở đỉnh tăng > 5 cmH2O so với mức nền của bệnh nhân, hoặc áp lực đỉnh > 35 cmH2O.","signs":["Thở rít/khò khè và dạng sóng CO2 có sườn lên dốc (gợi ý co thắt phế quản)","EtCO2 tăng","Thể tích khí lưu thông giảm","Tụt huyết áp (nếu có bẫy khí)"],"tasks":[{"task":"Huy động nguồn lực","actions":["Thông báo cho cả kíp","Xác định người chỉ huy","Gọi người hỗ trợ"]},{"task":"Đường thở","actions":["FiO2 100%, lưu lượng oxy 10–15 L/phút","Xác nhận có dạng sóng CO2 (EtCO2)","Đánh giá dạng sóng capnography: sườn lên dốc gợi ý tắc nghẽn; khuyết curare cuối thì thở ra gợi ý giãn cơ tồn dư/ức chế thần kinh cơ chưa đủ","Kiểm tra từ bệnh nhân trở ra: toàn bộ hệ thống dây thở, van, các khớp nối và dây lấy mẫu khí"]},{"task":"Loại trừ bẫy khí","actions":["Ngắt kết nối dây máy thở khỏi ống nội khí quản hoặc SGA/LMA để loại trừ bẫy khí (auto-PEEP)"]},{"task":"Khu trú vị trí vấn đề","actions":["Trong lúc ngắt kết nối, bóp bóng dự trữ để kiểm tra","Nếu áp lực vẫn CAO (vấn đề ở máy gây mê hoặc hệ thống dây thở): chuyển sang bóng tự phồng (Ambu) nối với nguồn oxy và đường lấy mẫu khí","Nếu áp lực thấp hoặc bình thường (vấn đề ở ống nội khí quản hoặc ở phổi): nối lại hệ thống máy gây mê"]},{"task":"Tối ưu hóa độ mê / độ giãn cơ","actions":["Cân nhắc làm sâu mê: ví dụ propofol 20 mg TM","Cân nhắc thêm thuốc giãn cơ","Nếu bơm hơi ổ bụng: giảm hoặc xả áp lực bơm hơi","Đánh giá tư thế bệnh nhân: nếu tư thế đầu thấp (Trendelenburg) cân nhắc chuyển về nằm ngang hoặc đầu cao; nếu nằm sấp cân nhắc lật ngửa","Nếu do banh kéo phẫu thuật: thông báo cho phẫu thuật viên","Kiểm tra bệnh nhân có bị xê dịch tư thế không (ví dụ trượt khỏi giá đỡ khi nằm sấp)"]},{"task":"Thông khí bằng tay","actions":["Chuyển sang bóp tay bằng máy gây mê để đánh giá độ giãn nở (compliance)","Kiểm tra và điều chỉnh van giới hạn áp lực có thể điều chỉnh (APL)"]},{"task":"Kiểm tra tắc nghẽn ống nội khí quản","actions":["Luồn ống hút mềm để loại trừ ống nội khí quản bị gập hoặc dịch tiết đặc (nút nhầy)","Cân nhắc nội soi phế q
