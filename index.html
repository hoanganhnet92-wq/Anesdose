function locWeight(){ return (IBW()>0 && P.wt > IBW()*1.2) ? AdjBW() : P.wt; }

function locDrug(){ return LOCALS[LOC_SEL.drug] || LOCALS[0]; }
function locConc(){
  const d = locDrug();
  const c = LOC_SEL.conc;
  return (c != null && d.concs.includes(c)) ? c : d.concs[0];   // mặc định nồng độ thấp nhất
}

/* Bảng block: mỗi dòng quy ra mg theo thuốc và nồng độ đang chọn, so với liều tối đa */
function blockRows(){
  const d = locDrug(), c = locConc(), w = locWeight();
  const maxMg = d.plain * w;
  let h = "";
  for(const grp of BLOCKS){
    h += `<div class="blkgrp">${grp.g}</div>`;
    for(const b of grp.items){
      const sides = (b.bil && LOC_SEL.bil) ? 2 : 1;
      const vLo = b.lo*sides, vHi = b.hi*sides;
      const mgLo = vLo*c*10, mgHi = vHi*c*10;      // 1 % = 10 mg/mL
      const over = mgHi > maxMg, overAll = mgLo > maxMg;
      const pct = Math.round(mgHi/maxMg*100);
      h += `<div class="blk${over?" over":""}">
        <div class="bhead"><span class="nm">${b.n}${sides===2?' <span class="tag">2 bên</span>':""}</span>
          <span class="dose">${b.lo===b.hi?sig(vLo):sig(vLo)+"–"+sig(vHi)} mL</span></div>
        <div class="sub">= ${b.lo===b.hi?sig(mgLo):sig(mgLo)+"–"+sig(mgHi)} mg · <b>${pct} %</b> liều tối đa
          ${overAll ? `· <b style="color:var(--danger)">VƯỢT liều tối đa ${sig(maxMg)} mg — phải pha loãng hoặc giảm thể tích</b>`
            : over ? `· <b style="color:var(--warn)">đầu trên của khoảng vượt ${sig(maxMg)} mg — dùng mức thấp hoặc pha loãng</b>` : ""}
          ${b.note?`<br>${b.note}`:""}</div></div>`;
    }
  }
  return h;
}

function updateBlockTable(){
  const el = $("blkBody"); if(el) el.innerHTML = blockRows();
  const d = locDrug(), c = locConc(), w = locWeight();
  const cap = $("blkCap");
  if(cap) cap.innerHTML = `${d.n} ${c} % (${c*10} mg/mL) · liều tối đa không adrenalin <b>${sig(d.plain*w)} mg</b>
    = <b>${sig(d.plain*w/(c*10))} mL</b> · có adrenalin ${sig(d.epi*w)} mg`;
  $("p-local").querySelectorAll("[data-ldrug]").forEach(b => b.classList.toggle("on", +b.dataset.ldrug === LOC_SEL.drug));
  $("p-local").querySelectorAll("[data-lconc]").forEach(b => b.classList.toggle("on", +b.dataset.lconc === c));
  const bb = $("blkBil"); if(bb) bb.classList.toggle("on", LOC_SEL.bil);
}

function caudalCard(){
  if(!isPed()) return "";
  const w = P.wt;
  const rows = [
   ["Vùng cùng cụt", 0.5, "Bao quy đầu, hậu môn — tê tới khoảng S2–L4"],
   ["Dưới rốn", 1.0, "Thoát vị bẹn, tinh hoàn ẩn — tê tới khoảng T10"],
   ["Trên rốn thấp", 1.25, "Tê tới khoảng T6–T8; thể tích lớn, kiểm tra kỹ liều tối đa"]
  ];
  const conc = 0.25;                                   // bupivacain 0,25 %
  const maxMg = 2.5 * w;                               // trần bupivacain ở trẻ em
  let h = `<div class="card"><h2>Gây tê khoang cùng (caudal) — trẻ em</h2>`;
  for(const [n, mlkg, s] of rows){
    let v = mlkg*w, capped = false;
    if(v > 25){ v = 25; capped = true; }
    const mg = v*conc*10;
    const over = mg > maxMg;
    h += `<div class="row${over?" danger":""}"><div class="nm">${n}</div>
      <div class="val">${sig(v)} mL<small>${mlkg} mL/kg × ${sig(w)} kg</small></div>
      <div class="sub">Bupivacain 0,25 % ⇒ ${sig(mg)} mg${capped?" · <b>giới hạn 25 mL</b>":""}
        ${over?` · <b style="color:var(--danger)">vượt trần ${sig(maxMg)} mg (2,5 mg/kg) — dùng bupivacain 0,125 %</b>`:""}<br>${s}</div></div>`;
  }
  h += `<div class="note">Công thức Armitage. Thuốc thường dùng: bupivacain 0,25 % hoặc ropivacain 0,2 %.
    Có thể thêm clonidin 1–2 mcg/kg để kéo dài tác dụng (theo dõi an thần và chậm nhịp tim).
    Hút thử trước khi bơm, bơm chậm chia nhỏ, theo dõi điện tim tìm dấu hiệu tiêm vào mạch.
    Chống chỉ định: nhiễm trùng vùng chọc, dị tật cột sống vùng cùng cụt, rối loạn đông máu.</div></div>`;
  return h;
}

function renderLocal(){
  const w = locWeight();
  const d = locDrug(), c = locConc();
  let h = `<div class="banner dg"><b>Liều tối đa an toàn</b> — tính theo ${sig(w)} kg. Ở người béo phì dùng cân nặng hiệu chỉnh; ở trẻ nhỏ, người suy gan/tim, thai phụ cần giảm thêm. Luôn hút thử trước khi bơm, tiêm chậm và chia nhỏ liều.</div>`;

  h += `<div class="card"><h2>Thuốc tê — liều tối đa</h2><div class="scrollx"><table>
   <tr><th>Thuốc</th><th class="n">Không adrenalin</th><th class="n">Có adrenalin</th><th>Thể tích tối đa theo nồng độ</th></tr>`;
  for(const L of LOCALS){
    const mgP = L.plain*w, mgE = L.epi*w;
    const vols = L.concs.map(x => `${x} %: <b>${sig(mgP/(x*10))}</b> mL`).join(" · ");
    h += `<tr><td><b>${L.n}</b><div style="font-size:11px;color:var(--muted)">${L.plain} / ${L.epi} mg/kg</div></td>
      <td class="n hl">${sig(mgP)} mg</td><td class="n">${sig(mgE)} mg</td>
      <td style="font-size:12px">${vols}<div style="font-size:11px;color:var(--muted)">(cột không adrenalin)</div></td></tr>`;
  }
  h += `</table></div><div class="note">1 % = 10 mg/mL. Ví dụ bupivacain 0,5 % ⇒ 5 mg/mL.<br>
    <b>LAST — ngộ độc thuốc tê toàn thân:</b> ngừng tiêm, gọi hỗ trợ, kiểm soát đường thở với oxy 100 %, cắt co giật bằng benzodiazepin,
    Intralipid 20 % <b>${sig(1.5*P.wt)} mL</b> bolus rồi truyền <b>${sig(15*P.wt/60)} mL/phút</b> (15 mL/kg/h). Tránh dùng propofol liều lớn để hồi sức.</div></div>`;

  // Bảng block ngoại vi
  h += `<div class="card"><h2>Thể tích gợi ý theo từng block</h2>
    <div class="ctxrow" style="padding:12px 14px 0">
      ${LOCALS.map((L,i)=>`<button type="button" data-ldrug="${i}">${L.n}</button>`).join("")}
    </div>
    <div class="ctxrow" style="padding:8px 14px 0">
      ${d.concs.map(x=>`<button type="button" data-lconc="${x}">${x} %</button>`).join("")}
      <button type="button" id="blkBil">Block thân mình 2 bên</button>
    </div>
    <div class="note" id="blkCap" style="border-top:none;background:var(--card)"></div>
    <div id="blkBody">${blockRows()}</div>
    <div class="note">Thể tích là mức thường dùng dưới hướng dẫn siêu âm, cần chỉnh theo cỡ người bệnh và mục tiêu phong bế.
      Phần trăm liều tối đa tính theo cân nặng ở đầu trang — nhớ cộng cả thuốc tê đã dùng để gây tê tại chỗ hoặc thấm vết mổ.</div></div>`;

  // Tê tuỷ / ngoài màng cứng
  h += `<div class="card"><h2>Tê tuỷ sống và ngoài màng cứng</h2>`;
  for(const n of NEURAXIAL)
    h += `<div class="row step"><div class="nm">${n.n}</div><div class="sub">${n.v}<br>${n.s}</div></div>`;
  h += `<div class="note">Luôn kiểm tra tiểu cầu, thuốc chống đông và dấu hiệu nhiễm trùng vùng chọc trước khi làm.
    Theo dõi vận động và cảm giác sau mổ để phát hiện sớm máu tụ ngoài màng cứng — yếu chân mới xuất hiện hoặc tê kéo dài bất thường phải chụp cộng hưởng từ khẩn.</div></div>`;

  h += caudalCard();

  h += `<div class="note" style="text-align:center;background:var(--card)">Khoảng chờ thuốc chống đông trước khi gây tê trục thần kinh đã chuyển sang <b>tab Chống đông → Gây tê vùng</b>.</div>`;

  $("p-local").innerHTML = h;

  $("p-local").querySelectorAll("[data-ldrug]").forEach(b => b.addEventListener("click", () => {
    LOC_SEL.drug = +b.dataset.ldrug; LOC_SEL.conc = null; renderLocal();
  }));
  $("p-local").querySelectorAll("[data-lconc]").forEach(b => b.addEventListener("click", () => {
    LOC_SEL.conc = +b.dataset.lconc; updateBlockTable();
  }));
  const bb = $("blkBil");
  if(bb) bb.addEventListener("click", () => { LOC_SEL.bil = !LOC_SEL.bil; updateBlockTable(); });
  updateBlockTable();
}

/* Salbutamol tĩnh mạch — co thắt phế quản (thẻ riêng vì liều nạp và liều truyền khác cấu trúc) */
function salbutamolCard(){
  const w = P.wt, ped = P.ageY < 12;
  const CONC_BOLUS = 50;    // mcg/mL sau khi pha 250 mcg / 5 mL
  const CONC_INF   = 100;   // mcg/mL — pha 5 mg / 50 mL (bơm tiêm điện), sửa được

  // Liều nạp
  const perKg = ped ? 15 : 4;
  let load = perKg * w; let capped = false;
  if(load > 250){ load = 250; capped = true; }
  const loadTime = ped ? "truyền trong 10 phút" : "tiêm chậm trong 5 phút";

  // Liều truyền duy trì
  let infLo, infHi, infTxt;
  if(ped){ infLo = 1*w; infHi = 2*w; infTxt = `1–2 mcg/kg/phút × ${sig(w)} kg`; }
  else   { infLo = 3;   infHi = 20;  infTxt = `3–20 mcg/phút (khởi đầu 5 mcg/phút)`; }
  const cIn = $("salbConc");
  const cInf = (cIn && num(cIn.value) > 0) ? num(cIn.value) : CONC_INF;
  const mlhLo = infLo*60/cInf, mlhHi = infHi*60/cInf;

  return `<div class="card"><h2>Co thắt phế quản — Salbutamol tĩnh mạch</h2>
   <div class="row danger"><div class="nm">Liều nạp (bolus)</div>
     <div class="val">${sig(load)} mcg<small>${sig(load/CONC_BOLUS)} mL @ 50 mcg/mL</small></div>
     <div class="sub">${perKg} mcg/kg × ${sig(w)} kg${capped?" · <b>giới hạn tối đa 250 mcg</b>":""} — ${loadTime}<br>
       Pha 250 mcg (0.5 mL ống 500 mcg/mL) với nước cất cho đủ 5 mL ⇒ 50 mcg/mL. Có thể nhắc lại nếu chưa đáp ứng.</div></div>
   <div class="row danger"><div class="nm">Truyền duy trì</div>
     <div class="val">${sig(infLo)}–${sig(infHi)} mcg/phút<small id="salbRate">${sig(mlhLo)}–${sig(mlhHi)} mL/h</small></div>
     <div class="sub">${infTxt}<br>
       Nồng độ pha: <span class="inline"><input id="salbConc" type="number" step="any" value="${cInf}"> mcg/mL</span>
       — mặc định 5 mg trong 50 mL (100 mcg/mL) chạy bơm tiêm điện; nếu truyền chai 5 mg/500 mL thì sửa thành 10.
       Chuẩn độ theo đáp ứng lâm sàng.</div></div>
   ${P.ageY < 2 ? `<div class="note" style="color:var(--danger)"><b>Lưu ý:</b> các phác đồ salbutamol tĩnh mạch được xây dựng cho trẻ trên 2 tuổi.
     Dưới 2 tuổi, co thắt phế quản thường do viêm tiểu phế quản và đáp ứng kém với thuốc giãn phế quản — cân nhắc kỹ chỉ định và hội chẩn hồi sức nhi.</div>` : ""}
   <div class="note"><b>Theo dõi bắt buộc:</b> nhịp tim, kali máu, đường huyết và khí máu — salbutamol TM gây nhịp nhanh, run cơ,
     hạ kali máu và toan lactic (toan lactic có thể làm bệnh nhân thở nhanh hơn và bị hiểu nhầm là hen nặng lên).
     ${ped?"Trẻ truyền trên 1 mcg/kg/phút cần được theo dõi tại hồi sức tích cực.":"Thận trọng ở bệnh mạch vành, loạn nhịp, cường giáp, thai phụ."}<br><br>
     <b>Trong gây mê, xử trí co thắt phế quản theo thứ tự:</b> FiO₂ 100 % → làm sâu mê (sevofluran, propofol, ketamin) →
     loại trừ nguyên nhân cơ học (ống vào sâu một bên, gập ống, đờm, mê nông) → salbutamol xịt qua ống nội khí quản →
     salbutamol tĩnh mạch hoặc magnesi sulfat khi đường hít không đủ hiệu quả. Nếu nghi phản vệ, adrenalin là thuốc hàng đầu.</div></div>`;
}

function vialFor(name, unit, route){
  const ctx = (name||"") + " " + (route||"");
  // Adrenalin tiêm bắp dùng ống nguyên 1:1000, không phải dung dịch pha loãng
  if(/epinephrin|adrenalin/i.test(name) && /bắp|\bIM\b/i.test(ctx) && !/TM|tĩnh mạch/i.test(ctx) && unit === "mcg")
    return {c:1000, label:"1000 mcg/mL — ống 1 mg/mL (1:1000), không pha loãng"};
  // Bơm qua ống nội khí quản dùng dung dịch 1:1000
  if(/epinephrin|adrenalin/i.test(name) && /nội khí quản|\bET\b/i.test(ctx)){
    if(unit === "mg")  return {c:1, label:"1 mg/mL (1:1000)"};
    if(unit === "mcg") return {c:1000, label:"1000 mcg/mL (1:1000)"};
  }
  for(const v of VIALS) if(v.re.test(name) && v.u === unit) return v;
  return null;
}

/* Tách đơn vị: "mg/kg TM trong 10 phút" -> {u:"mg", extra:"TM trong 10 phút"} */
const UNIT_RE = /^(đơn vị|mcg|mEq|mg|mL|g|J|ppm|nhát xịt|MAC)((?:\/(?:phút|giờ))*)\s*(.*)$/;
function parseUnit(raw){
  if(!raw) return {u:"", extra:""};
  const cleaned = String(raw).replace("/kg","").trim();
  const m = cleaned.match(UNIT_RE);
  if(!m) return {u:cleaned, extra:""};
  return {u:m[1]+m[2], extra:m[3]||""};
}
const baseUnit = u => (u||"").split("/")[0];

/* Tính liều cụ thể cho một thuốc theo bệnh nhân đang nhập */
function emDose(d){
  const ped = P.ageY < 14, w = P.wt;
  let lo=null, hi=null, unit="", extra="", basis="", pedFlag=false, capped=false;

  // Ưu tiên liều theo cân nặng do CHÍNH SÁCH ghi (đúng cho cả người lớn và trẻ em).
  // Chỉ dùng liều nhi bổ sung khi sách không có liều mg/kg.
  if(d.perKg == null && ped && d.pedPerKg != null && w > 0){
    const pu = parseUnit(d.pedUnit || "mg/kg");
    lo = d.pedPerKg * w; hi = lo; unit = pu.u; extra = pu.extra; pedFlag = true;
    basis = `${d.pedPerKg} ${d.pedUnit||"mg/kg"} × ${sig(w)} kg`;
    if(d.pedMax != null && hi > d.pedMax){ hi = d.pedMax; lo = Math.min(lo, d.pedMax); capped = true; }
  } else if(d.perKg != null && w > 0){
    const pu = parseUnit(d.perKgUnit || "mg/kg");
    lo = d.perKg * w; hi = (d.perKgHi != null ? d.perKgHi : d.perKg) * w;
    unit = pu.u; extra = pu.extra;
    basis = `${d.perKg}${d.perKgHi!=null?"–"+d.perKgHi:""} ${d.perKgUnit||"mg/kg"} × ${sig(w)} kg`;
  } else if(d.unit && /\/kg/.test(d.unit) && d.amountLo != null && w > 0){
    const pu = parseUnit(d.unit);
    lo = d.amountLo * w; hi = (d.amountHi != null ? d.amountHi : d.amountLo) * w;
    unit = pu.u; extra = pu.extra;
    basis = `${d.amountLo}${d.amountHi!=null&&d.amountHi!==d.amountLo?"–"+d.amountHi:""} ${d.unit} × ${sig(w)} kg`;
  } else if(d.amount != null || d.amountLo != null){
    lo = d.amountLo != null ? d.amountLo : d.amount;
    hi = d.amountHi != null ? d.amountHi : lo;
    unit = d.unit || ""; basis = "liều cố định cho người lớn theo sách";
  }
  return {lo, hi, unit, extra, basis, pedFlag, capped};
}

/* Tốc độ truyền liên tục */
function emInfusion(d){
  if(d.infusionLo == null) return null;
  const raw = d.infusionUnit || "";
  const perKg = /\/kg/.test(raw);
  const pu = parseUnit(raw);
  const lo = perKg ? d.infusionLo * P.wt : d.infusionLo;
  const hi = perKg ? (d.infusionHi != null ? d.infusionHi : d.infusionLo) * P.wt
                   : (d.infusionHi != null ? d.infusionHi : d.infusionLo);
  return {lo, hi, unit: pu.u, perKg, raw};
}

function emDrugRow(d){
  const r = emDose(d);
  const inf = emInfusion(d);
  let valHtml = "", volHtml = "";

  if(r.lo != null && isFinite(r.lo) && r.lo > 0){
    valHtml = rng(r.lo, r.hi, r.unit);
    const v = vialFor(d.name, baseUnit(r.unit), d.route);
    if(v) volHtml = `<b>${rng(r.lo/v.c, r.hi/v.c, "mL")}</b> @ ${v.label}`;
  } else if(inf){
    valHtml = rng(inf.lo, inf.hi, inf.unit);
  } else {
    valHtml = `<span class="asis">${d.adult || "—"}</span>`;
  }

  let sub = "";
  if(r.basis) sub += `<span class="mono">${r.basis}</span>`;
  if(r.capped) sub += ` · <b>giới hạn tối đa ${d.pedMax} ${baseUnit(r.unit)}</b>`;
  if(r.extra)  sub += ` · ${r.extra}`;
  if(d.route)  sub += `${sub?" · ":""}${d.route}`;
  if(d.repeat) sub += `${sub?" · ":""}${d.repeat}`;
  if(inf && r.lo != null && isFinite(r.lo) && r.lo > 0)
    sub += `<br><b>Truyền duy trì:</b> ${rng(inf.lo, inf.hi, inf.unit)}${inf.perKg?` (${d.infusionLo}–${d.infusionHi} ${d.infusionUnit})`:""}`;
  if(d.adult && r.basis) sub += `<br><i>Sách ghi: ${d.adult}</i>`;
  if(d.note) sub += `<br>${d.note}`;

  return `<div class="drug${r.pedFlag?" ped":""}">
    <div class="dhead"><span class="nm">${d.name}${r.pedFlag?' <span class="tag">liều nhi</span>':""}</span>
      <span class="dose">${valHtml}</span></div>
    ${volHtml ? `<div class="vol">${volHtml}</div>` : ""}
    <div class="sub">${sub}</div></div>`;
}

/* Bảng pha truyền (mục #29) */
function infusionTableCard(ev){
  let h = `<div class="card"><h2>${ev.title}</h2><table>
    <tr><th>Thuốc</th><th>Cách pha</th><th>Liều</th><th style="text-align:right">Tốc độ</th></tr>`;
  for(const f of ev.infusions){
    let rate = "—";
    const cu = parseUnit(f.concUnit || "");           // mg/mL, mcg/mL, đơn vị/mL
    const du = parseUnit(f.doseUnit || "");           // mg/phút, mcg/kg/phút...
    if(f.doseLo != null && f.conc){
      const perKg = /\/kg/.test(f.doseUnit || "");
      const perMin = /phút/.test(f.doseUnit || "");
      let k = 1;
      const db = baseUnit(du.u), cb = baseUnit(cu.u);
      if(db === cb) k = 1;
      else if(db === "mg" && cb === "mcg") k = 1000;
      else if(db === "mcg" && cb === "mg") k = 0.001;
      else k = null;
      if(k != null){
        const lo = f.doseLo * (perKg ? P.wt : 1) * (perMin ? 60 : 1) * k / f.conc;
        const hi = (f.doseHi != null ? f.doseHi : f.doseLo) * (perKg ? P.wt : 1) * (perMin ? 60 : 1) * k / f.conc;
        rate = `${rng(lo, hi, "")}<br><span class="mono" style="font-size:11px">mL/h</span>`;
      }
    }
    h += `<tr><td><b>${f.name}</b></td><td style="font-size:12.5px">${f.mix}<br><span class="mono" style="font-size:11px">= ${f.conc} ${f.concUnit}</span></td>
      <td style="font-size:12.5px">${f.dose}</td><td class="n hl">${rate}</td></tr>`;
  }
  h += `</table><div class="note">Tốc độ mL/h tính cho cân nặng <b>${sig(P.wt)} kg</b> với cách pha ghi ở cột bên trái.
    Nếu khoa bạn pha khác, tỷ lệ thay đổi theo — kiểm tra lại nồng độ trước khi chạy bơm.</div></div>`;
  return h;
}

/* Một sự kiện đầy đủ */
function eventCard(ev){
  if(ev.infusions) return infusionTableCard(ev);
  let h = `<div class="card"><h2>${ev.no}. ${ev.title}</h2>`;
  if(ev.definition) h += `<div class="note" style="background:var(--card);border-top:none;font-size:13px;color:var(--ink)">${ev.definition}</div>`;
  if(ev.signs && ev.signs.length)
    h += `<div class="note"><b>Dấu hiệu nhận biết:</b> ${ev.signs.join(" · ")}</div>`;
  h += `</div>`;

  if(ev.drugs && ev.drugs.length){
    h += `<div class="card"><h2>Thuốc — liều đã tính cho ${sig(P.wt)} kg</h2>`
       + ev.drugs.map(emDrugRow).join("") + `</div>`;
  }
  if(ev.id === "bronchospasm") h += salbutamolCard();

  if(ev.tasks && ev.tasks.length){
    h += `<div class="card"><h2>Các bước xử trí</h2>`;
    ev.tasks.forEach((t,i) => {
      h += `<div class="row step"><div class="nm"><span class="stepno">${i+1}</span>${t.task}</div>
        <div class="sub"><ul>${t.actions.map(a=>`<li>${a}</li>`).join("")}</ul></div></div>`;
    });
    h += `</div>`;
  }
  if(ev.causes && ev.causes.length){
    h += `<div class="card"><h2>Nguyên nhân / chẩn đoán phân biệt</h2>
      <div class="note" style="background:var(--card)"><ul class="tight">${ev.causes.map(c=>`<li>${c}</li>`).join("")}</ul></div></div>`;
  }
  if(ev.tables && ev.tables.length){
    for(const t of ev.tables){
      h += `<div class="card"><h2>${t.title}</h2><div class="scrollx"><table>
        <tr>${t.headers.map(x=>`<th>${x}</th>`).join("")}</tr>
        ${t.rows.map(r=>`<tr>${r.map((c,ci)=>`<td${ci===0?' style="font-weight:650"':""}>${c}</td>`).join("")}</tr>`).join("")}
        </table></div></div>`;
    }
  }
  if(ev.notes && ev.notes.length){
    h += `<div class="card"><h2>Ghi nhớ</h2>
      <div class="note" style="background:var(--card)"><ul class="tight">${ev.notes.map(c=>`<li>${c}</li>`).join("")}</ul></div></div>`;
  }
  return h;
}

let CUR_EVENT = "anaphylaxis";
let CUR_GROUP = "anes";
let PICKER_OPEN = true;
function renderEmergency(){
  const ev = EVENTS.find(e => e.id === CUR_EVENT) || EVENTS[0];
  const inGroup = EVENTS.filter(e => e.grp === CUR_GROUP);
  let h = `<div class="banner dg">Phác đồ theo <b>${EV_GROUPS.find(g=>g.key===ev.grp).src}</b>. Liều dưới đây đã nhân sẵn cho
    <b>${sig(P.wt)} kg</b>. ${P.ageY < 14
      ? 'Bệnh nhân nhi: các dòng có nhãn <span class="tag">liều nhi</span> là liều mg/kg theo PALS/APLS do app quy đổi thêm, <b>không có trong sách gốc</b> (sách là bản người lớn).'
      : 'Kiểm tra lại nồng độ ống thuốc trước khi rút.'}</div>`;
  h += `<details class="pickwrap"${PICKER_OPEN?" open":""}>
      <summary><span class="pill">${EV_GROUPS.find(g=>g.key===ev.grp).label}</span> ${ev.short||ev.title}<span class="hint">chạm để đổi</span></summary>
      <div class="grpbar">` + EV_GROUPS.map(g =>
        `<button data-grp="${g.key}" class="${g.key===CUR_GROUP?"on":""}">${g.label}<span>${EVENTS.filter(e=>e.grp===g.key).length}</span></button>`
      ).join("") + `</div>
      <div class="picker">` + inGroup.map(e =>
      `<button data-ev="${e.id}" class="${e.id===ev.id?"on":""}"><b>${e.no}</b> ${e.short||e.title}</button>`
    ).join("") + `</div></details>`;
  h += eventCard(ev);
  $("p-emergency").innerHTML = h;

  const det = $("p-emergency").querySelector(".pickwrap");
  det.addEventListener("toggle", () => { PICKER_OPEN = det.open; });
  det.querySelector(".grpbar").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    CUR_GROUP = b.dataset.grp;
    const first = EVENTS.find(x => x.grp === CUR_GROUP);
    if(first) CUR_EVENT = first.id;
    PICKER_OPEN = true; renderEmergency();
  });
  det.querySelector(".picker").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    CUR_EVENT = b.dataset.ev; PICKER_OPEN = false; renderEmergency();
    $("p-emergency").scrollIntoView({block:"start"});
  });
  const sc = $("salbConc");
  if(sc) sc.addEventListener("input", () => {
    const w = P.wt, ped = P.ageY < 12, c = num(sc.value);
    const lo = ped ? 1*w : 3, hi = ped ? 2*w : 20;
    const cell = $("salbRate");
    if(cell) cell.textContent = c>0 ? `${sig(lo*60/c)}–${sig(hi*60/c)} mL/h` : "— mL/h";
  });
}

function renderAirway(){
  const A = P.ageY;
  let ettC, ettU, blade, lma, depthO, depthN;
  if(A < 18){
    if(A < 1/12){ ettU = 3.0; ettC = 3.0; }
    else if(A < 1){ ettU = 3.5; ettC = 3.0; }
    else if(A < 2){ ettU = 4.0; ettC = 3.5; }
    else { ettU = A/4 + 4; ettC = A/4 + 3.5; }
  } else {
    ettC = P.sex === "M" ? 7.5 : 7.0; ettU = ettC;
  }
  const half = x => Math.ceil(x*2 - 0.5)/2;   // làm tròn 0.5 mm, ưu tiên cỡ nhỏ hơn
  ettC = half(ettC); ettU = half(ettU);
  if(A < 1/12)      depthO = 6 + P.wt;        // sơ sinh: 6 + cân nặng (kg)
  else if(A < 2)    depthO = ettC * 3;        // nhũ nhi/trẻ nhỏ: ID × 3
  else if(A < 18)   depthO = A/2 + 12;
  else              depthO = P.sex === "M" ? 23 : 21;
  if(A < 1/12)      depthN = 7 + P.wt;
  else if(A < 18)   depthN = A/2 + 15;
  else              depthN = P.sex === "M" ? 28 : 26;
  blade = A<1/12 ? "Miller 0" : A<1 ? "Miller 1" : A<2 ? "Miller 1 / Mac 1" : A<6 ? "Mac 2" : A<12 ? "Mac 2–3" : "Mac 3–4";
  const w = P.wt;
  lma = w<5?"1":w<10?"1.5":w<20?"2":w<30?"2.5":w<50?"3":w<70?"4":w<100?"5":"6";

  let h = `<div class="card"><h2>Đường thở</h2>
   <div class="row"><div class="nm">Ống NKQ có bóng (ID)</div><div class="val">${ettC} mm</div>
     <div class="sub">${A<18?"Công thức Khine: tuổi/4 + 3.5":"Người lớn: nam 7.5–8.0, nữ 7.0–7.5"}</div></div>
   <div class="row"><div class="nm">Ống NKQ không bóng (ID)</div><div class="val">${ettU} mm</div>
     <div class="sub">${A<18?"Công thức Cole: tuổi/4 + 4 — chuẩn bị thêm cỡ trên và cỡ dưới 0.5 mm":"—"}</div></div>
   <div class="row"><div class="nm">Độ sâu qua miệng</div><div class="val">${sig(depthO)} cm</div>
     <div class="sub">${A<1?"Sơ sinh: 6 + cân nặng (kg), tính từ mép môi":A<18?"tuổi/2 + 12 hoặc ID × 3":"tính từ cung răng"}</div></div>
   <div class="row"><div class="nm">Độ sâu qua mũi</div><div class="val">${sig(depthN)} cm</div><div class="sub">${A<1/12?"Sơ sinh: 7 + cân nặng (kg)":A<18?"tuổi/2 + 15":"tính từ lỗ mũi"}</div></div>
   <div class="row"><div class="nm">Mask thanh quản (LMA)</div><div class="val">cỡ ${lma}</div><div class="sub">Chọn theo cân nặng ${sig(w)} kg</div></div>
   <div class="row"><div class="nm">Lưỡi đèn soi thanh quản</div><div class="val">${blade}</div><div class="sub">Gợi ý theo tuổi</div></div>
   <div class="note">Luôn xác nhận vị trí ống bằng EtCO₂ và nghe phổi hai bên. Áp lực bóng chèn 20–30 cmH₂O.</div></div>`;
  h += airwayRefCards();
  $("p-airway").innerHTML = h;
}

/* Bảng tra cứu đường thở, mask thanh quản, máy thở, SvO2, EtCO2 */
function airwayRefCards(){
  const w = P.wt;
  return AIRWAY_REF.map(a => {
    let inner = "";
    if(a.intro) inner += `<div class="note" style="background:var(--card);border-top:none;color:var(--ink)">${a.intro}</div>`;
    if(a.steps && a.steps.length)
      inner += `<div class="note" style="background:var(--card)"><ol class="tight">${a.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>`;
    if(a.headers && a.rows)
      inner += `<div class="scrollx"><table><tr>${a.headers.map(x=>`<th>${x}</th>`).join("")}</tr>`
             + a.rows.map(r => `<tr>${r.map((c,ci)=>`<td${ci===0?' style="font-weight:650"':""}>${c}</td>`).join("")}</tr>`).join("")
             + `</table></div>`;
    if(a.notes && a.notes.length)
      inner += `<div class="note"><ul class="tight">${a.notes.map(n=>`<li>${n}</li>`).join("")}</ul></div>`;
    return `<div class="card"><h2>${a.title}</h2>${inner}</div>`;
  }).join("");
}

/* ==================== KHÍ MÁU (phân tích toan–kiềm) ====================
   Rà soát và đối chiếu tài liệu gốc tháng 8/2026. Các mốc chính:
   · Winters (Albert/Dell/Winters 1967) cho bù trừ hô hấp của toan chuyển hoá
   · Quy tắc Boston cho bù trừ của rối loạn hô hấp cấp và mạn
   · Khoảng trống anion hiệu chỉnh albumin theo Figge 1998
   · Định nghĩa Toàn cầu về ARDS 2023 (thay cho Berlin 2012)
   · Phương trình khí phế nang dạng đầy đủ
   Nguồn cụ thể ghi trong thẻ "Nguồn tham khảo" ở cuối tab.                */

const ABG = {
  ph:null, pco2:null, hco3:null, be:null,
  na:null, cl:null, alb:4, k:null, lac:null,
  pao2:null, fio2:21, spo2:null, peep:null,
  glu:null, cr:null,
  una:null, uk:null, ucl:null, osm:null, urea:null,
  sample:"art",          // art = động mạch, ven = tĩnh mạch
  hco3src:"gas",         // gas = cùng phiếu khí máu (là số TÍNH), lab = sinh hoá riêng
  agTop:12,              // ngưỡng trên của khoảng trống anion — người dùng chỉnh được
  vent:"spont", copd:false, vomit:false, ket:false, note:""
};

/* sig() dùng chung của app được viết cho LIỀU THUỐC nên trả về "—" với mọi số ≤ 0.
   Khí máu có nhiều đại lượng âm hợp lệ (kiềm dư khi toan, delta gap, khoảng trống
   thẩm thấu) nên cần bản hiển thị riêng giữ được dấu âm. */
function sigS(x){
  if(x == null || !isFinite(x)) return "—";
  if(Math.abs(x) < 0.05) return "0";
  return (x < 0 ? "−" : "") + sig(Math.abs(x));
}

function abgSolveTriad(ph,pco2,hco3){
  const nPh = (ph!=null && ph>0), nCo2 = (pco2!=null && pco2>0), nHco3 = (hco3!=null && hco3>0);
  if(nPh && nCo2 && !nHco3){ const H = Math.pow(10, 9-ph); hco3 = 24*pco2/H; }
  else if(nPh && nHco3 && !nCo2){ const H = Math.pow(10, 9-ph); pco2 = H*hco3/24; }
  else if(nCo2 && nHco3 && !nPh){ const H = 24*pco2/hco3; ph = 9-Math.log10(H); }
  return {ph,pco2,hco3};
}

function abgCompute(){
  const raw = ABG;
  const solved = abgSolveTriad(raw.ph, raw.pco2, raw.hco3);
  const ph = solved.ph, pco2 = solved.pco2, hco3 = solved.hco3;
  const enough = (ph>0 && pco2>0 && hco3>0);
  const ven = raw.sample === "ven";

  /* Kiểm tra tính nhất quán — CHỈ có ý nghĩa khi HCO₃⁻ lấy từ xét nghiệm sinh hoá riêng.
     HCO₃⁻ in trên phiếu khí máu vốn được máy TÍNH ra từ chính pH và PaCO₂ bằng công thức này,
     nên đem so với nhau là so công thức với chính nó, không bao giờ phát hiện được sai sót. */
  let consistencyWarn = "", consistencyNote = "";
  if(raw.ph>0 && raw.pco2>0 && raw.hco3>0){
    const H = Math.pow(10, 9-raw.ph);
    const hco3calc = 24*raw.pco2/H;
    if(raw.hco3src === "lab"){
      const d = hco3calc - raw.hco3;
      if(Math.abs(d) > 3)
        consistencyWarn = `Chênh lệch giữa HCO₃⁻ tính từ pH và PaCO₂ (${sig(hco3calc)} mmol/L) với CO₂ toàn phần của phiếu sinh hoá (${sig(raw.hco3)} mmol/L) là ${sig(Math.abs(d))} mmol/L — vượt mức 3 mmol/L. Nguyên nhân hay gặp nhất là <b>hai mẫu lấy cách nhau quá xa về thời gian</b>. Lưu ý CO₂ toàn phần của phòng xét nghiệm vốn <b>cao hơn khoảng 1–2 mmol/L</b> so với HCO₃⁻ của máy khí máu vì tính cả CO₂ hoà tan, nên chênh 1–2 mmol/L là bình thường.`;
    } else {
      consistencyNote = `HCO₃⁻ trên phiếu khí máu là giá trị <b>máy tự tính</b> từ pH và PaCO₂ chứ không đo trực tiếp, nên không dùng để kiểm tra chéo được. Muốn kiểm tra chéo phải lấy CO₂ toàn phần từ phiếu sinh hoá riêng.`;
    }
  }

  let primary = "", compTxt = "", mixedWarn = "";
  const flags = {metaAcid:false, respAcid:false, metaAlk:false, respAlk:false};
  const copdNote = raw.copd ? " Đã ghi nhận bệnh hô hấp mạn sẵn có — ưu tiên nghĩ đến đợt cấp trên nền mạn." : "";
  const R = (a,b) => `${sig(a)}–${sig(b)}`;

  if(enough){
    const acidemia = ph < 7.35, alkalemia = ph > 7.45;
    const hiCO2 = pco2 > 45, loCO2 = pco2 < 35;
    const hiHCO3 = hco3 > 26, loHCO3 = hco3 < 22;

    if(acidemia){
      if(loHCO3 && hiCO2){
        primary = "Toan hỗn hợp — vừa toan chuyển hoá vừa toan hô hấp";
        const expW = 1.5*hco3+8;
        compTxt = `HCO₃⁻ giảm và PaCO₂ tăng cùng lúc: hai rối loạn cộng gộp làm nặng thêm toan máu, chứ không bù trừ cho nhau.<br>
          <b>Định lượng phần hô hấp:</b> nếu chỉ có toan chuyển hoá đơn thuần thì bù trừ phải kéo PaCO₂ xuống khoảng <b>${R(expW-2, expW+2)} mmHg</b> theo công thức Winters. PaCO₂ đo được <b>${sig(pco2)} mmHg</b>, cao hơn mức đó khoảng <b>${sig(pco2-expW)} mmHg</b> — chính khoảng vượt này là thành phần toan hô hấp.` + copdNote;
        flags.metaAcid = true; flags.respAcid = true;
      } else if(loHCO3){
        primary = "Toan chuyển hoá";
        flags.metaAcid = true;
        const exp = 1.5*hco3+8, expLo = exp-2, expHi = exp+2;
        const floorHit = exp < 12;
        if(floorHit){
          compTxt = `Công thức Winters dự kiến PaCO₂ ≈ ${sig(exp)} mmHg, nhưng <b>giới hạn sinh lý của tăng thông khí là khoảng 8–12 mmHg</b> — không ai duy trì được thấp hơn. Ở mức toan này bù trừ hô hấp đã kịch trần, PaCO₂ đo được ${sig(pco2)} mmHg không nên diễn giải là bù trừ thiếu.`;
        } else if(pco2 < expLo){
          compTxt = `PaCO₂ đo được ${sig(pco2)} mmHg <b>thấp hơn</b> khoảng bù trừ dự kiến theo Winters (${R(expLo,expHi)} mmHg) ⇒ có thêm <b>kiềm hô hấp</b> đi kèm.`;
          flags.respAlk = true;
        } else if(pco2 > expHi){
          compTxt = `PaCO₂ đo được ${sig(pco2)} mmHg <b>cao hơn</b> khoảng bù trừ dự kiến theo Winters (${R(expLo,expHi)} mmHg) ⇒ có thêm <b>toan hô hấp</b> đi kèm, tức bù trừ không đủ hoặc có suy hô hấp phối hợp.${copdNote}`;
          flags.respAcid = true;
        } else {
          compTxt = `PaCO₂ đo được ${sig(pco2)} mmHg nằm trong khoảng bù trừ dự kiến theo Winters (${R(expLo,expHi)} mmHg) ⇒ bù trừ phù hợp, toan chuyển hoá đơn thuần.`;
        }
        const twoDigit = 7.10 <= ph && ph <= 7.60;
        if(twoDigit && !floorHit){
          const rule = Math.round((ph - 7)*100);
          compTxt += `<br><i>Kiểm tra nhanh:</i> quy tắc hai chữ số cuối của pH dự đoán PaCO₂ ≈ ${rule} mmHg (sai số 2–5 mmHg) — ${Math.abs(rule-pco2)<=5 ? "khớp với số đo" : "lệch so với số đo, nên xem lại"}.`;
        }
      } else if(hiCO2){
        primary = "Toan hô hấp";
        flags.respAcid = true;
        const eA = 24+0.1*(pco2-40);
        const eC1 = 24+0.35*(pco2-40), eC2 = 24+0.4*(pco2-40);
        if(hco3 < eA-3){
          compTxt = `HCO₃⁻ ${sig(hco3)} thấp hơn cả mức dự kiến của toan hô hấp <b>cấp</b> (≈ ${sig(eA)} mmol/L, dung sai ±3) ⇒ có thêm <b>toan chuyển hoá</b> đi kèm.`;
          flags.metaAcid = true;
        } else if(hco3 <= eA+3){
          compTxt = `HCO₃⁻ ${sig(hco3)} phù hợp <b>toan hô hấp cấp</b> — thận chưa kịp bù trừ (dự kiến ≈ ${sig(eA)} mmol/L, dung sai ±3).`;
        } else if(hco3 >= eC1-3 && hco3 <= eC2+3){
          compTxt = `HCO₃⁻ ${sig(hco3)} phù hợp <b>toan hô hấp mạn</b> đã bù trừ qua thận (dự kiến ${R(eC1,eC2)} mmol/L)${raw.copd?" — phù hợp với bệnh hô hấp mạn đã biết":""}. Bù trừ của thận cần <b>3–5 ngày</b> mới đầy đủ.`;
        } else if(hco3 > eC2+3){
          compTxt = `HCO₃⁻ ${sig(hco3)} <b>cao hơn</b> mức bù trừ dự kiến của cả toan hô hấp mạn (${R(eC1,eC2)} mmol/L) ⇒ có thêm <b>kiềm chuyển hoá</b> đi kèm.`;
          flags.metaAlk = true;
        } else {
          compTxt = `HCO₃⁻ ${sig(hco3)} nằm giữa mức dự kiến của thể cấp (≈ ${sig(eA)}) và thể mạn (${R(eC1,eC2)}) ⇒ nhiều khả năng là <b>đợt cấp trên nền mạn</b>, hoặc mới khởi phát và thận đang trong quá trình bù trừ.`;
        }
        compTxt += `<br><i>Lưu ý:</i> công thức không tự phân biệt được cấp hay mạn — phải dựa vào bệnh sử, mốc là <b>trên 3–5 ngày</b>. Hệ số cho thể mạn có nguồn dùng 0,35 có nguồn dùng 0,4 nên ở đây hiển thị thành khoảng.`;
      }
    } else if(alkalemia){
      if(hiHCO3 && loCO2){
        primary = "Kiềm hỗn hợp — vừa kiềm chuyển hoá vừa kiềm hô hấp";
        compTxt = "HCO₃⁻ tăng và PaCO₂ giảm cùng lúc: hai rối loạn cộng gộp làm nặng thêm kiềm máu.";
        flags.metaAlk = true; flags.respAlk = true;
      } else if(hiHCO3){
        primary = "Kiềm chuyển hoá";
        flags.metaAlk = true;
        const exp = 0.7*(hco3-24)+40;
        const expC = Math.min(exp, 55);
        if(pco2 > 55 && exp > 55){
          compTxt = `PaCO₂ dự kiến bù trừ ≈ ${sig(exp)} mmHg, nhưng <b>giảm thông khí bù trừ hiếm khi đẩy PaCO₂ vượt quá 55 mmHg</b>. PaCO₂ đo được ${sig(pco2)} mmHg nên được xem là có <b>toan hô hấp phối hợp</b> chứ không còn là bù trừ đơn thuần.`;
          flags.respAcid = true;
        } else if(pco2 > expC+5){
          compTxt = `PaCO₂ dự kiến bù trừ ≈ ${sig(exp)} mmHg (dung sai ±5). Đo được ${sig(pco2)} mmHg, cao hơn dự kiến ⇒ có thêm <b>toan hô hấp</b> đi kèm.${copdNote}`;
          flags.respAcid = true;
        } else if(pco2 < exp-5){
          compTxt = `PaCO₂ dự kiến bù trừ ≈ ${sig(exp)} mmHg (dung sai ±5). Đo được ${sig(pco2)} mmHg, thấp hơn dự kiến ⇒ có thêm <b>kiềm hô hấp</b> đi kèm.`;
          flags.respAlk = true;
        } else {
          compTxt = `PaCO₂ đo được nằm trong khoảng bù trừ dự kiến (≈ ${sig(exp)} ±5 mmHg) ⇒ bù trừ phù hợp.`;
        }
        compTxt += `<br><i>Lưu ý:</i> bù trừ hô hấp cho kiềm chuyển hoá kém tin cậy hơn so với toan chuyển hoá; hệ số giữa các nguồn dao động 0,6–0,9.`;
      } else if(loCO2){
        primary = "Kiềm hô hấp";
        flags.respAlk = true;
        const eA = 24-0.2*(40-pco2);
        const eC1 = 24-0.5*(40-pco2), eC2 = 24-0.4*(40-pco2);
        if(hco3 >= eA-3){
          compTxt = `HCO₃⁻ ${sig(hco3)} giảm nhẹ, phù hợp <b>kiềm hô hấp cấp</b> (dự kiến ≈ ${sig(eA)} mmol/L, dung sai ±3).`;
        } else if(hco3 >= eC1-3){
          compTxt = `HCO₃⁻ ${sig(hco3)} giảm nhiều, phù hợp <b>kiềm hô hấp mạn</b> đã bù trừ qua thận (dự kiến ${R(eC1,eC2)} mmol/L).`;
        } else {
          compTxt = `HCO₃⁻ ${sig(hco3)} giảm nhiều hơn cả mức bù trừ của thể mạn ⇒ có thêm <b>toan chuyển hoá</b> đi kèm.`;
          flags.metaAcid = true;
        }
        if(P.sex === "F")
          compTxt += `<br><i>Nếu người bệnh đang mang thai:</i> thai kỳ vốn có kiềm hô hấp sinh lý mạn tính với PaCO₂ khoảng 28–32 mmHg và HCO₃⁻ khoảng 18–21 mmol/L — đó là bình thường, không phải bệnh lý.`;
      }
    } else {
      /* pH trong giới hạn bình thường — điểm dễ sai nhất.
         Bù trừ KHÔNG BAO GIỜ đưa pH về đúng 7,40. pH bình thường mà cả PaCO₂ lẫn HCO₃⁻
         đều lệch nhiều thì đó là rối loạn HỖN HỢP, không phải "bù trừ hoàn toàn". */
      const bigCO2 = Math.abs(pco2-40) > 10, bigHCO3 = Math.abs(hco3-24) > 4;
      if(bigCO2 && bigHCO3){
        if(hiCO2 && hiHCO3){
          if(ph >= 7.40){
            primary = "Rối loạn HỖN HỢP — toan hô hấp kèm kiềm chuyển hoá";
            compTxt = `pH ${sig(ph)} ở mức trung tính hoặc kiềm nhẹ trong khi PaCO₂ ${sig(pco2)} và HCO₃⁻ ${sig(hco3)} đều tăng rõ. <b>Bù trừ sinh lý không bao giờ đưa pH vượt qua 7,40</b> — nên đây là kiềm chuyển hoá chồng lên toan hô hấp, chứ không phải toan hô hấp mạn bù trừ tốt.`;
            flags.respAcid = true; flags.metaAlk = true;
          } else {
            primary = "Toan hô hấp mạn đã bù trừ gần hoàn toàn";
            compTxt = `PaCO₂ và HCO₃⁻ đều tăng, pH ${sig(ph)} còn ở mức acid nhẹ trong giới hạn bình thường — hình ảnh điển hình của <b>toan hô hấp mạn</b>${raw.copd?" ở người có bệnh hô hấp mạn đã biết":" (bệnh phổi tắc nghẽn mạn tính, bệnh thần kinh cơ mạn)"}. Vẫn nên kiểm tra khoảng trống anion để không bỏ sót rối loạn thứ ba.`;
            flags.respAcid = true;
          }
        } else if(loCO2 && loHCO3){
          primary = "pH bình thường — kiềm hô hấp mạn, hoặc toan chuyển hoá kèm kiềm hô hấp";
          compTxt = `PaCO₂ và HCO₃⁻ đều giảm rõ nhưng pH vẫn bình thường. Hai khả năng: kiềm hô hấp mạn đã bù trừ (độ cao, thai kỳ, bệnh gan mạn), hoặc toan chuyển hoá và kiềm hô hấp triệt tiêu lẫn nhau — <b>bắt buộc xem khoảng trống anion</b> để phân biệt.`;
          flags.respAlk = true;
        } else {
          primary = "Rối loạn HỖN HỢP — PaCO₂ và HCO₃⁻ lệch ngược chiều nhau";
          compTxt = "Hai rối loạn có xu hướng triệt tiêu lẫn nhau nên pH nhìn có vẻ bình thường. Bắt buộc xem khoảng trống anion và bối cảnh lâm sàng để không bỏ sót.";
          if(hiHCO3){ flags.metaAlk = true; flags.respAcid = true; } else { flags.metaAcid = true; flags.respAlk = true; }
        }
        mixedWarn = "<b>pH bình thường KHÔNG có nghĩa là không có rối loạn toan–kiềm.</b> Bù trừ sinh lý không bao giờ đưa pH về đúng 7,40, nên pH bình thường đi kèm PaCO₂ và HCO₃⁻ lệch nhiều là dấu hiệu của rối loạn hỗn hợp.";
      }
      else if(hiCO2 || loCO2 || hiHCO3 || loHCO3){
        primary = "Lệch nhẹ, pH còn bù";
        compTxt = `pH ${sig(ph)} trong giới hạn bình thường, PaCO₂ ${sig(pco2)} và HCO₃⁻ ${sig(hco3)} lệch ở mức nhẹ. Xem thêm khoảng trống anion và bối cảnh lâm sàng.`;
      }
      else { primary = "Khí máu trong giới hạn bình thường"; compTxt = "pH, PaCO₂ và HCO₃⁻ đều trong giới hạn bình thường. Vẫn nên kiểm tra khoảng trống anion — rối loạn hỗn hợp cân bằng nhau vẫn có thể cho bộ ba bình thường."; }
    }
  }

  /* ---------- Khoảng trống anion ---------- */
  let agTxt = "", deltaTxt = "", agLow = "";
  const AGT = raw.agTop;
  if(raw.na>0 && raw.cl>0 && hco3>0){
    const ag = raw.na - (raw.cl + hco3);
    const alb = (raw.alb!=null && raw.alb>0) ? raw.alb : 4;
    const agc = ag + 2.5*(4-alb);
    const corrected = Math.abs(alb-4) > 0.05;
    agTxt = `AG = Na⁺ − (Cl⁻ + HCO₃⁻) = <b>${sig(ag)}</b> mmol/L`
      + (corrected ? `<br>Hiệu chỉnh theo albumin ${sig(alb)} g/dL (cộng 2,5 cho mỗi 1 g/dL thiếu hụt) ⇒ <b>AG hiệu chỉnh ${sig(agc)}</b> mmol/L` : "")
      + `<br>Đang dùng ngưỡng trên <b>${AGT}</b> mmol/L.`;

    if(ag < 3) agLow = `AG chỉ ${sig(ag)} mmol/L — <b>thấp bất thường</b>. Nghĩ tới lỗi xét nghiệm hoặc nhiễu: bromid, iodid, salicylat nồng độ rất cao bị máy đọc nhầm thành clorid, hoặc bệnh lý paraprotein, hoặc giảm albumin nặng chưa hiệu chỉnh.`;

    if(agc > AGT){
      flags.metaAcid = true;
      if(!primary){ primary = "Toan chuyển hoá tăng khoảng trống anion"; compTxt = "AG hiệu chỉnh tăng dù pH và HCO₃⁻ đo riêng lẻ còn trong giới hạn — gợi ý rối loạn nhẹ hoặc hỗn hợp."; }
    } else if(agc >= 11){
      agTxt += `<br><b style="color:var(--warn)">Vùng ranh giới:</b> AG hiệu chỉnh ${sig(agc)} nằm sát ngưỡng. Trên máy dùng điện cực chọn lọc ion, khoảng bình thường có thể chỉ 3–11 mmol/L, nên mức này vẫn có thể là toan chuyển hoá tăng AG thật sự.`;
    }

    /* Delta gap ưu tiên hơn delta ratio vì mẫu số của delta ratio tiến về 0 khi HCO₃⁻ gần bình thường */
    if(agc > AGT){
      const dGap = (agc - AGT) - (24 - hco3);
      let dgTxt;
      if(dGap < -6) dgTxt = "có thêm <b>toan chuyển hoá AG bình thường</b> (tăng clo) đi kèm";
      else if(dGap > 6) dgTxt = "có thêm <b>kiềm chuyển hoá</b>, hoặc toan hô hấp mạn đã bù trừ từ trước làm HCO₃⁻ nền vốn đã cao";
      else dgTxt = "toan chuyển hoá tăng AG <b>đơn thuần</b>";
      deltaTxt = `<b>Delta gap</b> = (AG hiệu chỉnh − ${AGT}) − (24 − HCO₃⁻) = <b>${sigS(dGap)}</b> ⇒ ${dgTxt}. <i>(ngưỡng: dưới −6 · từ −6 đến +6 · trên +6)</i>`;

      const denom = 24 - hco3;
      if(denom >= 2){
        const dr = (agc-AGT)/denom;
        let drTxt;
        if(dr < 0.4) drTxt = "chủ yếu là toan chuyển hoá AG bình thường (tăng clo)";
        else if(dr <= 0.8) drTxt = "phối hợp cả toan AG cao và AG bình thường";
        else if(dr <= 2) drTxt = "toan chuyển hoá AG cao đơn thuần (toan lactic thường quanh 1,6; nhiễm toan ceton gần 1)";
        else drTxt = "kèm kiềm chuyển hoá hoặc toan hô hấp mạn có từ trước";
        deltaTxt += `<br><b>Delta ratio</b> = ${sig(dr)} ⇒ ${drTxt}.`;
      } else {
        deltaTxt += `<br><i>Không tính delta ratio vì HCO₃⁻ ${sig(hco3)} gần mức bình thường 24 — mẫu số quá nhỏ khiến tỉ số mất ý nghĩa. Dùng delta gap ở trên.</i>`;
      }
      if(raw.copd) deltaTxt += `<br><b style="color:var(--warn)">Thận trọng vì người bệnh có bệnh hô hấp mạn:</b> cả delta gap lẫn delta ratio đều lấy mốc HCO₃⁻ nền là 24 mmol/L. Người ứ CO₂ mạn vốn đã có HCO₃⁻ nền cao hơn, thường 28–34 mmol/L, nên mức tụt HCO₃⁻ thực tế <b>lớn hơn</b> con số tính ở đây và thành phần toan chuyển hoá đang bị <b>đánh giá thấp hơn thực tế</b>. Nếu có khí máu nền của chính người bệnh thì nên lấy HCO₃⁻ nền đó thay cho 24.`;
      deltaTxt += `<br><span style="color:var(--muted)">Cả hai chỉ số đều giả định toàn bộ đệm là bicarbonat và nằm ngoài tế bào, trong khi thực tế khoảng một nửa lượng đệm là trong tế bào — vì vậy toan AG cao "đơn thuần" thường cho tỉ số trên 1. Chỉ số này còn bị sai lệch khi thận đã kịp thải bớt anion. <b>Đừng kết luận chỉ dựa vào con số này</b> nếu không có bằng chứng lâm sàng đi kèm.</span>`;
    }
  }

  /* ---------- Kiềm dư ---------- */
  let beTxt = "";
  if(raw.be != null && isFinite(raw.be)){
    const b = raw.be;
    const a = Math.abs(b);
    const lvl = a <= 2 ? "bình thường" : a <= 5 ? "nhẹ" : a <= 10 ? "trung bình" : "nặng";
    beTxt = `Kiềm dư <b>${sigS(b)}</b> mmol/L — ${b < -2 ? `thiếu hụt kiềm mức <b>${lvl}</b>, phản ánh thành phần chuyển hoá của toan` : b > 2 ? `dư kiềm mức <b>${lvl}</b>, phản ánh thành phần chuyển hoá của kiềm` : "trong giới hạn bình thường (−2 đến +2)"}.
      Đây là cách định lượng thành phần chuyển hoá độc lập với HCO₃⁻, dùng để kiểm tra chéo kết luận ở trên.`;
  }

  /* ---------- Oxy hoá máu ---------- */
  let oxyTxt = "", ardsTxt = "";
  if(ven){
    oxyTxt = `<b>Mẫu máu tĩnh mạch — không phân tích oxy hoá.</b> PO₂ tĩnh mạch không thay thế được PaO₂: chênh lệch phế nang–động mạch, tỉ lệ P/F và phân loại ARDS đều <b>không áp dụng</b> được.`;
  } else if(raw.pao2 > 0){
    const fio2pct = (raw.fio2!=null && raw.fio2>0) ? raw.fio2 : 21;
    const F = fio2pct/100;
    const pco2A = pco2>0 ? pco2 : 40;
    // Dạng đầy đủ của phương trình khí phế nang — chính xác hơn ở FiO₂ cao
    const PAO2 = F*(760-47) - pco2A*(F + (1-F)/0.8);
    const aa = PAO2 - raw.pao2;
    const pf = raw.pao2/F;
    const normalAA = (P.ageY + 10)/4;

    oxyTxt = `PAO₂ (phế nang) ≈ <b>${sig(PAO2)}</b> mmHg ⇒ chênh lệch phế nang–động mạch <b>${sigS(aa)}</b> mmHg.<br>`;
    if(fio2pct <= 21){
      oxyTxt += `Bình thường theo tuổi ≈ (tuổi + 10) ÷ 4 = <b>${sig(normalAA)}</b> mmHg — ${aa > normalAA ? "<b>cao hơn</b> mức dự kiến, gợi ý bất thường trao đổi khí tại phổi" : "trong giới hạn dự kiến"}.`;
    } else {
      oxyTxt += `<b style="color:var(--warn)">Không so với mức bình thường theo tuổi được</b> vì người bệnh đang thở FiO₂ ${sig(fio2pct)} %. Các công thức tuổi đều xây dựng khi thở khí trời; chênh lệch phế nang–động mạch <b>tăng thêm khoảng 5–7 mmHg cho mỗi 10 % FiO₂</b>, nên ở FiO₂ này một người bình thường cũng có thể có chênh lệch 30–50 mmHg.`;
    }
    oxyTxt += `<br>Tỉ lệ PaO₂/FiO₂ = <b>${sig(pf)}</b> mmHg.`;

    // Phân loại ARDS theo Định nghĩa Toàn cầu 2023
    const peep = raw.peep;
    const hasSupport = (peep != null && peep >= 5) || raw.vent === "mv";
    const cat = v => v <= 100 ? ["Nặng","danger"] : v <= 200 ? ["Trung bình","danger"] : v <= 300 ? ["Nhẹ","warn"] : null;
    const c = cat(pf);
    if(!hasSupport){
      ardsTxt = `<b style="color:var(--warn)">Chưa đủ điều kiện để phân loại ARDS.</b> Tỉ lệ P/F chỉ dùng để phân loại khi người bệnh đang có <b>PEEP ít nhất 5 cmH₂O</b> (thở máy, CPAP hoặc thở không xâm nhập), hoặc thở oxy dòng cao ít nhất 30 L/phút. Cùng một lá phổi ở PEEP 0 và PEEP 10 sẽ cho hai giá trị P/F khác nhau. Nhập PEEP hoặc chọn "đang thở máy" ở phần bối cảnh để phân loại.`;
    } else if(c){
      ardsTxt = `Với PEEP ${peep!=null?sig(peep)+" cmH₂O":"≥ 5 cmH₂O"}: P/F ${sig(pf)} ⇒ <b style="color:var(--${c[1]})">ARDS mức ${c[0]}</b> theo Định nghĩa Toàn cầu 2023 (nhẹ 200 &lt; P/F ≤ 300 · trung bình 100 &lt; P/F ≤ 200 · nặng P/F ≤ 100).<br>Vẫn cần đủ các tiêu chí còn lại: có yếu tố nguy cơ, khởi phát trong vòng 1 tuần, hình ảnh mờ hai bên trên phim hoặc cắt lớp hoặc siêu âm, và không giải thích hoàn toàn được bằng suy tim hay quá tải dịch.`;
    } else {
      ardsTxt = `P/F ${sig(pf)} &gt; 300 — <b>chưa đạt ngưỡng ARDS</b>. Lưu ý ngưỡng là P/F <b>≤ 300</b>, tức đúng 300 vẫn là ARDS.`;
    }
  }

  // Tỉ lệ SpO₂/FiO₂ — dùng được khi không có khí máu động mạch
  let sfTxt = "";
  if(raw.spo2 > 0 && raw.fio2 > 0){
    const F = raw.fio2/100;
    const sf = raw.spo2/F;
    if(raw.spo2 > 97){
      sfTxt = `<b style="color:var(--warn)">SpO₂ ${sig(raw.spo2)} % vượt quá 97 % nên KHÔNG tính được tỉ lệ SpO₂/FiO₂.</b> Trên mức này đường cong phân ly hemoglobin đã bão hoà, SpO₂ không còn phản ánh thay đổi của PaO₂. Cần giảm FiO₂ để SpO₂ về 97 % trở xuống rồi đo lại.`;
    } else {
      const c = sf <= 148 ? ["Nặng","danger"] : sf <= 235 ? ["Trung bình","danger"] : sf <= 315 ? ["Nhẹ","warn"] : null;
      sfTxt = `Tỉ lệ SpO₂/FiO₂ = <b>${sig(sf)}</b> ⇒ ${c ? `<b style="color:var(--${c[1]})">tương ứng ARDS mức ${c[0]}</b>` : "<b>chưa đạt ngưỡng ARDS</b> (ngưỡng ≤ 315)"}.<br>
        Định nghĩa Toàn cầu 2023 cho phép chẩn đoán ARDS <b>không cần khí máu động mạch</b>: nhẹ 235 &lt; S/F ≤ 315 · trung bình 148 &lt; S/F ≤ 235 · nặng S/F ≤ 148.
        Với người <b>chưa đặt nội khí quản</b> cần đang thở oxy dòng cao ít nhất 30 L/phút hoặc thở không xâm nhập với áp lực thở ra ít nhất 5 cmH₂O. Ở nơi nguồn lực hạn chế, định nghĩa mới chấp nhận S/F ≤ 315 mà <b>không đòi hỏi PEEP hay thiết bị cụ thể nào</b>.`;
    }
  }

  /* ---------- Lactat ---------- */
  let lacTxt = "";
  if(raw.lac != null && raw.lac > 0){
    const l = raw.lac;
    lacTxt = `Lactat <b>${sig(l)}</b> mmol/L — ${l < 2 ? "trong giới hạn bình thường" : l < 4 ? "<b>tăng</b>, ngưỡng gợi ý giảm tưới máu mô là từ 2 mmol/L" : "<b>tăng cao</b>, trên 4 mmol/L là dấu hiệu nguy cơ tử vong cao"}.`;
    if(raw.na>0 && raw.cl>0 && hco3>0){
      const ag = raw.na - (raw.cl + hco3);
      const agc = ag + 2.5*(4-(raw.alb||4));
      const excess = agc - AGT;
      if(excess > 0){
        const pctL = Math.min(100, Math.round(l/excess*100));
        lacTxt += `<br>Phần AG vượt ngưỡng là ${sig(excess)} mmol/L; lactat giải thích được khoảng <b>${pctL} %</b> trong đó. ${pctL < 50 ? "Phần còn lại cần tìm nguyên nhân khác: ceton, suy thận, ngộ độc." : ""}`;
      }
    }
  }

  return {ph,pco2,hco3,enough,ven,primary,compTxt,mixedWarn,consistencyWarn,consistencyNote,
          flags,agTxt,agLow,deltaTxt,beTxt,oxyTxt,ardsTxt,sfTxt,lacTxt};
}

function abgTreatHtml(flags){
  const order = ["metaAcid","respAcid","metaAlk","respAlk"];
  const active = order.filter(k => flags[k]);
  let h = "";
  if(!active.length) h = `<div class="abgblock" style="color:var(--muted)">Nhập đủ thông số để xem hướng xử trí gợi ý.</div>`;
  else h = active.map(k => `<div class="abgblock"><b class="hd">${ABG_TX[k].t}</b>${ABG_TX[k].b(ABG)}`
    + (OR_CAUSES[k] ? `<div class="orbox"><b class="orhd">Trong mổ / hồi tỉnh — nghĩ thêm đến</b>${OR_CAUSES[k]}</div>` : "")
    + `</div>`).join("");
  if(ABG.note && ABG.note.trim()) h += `<div class="abgblock"><b class="hd">Ghi chú bối cảnh (bạn nhập)</b>${ABG.note.trim().replace(/\n/g,"<br>")}</div>`;
  return h;
}

/* ==================== CÔNG CỤ BỔ SUNG ==================== */
function abgExtraTools(){
  const r = ABG;
  let uag = "", osm = "";
  if(r.una>0 && r.ucl>0){
    const k = r.uk>0 ? r.uk : 0;
    const v = r.una + k - r.ucl;
    uag = `<b>Khoảng trống anion niệu = ${sig(v)} mmol/L</b> ⇒ ${v < 0
      ? "<b>ÂM</b> — thận đang thải nhiều NH₄⁺, tức đáp ứng thận phù hợp ⇒ nguyên nhân <b>ngoài thận</b>, thường là mất bicarbonat qua đường tiêu hoá (tiêu chảy)."
      : "<b>DƯƠNG</b> — thận không thải được NH₄⁺ ⇒ gợi ý <b>toan hoá ống thận</b>."}<br>
      <span style="color:var(--warn)">Chỉ dùng được khi nước tiểu không có anion lạ. Mất giá trị khi có ceton niệu hoặc ngộ độc toluen — khi đó kết quả dương tính giả sẽ khiến hiểu nhầm là toan hoá ống thận.</span>`;
  }
  if(r.osm>0 && r.na>0){
    const calc = 2*r.na + (r.glu||0) + (r.urea||0);
    const gap = r.osm - calc;
    osm = `<b>Khoảng trống áp lực thẩm thấu = ${sigS(gap)} mOsm/kg</b> (đo ${sig(r.osm)} − tính ${sig(calc)}) ⇒ ${gap > 10
      ? "<b>tăng</b> — nghĩ tới ngộ độc rượu độc (methanol, ethylen glycol), cũng gặp khi dùng propylene glycol, mannitol, hoặc trong nhiễm toan ceton do rượu."
      : "trong giới hạn bình thường (dưới 10)."}<br>
      <span style="color:var(--warn)">Ba điểm dễ sai: có tới khoảng 15 công thức tính khác nhau và chúng không cho cùng kết quả; đơn vị mOsm/kg và mOsm/L hay bị lẫn; và <b>thời điểm quyết định tất cả</b> — ngộ độc rượu độc giai đoạn sớm cho khoảng trống thẩm thấu cao với AG bình thường, giai đoạn muộn thì ngược lại. <b>Khoảng trống bình thường không loại trừ được ngộ độc rượu độc.</b></span>`;
  }
  return {uag, osm};
}

/* ==================== HIỂN THỊ ==================== */
function updateABG(){
  const r = abgCompute();
  const set = (id, html) => { const e = $(id); if(e) e.innerHTML = html; };
  const show = (id, on) => { const e = $(id); if(e) e.style.display = on ? "" : "none"; };

  const warns = [r.consistencyWarn, r.mixedWarn].filter(Boolean);
  set("abgWarnBox", warns.length ? `<div class="banner warn" style="margin:12px 14px 0">${warns.join("<br><br>")}</div>` : "");

  const pv = $("abgPrimaryVal"); if(pv) pv.textContent = r.enough ? r.primary : "—";
  set("abgCompVal", r.enough ? r.compTxt + (r.consistencyNote?`<br><br><i>${r.consistencyNote}</i>`:"")
      : "Nhập đủ pH, PaCO₂ và HCO₃⁻ (hoặc bất kỳ hai trong ba số này) để phân tích.");

  set("abgAGVal", (r.agTxt || "Nhập Na⁺ và Cl⁻ để tính khoảng trống anion.") + (r.agLow?`<br><b style="color:var(--warn)">${r.agLow}</b>`:""));
  show("abgDeltaRow", !!r.deltaTxt); set("abgDeltaVal", r.deltaTxt || "");
  show("abgBeRow", !!r.beTxt); set("abgBeVal", r.beTxt || "");
  show("abgLacRow", !!r.lacTxt); set("abgLacVal", r.lacTxt || "");
  show("abgOxyRow", !!r.oxyTxt); set("abgOxyVal", r.oxyTxt || "");
  show("abgArdsRow", !!r.ardsTxt); set("abgArdsVal", r.ardsTxt || "");
  show("abgSfRow", !!r.sfTxt); set("abgSfVal", r.sfTxt || "");

  const ex = abgExtraTools();
  show("abgUagRow", !!ex.uag); set("abgUagVal", ex.uag || "");
  show("abgOsmRow", !!ex.osm); set("abgOsmVal", ex.osm || "");

  set("abgTxBody", abgTreatHtml(r.flags));

  $("p-abg").querySelectorAll("[data-agtop]").forEach(b => b.classList.toggle("on", +b.dataset.agtop === ABG.agTop));
  $("p-abg").querySelectorAll("[data-samp]").forEach(b => b.classList.toggle("on", b.dataset.samp === ABG.sample));
  $("p-abg").querySelectorAll("[data-hsrc]").forEach(b => b.classList.toggle("on", b.dataset.hsrc === ABG.hco3src));
}

function asSel(id){ return AS[id] || (AS[id] = {}); }

function asTotal(sc){
  const sel = asSel(sc.id);
  let n = 0;
  for(const it of sc.items){
    const v = sel[it.k];
    if(v == null) continue;
    n += (it.type === "yn") ? (v ? it.p : 0) : v;
  }
  return n;
}
/* Đã trả lời đủ chưa — thang ASA chỉ cần 1 mục */
function asComplete(sc){
  const sel = asSel(sc.id);
  return sc.items.every(it => sel[it.k] != null);
}

function asAutoFill(){
  for(const sc of SCORES){
    const sel = asSel(sc.id);
    for(const it of sc.items){
      if(!it.auto) continue;
      const v = it.auto();
      if(v == null) continue;
      // chỉ tự điền khi người dùng chưa tự chọn, hoặc giá trị cũ cũng do app điền
      if(sel[it.k] == null || AS_AUTO[sc.id+"."+it.k]){
        sel[it.k] = v;
        AS_AUTO[sc.id+"."+it.k] = true;
      }
    }
  }
}

function asItemHtml(sc, it){
  const sel = asSel(sc.id);
  const cur = sel[it.k];
  const isAuto = AS_AUTO[sc.id+"."+it.k];
  let btns;
  if(it.type === "yn"){
    btns = `<button type="button" class="asbtn${cur===1?" on":""}" data-as="${sc.id}" data-k="${it.k}" data-v="1">Có</button>
            <button type="button" class="asbtn${cur===0?" on":""}" data-as="${sc.id}" data-k="${it.k}" data-v="0">Không</button>`;
  } else {
    btns = it.o.map(([label,p]) =>
      `<button type="button" class="asbtn${cur===p?" on":""}" data-as="${sc.id}" data-k="${it.k}" data-v="${p}">${label}</button>`).join("");
  }
  return `<div class="asitem">
    <div class="asq">${it.t}${isAuto?' <span class="autotag">tự điền</span>':""}
      ${it.h?`<div class="ash">${it.h}</div>`:""}</div>
    <div class="asbtns">${btns}</div></div>`;
}

function asResultHtml(sc){
  if(!asComplete(sc))
    return `<div class="asres none">Còn ${sc.items.filter(it => asSel(sc.id)[it.k]==null).length} mục chưa chọn</div>`;
  const n = asTotal(sc);
  const r = sc.result(n, asSel(sc.id));
  return `<div class="asres ${r.lvl}"><b class="rh">${r.head}</b><div class="rb">${r.body}</div></div>`;
}

function updateAsScore(id){
  const sc = SCORES.find(s => s.id === id); if(!sc) return;
  const box = document.querySelector(`[data-asres="${id}"]`);
  if(box) box.innerHTML = asResultHtml(sc);
  const sel = asSel(id);
  document.querySelectorAll(`[data-as="${id}"]`).forEach(b => {
    const it = sc.items.find(x => x.k === b.dataset.k);
    const cur = sel[b.dataset.k];
    b.classList.toggle("on", cur != null && cur === +b.dataset.v && (it.type!=="yn" || true));
  });
  // bỏ nhãn "tự điền" ở mục vừa được người dùng bấm tay
  document.querySelectorAll(`[data-asres="${id}"]`).forEach(()=>{});
}

  let h = `<div class="banner warn">Các thang điểm dưới đây hỗ trợ lượng giá nguy cơ, <b>không thay thế</b> thăm khám và phán đoán lâm sàng.
    Mục có nhãn <span class="autotag">tự điền</span> được app suy ra từ tuổi, giới và BMI ở đầu trang — bấm tay để sửa nếu chưa đúng.</div>`;
  for(const sc of SCORES){
    h += `<div class="card"><h2>${sc.name}</h2>
      <div class="assub">${sc.short} · <i>${sc.src}</i></div>
      ${sc.items.map(it => asItemHtml(sc, it)).join("")}
      <div data-asres="${sc.id}">${asResultHtml(sc)}</div></div>`;
  }
  h += `<div class="card"><h2>Khả năng gắng sức (MET)</h2>
    <div class="asitem"><div class="asq">Mốc 4 MET là ranh giới kinh điển
      <div class="ash">Dưới 4 MET được coi là khả năng gắng sức kém.</div></div></div>
    <div class="note" style="background:var(--card)">
      <b>1 MET</b> — tự ăn uống, mặc quần áo, đi lại trong nhà.<br>
      <b>1–4 MET</b> — việc nhà nhẹ như lau bụi, rửa bát; đi bộ 1–2 dãy nhà trên đường bằng.<br>
      <b>4 MET</b> (mốc phân định) — leo một tầng cầu thang hoặc lên dốc, đi bộ nhanh trên đường bằng, việc nhà nặng như lau sàn, chơi golf, đánh đôi quần vợt.<br>
      <b>Trên 10 MET</b> — bơi lội, quần vợt đơn, bóng đá, bóng rổ.
    </div>
    <div class="asres warn"><b class="rh">Cảnh báo quan trọng</b><div class="rb">
      Nghiên cứu METS (Lancet 2018) cho thấy bác sĩ <b>ước lượng bằng cảm tính</b> mức dưới 4 MET chỉ đạt độ nhạy <b>19 %</b> và <b>không</b> dự đoán được tử vong hay nhồi máu cơ tim trong 30 ngày. Kết luận nguyên văn của nhóm tác giả: không nên dùng đánh giá gắng sức chủ quan để lượng giá nguy cơ trước mổ.<br>
      Hướng dẫn 2024 vì vậy ưu tiên <b>bộ câu hỏi DASI có cấu trúc</b> thay cho ước lượng cảm tính: DASI trên 34 là đủ tốt, 25–34 là trung gian nên cân nhắc xét nghiệm dấu ấn sinh học, dưới 25 là kém cần đánh giá thêm. Cách thay thế thực dụng: không leo nổi 2 tầng cầu thang thì coi là nguy cơ tăng.
    </div></div></div>`;

  $("p-assess").innerHTML = h;
  $("p-assess").querySelectorAll(".asbtn").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.as, k = b.dataset.k, v = +b.dataset.v;
    const sc = SCORES.find(s => s.id === id);
    const sel = asSel(id);
    const it = sc.items.find(x => x.k === k);
    sel[k] = v;
    AS_AUTO[id+"."+k] = false;                      // người dùng đã tự chọn
    // cập nhật trạng thái nút trong cùng một mục
    b.parentElement.querySelectorAll(".asbtn").forEach(x => x.classList.toggle("on", x === b));
    const tag = b.closest(".asitem").querySelector(".autotag");
    if(tag) tag.remove();
    const box = document.querySelector(`[data-asres="${id}"]`);
    if(box) box.innerHTML = asResultHtml(sc);
  }));
}

function revDrug(){ return REV_DRUGS.find(d => d.id === REV.drug) || REV_DRUGS[0]; }
const revText = v => typeof v === "function" ? v() : v;

function revBody(){
  const d = revDrug();
  let h = `<div class="card"><h2>${d.n}</h2>
    <div class="abgblock"><b class="hd">Khi nào cần hoá giải</b>${d.gate}</div>
    <div class="abgblock"><b class="hd">Lựa chọn hàng đầu</b>${revText(d.first)}</div>
    <div class="abgblock"><b class="hd">Lựa chọn thay thế</b>${revText(d.second)}</div>
    <div class="abgblock"><b class="hd">Ngay sau khi dùng thuốc — làm gì</b>
      <ol class="tight">${d.after.map(x=>`<li>${x}</li>`).join("")}</ol></div>
    <div class="abgblock"><b class="hd">Theo dõi gì, vào lúc nào</b>
      <div class="scrollx"><table><tr><th>Theo dõi</th><th>Mốc thời gian</th><th>Ngưỡng xử trí</th></tr>
      ${d.monitor.map(r=>`<tr><td style="font-weight:650">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}
      </table></div></div>`;
  if(d.warn) h += `<div class="abgblock"><div class="orbox" style="margin-top:0;border-left-color:var(--danger);background:var(--danger-soft)">
      <b class="orhd" style="color:var(--danger)">Cảnh báo</b>${d.warn}</div></div>`;
  h += `<div class="abgblock"><b class="hd">Dùng lại thuốc chống đông</b>${d.restart}</div></div>`;
  return h;
}

      <li><b>Xét nghiệm nền:</b> công thức máu, PT/INR, aPTT, fibrinogen, calci ion hoá, chức năng thận và gan, nhóm máu và phản ứng chéo. Gửi xét nghiệm đặc hiệu cho thuốc nếu có.</li>
      <li><b>Không chờ kết quả xét nghiệm</b> nếu đang chảy máu đe doạ tính mạng — ISTH 2024 và ESAIC 2024 đều nhấn mạnh điều này.</li>
      <li><b>Sửa các yếu tố nền</b> song song: fibrinogen, calci, thân nhiệt, pH — xem thẻ bên dưới.</li>
      <li><b>Hội chẩn</b> huyết học, cùng chuyên khoa liên quan (ngoại thần kinh, tiêu hoá, can thiệp mạch).</li>
    </ol></div></div>`;

  h += `<div class="card"><h2>Bệnh nhân đang dùng thuốc gì</h2>
    <div class="ctxrow" style="padding:12px 14px 14px">
      ${REV_DRUGS.map(d => `<button type="button" data-revdrug="${d.id}" class="${d.id===REV.drug?"on":""}">${d.n}</button>`).join("")}

  h += revBody();

  h += `<div class="card"><h2>Sửa nền tảng cầm máu — áp dụng cho mọi thuốc</h2>
    <div class="scrollx"><table><tr><th>Yếu tố</th><th>Đích và liều</th></tr>
    <tr><td style="font-weight:650">Fibrinogen</td><td>Bù khi <b>dưới 1,5 g/L (150 mg/dL)</b>. Liều đầu <b>3–4 g</b> fibrinogen cô đặc hoặc 15–20 đơn vị tủa lạnh từ một người cho</td></tr>
    <tr><td style="font-weight:650">Tiểu cầu</td><td>Giữ <b>trên 50 G/L</b> khi đang chảy máu, <b>trên 100 G/L</b> nếu có chấn thương sọ não. Liều đầu 4–8 đơn vị gộp hoặc 1 đơn vị gạn tách</td></tr>
    <tr><td style="font-weight:650">Calci ion hoá</td><td>Giữ trong khoảng bình thường <b>1,1–1,3 mmol/L</b>; xử trí ngay nếu dưới 0,9; dưới 0,8 gây loạn nhịp. Dùng calci clorid. Mỗi đơn vị hồng cầu hoặc huyết tương chứa khoảng 3 g citrat</td></tr>
    <tr><td style="font-weight:650">Thân nhiệt</td><td>Giữ <b>36–37 °C</b>. Giảm 1 °C làm mất khoảng <b>10 %</b> chức năng yếu tố đông máu</td></tr>
    <tr><td style="font-weight:650">pH</td><td>Sửa toan máu. rFVIIa được dự báo <b>thất bại nếu pH dưới 7,2</b> hoặc tiểu cầu dưới 100 G/L</td></tr>
    <tr><td style="font-weight:650">Hemoglobin</td><td>Đích <b>70–90 g/L</b></td></tr>
    <tr><td style="font-weight:650">Tỉ lệ truyền máu khối lượng lớn</td><td>Huyết tương : tiểu cầu : hồng cầu từ <b>1:1:1 đến 1:1:2</b>, rồi chuyển sang truyền theo đích xét nghiệm</td></tr>
    <tr><td style="font-weight:650">Acid tranexamic</td><td><b>Chấn thương:</b> 1 g trong 10 phút rồi 1 g trong 8 giờ, <b>phải trong 3 giờ đầu</b> — sau 3 giờ không còn lợi ích và có thể tăng tử vong do chảy máu.<br><b>Xuất huyết nội sọ tự phát: không dùng thường quy.</b></td></tr>
    </table></div></div>`;

  h += `<details class="pickwrap"><summary><span class="pill">Xét nghiệm</span>Xét nghiệm nào dùng được cho thuốc nào<span class="hint">chạm để mở</span></summary>
    <div class="scrollx"><table><tr><th>Thuốc</th><th>Xét nghiệm tốt nhất</th><th>Dùng định tính</th><th>Không dùng / gây hiểu nhầm</th></tr>
    ${REV_LABS.map(r=>`<tr><td style="font-weight:650">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}

    <div class="note"><b>Kết quả bình thường loại trừ được gì:</b> thời gian thrombin thường bình thường thì loại trừ được dabigatran; aPTT bình thường loại trừ được thuốc ức chế yếu tố XIa; kháng Xa có chuẩn riêng bình thường thì loại trừ được thuốc ức chế Xa. Ngược lại <b>PT bình thường không loại trừ được gì cả</b>.<br>
      <b>Thực tế thời gian trả kết quả:</b> PT/INR và aPTT khoảng 15–30 phút và ở đâu cũng làm được; kháng Xa chuẩn theo heparin khoảng 30 phút, hầu hết bệnh viện làm được 24/24 nên dùng được để loại trừ nhanh sự hiện diện của thuốc ức chế Xa; còn kháng Xa có chuẩn riêng cho từng thuốc và dTT thì nhiều nơi chỉ làm giờ hành chính hoặc phải gửi đi.</div>
  </details>`;

  h += `<details class="pickwrap"><summary><span class="pill">Cập nhật</span>Những điều đã thay đổi so với cách dạy cũ<span class="hint">chạm để mở</span></summary>

    ${REV_OUTDATED.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}
    </table></div></details>`;

  h += `<details class="pickwrap"><summary><span class="pill">Sau đó</span>Dùng lại thuốc chống đông sau chảy máu nặng<span class="hint">chạm để mở</span></summary>
    <div class="abgblock"><b class="hd">Sau chảy máu tiêu hoá</b>
      Phần lớn bệnh nhân dùng lại trong khoảng <b>ngày thứ 3 đến ngày thứ 7</b> sau khi cầm máu. Chảy máu mức vừa và nặng đều nên dùng lại <b>trong vòng 1 tuần</b>, ưu tiên thuốc chống đông đường uống trực tiếp ở liều hiệu quả thấp nhất. Kháng tiểu cầu kép có thể dùng lại trong vòng 3 ngày. Rất ít trường hợp cần hoãn quá 15 ngày.<br>
      Các phân tích gộp đều cho thấy dùng lại thuốc <b>làm tăng chảy máu tái phát nhưng giảm rõ rệt huyết khối và giảm tử vong chung</b> — cán cân nghiêng về phía dùng lại.</div>

      Thường hoãn <b>ít nhất 4 tuần</b> ở người không có nguy cơ huyết khối cao. Người mang <b>van tim cơ học</b> thì dùng lại sớm hơn nhiều, thường 1–2 tuần, vì nguy cơ huyết khối lấn át.<br>
      <b>Đây là vấn đề chưa ngã ngũ.</b> Nghiên cứu PRESTIGE-AF (Lancet 2025, 319 bệnh nhân) là thử nghiệm ngẫu nhiên đầu tiên: thuốc chống đông đường uống trực tiếp giảm đột quỵ thiếu máu rất mạnh (tỉ số nguy cơ 0,05; 0,83 so với 8,60 biến cố trên 100 bệnh nhân-năm) nhưng <b>làm tăng xuất huyết nội sọ tái phát</b> (tỉ số nguy cơ 10,89; 5,00 so với 0,82 trên 100 bệnh nhân-năm) và <b>không đạt tiêu chí không thua kém</b>. Chính tác giả kêu gọi thêm nghiên cứu và nêu bít tiểu nhĩ trái như một lựa chọn thay thế. Hãy coi đây là quyết định cần bàn bạc với người bệnh, không phải một thuật toán.</div>
    <div class="abgblock"><b class="hd">Nguyên tắc chung</b>
      Chưa dùng lại khi chưa chắc chắn đã kiểm soát được nguồn chảy máu và hemoglobin chưa ổn định. Cân nhắc cửa sổ tăng đông 24–72 giờ sau khi dùng thuốc hoá giải. Riêng dabigatran có thể dùng lại từ 24 giờ sau idarucizumab nếu đã ổn định.</div>
  </details>`;

  h += `<div class="note" style="border-radius:var(--radius);border:1px solid var(--line);background:var(--card)">
    <b>Lưu ý về tính sẵn có:</b> idarucizumab và andexanet không phải nơi nào cũng có. Ở phần lớn cơ sở, <b>PCC 4 yếu tố là thuốc chủ lực</b> cho cả warfarin lẫn thuốc ức chế Xa. Hãy kiểm tra danh mục thuốc của khoa dược trước khi cần dùng, đừng đợi tới lúc cấp cứu.<br>
    <b>Nội dung rà soát tháng 8/2026.</b> Lĩnh vực này thay đổi nhiều trong 12 tháng qua và nhiều khả năng còn thay đổi tiếp — hãy đối chiếu lại với phác đồ cơ sở định kỳ.</div>`;

  return h;
}

    ${tbl(["Can thiệp đã làm","Hoãn mổ PHIÊN tối thiểu","Mổ không trì hoãn được"], STENT_WAIT)}
    <div class="note">Các mốc này <b>đã thay đổi qua các năm</b>: hướng dẫn 2014 từng cho phép mổ sau 180 ngày với stent phủ thuốc và cân nhắc từ 30 ngày; bản 2016 nâng lên 6 tháng; bản AHA/ACC 2024 hiện hành giữ <b>6 tháng cho bệnh mạch vành ổn định, 12 tháng sau hội chứng vành cấp, và 3 tháng là mốc sàn tuyệt đối</b> cho mổ không trì hoãn được. Hướng dẫn ESC 2022 nêu các mốc tương đương.<br><br>
      <b>Mổ cấp cứu ở người mang stent:</b> không bao giờ ngừng aspirin (trừ mổ trong sọ, trong ống sống, buồng sau nhãn cầu). Hội chẩn phẫu thuật viên, tim mạch can thiệp, gây mê và huyết học. Mổ ở nơi có phòng thông tim trực 24/24. Ngừng thuốc ức chế P2Y₁₂ trong thời gian ngắn nhất có thể. Có thể bắc cầu bằng cangrelor truyền 0,75 mcg/kg/phút không bolus (= <b>${sig(0.75*P.wt)} mcg/phút</b> cho người bệnh này), ngừng 1–6 giờ trước mổ — mức khuyến cáo yếu. Chuẩn bị sẵn khối tiểu cầu, nhưng lưu ý truyền tiểu cầu <b>không hiệu quả</b> khi ticagrelor còn trong máu vì thuốc gắn thuận nghịch, phải chờ ít nhất 12–24 giờ sau liều cuối; clopidogrel và prasugrel gắn không hồi phục nên truyền tiểu cầu có tác dụng sớm hơn. Ưu tiên acid tranexamic và cầm máu ngoại khoa tỉ mỉ hơn là ngừng thuốc kháng tiểu cầu. Dùng lại thuốc ức chế P2Y₁₂ trong vòng 24–72 giờ, có liều nạp nếu cần tác dụng nhanh và đã cầm máu chắc chắn.</div></div>`;

  h += `<div class="card"><h2>Bước 6 — Thuốc hoá giải khi mổ cấp cứu</h2>`;
  for(const r of REVERSAL)
    h += `<div class="blk"><div class="bhead"><span class="nm">${r.n}</span></div>
      <div class="sub"><b>${r.d}</b><br>${r.s}</div></div>`;
  h += `</div>`;

  h += `<div class="card"><h2>Hoãn mổ phiên sau biến cố huyết khối</h2>
    ${tbl(["Biến cố","Hoãn tối thiểu","Ghi chú"], DELAY_SURG)}</div>`;
  return h;
}

function anticoRegional(){
  let h = `<div class="banner dg">Khoảng chờ cho <b>gây tê trục thần kinh</b> và các block sâu cạnh trục thần kinh — chặt chẽ hơn nhiều so với mổ thường vì máu tụ ngoài màng cứng có thể gây liệt vĩnh viễn. Block nông có thể nới lỏng hơn.</div>`;
  h += `<div class="card"><h2>ASRA ấn bản 5 (tháng 1/2025)</h2>
    <div class="note" style="background:var(--card);border-top:none">Bản này đổi cách gọi từ “dự phòng / điều trị” sang <b>“liều thấp / liều cao”</b>, và <b>rút ngắn</b> thời gian chờ cho thuốc chống đông đường uống liều thấp so với bản trước.
      <b>Luôn đối chiếu với phác đồ của cơ sở và chức năng thận của người bệnh.</b></div>
    <div class="blkgrp">Thuốc kháng kết tập tiểu cầu</div>
    ${tbl(["Thuốc","Ngừng trước khi làm","Dùng lại sau rút catheter"], ASRA_AP)}
    <div class="blkgrp">Thuốc chống đông</div>
    ${tbl(["Thuốc","Ngừng trước khi làm","Dùng lại sau rút catheter"], ASRA_AC)}
    <div class="note">Bản 5 cho phép dựa vào <b>nồng độ thuốc còn lại</b> để rút ngắn thời gian chờ khi cần làm sớm: apixaban dưới 30 ng/mL hoặc hoạt độ kháng Xa từ 0,1 IU/mL trở xuống. Với dabigatran, thời gian chờ kéo dài thêm khi mức lọc cầu thận giảm.<br>
      Sau khi rút catheter phải <b>theo dõi thần kinh ít nhất 24 giờ</b>. Yếu chân mới xuất hiện hoặc tê kéo dài bất thường phải nghĩ ngay đến máu tụ ngoài màng cứng và chụp cộng hưởng từ khẩn — giải ép trong vòng 8 giờ mới có cơ hội hồi phục.</div></div>`;
  return h;
}

function renderAntico(){
  const s = ANTICO_TAB.sec;
  let h = `<div class="ctxrow" style="padding:0 0 12px">
    <button type="button" data-anticosec="surg" class="${s==="surg"?"on":""}">Phẫu thuật</button>
    <button type="button" data-anticosec="reg" class="${s==="reg"?"on":""}">Gây tê vùng</button>
    <button type="button" data-anticosec="rev" class="${s==="rev"?"on":""}">Đảo ngược</button>
  </div>`;
  h += (s === "surg") ? anticoSurg() : (s === "reg") ? anticoRegional() : renderReversal();
  $("p-antico").innerHTML = h;
  $("p-antico").querySelectorAll("[data-anticosec]").forEach(b => b.addEventListener("click", () => {
    ANTICO_TAB.sec = b.dataset.anticosec; renderAntico(); window.scrollTo({top:0,behavior:"instant"});
  }));
  // chọn thuốc cần hoá giải — chỉ vẽ lại phần thân, giữ nguyên vị trí cuộn
  $("p-antico").querySelectorAll("[data-revdrug]").forEach(b => b.addEventListener("click", () => {
    REV.drug = b.dataset.revdrug; renderAntico();
  }));
}

/* ==================== TABS ==================== */
/* [id panel, nhãn, khoá màu nhận diện] */
const TABS = [
  ["p-emergency","Cấp cứu","emergency"],["p-anes","Gây mê","anes"],
  ["p-local","Tê vùng","local"],["p-antico","Chống đông","antico"],
  ["p-abg","Khí máu","abg"]
];
/* Tab Gây mê chia thành các mục con */
const SUBTABS = [
  ["p-assess","Đánh giá"],["p-induction","Khởi mê"],["p-airway","Đường thở"],
  ["p-infusion","Truyền TM"],["p-fluid","Dịch & Máu"]
];
function buildSubtabs(){
  $("subtabs").innerHTML = SUBTABS.map(([id,label],i) =>
    `<button role="tab" data-sp="${id}" aria-selected="${i===0}">${label}</button>`).join("");
  $("subtabs").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    document.querySelectorAll("#subtabs button").forEach(x => x.setAttribute("aria-selected", x===b));
    document.querySelectorAll("#p-anes .subpanel").forEach(p => p.classList.toggle("on", p.id===b.dataset.sp));
    window.scrollTo({top:0,behavior:"instant"});
  });
}
/* Đổi màu chủ đạo của cả trang theo tab đang mở.
   Chỉ đổi --accent; các màu ý nghĩa lâm sàng (danger/warn/ok) giữ nguyên. */
function applyTabColor(key){
  const root = document.documentElement.style;
  root.setProperty("--accent", `var(--t-${key})`);
  root.setProperty("--accent-soft", `var(--t-${key}-soft)`);
}
function buildTabs(){
  $("tabs").innerHTML = TABS.map(([id,label,key],i) =>
    `<button role="tab" data-p="${id}" data-key="${key}" style="--tc:var(--t-${key})" aria-selected="${i===0}">${label}</button>`).join("");
  $("tabs").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-selected", x===b));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id===b.dataset.p));
    applyTabColor(b.dataset.key);
    window.scrollTo({top:0,behavior:"instant"});
  });
  applyTabColor(TABS[0][2]);
}

function renderAll(){
  readPatient();
  renderDerived(); renderInduction(); renderInfusion();
  renderLocal(); renderEmergency(); renderAirway(); renderFluid(); renderABG();
  renderAssess(); renderAntico();
  adjustSticky();
}

/* Khi cuộn, đẩy phần nhập thông số lên khỏi khung nhìn bằng cách đặt top âm cho header,
   chỉ còn hàng tab dính ở đỉnh. Áp dụng cho CẢ màn hình dọc lẫn ngang —
   phần đầu trang khá cao (nhất là khi có thêm dòng sinh hiệu nhi) nên nếu giữ
   cố định toàn bộ thì chiếm mất quá nhiều chỗ đọc nội dung. */
function adjustSticky(){
  const head = document.querySelector("header.top"), nav = $("tabs");
  if(!head || !nav) return;
  head.style.top = (-nav.offsetTop) + "px";
}
window.addEventListener("resize", adjustSticky);
window.addEventListener("orientationchange", () => setTimeout(adjustSticky, 150));
/* Chiều cao đầu trang đổi khi đổi bệnh nhân (hiện/ẩn dòng sinh hiệu nhi) hoặc khi
   các chip xuống dòng — theo dõi để tính lại mốc dính. */
if(window.ResizeObserver){
  const ro = new ResizeObserver(() => adjustSticky());
  const h = document.querySelector("header.top");
  if(h) ro.observe(h);
}
let LAST_SIG = "";
function renderIfChanged(){
  const sig = [$("wt").value,$("ht").value,$("age").value,$("ageUnit").value,$("sex").value].join("|");
  if(sig === LAST_SIG) return;
  LAST_SIG = sig; renderAll();
}
["wt","ht","age","ageUnit","sex"].forEach(id => {
  $(id).addEventListener("input", renderIfChanged);
  $(id).addEventListener("change", renderIfChanged);
});
buildTabs(); buildSubtabs(); renderAll();

/* Xuất hàm để kiểm thử tự động */
if(typeof module !== "undefined") module.exports = { IBW, LBW, AdjBW, W, P, readPatient };
window.__anes = { P, IBW, LBW, AdjBW, BSA, bmi, W, sig };
</script>
