n định vấn đề nằm ở máy/hệ thống dây thở hay ở bệnh nhân/ống nội khí quản","Bẫy khí (auto-PEEP) có thể gây tụt huyết áp nặng — ngắt kết nối cho phép xả khí"],"short":"Áp lực đường thở cao","grp":"resp"},{"id":"hypoxemia","no":4,"title":"Thiếu oxy máu (Hypoxemia)","definition":"SpO2 và/hoặc PaO2 thấp không đáp ứng với can thiệp ban đầu hoặc không rõ nguyên nhân.","signs":["SpO2 giảm","PaO2 thấp trên khí máu động mạch","Dạng sóng SpO2 kém hoặc mất tín hiệu","Có thể kèm khò khè, giảm rì rào phế nang, áp lực đường thở cao"],"tasks":[{"task":"Huy động nguồn lực","actions":["Thông báo cho cả kíp","Cân nhắc tạm dừng cuộc mổ","Gọi người hỗ trợ","Cân nhắc gọi xe cấp cứu (code cart)"]},{"task":"Oxy hóa và kiểm tra ban đầu","actions":["FiO2 100%, lưu lượng oxy 10–15 L/phút","Kiểm tra máy phân tích khí để loại trừ FiO2 thấp hoặc N2O cao","Kiểm tra monitor và dạng sóng SpO2, vị trí đầu dò, tưới máu chi","Kiểm tra dấu hiệu sinh tồn: điện tâm đồ, chu kỳ NIBP, bắt mạch, áp lực đường thở","Kiểm tra dạng sóng CO2, tìm chỗ ngắt kết nối trong hệ thống dây thở","Thông khí bằng tay để đánh giá độ giãn nở (compliance)","Cân nhắc dùng bóng tự phồng (Ambu)"]},{"task":"Kiểm tra ống nội khí quản ban đầu","actions":["Thông khí bằng nguồn oxy không phải từ máy gây mê (ví dụ bình oxy dự trữ) hoặc bằng khí phòng để loại trừ vấn đề từ máy hoặc nguồn cấp oxy","Nối lại đường lấy mẫu khí và cân nhắc chuyển sang gây mê tĩnh mạch","Kiểm tra vị trí ống nội khí quản và nghe rì rào phế nang","Luồn ống hút mềm qua ống nội khí quản để đánh giá dịch tiết và độ thông thoáng"]},{"task":"Huy động phế nang","actions":["Thực hiện thủ thuật huy động phế nang (recruitment)","Cân nhắc PEEP; nếu có tụt huyết áp, dùng thận trọng","Tăng dung tích cặn chức năng (FRC): tư thế đầu cao, xả khí ổ bụng","Nếu huyết động ổn định: làm sâu mê bằng propofol hoặc thuốc mê bốc hơi"]},{"task":"Thuốc","actions":["Nếu khò khè: albuterol 4–8 nhát xịt MDI hoặc 2,5 mg khí dung","Nếu nặng: epinephrine 5–10 mcg TM, hoặc ketamine 10–20 mg TM","Cân nhắc thêm thuốc giãn cơ hoặc hóa giải giãn cơ (tùy nguyên nhân)"]},{"task":"Đánh giá chuyên sâu","actions":["Nội soi phế quản ống mềm: xác nhận thấy vòng sụn khí quản, kiểm tra vị trí ống nội khí quản hoặc tắc nghẽn","Siêu âm phổi: tìm tràn khí màng phổi, tràn dịch màng phổi, đường B (phù kẽ)"]},{"task":"Đường vào mạch máu và xét nghiệm","actions":["Cân nhắc đặt đường động mạch và làm khí máu động mạch (ABG)"]},{"task":"Chẩn đoán hình ảnh","actions":["Chụp X-quang ngực tại giường (STAT)"]},{"task":"ECMO/CPB","actions":["Nếu tình trạng vẫn tiếp diễn: cân nhắc ECMO hoặc tuần hoàn ngoài cơ thể"]}],"drugs":[{"name":"Albuterol (salbutamol)","adult":"4–8 nhát xịt MDI hoặc 2,5 mg khí dung","amountLo":4,"amountHi":8,"unit":"nhát xịt","route":"Hít qua ống nội khí quản/MDI hoặc khí dung","repeat":"nhắc lại theo đáp ứng","perKg":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Nhi khoa: 4–8 nhát xịt MDI; khí dung 2,5 mg nếu <20 kg, 5 mg nếu ≥20 kg"},{"name":"Epinephrine","adult":"5–10 mcg TM","amountLo":5,"amountHi":10,"unit":"mcg","route":"TM","repeat":"nhắc lại và tăng liều theo đáp ứng","perKg":null,"pedPerKg":0.1,"pedUnit":"mcg/kg","pedMax":10,"infusionLo":0.02,"infusionHi":0.2,"infusionUnit":"mcg/kg/phút","note":"Dùng khi co thắt phế quản nặng"},{"name":"Ketamine","adult":"10–20 mg TM","amountLo":10,"amountHi":20,"unit":"mg","route":"TM","repeat":"nhắc lại theo đáp ứng","perKg":null,"pedPerKg":0.5,"pedUnit":"mg/kg","pedMax":20,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Có tác dụng giãn phế quản"},{"name":"Propofol (làm sâu mê)","adult":"Chuẩn độ theo đáp ứng (ví dụ 20–50 mg TM)","amountLo":20,"amountHi":50,"unit":"mg","route":"TM","repeat":"chuẩn độ theo huyết động","perKg":null,"pedPerKg":0.5,"pedUnit":"mg/kg","pedMax":50,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Sách chỉ ghi 'làm sâu mê bằng propofol hoặc thuốc bốc hơi' nếu huyết động ổn định; liều là gợi ý bổ sung"}],"causes":["FiO2 thấp: nếu máy phân tích khí đọc FiO2 thấp dù đặt '100% O2', có thể đường ống oxy bị nối sai hoặc bắt chéo (xem Sự cố oxy #21)","Giảm thông khí — thở tự nhiên: co thắt phế quản, mê quá sâu, tê tủy sống lan cao, co thắt thanh quản, tắc nghẽn đường thở, opioid, đau, phù, tắc nghẽn, giãn cơ tồn dư","Giảm thông khí — thở máy, báo động áp lực cao: thở chống máy, co thắt phế quản (xem Co thắt phế quản #6), áp lực đường thở đỉnh cao (xem Áp lực đường thở cao #13), giãn cơ chưa đủ, ống nội khí quản bị gập hoặc tắc, máy thở ở chế độ thủ công/APL đóng","Giảm thông khí — thở máy, báo động áp lực thấp: bóng chèn ống nội khí quản bị xì hoặc rách, rò rỉ hệ thống dây thở, cài đặt Vt hoặc tần số thở quá thấp, máy đang ở chế độ thủ công và van APL mở","Bất tương xứng V/Q — shunt (được tưới máu nhưng không được thông khí, ít đáp ứng với O2): hít sặc, xẹp phổi, co thắt phế quản (xem Co thắt phế quản #6), đặt nội khí quản vào một bên phế quản, nút nhầy, thông khí một phổi, tràn dịch màng phổi, phù phổi","Bất tương xứng V/Q — khoảng chết (được thông khí nhưng không được tưới máu, đáp ứng nhiều hơn với O2): phản vệ (#5), thuyên tắc khí/huyết khối/mỡ (xem Thuyên tắc #9), tràn khí màng phổi (#22), suy tim phải (#24), tụt huyết áp nặng","Bất thường khuếch tán: thường là bệnh phổi mạn tính","Tăng nhu cầu oxy: tăng thân nhiệt do thầy thuốc, tăng thân nhiệt ác tính (#19), hội chứng an thần kinh ác tính, nhiễm khuẩn huyết, cường giáp","Bệnh huyết sắc tố: carboxyhemoglobin (SpO2 bình thường giả), methemoglobin (SpO2 khoảng 85%) — nếu nghi ngờ, gửi xét nghiệm đồng oxy hóa (co-oximetry)","SpO2 giả (artifact): xác nhận bằng ABG; dạng sóng SpO2 kém do nhiễu dao điện, ngón tay lạnh hoặc tưới máu kém, nhiễu ánh sáng, đầu dò đặt sai vị trí; thuốc nhuộm (indigo carmine, xanh methylen) và sơn móng tay màu xanh"],"notes":["Ưu tiên loại trừ vấn đề nguồn oxy và máy gây mê bằng cách thông khí với nguồn oxy độc lập hoặc bóng tự phồng","Xác nhận SpO2 thấp là thật bằng khí máu động mạch trước khi điều trị leo thang"],"short":"Thiếu oxy máu","grp":"resp"},{"id":"pneumothorax","no":5,"title":"Tràn khí màng phổi","definition":"Khí tích tụ trong khoang màng phổi gây xẹp phổi; khi có van một chiều sẽ tiến triển thành tràn khí màng phổi áp lực với trụy tim mạch. Nghi ngờ khi áp lực đỉnh đường thở tăng kèm tụt huyết áp và giảm thông khí một bên.","signs":["Tăng áp lực đỉnh đường thở (PIP)","Nhịp tim nhanh","Tụt huyết áp hoặc thiếu oxy máu","Rì rào phế nang giảm hoặc không đối xứng","Gõ vang bất thường một bên ngực","Lệch khí quản (dấu hiệu muộn)","Tĩnh mạch cổ nổi / tăng CVP","Mất bù xảy ra ngay khi bắt đầu thông khí áp lực dương hoặc sau khi đặt đường truyền tĩnh mạch trung tâm","Tỷ lệ mắc cao hơn ở bệnh nhân chấn thương, COPD, phẫu thuật tim và phẫu thuật tầng bụng trên"],"tasks":[{"task":"Huy động nguồn lực","actions":["Thông báo cho ê-kíp","Xác định người chỉ huy","Gọi cấp cứu, nhận xe cấp cứu / xe thuốc","Gọi ngay khoa Chấn thương, Ngoại tổng quát hoặc Phẫu thuật Tim mạch lồng ngực"]},{"task":"Đường thở","actions":["Thở oxy 100% với lưu lượng 10-15 L/phút"]},{"task":"Kiểm tra nhanh loại trừ nguyên nhân khác","actions":["Loại trừ đặt nội khí quản chọn lọc một bên: nghe phổi hai bên và kiểm tra độ sâu ống nội khí quản","Loại trừ tắc nghẽn ống nội khí quản: luồn ống hút mềm qua ống nội khí quản","Loại trừ auto-PEEP: ngắt kết nối tạm thời hệ thống dây thở"]},{"task":"Giải áp cấp cứu","actions":["Nếu huyết động không ổn định và chưa có ống dẫn lưu màng phổi: giải áp bằng kim ngay lập tức","Đặt ống thông tĩnh mạch cỡ 14G (hoặc 16G) vào khoang liên sườn 4 hoặc 5 trên đường nách giữa theo ATLS 2018 (có thể nghe thấy tiếng khí thoát ra nếu tràn khí áp lực)","Để nguyên ống thông tĩnh mạch tại chỗ trong khi chờ đặt ống dẫn lưu màng phổi","Gọi nhân viên có chuyên môn đặt ống dẫn lưu màng phổi"]},{"task":"Thăm dò nâng cao","actions":["Nội soi phế quản ống mềm để đánh giá vị trí ống nội khí quản (đặt vào phế quản gốc) và tình trạng tắc ống","Siêu âm phổi: mất dấu trượt màng phổi (bình thường có trượt phổi), mất điểm phổi, dấu hiệu bờ biển (bình thường) chuyển thành dấu mã vạch (gợi ý tràn khí màng phổi)","Cân nhắc chụp X-quang ngực tại giường STAT — nhưng KHÔNG trì hoãn giải áp để chờ chụp phim"]},{"task":"Xử trí tiếp theo","actions":["Cân nhắc chuyển ICU để theo dõi hô hấp và quản lý ống dẫn lưu màng phổi"]}],"drugs":[],"causes":["Chấn thương ngực","Bệnh phổi tắc nghẽn mạn tính (COPD) / vỡ bóng khí phế thũng","Biến chứng đặt đường truyền tĩnh mạch trung tâm","Chấn thương áp lực do thông khí áp lực dương","Phẫu thuật tim và phẫu thuật tầng bụng trên","Chẩn đoán phân biệt: đặt nội khí quản chọn lọc một bên phế quản, tắc nghẽn ống nội khí quản, auto-PEEP, co thắt phế quản, tràn dịch màng phổi, thuyên tắc phổi"],"notes":["Tràn khí màng phổi áp lực là chẩn đoán LÂM SÀNG — giải áp ngay, không chờ X-quang.","Vị trí chọc kim theo ATLS 2018: khoang liên sườn 4-5 đường nách giữa (thay cho vị trí cũ liên sườn 2 đường giữa đòn).","Giữ nguyên kim/ống thông sau khi giải áp cho đến khi đặt được ống dẫn lưu màng phổi chính thức.","Siêu âm phổi tại giường: mất trượt màng phổi + dấu mã vạch (barcode/stratosphere) trên M-mode gợi ý tràn khí màng phổi.","Luôn loại trừ ba nguyên nhân giả lập nhanh trước: nội khí quản vào một bên phế quản, tắc ống nội khí quản, auto-PEEP."],"short":"Tràn khí màng phổi","grp":"resp"},{"id":"laryngospasm","title":"Co thắt thanh quản","definition":"Khép chặt dây thanh không chủ ý và kéo dài (kèm khép các nếp phễu–thanh thiệt và băng thanh thất), gây tắc nghẽn một phần hoặc hoàn toàn đường thở và VẪN TIẾP DIỄN sau khi tác nhân kích thích đã được loại bỏ. Đây là phản xạ bảo vệ thanh môn bị khuếch đại quá mức: đường vào là nhánh trong của thần kinh thanh quản trên, đường ra là thần kinh thanh quản quặt ngược. Mê nông làm mất ức chế trung ương lên phản xạ này. Hay gặp nhất lúc khởi mê và lúc rút ống, đặc biệt ở trẻ em.","signs":["Co thắt MỘT PHẦN: thở rít (stridor) thì hít vào, tiếng thở ồn ào","Co thắt HOÀN TOÀN: IM LẶNG — không có tiếng thở, không có luồng khí (dấu hiệu nguy hiểm nhất, dễ bị bỏ sót)","Cử động ngực bụng ngược chiều kiểu bập bênh (see-saw), lõm hõm ức và khoang liên sườn","Co kéo khí quản (tracheal tug)","Sóng EtCO2 dẹt hoặc mất hoàn toàn","Bóng dự trữ không di động dù bệnh nhân đang gắng sức thở","Không thông khí được bằng bóp bóng, áp lực đường thở tăng","Bão hoà oxy tụt nhanh, sau đó chậm nhịp tim (đặc biệt ở trẻ nhỏ)","Tím tái"],"tasks":[{"task":"Bước 1 — Ngay lập tức (0–15 giây)","actions":["Nói to \"Đây là co thắt thanh quản\" và GỌI NGƯỜI HỖ TRỢ, gọi xe thuốc cấp cứu","NGỪNG và LOẠI BỎ tác nhân kích thích: báo phẫu thuật viên dừng tay, ngừng hút, ngừng nội soi, rút bỏ dụng cụ đường thở nếu chính nó là tác nhân","FiO2 100 %, lưu lượng khí mới cao, đóng van APL để tạo bóng dự trữ","Nếu oxy hoá còn cho phép: soi thanh quản và hút nhẹ máu, đờm dãi, dịch dạ dày trên dây thanh — máu hoặc dịch nôn đọng lại sẽ duy trì co thắt","Xác nhận đường truyền tĩnh mạch còn thông (nếu KHÔNG có đường truyền thì kế hoạch thuốc sẽ khác — xem phần thuốc)"]},{"task":"Bước 2 — Thủ thuật đường thở (15–30 giây)","actions":["Ngửa đầu, nâng cằm, đẩy hàm hai tay thật mạnh (bán trật khớp thái dương hàm)","Đặt canun miệng hầu (Guedel) đúng cỡ — nếu tắc nghẽn KHÔNG cải thiện dù Guedel đã đặt đúng thì đó là dấu hiệu ủng hộ chẩn đoán co thắt thanh quản","THỦ THUẬT LARSON: đặt đầu ngón giữa hai bàn tay vào hõm ngay SAU DÁI TAI hai bên — hõm này giới hạn phía trước bởi ngành lên xương hàm dưới, phía sau bởi mỏm chũm, phía trên bởi nền sọ. Ấn mạnh vào trong và ra trước hướng về nền sọ, ĐỒNG THỜI hai bên, kèm đẩy hàm mạnh. Ấn đau là chủ ý và là một phần cơ chế","CPAP NHẸ khoảng 10 cmH2O với oxy 100 %, mặt nạ kín, kỹ thuật hai tay có người bóp bóng","TUYỆT ĐỐI KHÔNG bóp bóng áp lực cao và thô bạo: làm căng dạ dày, chèn ép cơ hoành, tăng nguy cơ trào ngược; trong co thắt hoàn toàn còn có thể ép băng thanh thất khép chặt thêm","Nếu sau khoảng 30 giây không cải thiện, hoặc là co thắt hoàn toàn im lặng: DỪNG thủ thuật, chuyển sang dùng thuốc ngay"]},{"task":"Bước 3 — Làm sâu mê bằng propofol","actions":["Propofol tĩnh mạch chia nhỏ là thuốc hàng đầu khi đã có đường truyền — khoảng 75 % trường hợp cắt được co thắt chỉ bằng propofol","Khởi phát sau 30–45 giây; có thể gây ngừng thở nhưng chấp nhận được vì khi đã mở được thanh môn thì hỗ trợ hô hấp dễ dàng","Nếu huyết động không ổn định hoặc đã thiếu oxy nặng kèm chậm nhịp: BỎ QUA propofol, dùng ngay giãn cơ","Tăng thuốc mê bốc hơi KHÔNG phải lựa chọn chính vì không có thông khí thì thuốc không vào được phổi"]},{"task":"Bước 4 — Giãn cơ (suxamethonium)","actions":["Chỉ định dùng ngay: propofol thất bại, HOẶC co thắt hoàn toàn im lặng, HOẶC SpO2 đang tụt dưới 85 % và còn tiếp tục tụt, HOẶC bắt đầu chậm nhịp tim. Không chờ đến khi ngừng tim","Cơ thanh quản NHẠY với suxamethonium hơn cơ vân, nên giãn ra TRƯỚC — vì vậy liều dưới mức liệt hoàn toàn vẫn cắt được co thắt (ED95 chỉ 0,3 mg/kg)","Còn oxy hoá được và muốn giữ tự thở, không định đặt ống: dùng LIỀU THẤP","Co thắt hoàn toàn, tụt bão hoà nhanh, chậm nhịp, hoặc đã quyết định đặt nội khí quản: dùng LIỀU ĐẦY ĐỦ","KHÔNG có đường truyền tĩnh mạch: tiêm bắp cơ delta (hấp thu nhanh hơn) hoặc cơ rộng ngoài đùi; cắt được co thắt sau 45 giây đến 1 phút dù liệt hoàn toàn phải mất 3–4 phút","Có đường truyền trong xương: dùng đường trong xương, khởi phát 35 giây, tương đương tĩnh mạch","Kiểm tra nhanh chống chỉ định: tiền sử sốt cao ác tính, tăng kali máu, bỏng trên 24–48 giờ, liệt hoặc bất động kéo dài, loạn dưỡng cơ (chú ý bé trai chưa chẩn đoán Duchenne), tiêu cơ vân"]},{"task":"Bước 5 — Atropin khi chậm nhịp","actions":["Chậm nhịp tim gặp ở 6 % số ca co thắt thanh quản nói chung nhưng tới 23 % ở trẻ dưới 1 tuổi","Cung lượng tim của trẻ phụ thuộc tần số tim, nên chậm nhịp làm tụt cung lượng rất nhanh","Bản thân suxamethonium cũng gây chậm nhịp, rõ hơn khi tiêm liều thứ hai và ở trẻ em — nhiều đơn vị nhi cho atropin thường quy kèm suxamethonium","Nhớ rằng điều trị căn bản của chậm nhịp do thiếu oxy là CUNG CẤP OXY, atropin chỉ mua thêm thời gian"]},{"task":"Bước 6 — Đặt nội khí quản","actions":["Đặt ống khi: đã dùng giãn cơ liều đầy đủ, hoặc co thắt tái phát nhiều lần, hoặc có trào ngược hít sặc, hoặc bệnh nhân không ổn định, hoặc cần bảo vệ đường thở để tiếp tục cuộc mổ","Sau khi thanh môn mở: thông khí nhẹ nhàng, tránh bơm căng dạ dày, đặt ống thông dạ dày để giải áp nếu đã bóp bóng nhiều"]},{"task":"Bước 7 — Sau khi cắt được cơn","actions":["Cảnh giác PHÙ PHỔI DO ÁP LỰC ÂM: bệnh nhân gắng sức hít vào chống lại thanh môn đóng, tạo áp lực âm lồng ngực rất lớn kéo dịch vào phế nang","Biểu hiện: khó thở, giảm oxy máu, đờm bọt hồng, ran ẩm, thâm nhiễm hai bên trên phim — thường xuất hiện trong vòng vài phút đến 1 giờ sau cơn, đa số trong 30–60 phút","Xử trí: thở oxy, CPAP hoặc PEEP, thở máy nếu nặng; lợi tiểu chỉ dùng khi thực sự quá tải, hầu hết tự khỏi trong 12–48 giờ","Theo dõi tối thiểu 2–4 giờ sau cơn co thắt nặng trước khi cho về; nếu đã có triệu chứng thì phải nhập viện theo dõi","Đánh giá nguy cơ hít sặc: nghe phổi, theo dõi oxy, chụp phim nếu nghi ngờ"]},{"task":"Phòng ngừa","actions":["Rút ống khi mê SÂU hoặc khi TỈNH HẲN — tránh giai đoạn mê nông ở giữa, đây là thời điểm nguy hiểm nhất","Kỹ thuật \"không chạm\" (no-touch): đặt bệnh nhân tư thế nằm nghiêng, không kích thích gì cho tới khi tỉnh hoàn toàn","Hút sạch hầu họng khi còn mê sâu, không hút lúc mê nông","Lidocain tĩnh mạch trước rút ống làm giảm tỉ lệ co thắt","Hoãn mổ phiên nếu trẻ đang nhiễm khuẩn hô hấp trên hoặc vừa khỏi trong vòng 2–4 tuần (nguy cơ tăng rõ)","Bơm phồng phổi kèm PEEP 10–20 cmH2O trước khi xả bóng chèn giúp đẩy dịch tiết dưới thanh môn lên trên"]}],"drugs":[{"name":"Propofol (cắt co thắt)","adult":"0,5 mg/kg TM chia nhỏ, nhắc lại theo đáp ứng","perKg":0.5,"perKgHi":0.8,"perKgUnit":"mg/kg","route":"TM, chia nhỏ","repeat":"Nhắc lại từng liều nhỏ tới khi cắt được cơn","note":"Liều dưới mức gây mê. Các nguồn ghi 0,25–0,8 mg/kg; BJA Education dùng 0,5 mg/kg chia nhỏ. Người lớn thường chỉ cần 20–50 mg. Cắt được cơn trong khoảng 75 % trường hợp."},{"name":"Suxamethonium — liều thấp, giữ tự thở","adult":"0,1–0,5 mg/kg TM","perKg":0.1,"perKgHi":0.5,"perKgUnit":"mg/kg","route":"TM","repeat":"Nhắc lại nếu chưa cắt được cơn — cân nhắc atropin kèm liều thứ hai","note":"Dùng khi còn oxy hoá được và muốn tránh phải đặt ống. ED95 chỉ 0,3 mg/kg và cơ thanh quản giãn trước cơ vân, nên liều này thường đủ cắt cơn mà vẫn còn thở."},{"name":"Suxamethonium — liều đầy đủ, khi định đặt ống","adult":"1–2 mg/kg TM","perKg":1,"perKgHi":2,"perKgUnit":"mg/kg","route":"TM","repeat":"—","note":"Dùng khi co thắt hoàn toàn, tụt bão hoà nhanh, chậm nhịp tim hoặc đã quyết định đặt nội khí quản."},{"name":"Suxamethonium — tiêm bắp khi KHÔNG có đường truyền","adult":"4 mg/kg tiêm bắp, tối đa 200 mg","perKg":4,"perKgUnit":"mg/kg","route":"Tiêm bắp cơ delta hoặc cơ rộng ngoài đùi","repeat":"—","note":"TỐI ĐA 200 mg. Cơ delta hấp thu nhanh hơn. Cắt được co thắt sau 45 giây đến 1 phút, liệt hoàn toàn mất 3–4 phút. Đường dưới lưỡi 2–3 mg/kg nhanh hơn nhưng phải bỏ mặt nạ và có báo cáo loạn nhịp."},{"name":"Suxamethonium — đường trong xương","adult":"1 mg/kg trong xương","perKg":1,"perKgUnit":"mg/kg","route":"Trong xương","repeat":"—","note":"Khởi phát 35 giây, tương đương đường tĩnh mạch. Là đường vào đáng tin cậy nhất khi nặng hoặc cận ngừng tim mà chưa có đường truyền."},{"name":"Atropin (chậm nhịp)","adult":"0,02 mg/kg TM","perKg":0.02,"perKgUnit":"mg/kg","route":"TM (hoặc tiêm bắp nếu chưa có đường truyền)","repeat":"Nhắc lại theo đáp ứng","note":"TỐI THIỂU 0,1 mg để tránh chậm nhịp nghịch thường. Tối đa một lần 0,5 mg ở trẻ em và 0,6 mg ở người lớn. Nhiều đơn vị nhi cho thường quy kèm suxamethonium."},{"name":"Rocuronium (khi chống chỉ định suxamethonium)","adult":"1,0–1,2 mg/kg TM","perKg":1,"perKgHi":1.2,"perKgUnit":"mg/kg","route":"TM","repeat":"—","note":"Lựa chọn hai vì khởi phát chậm hơn và tác dụng kéo dài — dùng liều này là đã cam kết đặt ống và thở máy. Một số nguồn mô tả liều thấp 0,2–0,3 mg/kg nhưng bằng chứng yếu."},{"name":"Sugammadex (hoá giải rocuronium ngay)","adult":"16 mg/kg TM","perKg":16,"perKgUnit":"mg/kg","route":"TM","repeat":"—","note":"Hoá giải tức thì liều rocuronium 1,2 mg/kg. Lưu ý: hồi phục dẫn truyền thần kinh cơ KHÔNG đồng nghĩa đường thở an toàn — tỉnh lại ở mê nông có thể tái phát co thắt. Sau sugammadex không dùng lại được rocuronium trong khoảng 24 giờ."},{"name":"Lidocain TM (phòng ngừa trước rút ống)","adult":"1–1,5 mg/kg TM","perKg":1,"perKgHi":1.5,"perKgUnit":"mg/kg","route":"TM, trước rút ống 1–3 phút","repeat":"—","note":"Dùng để PHÒNG NGỪA, không phải để cắt cơn đang xảy ra."}],"causes":["Mê nông khi có kích thích: đặt hoặc rút dụng cụ đường thở, hút hầu họng, soi thanh quản","Máu, đờm dãi, dịch dạ dày hoặc mảnh mô đọng trên dây thanh","Phẫu thuật chung đường thở: cắt amidan, nạo VA, nội soi thanh khí quản","Trẻ em, đặc biệt trẻ nhỏ — tỉ lệ cao gấp nhiều lần người lớn","Nhiễm khuẩn hô hấp trên gần đây hoặc đang có (trong vòng 2–4 tuần)","Hen phế quản, hút thuốc lá thụ động, trào ngược dạ dày thực quản","Kích thích đau ở nơi khác khi mê nông","Giảm CO2 máu làm tăng nguy cơ; ngược lại tăng CO2 máu có tác dụng bảo vệ"],"notes":["Co thắt HOÀN TOÀN thì IM LẶNG — không nghe thấy gì không có nghĩa là ổn, mà thường là nặng hơn thở rít","Đừng loay hoay với thủ thuật quá 30 giây nếu bão hoà đang tụt: ở trẻ em mất bão hoà tính bằng giây","Thủ thuật Larson chưa từng có thử nghiệm ngẫu nhiên chứng minh, nhưng miễn phí, nhanh và vô hại — cứ làm nhưng KHÔNG được vì nó mà chậm dùng thuốc","Ép ngực nhẹ giữa xương ức 20–25 lần/phút với lực dưới một nửa lực ép tim có báo cáo tỉ lệ thành công 74 % so với 38 % của CPAP đơn thuần, nhưng đây là nghiên cứu không ngẫu nhiên — chỉ là biện pháp hỗ trợ, không thay thế thuốc","Sau cơn nặng phải nghĩ tới phù phổi do áp lực âm và theo dõi ít nhất 2–4 giờ","Không có hướng dẫn quốc gia riêng cho co thắt thanh quản: nội dung ở đây tổng hợp từ bài tổng quan BJA Education 2014 của Gavel và Walker, WFSA Update in Anaesthesia số 35, tài liệu gây mê nhi của Hampson-Evans và Morgan, LITFL và OpenAnesthesia. Liều thuốc giữa các nguồn có khác nhau, phần trên đã ghi rõ khoảng liều và bối cảnh áp dụng"],"grp":"resp","no":6},{"id":"cv-cpr-bls","no":1,"short":"CPR (BLS)","title":"Hồi sinh tim phổi cơ bản (CPR) — người lớn, trẻ em, trẻ sơ sinh","definition":"Chuỗi hồi sinh tim phổi cơ bản áp dụng cho nạn nhân không đáp ứng, không thở hoặc chỉ thở ngáp. Mục tiêu là ép tim chất lượng cao, giảm tối đa gián đoạn và khử rung sớm bằng AED.","signs":["Không đáp ứng khi gọi hỏi, lay gọi","Không thở hoặc chỉ thở ngáp (thở hổn hển)","Không bắt được mạch trung tâm trong vòng 10 giây (mạch cảnh ở người lớn/trẻ em; mạch cánh tay hoặc mạch bẹn ở trẻ sơ sinh)"],"tasks":[{"task":"Đánh giá ban đầu và gọi hỗ trợ","actions":["Kiểm tra đáp ứng: không đáp ứng? không thở hay chỉ thở ngáp?","Gọi hỗ trợ — yêu cầu người khác đi lấy máy khử rung tim/AED","Kiểm tra mạch trong vòng 10 giây (nếu có mạch nhưng ngừng thở: thổi ngạt 1 lần mỗi 5-6 giây, kiểm tra lại mạch sau mỗi 2 phút)"]},{"task":"Nếu không có mạch — bắt đầu ép tim","actions":["Đặt bệnh nhân nằm ngửa trên mặt phẳng cứng","Bắt đầu ép tim ngoài lồng ngực, tỷ lệ 30:2, ép mạnh và nhanh ≥100 lần/phút","Vị trí ép: nửa dưới xương ức","Cho phép lồng ngực nở lại hoàn toàn giữa các lần ép — giảm tối đa gián đoạn ép tim"]},{"task":"Kiểm soát đường thở và thông khí","actions":["Mở đường thở: ngửa đầu — nâng cằm","Thông khí 2 lần (tránh thông khí quá mức)","Sau khi đặt đường thở nâng cao: thông khí 8-10 lần/phút, ép tim liên tục không ngắt quãng"]},{"task":"Gắn AED và phân tích nhịp","actions":["Gắn AED cho người lớn và trẻ em >1 tuổi","Nếu nhịp có chỉ định sốc: sốc điện × 1, sau đó tiếp tục CPR ngay lập tức trong 2 phút, kiểm tra lại nhịp sau mỗi 2 phút","Nếu nhịp KHÔNG có chỉ định sốc: tiếp tục CPR ngay lập tức trong 2 phút, khởi động các biện pháp can thiệp ACLS, kiểm tra nhịp mỗi 2 phút"]},{"task":"Thông số CPR theo lứa tuổi (bảng trang 2)","actions":["Người lớn, 1 hoặc 2 người cấp cứu: tỷ lệ 30:2, tần số ép 100 lần/phút, độ sâu >2 inch (>5 cm), kiểm tra mạch cảnh","Trẻ em, 1 người cấp cứu: 30:2; trẻ em, 2 người cấp cứu: 15:2; tần số 100 lần/phút, độ sâu khoảng 2 inch (5 cm), kiểm tra mạch cảnh","Trẻ sơ sinh/nhũ nhi, 1 người: 30:2; 2 người: 15:2; tần số 100 lần/phút, độ sâu khoảng 1,5 inch (4 cm), kiểm tra mạch cánh tay hoặc mạch bẹn","Trẻ sơ sinh (hồi sức sơ sinh), 2 người: tỷ lệ 3:1","Người lớn sau khi đã đặt đường thở nâng cao: thông khí 8-10 lần/phút, không đồng bộ với ép tim"]}],"drugs":[{"name":"Sốc điện bằng AED (khử rung)","adult":"Sốc × 1 theo hướng dẫn của máy AED, sau đó CPR ngay 2 phút","amount":null,"amountLo":null,"amountHi":null,"unit":"J","route":"Điện cực dán ngực","repeat":"Kiểm tra nhịp mỗi 2 phút","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":2,"pedUnit":"J/kg","pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"AED tự chọn mức năng lượng. Trẻ em >1 tuổi dùng AED (ưu tiên bộ điện cực giảm liều nhi khoa). Liều khử rung PALS: 2 J/kg lần đầu, 4 J/kg các lần sau."}],"causes":["Rung thất / nhịp nhanh thất vô mạch","Vô tâm thu","Hoạt động điện vô mạch (PEA)","Nguyên nhân hô hấp nguyên phát (đặc biệt ở trẻ em và trẻ sơ sinh)"],"notes":["Ép tim mạnh và nhanh ≥100 lần/phút, hạn chế tối đa gián đoạn","Cho phép lồng ngực hồi phục hoàn toàn sau mỗi lần ép","Tránh thông khí quá mức","Ở trẻ em và trẻ sơ sinh, khi có 2 người cấp cứu, tỷ lệ chuyển thành 15:2 (3:1 với hồi sức sơ sinh)"],"grp":"cv"},{"id":"cv-cardiac-arrest","no":2,"short":"Ngừng tim (ACLS)","title":"Ngừng tim — thuật toán ACLS (VF/VT vô mạch, vô tâm thu/PEA)","definition":"Ngừng tuần hoàn đột ngột với 4 dạng nhịp: rung thất (VF), nhịp nhanh thất vô mạch (VT), vô tâm thu và hoạt động điện vô mạch (PEA). Xử trí gồm CPR chất lượng cao, khử rung sớm với nhịp có chỉ định sốc và thuốc vận mạch.","signs":["Mất ý thức, không đáp ứng, không mạch","Rung thất thô: hoạt động điện hỗn loạn, không đều — có chỉ định sốc","Rung thất nhỏ (sóng mịn): hoạt động điện không đều, biên độ thấp — có chỉ định sốc","Nhịp nhanh thất: phức bộ nhanh, rộng — sốc nếu không có mạch","Vô tâm thu: không có hoạt động điện — CPR","PEA: bất kỳ nhịp ECG có tổ chức nào nhưng không có mạch — CPR"],"tasks":[{"task":"Xử trí ban đầu chung","actions":["Gọi hỗ trợ, bắt đầu CPR (30:2, ép mạnh và nhanh ≥100 lần/phút, hạn chế tối đa gián đoạn)","Cung cấp oxy, gắn monitor/máy khử rung, ghi điện tâm đồ","Xác định nhịp: có chỉ định sốc hay không?"]},{"task":"Nhánh VF / VT vô mạch — sốc điện lần đầu","actions":["Khử rung 120-200 J hai pha (hoặc theo khuyến cáo nhà sản xuất/AED), hoặc 360 J một pha","Tiếp tục CPR ngay lập tức trong 2 phút","Thiết lập đường truyền tĩnh mạch/trong xương"]},{"task":"Nhánh VF / VT — sốc lần 2 và thuốc vận mạch","actions":["Khử rung lần tiếp theo","Tiếp tục CPR × 2 phút","Adrenalin (Epinephrine) 1 mg TM/trong xương, lặp lại mỗi 3-5 phút; HOẶC Vasopressin 40 đơn vị TM/trong xương (chỉ dùng một liều duy nhất)","Xem xét đặt đường thở nâng cao (ống nội khí quản, đường thở trên thanh quản); thông khí 8-10 lần/phút với ép tim liên tục","Sử dụng capnography dạng sóng: nếu PETCO2 <15 mmHg, cải thiện chất lượng CPR"]},{"task":"Nhánh VF / VT — sốc lần 3 và thuốc chống loạn nhịp","actions":["Khử rung lần tiếp theo","Tiếp tục CPR × 2 phút","Amiodaron 300 mg TM/trong xương; có thể lặp lại một lần 150 mg trong 5 phút","Tìm và điều trị các nguyên nhân có thể đảo ngược"]},{"task":"Nhánh vô tâm thu / PEA","actions":["Tiếp tục CPR ngay lập tức × 2 phút","Thiết lập đường truyền tĩnh mạch/trong xương","Adrenalin (Epinephrine) 1 mg TM/trong xương, lặp lại mỗi 3-5 phút; HOẶC Vasopressin 40 đơn vị TM/trong xương (một liều duy nhất)","Xem xét đặt đường thở nâng cao (ống nội khí quản, đường thở trên thanh quản); thông khí 8-10 lần/phút với ép tim liên tục","Capnography dạng sóng: nếu PETCO2 <15 mmHg, cải thiện chất lượng CPR","Kiểm tra lại nhịp: nếu vẫn vô tâm thu/PEA — tiếp tục CPR × 2 phút và tìm nguyên nhân có thể đảo ngược"]},{"task":"Đánh giá tái lập tuần hoàn tự nhiên (ROSC)","actions":["Nếu có ROSC (có mạch, có huyết áp, PETCO2 ≥40 mmHg) — chuyển sang thuật toán chăm sóc sau ngừng tim","Nếu không có ROSC — tiếp tục chu kỳ CPR/sốc/thuốc"]}],"drugs":[{"name":"Khử rung (sốc điện không đồng bộ) — hai pha","adult":"120-200 J hai pha (theo khuyến cáo nhà sản xuất hoặc AED)","amount":null,"amountLo":120,"amountHi":200,"unit":"J","route":"Điện cực dán/bản cực ngực","repeat":"Sau mỗi 2 phút CPR nếu vẫn còn nhịp có chỉ định sốc","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":2,"pedUnit":"J/kg","pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Chỉ dùng cho VF và VT vô mạch. Trẻ em (PALS): 2 J/kg lần đầu, 4 J/kg các lần tiếp theo, tối đa 10 J/kg hoặc liều người lớn."},{"name":"Khử rung (sốc điện không đồng bộ) — một pha","adult":"360 J một pha","amount":360,"amountLo":null,"amountHi":null,"unit":"J","route":"Điện cực dán/bản cực ngực","repeat":"Sau mỗi 2 phút CPR nếu vẫn còn nhịp có chỉ định sốc","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":null,"pedUnit":null,"pedMax":null,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Máy một pha: dùng 360 J cho tất cả các lần sốc."},{"name":"Adrenalin (Epinephrine)","adult":"1 mg TM/trong xương, lặp lại mỗi 3-5 phút","amount":1,"amountLo":null,"amountHi":null,"unit":"mg","route":"TM/trong xương","repeat":"mỗi 3-5 phút","perKg":null,"perKgHi":null,"perKgUnit":null,"pedPerKg":0.01,"pedUnit":"mg/kg","pedMax":1,"infusionLo":null,"infusionHi":null,"infusionUnit":null,"note":"Dùng cho mọi dạng nhịp ngừng tim. Liều nhi (PALS): 0,01 mg/kg (0,1 mL/kg dung dịch 1:10.000) TM/trong xương mỗi 3-5 phút, tối đa 1 mg."},{"name":"Vasopressin","adult":"40 đơn vị TM/trong xương, chỉ dùng một liều duy nhất","amount":40,"amountLo":null,"amountHi":null,"unit":"đơn vị","route":"TM/trong xương","repeat":"không lặp lại (một liều duy nhất)","perKg"
